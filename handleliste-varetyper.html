<script>

let canEditTypeOrder=false;
let currentUserRole="";
const SHOPPING_STORE_LOCK_KEY="shoppingStoreMatchLockV2";
const SHOPPING_ACTIVE_CHAIN_KEY="shoppingActiveStoreChainV2";
function relationText(value){if(Array.isArray(value)){return value.map(relationText).find(Boolean)||"";}if(value&&typeof value==="object"){return String(value.value||value.name||value.label||value.type||value.title||"").trim();}return String(value||"").trim();}
function normalizeChainKey(value){return relationText(value).toLocaleLowerCase("nb-NO").replace(/[^a-z0-9æøå]+/g,"");}
function isRealStoreChain(value){const key=normalizeChainKey(value);return !!key&&key!=="standard"&&key!=="standardrekkefolge";}
function getInitialChain(){
  try{
    const requestedChain=relationText(new URLSearchParams(location.search).get("chain"));
    if(isRealStoreChain(requestedChain))return requestedChain;
    const activeRaw=localStorage.getItem(SHOPPING_ACTIVE_CHAIN_KEY);
    if(activeRaw){
      const active=JSON.parse(activeRaw);
      if(active&&active.chain&&Number(active.expiresAt)>Date.now())return relationText(active.chain)||"Standard";
      localStorage.removeItem(SHOPPING_ACTIVE_CHAIN_KEY);
    }
    const raw=localStorage.getItem(SHOPPING_STORE_LOCK_KEY);
    if(!raw)return "Standard";
    const lock=JSON.parse(raw);
    const expiresAt=Number(lock&&lock.expiresAt||0);
    if(!lock||!lock.data||!expiresAt||Date.now()>=expiresAt){localStorage.removeItem(SHOPPING_STORE_LOCK_KEY);return "Standard";}
    const data=lock.data;
    const actualChain=relationText(data.storeChain||(data.store&&data.store.chain));
    return isRealStoreChain(actualChain)?actualChain:"Standard";
  }catch(error){return "Standard";}

function esc(value){return String(value==null?"":value).split("&").join("&amp;").split("<").join("&lt;").split(">").join("&gt;").split('"').join("&quot;").split("'").join("&#039;");}

function render(){renderChains();updateChainLogo();updateEditUi();const list=document.getElementById("typeList");list.innerHTML=types.map((type,index)=>{const dragAttrs=canEditTypeOrder?`draggable="true" ondragstart="handleDragStart(event, ${index})" ondragover="handleDragOver(event, ${index})" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event, ${index})" ondragend="handleDragEnd(event)" onpointerdown="handlePointerDown(event, ${index})"`:"";const actions=canEditTypeOrder?`<div class="type-actions"><button class="type-button" type="button" onclick="moveType(${index}, ${index-1})" ${index===0?"disabled":""} title="Flytt opp">↑</button><button class="type-button" type="button" onclick="moveType(${index}, ${index+1})" ${index===types.length-1?"disabled":""} title="Flytt ned">↓</button></div>`:`<div class="type-actions"></div>`;return `<div class="type-row ${canEditTypeOrder?"touch-enabled":"readonly"}" ${dragAttrs} data-index="${index}"><div class="type-number">${index+1}</div><div class="type-name">${esc(type)}</div>${actions}</div>`;}).join("");}
async function loadTypes(chain,retryCanonical){

}
function selectChain(chain){if(chain===currentChain){return;}if(hasUnsavedChanges&&!confirm("Du har ulagrede endringer. Bytte kjede uten å lagre?")){return;}loadTypes(chain);}
function moveType(fromIndex,toIndex){if(!canEditTypeOrder){return;}if(fromIndex<0||fromIndex>=types.length||toIndex<0||toIndex>=types.length||fromIndex===toIndex){return;}const [type]=types.splice(fromIndex,1);types.splice(toIndex,0,type);hasUnsavedChanges=true;render();}
function handleDragStart(event,index){if(!canEditTypeOrder){event.preventDefault();return;}draggedIndex=index;event.currentTarget.classList.add("dragging");event.dataTransfer.effectAllowed="move";}
function handleDragOver(event,index){if(!canEditTypeOrder){return;}event.preventDefault();event.currentTarget.classList.add("drag-over");}
function handleDragLeave(event){event.currentTarget.classList.remove("drag-over");}
function handleDrop(event,index){if(!canEditTypeOrder){return;}event.preventDefault();event.currentTarget.classList.remove("drag-over");if(draggedIndex===null){return;}moveType(draggedIndex,index);draggedIndex=null;}
function handleDragEnd(event){event.currentTarget.classList.remove("dragging");document.querySelectorAll(".type-row.drag-over").forEach(row=>row.classList.remove("drag-over"));draggedIndex=null;}
let pointerDragState=null;
function clearPointerDragClasses(){document.querySelectorAll(".type-row.touch-dragging,.type-row.drag-over").forEach(row=>{row.classList.remove("touch-dragging");row.classList.remove("drag-over");});}
function handlePointerDown(event,index){
  if(!canEditTypeOrder){return;}
  if(event.pointerType==="mouse"){return;}
  if(event.target.closest("button")){return;}
  const row=event.currentTarget;
  pointerDragState={startIndex:index,currentIndex:index,startX:event.clientX,startY:event.clientY,dragging:false,pointerId:event.pointerId,row};
  if(row.setPointerCapture){row.setPointerCapture(event.pointerId);}
  row.addEventListener("pointermove",handlePointerMove);
  row.addEventListener("pointerup",handlePointerUp);
  row.addEventListener("pointercancel",handlePointerCancel);
}
function handlePointerMove(event){
  if(!pointerDragState||event.pointerId!==pointerDragState.pointerId){return;}
  const dx=Math.abs(event.clientX-pointerDragState.startX);
  const dy=Math.abs(event.clientY-pointerDragState.startY);
  if(!pointerDragState.dragging&&(dx>8||dy>8)){
    pointerDragState.dragging=true;
    pointerDragState.row.classList.add("touch-dragging");
  }
  if(!pointerDragState.dragging){return;}
  event.preventDefault();
  const element=document.elementFromPoint(event.clientX,event.clientY);
  const targetRow=(element&&element.closest?element.closest(".type-row"):null);
  document.querySelectorAll(".type-row.drag-over").forEach(row=>row.classList.remove("drag-over"));
  if(targetRow){
    const targetIndex=Number(targetRow.dataset.index);
    if(Number.isFinite(targetIndex)){
      pointerDragState.currentIndex=targetIndex;
      targetRow.classList.add("drag-over");
    }
  }
}
function handlePointerUp(event){
  if(!pointerDragState||event.pointerId!==pointerDragState.pointerId){return;}
  const state=pointerDragState;
  cleanupPointerListeners(state.row);
  if(state.dragging&&state.currentIndex!==null&&state.currentIndex!==state.startIndex){
    moveType(state.startIndex,state.currentIndex);
  }
  clearPointerDragClasses();
  pointerDragState=null;
}
function handlePointerCancel(event){
  if(!pointerDragState||event.pointerId!==pointerDragState.pointerId){return;}
  cleanupPointerListeners(pointerDragState.row);
  clearPointerDragClasses();
  pointerDragState=null;
}
function cleanupPointerListeners(row){
  if(row){row.removeEventListener("pointermove",handlePointerMove);}
  if(row){row.removeEventListener("pointerup",handlePointerUp);}
  if(row){row.removeEventListener("pointercancel",handlePointerCancel);}
}

async function saveTypeOrder(){
  if(!canEditTypeOrder){setStatus("Kun administrator kan lagre varetyperekkefølge.","error");return;}
  const button=document.getElementById("saveButton");
  const requestedTypes=[...types];
  button.disabled=true;
  setStatus(`Lagrer rekkefølge for ${esc(currentChain)}...`);
  try{
    await fetchJson(`${API_BASE}/shopping/type-order`,{
      method:"POST",
      headers:{"Content-Type":"text/plain;charset=UTF-8"},
      body:JSON.stringify({chain:currentChain,types:requestedTypes})
    });

    // Les tilbake fra Baserow via Worker og bekreft at rekkefølgen faktisk er lagret.
    const verified=await fetchJson(`${API_BASE}/shopping/type-order?chain=${encodeURIComponent(currentChain)}&verify=${Date.now()}`);
    const savedTypes=Array.isArray(verified.typeOrder)?verified.typeOrder:[];
    const requestedKey=requestedTypes.join("\u001f");
    const savedKey=savedTypes.slice(0,requestedTypes.length).join("\u001f");
    if(!savedTypes.length||savedKey!==requestedKey){
      throw new Error("Rekkefølgen ble ikke lest tilbake likt etter lagring.");
    }

    types=savedTypes;
    chains=Array.isArray(verified.chains)&&verified.chains.length?verified.chains:chains;
    chainLogos=verified.chainLogos||chainLogos||{};
    hasUnsavedChanges=false;
    render();
    setStatus(`Varetyperekkefølgen for <strong>${esc(currentChain)}</strong> er lagret og kontrollert.`,"success");
  }catch(error){
    setStatus(`Kunne ikke lagre varetyperekkefølgen.<br><br>${esc(error.message)}`,"error");
  }finally{
    button.disabled=false;
  }
}
window.addEventListener("beforeunload",event=>{if(!hasUnsavedChanges){return;}event.preventDefault();event.returnValue="";});
loadTypes(getInitialChain());
document.getElementById("chainLogo").addEventListener("error",function(){this.style.display="none";});

<script>
(function(){
  const APP_PAGE_RE = /^handleliste-[a-z0-9-]+\.html$/i;
  const HOME_TARGET = 'index.html?restoreMenu=1';

  function currentPage(){
    return location.pathname.split('/').pop() || 'handleliste-bestille.html';
  }

  function isAppPage(page){
    return APP_PAGE_RE.test(String(page || ''));
  }

  function safeAppTarget(value){
    if(!value) return '';
    try{
      const url = new URL(value, location.href);
      if(url.origin !== location.origin) return '';
      const page = url.pathname.split('/').pop();
      if(!isAppPage(page)) return '';
      return page + url.search + url.hash;
    }catch(e){
      const clean = String(value).trim();
      const page = clean.split('?')[0].split('#')[0];
      return isAppPage(page) ? clean : '';
    }
  }

  function currentTargetForBack(){
    const url = new URL(location.href);
    const page = currentPage();
    const params = new URLSearchParams(url.search);
    const legacyFrom = params.get('from');
    const existingBack = params.get('back');

    params.delete('from');

    if(!existingBack && legacyFrom){
      const safeLegacy = safeAppTarget(legacyFrom);
      if(safeLegacy) params.set('back', safeLegacy);
    }

    const query = params.toString();
    return page + (query ? '?' + query : '') + url.hash;
  }

  function getBackTarget(){
    const params = new URLSearchParams(location.search);
    return safeAppTarget(params.get('back')) || safeAppTarget(params.get('from')) || HOME_TARGET;
  }

  function addBackToUrl(rawHref){
    if(!rawHref) return rawHref;
    if(/^#|^(mailto|sms|tel|javascript):/i.test(rawHref)) return rawHref;

    try{
      const url = new URL(rawHref, location.href);
      if(url.origin !== location.origin) return rawHref;
      const page = url.pathname.split('/').pop();
      const here = currentPage();

      if(isAppPage(page) && page !== here){
        url.searchParams.delete('from');
        if(!url.searchParams.has('back')){
          url.searchParams.set('back', currentTargetForBack());
        }
        return page + url.search + url.hash;
      }
    }catch(e){}

    return rawHref;
  }

  function appBack(event){
    event.preventDefault();
    location.href = getBackTarget();
  }

  function initAppNavigation(){
    document.querySelectorAll('a[href]').forEach(function(anchor){
      const href = anchor.getAttribute('href');
      const nextHref = addBackToUrl(href);
      if(nextHref !== href) anchor.setAttribute('href', nextHref);
    });

    document.querySelectorAll('.top-buttons .top-button').forEach(function(button){
      if((button.textContent || '').trim() === '←'){
        button.addEventListener('click', appBack);
      }
    });
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', initAppNavigation);
  }else{
    initAppNavigation();
  }
})();
</script>


<script>
/* Handleliste v51: lokal navigasjonsstack for tilbakeknapp innen Handleliste */
(function(){
  const STACK_KEY = "kvimarka92HandlelisteBackStack";
  const HOME_TARGET = "index.html?restoreMenu=1";
  const HANDLE_PAGE_RE = /^handleliste-[a-z0-9-]+\.html$/i;
  const MAX_STACK = 30;

  function pageFromUrl(value){
    try{
      const url = new URL(value, location.href);
      return url.pathname.split("/").pop() || "";
    }catch(error){
      return String(value || "").split("?")[0].split("#")[0].split("/").pop() || "";
    }
  }

  function isHandlelisteUrl(value){
    return HANDLE_PAGE_RE.test(pageFromUrl(value));
  }

  function relativeUrl(value){
    try{
      const url = new URL(value, location.href);
      if(url.origin !== location.origin) return "";
      const page = url.pathname.split("/").pop() || "";
      if(!HANDLE_PAGE_RE.test(page)) return "";
      return page + url.search + url.hash;
    }catch(error){
      const text = String(value || "").trim();
      return isHandlelisteUrl(text) ? text : "";
    }
  }

  function currentRelativeUrl(){
    const page = location.pathname.split("/").pop() || "";
    return page + location.search + location.hash;
  }

  function readStack(){
    try{
      const parsed = JSON.parse(sessionStorage.getItem(STACK_KEY) || "[]");
      return Array.isArray(parsed) ? parsed.filter(isHandlelisteUrl) : [];
    }catch(error){
      return [];
    }
  }

  function writeStack(stack){
    try{
      sessionStorage.setItem(STACK_KEY, JSON.stringify(stack.slice(-MAX_STACK)));
    }catch(error){}
  }

  function pushCurrentToHandlelisteStack(){
    const current = currentRelativeUrl();
    if(!isHandlelisteUrl(current)) return;
    const stack = readStack();
    if(stack[stack.length - 1] !== current){
      stack.push(current);
      writeStack(stack);
    }
  }

  function popPreviousFromHandlelisteStack(){
    const current = currentRelativeUrl();
    const stack = readStack();
    let target = "";
    while(stack.length){
      const candidate = stack.pop();
      if(candidate && candidate !== current){
        target = candidate;
        break;
      }
    }
    writeStack(stack);
    return target;
  }

  window.pushHandlelisteBackUrl = pushCurrentToHandlelisteStack;
  window.goHandlelisteBackOrHome = function(event){
    if(event){
      event.preventDefault();
      if(event.stopImmediatePropagation) event.stopImmediatePropagation();
      event.stopPropagation();
    }
    location.href = popPreviousFromHandlelisteStack() || HOME_TARGET;
    return false;
  };

  function shouldIgnoreClick(event, anchor){
    if(event.defaultPrevented) return true;
    if(event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return true;
    if(anchor.target && anchor.target !== "_self") return true;
    if(anchor.hasAttribute("download")) return true;
    const href = anchor.getAttribute("href") || "";
    if(!href || href === "#" || href.startsWith("#")) return true;
    if(/^(mailto|sms|tel|javascript):/i.test(href)) return true;
    return false;
  }

  document.addEventListener("click", function(event){
    const anchor = event.target && event.target.closest ? event.target.closest("a[href]") : null;
    if(!anchor) return;

    const isBackButton = anchor.hasAttribute("data-handleliste-back") ||
      (anchor.classList && anchor.classList.contains("top-button") && (anchor.textContent || "").trim() === "←");

    if(isBackButton){
      window.goHandlelisteBackOrHome(event);
      return;
    }

    const href = anchor.getAttribute("href") || "";

    if(/^(index\.html|\/index\.html)/i.test(href)){
      try{ sessionStorage.removeItem(STACK_KEY); }catch(error){}
      return;
    }

    if(shouldIgnoreClick(event, anchor)) return;

    if(isHandlelisteUrl(href)){
      const target = relativeUrl(href);
      if(target && target !== currentRelativeUrl()){
        pushCurrentToHandlelisteStack();
      }
    }
  }, true);
})();
</script>
