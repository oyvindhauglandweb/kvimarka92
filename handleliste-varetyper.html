<script>
const API_BASE="https://api-kvimarka92.carstereogarage.com";

function esc(value){return String(value==null?"":value).split("&").join("&amp;").split("<").join("&lt;").split(">").join("&gt;").split('"').join("&quot;").split("'").join("&#039;");}
async function fetchJson(url,options){const res=await fetch(url,{credentials:"include",...(options||{})});const data=await res.json().catch(()=>null);if(!res.ok||(data&&data.error)){throw new Error((data&&data.error)||(data&&data.detail)||`HTTP ${res.status}`);}return data;}

function renderChains(){const el=document.getElementById("chainTabs");el.innerHTML=chains.map(chain=>`<button class="chain-button ${chain===currentChain?"active":""}" type="button" onclick="selectChain('${esc(chain)}')">${esc(chain)}</button>`).join("");}
function updateChainLogo(){const logo=document.getElementById("chainLogo");if(!logo){return;}const logoUrl=chainLogos&&currentChain?chainLogos[currentChain]:"";if(!logoUrl||currentChain==="Standard"){logo.style.display="none";logo.removeAttribute("src");logo.alt="";return;}logo.src=logoUrl;logo.alt=`${currentChain} logo`;logo.title=currentChain;logo.style.display="block";}
function updateEditUi(){const saveButton=document.getElementById("saveButton");const note=document.getElementById("editNote");if(saveButton){saveButton.style.display=canEditTypeOrder?"inline-flex":"none";saveButton.disabled=!canEditTypeOrder;}if(note){note.textContent=canEditTypeOrder?"":"Kun administrator kan endre rekkefølgen.";}}
function render(){renderChains();updateChainLogo();updateEditUi();const list=document.getElementById("typeList");list.innerHTML=types.map((type,index)=>{const dragAttrs=canEditTypeOrder?`draggable="true" ondragstart="handleDragStart(event, ${index})" ondragover="handleDragOver(event, ${index})" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event, ${index})" ondragend="handleDragEnd(event)" onpointerdown="handlePointerDown(event, ${index})"`:"";const actions=canEditTypeOrder?`<div class="type-actions"><button class="type-button" type="button" onclick="moveType(${index}, ${index-1})" ${index===0?"disabled":""} title="Flytt opp">↑</button><button class="type-button" type="button" onclick="moveType(${index}, ${index+1})" ${index===types.length-1?"disabled":""} title="Flytt ned">↓</button></div>`:`<div class="type-actions"></div>`;return `<div class="type-row ${canEditTypeOrder?"touch-enabled":"readonly"}" ${dragAttrs} data-index="${index}"><div class="type-number">${index+1}</div><div class="type-name">${esc(type)}</div>${actions}</div>`;}).join("");}
async function loadTypes(chain){currentChain=chain||currentChain||"Standard";setStatus(`Laster varetyper for ${esc(currentChain)}...`);try{const data=await fetchJson(`${API_BASE}/shopping/type-order?chain=${encodeURIComponent(currentChain)}`);types=Array.isArray(data.typeOrder)?data.typeOrder:[];chains=Array.isArray(data.chains)&&data.chains.length?data.chains:["Standard"];chainLogos=data.chainLogos||chainLogos||{};currentChain=data.chain||currentChain;canEditTypeOrder=Boolean(data.canEditTypeOrder);currentUserRole=data.(currentUser&&currentUser.role)||"";hasUnsavedChanges=false;render();setStatus(canEditTypeOrder?`Klar. Redigerer rekkefølge for <strong>${esc(currentChain)}</strong>.`:`Klar. Viser rekkefølge for <strong>${esc(currentChain)}</strong>. Kun administrator kan endre.`, "success");}catch(error){setStatus(`Kunne ikke laste varetyper.<br><br>${esc(error.message)}`,"error");}}
function selectChain(chain){if(chain===currentChain){return;}if(hasUnsavedChanges&&!confirm("Du har ulagrede endringer. Bytte kjede uten å lagre?")){return;}loadTypes(chain);}
function moveType(fromIndex,toIndex){if(!canEditTypeOrder){return;}if(fromIndex<0||fromIndex>=types.length||toIndex<0||toIndex>=types.length||fromIndex===toIndex){return;}const [type]=types.splice(fromIndex,1);types.splice(toIndex,0,type);hasUnsavedChanges=true;render();}
function handleDragStart(event,index){if(!canEditTypeOrder){event.preventDefault();return;}draggedIndex=index;event.currentTarget.classList.add("dragging");event.dataTransfer.effectAllowed="move";}
function handleDragOver(event,index){if(!canEditTypeOrder){return;}event.preventDefault();event.currentTarget.classList.add("drag-over");}
function handleDragLeave(event){event.currentTarget.classList.remove("drag-over");}
function handleDrop(event,index){if(!canEditTypeOrder){return;}event.preventDefault();event.currentTarget.classList.remove("drag-over");if(draggedIndex===null){return;}moveType(draggedIndex,index);draggedIndex=null;}

function clearPointerDragClasses(){document.querySelectorAll(".type-row.touch-dragging,.type-row.drag-over").forEach(row=>{row.classList.remove("touch-dragging");row.classList.remove("drag-over");});}
function handlePointerDown(event,index){
  if(!canEditTypeOrder){return;}
  if(event.pointerType==="mouse"){return;}
  if(event.target.closest("button")){return;}
  const row=event.currentTarget;
  pointerDragState={startIndex:index,currentIndex:index,startX:event.clientX,startY:event.clientY,dragging:false,pointerId:event.pointerId,row};
  if(row.setPointerCapture){row.setPointerCapture(event.pointerId);}
  row.addEventListener("pointermove",handlePointerMove);
  row.addEventListener("pointerup",handlePointerUp);
  row.addEventListener("pointercancel",handlePointerCancel);
}
function handlePointerMove(event){
  if(!pointerDragState||event.pointerId!==pointerDragState.pointerId){return;}
  const dx=Math.abs(event.clientX-pointerDragState.startX);
  const dy=Math.abs(event.clientY-pointerDragState.startY);
  if(!pointerDragState.dragging&&(dx>8||dy>8)){
    pointerDragState.dragging=true;
    pointerDragState.row.classList.add("touch-dragging");
  }
  if(!pointerDragState.dragging){return;}
  event.preventDefault();
  const element=document.elementFromPoint(event.clientX,event.clientY);
  const targetRow=(element&&element.closest?element.closest(".type-row"):null);
  document.querySelectorAll(".type-row.drag-over").forEach(row=>row.classList.remove("drag-over"));
  if(targetRow){
    const targetIndex=Number(targetRow.dataset.index);
    if(Number.isFinite(targetIndex)){
      pointerDragState.currentIndex=targetIndex;
      targetRow.classList.add("drag-over");
    }
  }
}
function handlePointerUp(event){
  if(!pointerDragState||event.pointerId!==pointerDragState.pointerId){return;}
  const state=pointerDragState;
  cleanupPointerListeners(state.row);
  if(state.dragging&&state.currentIndex!==null&&state.currentIndex!==state.startIndex){
    moveType(state.startIndex,state.currentIndex);
  }
  clearPointerDragClasses();
  pointerDragState=null;
}
function handlePointerCancel(event){
  if(!pointerDragState||event.pointerId!==pointerDragState.pointerId){return;}
  cleanupPointerListeners(pointerDragState.row);
  clearPointerDragClasses();
  pointerDragState=null;
}
function cleanupPointerListeners(row){
  if(row){row.removeEventListener("pointermove",handlePointerMove);}
  if(row){row.removeEventListener("pointerup",handlePointerUp);}
  if(row){row.removeEventListener("pointercancel",handlePointerCancel);}
}

<script>
(function(){
  const APP_PAGE_RE = /^handleliste-[a-z0-9-]+\.html$/i;
  const HOME_TARGET = 'index.html?restoreMenu=1';

  function currentPage(){
    return location.pathname.split('/').pop() || 'handleliste-bestille.html';
  }

  function isAppPage(page){
    return APP_PAGE_RE.test(String(page || ''));
  }

  function safeAppTarget(value){
    if(!value) return '';
    try{
      const url = new URL(value, location.href);
      if(url.origin !== location.origin) return '';
      const page = url.pathname.split('/').pop();
      if(!isAppPage(page)) return '';
      return page + url.search + url.hash;
    }catch(e){
      const clean = String(value).trim();
      const page = clean.split('?')[0].split('#')[0];
      return isAppPage(page) ? clean : '';
    }
  }

  function currentTargetForBack(){
    const url = new URL(location.href);
    const page = currentPage();
    const params = new URLSearchParams(url.search);
    const legacyFrom = params.get('from');
    const existingBack = params.get('back');

    params.delete('from');

    if(!existingBack && legacyFrom){
      const safeLegacy = safeAppTarget(legacyFrom);
      if(safeLegacy) params.set('back', safeLegacy);
    }

    const query = params.toString();
    return page + (query ? '?' + query : '') + url.hash;
  }

  function getBackTarget(){
    const params = new URLSearchParams(location.search);
    return safeAppTarget(params.get('back')) || safeAppTarget(params.get('from')) || HOME_TARGET;
  }

  function addBackToUrl(rawHref){
    if(!rawHref) return rawHref;
    if(/^#|^(mailto|sms|tel|javascript):/i.test(rawHref)) return rawHref;

    try{
      const url = new URL(rawHref, location.href);
      if(url.origin !== location.origin) return rawHref;
      const page = url.pathname.split('/').pop();
      const here = currentPage();

      if(isAppPage(page) && page !== here){
        url.searchParams.delete('from');
        if(!url.searchParams.has('back')){
          url.searchParams.set('back', currentTargetForBack());
        }
        return page + url.search + url.hash;
      }
    }catch(e){}

    return rawHref;
  }

  function appBack(event){
    event.preventDefault();
    location.href = getBackTarget();
  }

  function initAppNavigation(){
    document.querySelectorAll('a[href]').forEach(function(anchor){
      const href = anchor.getAttribute('href');
      const nextHref = addBackToUrl(href);
      if(nextHref !== href) anchor.setAttribute('href', nextHref);
    });

    document.querySelectorAll('.top-buttons .top-button').forEach(function(button){
      if((button.textContent || '').trim() === '←'){
        button.addEventListener('click', appBack);
      }
    });
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', initAppNavigation);
  }else{
    initAppNavigation();
  }
})();
</script>

</body></html>
