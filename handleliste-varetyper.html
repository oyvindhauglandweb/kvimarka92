t);font-weight:bold;cursor:pointer;font-size:13px;}.chain-button.active{background:var(--link);border-color:var(--link);color:#fff;}.chain-logo{display:none;max-width:110px;max-height:36px;object-fit:contain;background:#fff;border:1px solid var(--border);border-radius:8px;padding:4px;margin-left:auto;}.chain-status-row{display:flex;align-items:center;gap:10px;}.chain-status-row .status{flex:1;min-width:0;}@media(max-width:700px){.chain-logo{max-width:86px;max-height:32px;padding:3px;}}.status{color:var(--muted);line-height:1.35;font-size:14px;}.status.error{color:var(--danger);}.status.success{color:var(--success);}.small-help{color:var(--muted);font-size:13px;line-height:1.35;}.type-list{display:flex;flex-direction:column;gap:4px;}.type-row{display:grid;grid-template-columns:34px 1fr auto;gap:7px;align-items:center;border:1px solid var(--border);border-radius:8px;padding:5px 7px;background:rgba(127,127,127,.04);min-height:36px;cursor:grab;}.type-row.readonly{cursor:default;} .type-row.readonly .type-actions{display:none;} .readonly-note{color:var(--muted);font-size:13px;margin-left:8px;} .type-row.dragging{opacity:.45;}.type-row.drag-over{outline:3px solid var(--link);outline-offset:2px;}.type-number{display:flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:var(--link);color:#fff;font-weight:bold;font-size:12px;}.type-name{font-weight:bold;font-size:14px;}.type-actions{display:flex;gap:0;}.type-button{display:inline-flex;align-items:center;justify-content:center;width:30px;height:28px;border:1px solid var(--border);border-radius:0;background:var(--button);color:var(--text);font-weight:bold;cursor:pointer;margin-left:-1px;}.type-button:first-child{border-top-left-radius:7px;border-bottom-left-radius:7px;margin-left:0;}.type-button:last-child{border-top-right-radius:7px;border-bottom-right-radius:7px;}@media(max-width:700px){body{padding:6px;}.header{margin-bottom:12px;}.site-title{font-size:28px;}.card{padding:7px;margin-bottom:7px;border-radius:10px;}.toolbar,.toolbar-left,.toolbar-right{align-items:stretch;width:100%;}.action-button{flex:1 1 auto;min-height:31px;padding:0 7px;font-size:12px;}.type-list{gap:3px;}.type-row{grid-template-columns:30px 1fr auto;padding:4px 5px;min-height:32px;gap:5px;border-radius:7px;}.type-name{font-size:13px;}.type-button{width:28px;height:26px;}}
/* shopping-toolbar-cleanup-2026-06-05 */ .top-button.bestille-top-button{font-size:20px;} .top-button.handle-top-button{font-size:20px;} .toolbar-separator{display:inline-block;width:12px;flex:0 0 12px;} @media(max-width:700px){.toolbar-separator{width:100%;flex:0 0 100%;height:0;}}</style></head><body class="dark-mode"><div class="container"><div class="header"><h1 class="site-title">Handleliste</h1><div class="subtitle">Sorter varetyper</div><div class="top-buttons"><a class="top-button" href="handleliste-bestille.html" title="Tilbake til Bestille">←</a><a class="top-button bestille-top-button" href="handleliste-bestille.html" title="Bestille">☑</a><a class="top-button" href="index.html" title="Hovedside">⌂</a><a class="top-button" href="help.html?case=Handleliste" title="Hjelp">?</a></div></div>
<div class="card"><div class="toolbar"><div class="toolbar-left"><a class="action-button" href="handleliste-rediger.html">✎ Rediger</a></div><div class="toolbar-right"><button class="action-button primary" type="button" id="saveButton" onclick="saveTypeOrder()">Lagre rekkefølge</button><span class="readonly-note" id="editNote"></span></div></div></div>
<div class="card"><div class="small-help">Velg <strong>Standard</strong> for vanlig rekkefølge, eller en butikkjede for å tilpasse rekkefølgen slik varene står i den kjeden. Dra og slipp varetypene fra øverst til nederst.</div></div><div class="card"><div id="chainTabs" class="chain-tabs"></div></div>
<div class="card"><div class="chain-status-row"><div id="status" class="status">Laster...</div><img id="chainLogo" class="chain-logo" alt=""></div></div><div class="card"><div id="typeList" class="type-list"></div></div></div>
<script>
const API_BASE="https://api-kvimarka92.carstereogarage.com";
let types=[];
let chains=["Standard"];
let chainLogos={};
let currentChain="Standard";
let draggedIndex=null;
let hasUnsavedChanges=false;
let canEditTypeOrder=false;
let currentUserRole="";
function esc(value){return String(value??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");}
async function fetchJson(url,options){const res=await fetch(url,{credentials:"include",...(options||{})});const data=await res.json().catch(()=>null);if(!res.ok||(data&&data.error)){throw new Error(data?.error||data?.detail||`HTTP ${res.status}`);}return data;}
function setStatus(message,type){const el=document.getElementById("status");el.className="status"+(type?` ${type}`:"");el.innerHTML=message||"";}
function renderChains(){const el=document.getElementById("chainTabs");el.innerHTML=chains.map(chain=>`<button class="chain-button ${chain===currentChain?"active":""}" type="button" onclick="selectChain('${esc(chain)}')">${esc(chain)}</button>`).join("");}
function updateChainLogo(){const logo=document.getElementById("chainLogo");if(!logo){return;}const logoUrl=chainLogos&&currentChain?chainLogos[currentChain]:"";if(!logoUrl||currentChain==="Standard"){logo.style.display="none";logo.removeAttribute("src");logo.alt="";return;}logo.src=logoUrl;logo.alt=`${currentChain} logo`;logo.title=currentChain;logo.style.display="block";}
function updateEditUi(){const saveButton=document.getElementById("saveButton");const note=document.getElementById("editNote");if(saveButton){saveButton.style.display=canEditTypeOrder?"inline-flex":"none";saveButton.disabled=!canEditTypeOrder;}if(note){note.textContent=canEditTypeOrder?"":"Kun administrator kan endre rekkefølgen.";}}
function render(){renderChains();updateChainLogo();updateEditUi();const list=document.getElementById("typeList");list.innerHTML=types.map((type,index)=>{const dragAttrs=canEditTypeOrder?`draggable="true" ondragstart="handleDragStart(event, ${index})" ondragover="handleDragOver(event, ${index})" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event, ${index})" ondragend="handleDragEnd(event)"`:"";const actions=canEditTypeOrder?`<div class="type-actions"><button class="type-button" type="button" onclick="moveType(${index}, ${index-1})" ${index===0?"disabled":""} title="Flytt opp">↑</button><button class="type-button" type="button" onclick="moveType(${index}, ${index+1})" ${index===types.length-1?"disabled":""} title="Flytt ned">↓</button></div>`:`<div class="type-actions"></div>`;return `<div class="type-row ${canEditTypeOrder?"":"readonly"}" ${dragAttrs} data-index="${index}"><div class="type-number">${index+1}</div><div class="type-name">${esc(type)}</div>${actions}</div>`;}).join("");}
async function loadTypes(chain){currentChain=chain||currentChain||"Standard";setStatus(`Laster varetyper for ${esc(currentChain)}...`);try{const data=await fetchJson(`${API_BASE}/shopping/type-order?chain=${encodeURIComponent(currentChain)}`);types=Array.isArray(data.typeOrder)?data.typeOrder:[];chains=Array.isArray(data.chains)&&data.chains.length?data.chains:["Standard"];chainLogos=data.chainLogos||chainLogos||{};currentChain=data.chain||currentChain;canEditTypeOrder=Boolean(data.canEditTypeOrder);currentUserRole=data.currentUser?.role||"";hasUnsavedChanges=false;render();setStatus(canEditTypeOrder?`Klar. Redigerer rekkefølge for <strong>${esc(currentChain)}</strong>.`:`Klar. Viser rekkefølge for <strong>${esc(currentChain)}</strong>. Kun administrator kan endre.`, "success");}catch(error){setStatus(`Kunne ikke laste varetyper.<br><br>${esc(error.message)}`,"error");}}
function selectChain(chain){if(chain===currentChain){return;}if(hasUnsavedChanges&&!confirm("Du har ulagrede endringer. Bytte kjede uten å lagre?")){return;}loadTypes(chain);}
function moveType(fromIndex,toIndex){if(!canEditTypeOrder){return;}if(fromIndex<0||fromIndex>=types.length||toIndex<0||toIndex>=types.length||fromIndex===toIndex){return;}const [type]=types.splice(fromIndex,1);types.splice(toIndex,0,type);hasUnsavedChanges=true;render();}
function handleDragStart(event,index){if(!canEditTypeOrder){event.preventDefault();return;}draggedIndex=index;event.currentTarget.classList.add("dragging");event.dataTransfer.effectAllowed="move";}
function handleDragOver(event,index){if(!canEditTypeOrder){return;}event.preventDefault();event.currentTarget.classList.add("drag-over");}
function handleDragLeave(event){event.currentTarget.classList.remove("drag-over");}
function handleDrop(event,index){if(!canEditTypeOrder){return;}event.preventDefault();event.currentTarget.classList.remove("drag-over");if(draggedIndex===null){return;}moveType(draggedIndex,index);draggedIndex=null;}
function handleDragEnd(event){event.currentTarget.classList.remove("dragging");document.querySelectorAll(".type-row.drag-over").forEach(row=>row.classList.remove("drag-over"));draggedIndex=null;}
async function saveTypeOrder(){if(!canEditTypeOrder){setStatus("Kun administrator kan lagre varetyperekkefølge.","error");return;}const button=document.getElementById("saveButton");button.disabled=true;setStatus(`Lagrer rekkefølge for ${esc(currentChain)}...`);try{const data=await fetchJson(`${API_BASE}/shopping/type-order`,{method:"POST",headers:{"Content-Type":"text/plain;charset=UTF-8"},body:JSON.stringify({chain:currentChain,types})});types=Array.isArray(data.typeOrder)?data.typeOrder:types;chains=Array.isArray(data.chains)&&data.chains.length?data.chains:chains;chainLogos=data.chainLogos||chainLogos||{};hasUnsavedChanges=false;render();setStatus(`Varetyperekkefølgen for <strong>${esc(currentChain)}</strong> er lagret.`, "success");}catch(error){setStatus(`Kunne ikke lagre varetyperekkefølgen.<br><br>${esc(error.message)}`,"error");}finally{button.disabled=false;}}
window.addEventListener("beforeunload",event=>{if(!hasUnsavedChanges){return;}event.preventDefault();event.returnValue="";});
loadTypes("Standard");
document.getElementById("chainLogo").addEventListener("error",function(){this.style.display="none";});
</script>
<script>
(function(){
  const APP_PAGE_RE = /^handleliste-[a-z0-9-]+\.html$/i;
  const HOME_TARGET = 'index.html?restoreMenu=1';

  function currentPage(){
    return location.pathname.split('/').pop() || 'handleliste-bestille.html';
  }

  function isAppPage(page){
    return APP_PAGE_RE.test(String(page || ''));
  }

  function safeAppTarget(value){
    if(!value) return '';
    try{
      const url = new URL(value, location.href);
      if(url.origin !== location.origin) return '';
      const page = url.pathname.split('/').pop();
      if(!isAppPage(page)) return '';
      return page + url.search + url.hash;
    }catch(e){
      const clean = String(value).trim();
      const page = clean.split('?')[0].split('#')[0];
      return isAppPage(page) ? clean : '';
    }
  }

  function currentTargetForBack(){
    const url = new URL(location.href);
    const page = currentPage();
    const params = new URLSearchParams(url.search);
    const legacyFrom = params.get('from');
    const existingBack = params.get('back');

    params.delete('from');

    if(!existingBack && legacyFrom){
      const safeLegacy = safeAppTarget(legacyFrom);
      if(safeLegacy) params.set('back', safeLegacy);
    }

    const query = params.toString();
    return page + (query ? '?' + query : '') + url.hash;
  }

  function getBackTarget(){
    const params = new URLSearchParams(location.search);
    return safeAppTarget(params.get('back')) || safeAppTarget(params.get('from')) || HOME_TARGET;
  }

  function addBackToUrl(rawHref){
    if(!rawHref) return rawHref;
    if(/^#|^(mailto|sms|tel|javascript):/i.test(rawHref)) return rawHref;

    try{
      const url = new URL(rawHref, location.href);
      if(url.origin !== location.origin) return rawHref;
      const page = url.pathname.split('/').pop();
      const here = currentPage();

      if(isAppPage(page) && page !== here){
        url.searchParams.delete('from');
        if(!url.searchParams.has('back')){
          url.searchParams.set('back', currentTargetForBack());
        }
        return page + url.search + url.hash;
      }
    }catch(e){}

    return rawHref;
  }

  function appBack(event){
    event.preventDefault();
    location.href = getBackTarget();
  }

  function initAppNavigation(){
    document.querySelectorAll('a[href]').forEach(function(anchor){
      const href = anchor.getAttribute('href');
      const nextHref = addBackToUrl(href);
      if(nextHref !== href) anchor.setAttribute('href', nextHref);
    });

    document.querySelectorAll('.top-buttons .top-button').forEach(function(button){
      if((button.textContent || '').trim() === '←'){
        button.addEventListener('click', appBack);
      }
    });
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', initAppNavigation);
  }else{
    initAppNavigation();
  }
})();
</script>
