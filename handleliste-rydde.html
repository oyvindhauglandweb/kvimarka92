    <div class="cleanup-filter-field"><label for="cleanupStandardFilter">Standardstatus</label><select id="cleanupStandardFilter" onchange="render()"><option value="">Alle</option><option value="standard">Standardvarer</option><option value="other">Andre varer</option></select></div>
    <div class="cleanup-filter-field"><label for="cleanupBoughtFilter">Sist handlet</label><select id="cleanupBoughtFilter" onchange="render()"><option value="">Alle</option><option value="never">Aldri handlet</option><option value="bought">Tidligere handlet</option></select></div>
    <div class="cleanup-filter-actions"><button class="action-button" type="button" onclick="resetCleanupFilters()">Nullstill</button></div>

<div class="card">
<div id="status" class="cleanup-inline-message" role="status" aria-live="polite" hidden></div>
  <div class="cleanup-mobile-sort" aria-label="Sorter varer">
  <div><label for="cleanupMobileSortKey">Sorter etter</label><select id="cleanupMobileSortKey" onchange="setCleanupMobileSort(this.value)"><option value="lastBoughtAt">Sist handlet</option><option value="createdAt">Lagt inn</option><option value="name">Vare</option><option value="type">Varegruppe/butikk</option><option value="owner">Vareliste</option></select></div>
  <button class="action-button" id="cleanupMobileSortDirection" type="button" onclick="toggleCleanupSortDirection()" title="Bytt sorteringsretning">↑</button>
</div>
<div class="cleanup-table-head">
  <button class="cleanup-sort-button" data-sort="name" type="button" onclick="toggleCleanupSort('name')">Vare <span class="cleanup-sort-symbol">⇅</span></button>
  <button class="cleanup-sort-button" data-sort="type" type="button" onclick="toggleCleanupSort('type')">Varegruppe/butikk <span class="cleanup-sort-symbol">⇅</span></button>
  <button class="cleanup-sort-button" data-sort="owner" type="button" onclick="toggleCleanupSort('owner')">Vareliste <span class="cleanup-sort-symbol">⇅</span></button>
  <button class="cleanup-sort-button" data-sort="createdAt" type="button" onclick="toggleCleanupSort('createdAt')">Lagt inn <span class="cleanup-sort-symbol">⇅</span></button>
  <button class="cleanup-sort-button" data-sort="lastBoughtAt" type="button" onclick="toggleCleanupSort('lastBoughtAt')">Sist handlet <span class="cleanup-sort-symbol">⇅</span></button>
  <span></span>
</div>
<div id="cleanupList"></div>
</div></div><script>
const API_BASE="https://api-kvimarka92.carstereogarage.com";
let SHOPPING_OWNERS=["Felles"];
let items=[];
let currentUser=null;
let cleanupSort={key:"lastBoughtAt",direction:"asc"};
let cleanupStatusTimer=null;
function esc(value){return String(value==null?"":value).split("&").join("&amp;").split("<").join("&lt;").split(">").join("&gt;").split('"').join("&quot;").split("'").join("&#039;");}
async function fetchJson(url,options){const res=await fetch(url,Object.assign({credentials:"include"},options||{}));const data=await res.json().catch(()=>null);if(!res.ok||(data&&data.error)){throw new Error((data&&data.error)||(data&&data.detail)||`HTTP ${res.status}`);}return data;}
function setStatus(message,type,autoHideMs){const el=document.getElementById("status");if(!el)return;if(cleanupStatusTimer){clearTimeout(cleanupStatusTimer);cleanupStatusTimer=null;}const text=String(message||"").trim();const visible=Boolean(text)&&["working","success","error"].includes(type);el.className="cleanup-inline-message"+(visible?` show ${type}`:"");el.hidden=!visible;el.innerHTML=visible?message:"";if(visible&&autoHideMs){cleanupStatusTimer=setTimeout(()=>setStatus("",""),autoHideMs);}}
function cleanupClientInfo(){const ua=navigator.userAgent||"";return {device:/Mobi|Android|iPhone|iPad/i.test(ua)?"Mobil/nettbrett":"PC",browser:ua,operatingSystem:navigator.platform||""};}
async function reportCleanupError(error,context){try{const info=cleanupClientInfo();await fetch(`${API_BASE}/error-log`,{method:"POST",credentials:"include",headers:{"Content-Type":"text/plain;charset=UTF-8"},body:JSON.stringify({application:"Handleliste",page:"handleliste-rydde.html",name:"Feil på Slette varer",message:String(error&&error.message||error||"Ukjent feil"),errorType:error&&error.name||"JavaScript",stackTrace:String(error&&error.stack||""),context:context||{},occurredAt:new Date().toISOString(),device:info.device,browser:info.browser,operatingSystem:info.operatingSystem})});}catch(logError){console.warn("Kunne ikke logge feil til Feillogg.",logError);}}
window.addEventListener("error",event=>{reportCleanupError(event.error||new Error(event.message||"JavaScript-feil"),{action:"window-error",filename:event.filename||"",line:event.lineno||0,column:event.colno||0});});
window.addEventListener("unhandledrejection",event=>{const reason=event.reason instanceof Error?event.reason:new Error(String(event.reason||"Ubehandlet Promise-feil"));reportCleanupError(reason,{action:"unhandled-rejection"});});
function normalizeOwner(value){const text=String(value||"Felles").trim()||"Felles";return SHOPPING_OWNERS.some(owner=>owner.toLowerCase()===text.toLowerCase())?SHOPPING_OWNERS.find(owner=>owner.toLowerCase()===text.toLowerCase()):text;}
function setShoppingOwners(options){const incoming=Array.isArray(options)?options.map(value=>String(value||"").trim()).filter(Boolean):[];const seen=new Set();const clean=[];incoming.forEach(owner=>{const key=owner.toLowerCase();if(!seen.has(key)){seen.add(key);clean.push(owner);}});if(!clean.some(owner=>owner.toLowerCase()==="felles")){clean.unshift("Felles");}if(clean.length){SHOPPING_OWNERS=clean;}}
function normalizePermissionText(value){return String(value||"").trim().toLowerCase();}
function isSupervisorOrAdministrator(){const role=normalizePermissionText((currentUser&&currentUser.role));return role==="administrator"||role==="supervisor";}
function ownerMatchesCurrentUser(owner){const safeOwner=normalizePermissionText(owner||"Felles");if(!safeOwner||safeOwner==="felles")return false;const userName=normalizePermissionText((currentUser&&currentUser.name)||"");const emailLocal=normalizePermissionText(String((currentUser&&currentUser.email)||"").split("@")[0]||"");return userName===safeOwner||userName.startsWith(`${safeOwner} `)||emailLocal===safeOwner||emailLocal.startsWith(safeOwner);}
function canDeleteItem(item){if(isSupervisorOrAdministrator())return true;const owner=normalizeOwner(item.owner);return owner!=="Felles"&&ownerMatchesCurrentUser(owner);}
function lastBoughtTimestamp(item){const raw=String((item&&item.lastBoughtAt)||"").trim();if(!raw)return -8640000000000000;const t=Date.parse(raw);return Number.isFinite(t)?t:-8640000000000000;}
function formatDateTime(value,emptyText){const raw=String(value||"").trim();if(!raw)return emptyText||"–";const date=new Date(raw);if(Number.isNaN(date.getTime()))return raw;return new Intl.DateTimeFormat("no-NO",{dateStyle:"medium",timeStyle:"short"}).format(date);}
function formatLastBought(value){return formatDateTime(value,"Aldri handlet");}
function formatCreatedAt(value){return formatDateTime(value,"Ukjent");}
function sourceBadge(item){const source=String(item.source||"").trim();if(item.recipeName)return `<span class="badge">${esc(item.recipeName)}</span>`;if(source&&source!=="Normal")return `<span class="badge">${esc(source)}</span>`;return "";}
function badgesForItem(item){const badges=[];if(item.standardItem)badges.push('<span class="badge">Standard</span>');const source=sourceBadge(item);if(source)badges.push(source);return badges.join("");}
function cleanupSortValue(item,key){
  if(key==="name")return String(item.name||"");
  if(key==="type")return String(item.type||"Annet");
  if(key==="owner")return normalizeOwner(item.owner);
  if(key==="createdAt"){const t=Date.parse(String(item.createdAt||""));return Number.isFinite(t)?t:-8640000000000000;}
  return lastBoughtTimestamp(item);
}
function sortForCleanup(a,b){
  const key=cleanupSort.key;const av=cleanupSortValue(a,key);const bv=cleanupSortValue(b,key);let result=0;
  if(typeof av==="number"&&typeof bv==="number")result=av-bv;else result=String(av).localeCompare(String(bv),"no",{sensitivity:"base"});
  if(result===0)result=String(a.name||"").localeCompare(String(b.name||""),"no",{sensitivity:"base"});
  return cleanupSort.direction==="desc"?-result:result;
}
function cleanupSortSymbol(){return cleanupSort.direction==="asc"?"↑":"↓";}
function updateCleanupSortUi(){
  document.querySelectorAll(".cleanup-sort-button").forEach(button=>{const active=button.dataset.sort===cleanupSort.key;button.classList.toggle("active",active);const symbol=button.querySelector(".cleanup-sort-symbol");if(symbol)symbol.textContent=active?cleanupSortSymbol():"⇅";});
  const mobileKey=document.getElementById("cleanupMobileSortKey");if(mobileKey)mobileKey.value=cleanupSort.key;
  const mobileDirection=document.getElementById("cleanupMobileSortDirection");if(mobileDirection)mobileDirection.textContent=cleanupSortSymbol();
}
function toggleCleanupSort(key){if(cleanupSort.key===key)cleanupSort.direction=cleanupSort.direction==="asc"?"desc":"asc";else{cleanupSort.key=key;cleanupSort.direction=(key==="createdAt"||key==="lastBoughtAt")?"asc":"asc";}render();}
function setCleanupMobileSort(key){cleanupSort.key=key||"lastBoughtAt";render();}
function toggleCleanupSortDirection(){cleanupSort.direction=cleanupSort.direction==="asc"?"desc":"asc";render();}
function uniqueSorted(values){const seen=new Set();return (values||[]).map(v=>String(v||"").trim()).filter(Boolean).filter(v=>{const k=v.toLowerCase();if(seen.has(k))return false;seen.add(k);return true;}).sort((a,b)=>a.localeCompare(b,"no",{sensitivity:"base"}));}
function populateCleanupFilters(){const typeEl=document.getElementById("cleanupTypeFilter");const ownerEl=document.getElementById("cleanupOwnerFilter");const selectedType=typeEl?typeEl.value:"";const selectedOwner=ownerEl?ownerEl.value:"";if(typeEl){typeEl.innerHTML='<option value="">Alle</option>'+uniqueSorted(items.map(item=>item.type||"Annet")).map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join("");typeEl.value=selectedType;}if(ownerEl){ownerEl.innerHTML='<option value="">Alle</option>'+uniqueSorted(items.map(item=>normalizeOwner(item.owner))).map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join("");ownerEl.value=selectedOwner;}}
function filteredCleanupItems(){const query=String(document.getElementById("cleanupSearch")?.value||"").trim().toLowerCase();const type=String(document.getElementById("cleanupTypeFilter")?.value||"").trim().toLowerCase();const owner=String(document.getElementById("cleanupOwnerFilter")?.value||"").trim().toLowerCase();const standard=String(document.getElementById("cleanupStandardFilter")?.value||"");const bought=String(document.getElementById("cleanupBoughtFilter")?.value||"");return items.filter(item=>{if(query&&!String(item.name||"").toLowerCase().includes(query))return false;if(type&&String(item.type||"Annet").trim().toLowerCase()!==type)return false;if(owner&&normalizeOwner(item.owner).toLowerCase()!==owner)return false;if(standard==="standard"&&!item.standardItem)return false;if(standard==="other"&&item.standardItem)return false;const hasBought=!!String(item.lastBoughtAt||"").trim();if(bought==="never"&&hasBought)return false;if(bought==="bought"&&!hasBought)return false;return true;});}
function resetCleanupFilters(){["cleanupSearch","cleanupTypeFilter","cleanupOwnerFilter","cleanupStandardFilter","cleanupBoughtFilter"].forEach(id=>{const el=document.getElementById(id);if(el)el.value="";});render();}
function cleanupField(label,value,extraClass){return `<div class="cleanup-mobile-field ${extraClass||""}"><span class="cleanup-mobile-label">${esc(label)}</span><span class="cleanup-cell-value">${value}</span></div>`;}
function render(){updateCleanupSortUi();const root=document.getElementById("cleanupList");const sorted=filteredCleanupItems().sort(sortForCleanup);if(!sorted.length){root.innerHTML='<div class="empty">Ingen varer passer til filteret.</div>';setStatus(`Klar. Viser 0 av ${items.length} varer.`,"success");return;}root.innerHTML=sorted.map(item=>{const canDelete=canDeleteItem(item);const deleteTitle=canDelete?"Slett vare fra systemet":"Du kan bare slette egne varer. Fellesvarer slettes av supervisor/administrator.";const type=esc(item.type||"Annet");const owner=esc(normalizeOwner(item.owner));const created=esc(formatCreatedAt(item.createdAt));const last=esc(formatLastBought(item.lastBoughtAt));return `<div class="cleanup-row"><div class="cleanup-cell"><div class="cleanup-title">${esc(item.name)}</div><div class="cleanup-badges">${badgesForItem(item)}</div><div class="cleanup-mobile-grid">${cleanupField("Varegruppe/butikk",type)}${cleanupField("Vareliste",owner)}${cleanupField("Lagt inn",created)}${cleanupField("Sist handlet",last)}</div></div><div class="cleanup-cell cleanup-desktop-cell"><div class="cleanup-cell-value">${type}</div></div><div class="cleanup-cell cleanup-desktop-cell"><div class="cleanup-cell-value">${owner}</div></div><div class="cleanup-cell cleanup-desktop-cell"><div class="cleanup-cell-value ${item.createdAt?"":"cleanup-date-empty"}">${created}</div></div><div class="cleanup-cell cleanup-desktop-cell"><div class="cleanup-cell-value ${item.lastBoughtAt?"":"cleanup-date-empty"}">${last}</div></div><button class="delete-button" id="deleteItemButton-${item.id}" type="button" onclick="deleteItem(${item.id})" title="${esc(deleteTitle)}" ${canDelete?"":"disabled"}>🗑</button></div>`;}).join("");setStatus(`Klar. Viser ${sorted.length} av ${items.length} varer.`,"success");}
async function loadItems(){setStatus("Laster varer...");try{const data=await fetchJson(`${API_BASE}/shopping/items`);setShoppingOwners(data.ownerOptions||[]);currentUser=data.currentUser||null;items=Array.isArray(data.items)?data.items:[];populateCleanupFilters();render();}catch(error){reportCleanupError(error,{action:"load-items"});setStatus(`Kunne ikke laste varer.<br><br>${esc(error.message)}`,"error");}}
async function deleteItem(id){const item=items.find(item=>Number(item.id)===Number(id));if(!item)return;if(!canDeleteItem(item)){setStatus("Du kan bare slette egne varer. Fellesvarer kan bare slettes av supervisor eller administrator.","error");return;}if(!confirm(`Slette varen fra systemet?\n\n${item.name}\n\nHistorikk beholdes.`))return;const button=document.getElementById(`deleteItemButton-${id}`);if(button)button.disabled=true;setStatus(`Sletter «${esc(item.name)}» …`,"working");try{await fetchJson(`${API_BASE}/shopping/item-delete`,{method:"POST",headers:{"Content-Type":"text/plain;charset=UTF-8"},body:JSON.stringify({id})});items=items.filter(row=>Number(row.id)!==Number(id));populateCleanupFilters();render();setStatus(`«${esc(item.name)}» er slettet.`,"success",5000);}catch(error){if(button)button.disabled=false;reportCleanupError(error,{action:"delete-item",itemId:id,itemName:item&&item.name||""});setStatus(`Kunne ikke slette «${esc(item.name)}».<br><br>${esc(error.message)}`,"error");}}
loadItems();
</script>
<script>
(function(){
  const APP_PAGE_RE = /^handleliste-[a-z0-9-]+\.html$/i;
  const HOME_TARGET = 'index.html?restoreMenu=1';

  function currentPage(){
    return location.pathname.split('/').pop() || 'handleliste-bestille.html';
  }

  function isAppPage(page){
    return APP_PAGE_RE.test(String(page || ''));
  }

  function safeAppTarget(value){
    if(!value) return '';
    try{
      const url = new URL(value, location.href);
      if(url.origin !== location.origin) return '';
      const page = url.pathname.split('/').pop();
      if(!isAppPage(page)) return '';
      return page + url.search + url.hash;
    }catch(e){
      const clean = String(value).trim();
      const page = clean.split('?')[0].split('#')[0];
      return isAppPage(page) ? clean : '';
    }
  }

  function currentTargetForBack(){
    const url = new URL(location.href);
    const page = currentPage();
    const params = new URLSearchParams(url.search);
    const legacyFrom = params.get('from');
    const existingBack = params.get('back');

    params.delete('from');

    if(!existingBack && legacyFrom){
      const safeLegacy = safeAppTarget(legacyFrom);
      if(safeLegacy) params.set('back', safeLegacy);
    }

    const query = params.toString();
    return page + (query ? '?' + query : '') + url.hash;
  }

  function getBackTarget(){
    const params = new URLSearchParams(location.search);
    return safeAppTarget(params.get('back')) || safeAppTarget(params.get('from')) || HOME_TARGET;
  }

  function addBackToUrl(rawHref){
    if(!rawHref) return rawHref;
    if(/^#|^(mailto|sms|tel|javascript):/i.test(rawHref)) return rawHref;

    try{
      const url = new URL(rawHref, location.href);
      if(url.origin !== location.origin) return rawHref;
      const page = url.pathname.split('/').pop();
      const here = currentPage();

      if(isAppPage(page) && page !== here){
        url.searchParams.delete('from');
        if(!url.searchParams.has('back')){
          url.searchParams.set('back', currentTargetForBack());
        }
        return page + url.search + url.hash;
      }
    }catch(e){}

    return rawHref;
  }

  function appBack(event){
    event.preventDefault();
    location.href = getBackTarget();
  }

  function initAppNavigation(){
    document.querySelectorAll('a[href]').forEach(function(anchor){
      const href = anchor.getAttribute('href');
      const nextHref = addBackToUrl(href);
      if(nextHref !== href) anchor.setAttribute('href', nextHref);
    });

    document.querySelectorAll('.top-buttons .top-button').forEach(function(button){
      if((button.textContent || '').trim() === '←'){
        button.addEventListener('click', appBack);
      }
    });
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', initAppNavigation);
  }else{
    initAppNavigation();
  }
})();
</script>
