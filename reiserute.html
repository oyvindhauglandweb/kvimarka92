}


.view-toolbar-card{
  position:relative;
  overflow:hidden;
}

.view-toolbar-card.sync-running{
  border-color:var(--link);
  box-shadow:0 0 0 1px rgba(124,199,232,.28);
}

.view-toolbar-card.sync-running::before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  height:3px;
  width:38%;
  background:var(--link);
  animation:routeSyncProgress 1.25s linear infinite;
}

.view-toolbar-card.sync-success{
  border-color:#4f8f5f;
  box-shadow:0 0 0 1px rgba(114,193,132,.20);
}

.view-toolbar-card.sync-error{
  border-color:#b85c5c;
  box-shadow:0 0 0 1px rgba(216,119,119,.20);
}

@keyframes routeSyncProgress{
  0%{ left:-40%; }
  100%{ left:102%; }
}

.route-sync-status{
  display:none;
  width:100%;
  margin-top:8px;

function parseImageMetadataValue(value){
  if(!value){
    return [];
  }

  if(Array.isArray(value)){
    return value;
  }

  if(typeof value === "string"){
    const text = value.trim();

    if(!text){
      return [];
    }

    try{
      const parsed = JSON.parse(text);
      return Array.isArray(parsed) ? parsed : [];
    }catch(error){
      console.warn("Could not parse imageMetadata JSON.", error);
      return [];
    }
  }

  return [];
}

function getOneDriveImageProxyUrl(image, options){
  const itemId = String(image?.oneDriveItemId || image?.id || "").trim();

  if(!itemId){
    return "";
  }

  const mode = options?.mode === "full" ? "full" : "thumb";
  const size = ["small", "medium", "large"].includes(options?.size) ? options.size : "large";
  const cacheKey = String(image.lastModifiedDateTime || image.name || itemId);
  const params = new URLSearchParams();

  params.set("id", itemId);
  params.set("mode", mode);
  params.set("size", size);
  params.set("v", `resolve-v2-${cacheKey}`);

  // Some older cards can have stale OneDrive item ids after files/folders have
  // been moved or re-synced. Send enough metadata for the Worker to recover by
  // looking up the file again in the original parent folder.
  if(image.name || image.fileName || image.title){
    params.set("name", image.name || image.fileName || image.title);
  }

  if(image.parentId || image.parentReference?.id || image.folderId || image.oneDriveParentId){
    params.set("parentId", image.parentId || image.parentReference?.id || image.folderId || image.oneDriveParentId);
  }

  if(image.parentPath || image.parentReference?.path){
    params.set("parentPath", image.parentPath || image.parentReference?.path);
  }

  return `${API_BASE}/onedrive/image?${params.toString()}`;
}

function getImageFallbackUrls(image, options){
  const urls = [];

  function add(url){
    const text = String(url || "").trim();

    if(text && !urls.includes(text)){
      urls.push(text);
    }
  }

  if(!image){
    return urls;
  }

  if(typeof image === "string"){
    add(image);
    return urls;
  }

  // OneDrive downloadUrl is temporary and may expire. Try the Worker proxy first,
  // then try full-size proxy, and only then fall back to stored direct URLs.
  const oneDriveThumbUrl = getOneDriveImageProxyUrl(image, {
    mode:"thumb",
    size:options?.size || "large"
  });
  const oneDriveFullUrl = getOneDriveImageProxyUrl(image, {
    mode:"full",
    size:options?.size || "large"
  });

  add(oneDriveThumbUrl);
  add(oneDriveFullUrl);
  add(image.downloadUrl);
  add(image["@microsoft.graph.downloadUrl"]);
  add(image.download_url);
  add(image.mediumUrl);
  add(image.largeUrl);
  add(image.url);
  add(image.thumbnails?.large?.url);
  add(image.thumbnails?.large);
  add(image.thumbnails?.small?.url);
  add(image.thumbnails?.small);
  add(image.thumbUrl);
  add(image.thumbnailUrl);

  return urls;
}

function getImageDisplayUrl(image, options){
  return getImageFallbackUrls(image, options)[0] || "";
}

function renderManagedImage(image, className, options, altText){
  const urls = getImageFallbackUrls(image, options || {});

  if(!urls.length){
    return "";
  }

  const primaryUrl = urls[0];
  const fallbackUrls = urls.slice(1).join("\n");

  return `<img class="${esc(className)}" src="${esc(primaryUrl)}" data-fallback-srcs="${esc(fallbackUrls)}" data-route-image-retries="0" loading="lazy" decoding="async" onerror="handleRouteImageError(this)" alt="${esc(altText || "")}">`;
}

function appendRouteImageRetryParam(url, retryNumber){
  const separator = String(url || "").includes("?") ? "&" : "?";
  return `${url}${separator}imgRetry=${Date.now()}-${retryNumber}`;
}

function handleRouteImageError(imageElement){
  if(!imageElement){
    return;
  }

  const currentRetryCount = Number(imageElement.dataset.routeImageRetries || 0);

  // Loading many OneDrive images at once can occasionally produce transient
  // Graph/Worker errors. Retry the same URL briefly before moving to fallbacks.
  if(currentRetryCount < 2){
    const retryUrl = imageElement.currentSrc || imageElement.src || "";

    if(retryUrl){
      imageElement.dataset.routeImageRetries = String(currentRetryCount + 1);
      setTimeout(function(){
        imageElement.src = appendRouteImageRetryParam(retryUrl, currentRetryCount + 1);
      }, currentRetryCount === 0 ? 700 : 1700);
      return;
    }
  }

  const fallbackText = imageElement.dataset.fallbackSrcs || "";
  const fallbacks = fallbackText
    .split("\n")
    .map(value => value.trim())
    .filter(Boolean);

  if(fallbacks.length){
    const nextUrl = fallbacks.shift();
    imageElement.dataset.fallbackSrcs = fallbacks.join("\n");
    imageElement.dataset.routeImageRetries = "0";
    imageElement.src = nextUrl;
    return;
  }

  imageElement.onerror = null;
  imageElement.classList.add("route-image-load-failed");
  imageElement.title = "Kunne ikke laste bildet. Prøv å synkronisere OneDrive-bilder på nytt.";
}

function getImageParentFolderId(image){
  if(!image || typeof image === "string"){

function getStopOneDriveFolderId(stop){

    stop.sourceFolderId ||

}

    function getCaseFromUrl(){

    async function fetchJson(url, options){
      const res = await fetch(url, {
        credentials:"include",
        ...(options || {})
      });

      if(!res.ok){
        const text = await res.text();
        let message = text || "Request failed";

        try{
          const parsed = JSON.parse(text);
          message = parsed.detail || parsed.error || parsed.message || message;
        }catch(parseError){
          // Keep original response text when it is not JSON.
        }

        const error = new Error(message);
        error.status = res.status;
        error.responseText = text;
        return Promise.reject(error);
      }

      return await res.json();
    }

    function formatDate(dateValue){
      if(!dateValue){
        return "";
      }

      const parts = String(dateValue).split("-");

      if(parts.length !== 3){
        return String(dateValue);
      }

      return `${parts[2]}.${parts[1]}.${parts[0]}`;
    }

    function formatDateRange(from, to){
      const fromText = formatDate(from);
      const toText = formatDate(to);

      if(fromText && toText && fromText !== toText){
        return `${fromText}–${toText}`;
      }

      return fromText || toText || "";
    }

    function normalizeRouteDateValue(value){
      const text = String(value || "").trim();

      if(!text){
        return "";
      }

      if(/^\d{4}-\d{2}-\d{2}$/.test(text)){
        return text;
      }

      const dmy = text.match(/^(\d{1,2})[\/.](\d{1,2})[\/.](\d{4})$/);

      if(dmy){
        return `${dmy[3]}-${String(dmy[2]).padStart(2, "0")}-${String(dmy[1]).padStart(2, "0")}`;
      }

      return text;
    }

    function firstDate(stops){
      const dates = (Array.isArray(stops) ? stops : [])
        .map(stop => normalizeRouteDateValue(stop.dateFrom || stop.dateTo))
        .filter(Boolean)
        .sort();

      return dates[0] || "";
    }

    function lastDate(stops){
      const dates = (Array.isArray(stops) ? stops : [])
        .map(stop => normalizeRouteDateValue(stop.dateTo || stop.dateFrom))
        .filter(Boolean)
        .sort();

      return dates[dates.length - 1] || "";
    }

    function getRoutePeriodText(data){
      const apiPeriod =
        data?.case?.displayDate ||
        data?.case?.period ||
        data?.period?.displayDate ||
        "";

      if(apiPeriod){
        return apiPeriod;
      }

      const stops = data?.stops || [];
      return formatDateRange(firstDate(stops), lastDate(stops));
    }

function isWorkerSubrequestLimitError(error){

}

async function runOneDriveSyncBatch(caseName, stopLimit){
  return await fetchJson(`${API_BASE}/onedrive/sync-route-from-onedrive`, {
    method:"POST",
    headers:{
      "Content-Type":"text/plain;charset=UTF-8"

function addSyncCounts(total, data){
  total.createdStopCount += Number(data.createdStopCount || 0);
  total.imageUpdatedStopCount += Number(data.imageUpdatedStopCount || 0);
  total.imageTotal += Number(data.imageTotal || 0);
}

async function refreshRouteImageMetadata(event){
  if(event){
    event.preventDefault();
    event.stopPropagation();
  }

  const caseName = currentRouteData?.case?.caseName || currentRouteData?.case?.title || getCaseFromUrl();
  const button = event?.currentTarget || document.querySelector(".summary-image-refresh-button");

  if(!caseName){
    setImageRefreshStatus("Mangler case-navn.", "error");
    return;
  }

  if(button){
    button.disabled = true;
  }

  const existingStopCount = Math.max(1, Number(currentRouteData?.stops?.length || 0));
  const maxRounds = Math.min(Math.max(existingStopCount + 12, 12), 140);
  const total = {
    createdStopCount:0,
    imageUpdatedStopCount:0,
    imageTotal:0
  };
  const lastCumulative = {
    imageUpdatedStopCount:0,
    imageTotal:0
  };

  setRouteSyncState("running", "Oppdaterer OneDrive…", "Kjører i små batcher for å unngå Cloudflare-grensen.");
  setImageRefreshStatus("Oppdaterer OneDrive… Kjører i små batcher for å unngå Cloudflare-grensen.", "running");

  if(currentRouteData){
    renderRoute(currentRouteData);
  }

  try{
    for(let round = 1; round <= maxRounds; round += 1){
      const progressText = `Runde ${round}/${maxRounds}. Behandler neste OneDrive-batch.`;
      setRouteSyncState("running", "Oppdaterer OneDrive…", progressText);
      setImageRefreshStatus(`Oppdaterer OneDrive… ${progressText}`, "running");

      const data = await runOneDriveSyncBatch(caseName, 1);

      if(!data.success){
        throw new Error(data.error || data.detail || "Oppdatering feilet.");
      }

      total.createdStopCount += Number(data.createdStopCount || 0);

      const cumulativeUpdatedStops = Number(data.imageUpdatedStopCount || 0);
      const cumulativeImageTotal = Number(data.imageTotal || 0);
      const updatedStopDelta = Math.max(0, cumulativeUpdatedStops - lastCumulative.imageUpdatedStopCount);
      const imageTotalDelta = Math.max(0, cumulativeImageTotal - lastCumulative.imageTotal);

      lastCumulative.imageUpdatedStopCount = Math.max(lastCumulative.imageUpdatedStopCount, cumulativeUpdatedStops);
      lastCumulative.imageTotal = Math.max(lastCumulative.imageTotal, cumulativeImageTotal);

      total.imageUpdatedStopCount += updatedStopDelta;
      total.imageTotal += imageTotalDelta;

      const imageRefresh = data.imageRefresh || {};
      const nextRunNeeded = imageRefresh.nextRunNeeded !== false && imageRefresh.status !== "completed";
      const stopIndex = Number(imageRefresh.stopIndex || 0);
      const stopTotal = Number(imageRefresh.stopTotal || 0);

      const changedThisRound =
        Number(data.createdStopCount || 0) +
        updatedStopDelta +
        imageTotalDelta;

      setRouteSyncState(
        "running",
        "Oppdaterer OneDrive…",
        `Runde ${round}/${maxRounds} ferdig. ${total.createdStopCount} nye stopp, ${total.imageUpdatedStopCount} stopp oppdatert, ${total.imageTotal} bilder funnet${stopTotal ? ` (${Math.min(stopIndex, stopTotal)}/${stopTotal} stopp sjekket)` : ""}.`
      );

      if(!nextRunNeeded){
        break;
      }

      if(changedThisRound === 0 && round > existingStopCount + 5){
        break;
      }

      await wait(250);
    }

    const successMessage = "OneDrive-oppdatering ferdig.";
    const successDetails = `${total.createdStopCount} nye stopp, ${total.imageUpdatedStopCount} stopp oppdatert med ${total.imageTotal} bilder.`;

    setRouteSyncState("success", successMessage, successDetails);
    setImageRefreshStatus(`${successMessage} ${successDetails}`, "success");

    await loadRoute();
    setRouteSyncState("success", successMessage, successDetails);

    window.setTimeout(function(){
      if(routeSyncState.status === "success"){
        setRouteSyncState("idle", "", "");
      }
    }, 6500);
  }catch(error){
    console.error(error);

    let message = error.message || "Ukjent feil.";

    if(isWorkerSubrequestLimitError(error)){
      message = "Cloudflare stoppet kallet fordi én Worker-kjøring gjorde for mange OneDrive-kall. Denne HTML-en kjører nå med stopLimit:1, men backend må trolig også begrense antall OneDrive-subrequests per stopp hvis feilen fortsatt kommer.";
    }

    setRouteSyncState("error", "Kunne ikke oppdatere OneDrive.", message);
    setImageRefreshStatus(`Kunne ikke synkronisere stopp/bilder: ${message}`, "error");
  }finally{
    if(button){
      button.disabled = false;
    }
  }
}

function parseCoordinate(value, type){
  if(value === null || value === undefined){
    return NaN;
  }

  if(typeof value === "object"){
    if(value.value !== undefined){
      return parseCoordinate(value.value, type);
    }

    if(value.name !== undefined){
      return parseCoordinate(value.name, type);
    }

    if(value.text !== undefined){
      return parseCoordinate(value.text, type);
    }

    return NaN;
  }

  let text = String(value).trim();

  if(!text){
    return NaN;
  }

  text = text.replace(",", ".");

  let number = Number(text);

  if(!Number.isFinite(number)){
    return NaN;
  }

  if(type === "lat" && Math.abs(number) > 90){
    number = number / 10000;
  }

  if(type === "lng" && Math.abs(number) > 180){
    number = number / 10000;
  }

  if(type === "lng" && number > 0 && number > 30 && number < 180){
    number = -number;
  }

  return number;
}

function getStopCoordinate(stop, names, type){
  for(const name of names){
    if(
      stop[name] !== undefined &&
      stop[name] !== null &&
      String(stop[name]).trim() !== ""
    ){
      return parseCoordinate(stop[name], type);
    }
  }

  return NaN;
}

function normalizeLatLng(stop, position){
  const isStopPosition = position === "stop";

  let lat = getStopCoordinate(stop, isStopPosition ? [
    "latitudeStop",
    "Latitude stop",
    "latStop",
    "field_8692025"
  ] : [
    "latitude",
    "Latitude",
    "lat",
    "Lat",
    "field_8628028"
  ], "lat");

  let lng = getStopCoordinate(stop, isStopPosition ? [
    "longitudeStop",
    "Longitude stop",
    "lngStop",
    "lonStop",
    "field_8692026"
  ] : [
    "longitude",
    "Longitude",
    "lng",
    "Lng",
    "lon",
    "Lon",
    "field_8628030"
  ], "lng");

  if(
    Number.isFinite(lat) &&
    Number.isFinite(lng) &&
    Math.abs(lat) > 90 &&
    Math.abs(lng) <= 90
  ){
    const oldLat = lat;
    lat = lng;
    lng = oldLat;
  }

  if(
    !Number.isFinite(lat) ||
    !Number.isFinite(lng) ||
    Math.abs(lat) > 90 ||
    Math.abs(lng) > 180
  ){
    return null;
  }

  return { lat, lng };
}

function buildRouteMapPoints(stops){
  const points = [];

  stops.forEach((stop, index) => {
    const number = index + 1;
    const startCoordinates = normalizeLatLng(stop, "start");
    const stopCoordinates = normalizeLatLng(stop, "stop");

    if(startCoordinates && stopCoordinates){
      points.push({
        stop,
        displayNumber:`${number}.1`,
        positionLabel:"Startposisjon",
        coordinates:startCoordinates
      });
      points.push({
        stop,
        displayNumber:`${number}.2`,
        positionLabel:"Stopposisjon",
        coordinates:stopCoordinates
      });
      return;
    }

    if(startCoordinates || stopCoordinates){
      points.push({
        stop,
        displayNumber:String(number),
        positionLabel:startCoordinates ? "Posisjon" : "Stopposisjon",
        coordinates:startCoordinates || stopCoordinates
      });
    }
  });

  return points;
}

function openImageModal(stop, startIndex){
  const imageUrls = getFileUrls(getStopImages(stop), { mode:"full" });

  if(!imageUrls.length){
    return;
  }

  imageModalImages = imageUrls;
  imageModalTitle = stop.stopName || stop.title || "Bilder";
  imageModalIndex = Number.isFinite(Number(startIndex)) ? Number(startIndex) : 0;

  if(imageModalIndex < 0 || imageModalIndex >= imageModalImages.length){
    imageModalIndex = 0;
  }

  showImageModalImage();
  document.getElementById("imageModal").classList.add("open");
}

function showImageModalImage(){
  const image = document.getElementById("imageModalImage");
  const title = document.getElementById("imageModalTitle");

  if(!imageModalImages.length){
    return;
  }

  const imageUrl = imageModalImages[imageModalIndex];

  image.src = imageUrl;
  title.textContent =
    `${imageModalTitle} — ${imageModalIndex + 1} av ${imageModalImages.length}`;
}

function showPreviousImage(){
  if(!imageModalImages.length){
    return;
  }

  imageModalIndex =
    (imageModalIndex - 1 + imageModalImages.length) % imageModalImages.length;

  showImageModalImage();
}

function showNextImage(){
  if(!imageModalImages.length){
    return;
  }

  imageModalIndex =
    (imageModalIndex + 1) % imageModalImages.length;

  showImageModalImage();
}

function closeImageModal(){
  const modal = document.getElementById("imageModal");
  const image = document.getElementById("imageModalImage");

  modal.classList.remove("open");
  image.src = "";

  imageModalImages = [];
  imageModalTitle = "";
  imageModalIndex = 0;
  imageModalTouchStartX = null;
}

function setupImageModal(){
  if(imageModalReady){
    return;
  }

  imageModalReady = true;

  const modal = document.getElementById("imageModal");
  const closeButton = document.getElementById("imageModalClose");
  const prevButton = document.getElementById("imageModalPrev");
  const nextButton = document.getElementById("imageModalNext");

  closeButton.addEventListener("click", closeImageModal);
  prevButton.addEventListener("click", showPreviousImage);
  nextButton.addEventListener("click", showNextImage);

  modal.addEventListener("click", function(event){
    if(event.target === modal){
      closeImageModal();
    }
  });

  document.addEventListener("keydown", function(event){
    if(!modal.classList.contains("open")){
      return;
    }

    if(event.key === "Escape"){
      closeImageModal();
    }

    if(event.key === "ArrowLeft"){
      showPreviousImage();
    }

    if(event.key === "ArrowRight"){
      showNextImage();
    }
  });

  document.addEventListener("keydown", function(event){
    const galleryModal = document.getElementById("stopImageGalleryModal");

    if(event.key === "Escape" && galleryModal && galleryModal.classList.contains("open")){
      closeStopImageGallery();
    }
  });

  modal.addEventListener("touchstart", function(event){
    if(!modal.classList.contains("open")){
      return;
    }

    imageModalTouchStartX = event.changedTouches[0].clientX;
  }, {
    passive:true
  });

  modal.addEventListener("touchend", function(event){
    if(imageModalTouchStartX === null){
      return;
    }

    const touchEndX = event.changedTouches[0].clientX;
    const difference = touchEndX - imageModalTouchStartX;

    imageModalTouchStartX = null;

    if(Math.abs(difference) < 45){
      return;
    }

    if(difference > 0){
      showPreviousImage();
    }else{
      showNextImage();
    }
  }, {
    passive:true
  });
}

      name:getImageName(image)
    }))

  stopGalleryStopIndex = stopIndex;

  const heading = document.getElementById("stopImageGalleryTitle");
  const grid = document.getElementById("stopImageGalleryGrid");

  if(!modal || !heading || !grid){

  heading.textContent = `${stopIndex + 1}. ${title}`;

  grid.innerHTML = imageItems.map(item => `
    <button
      class="stop-gallery-card"
      type="button"
      data-image-index="${item.imageIndex}"
      title="Vis bilde"
    >
      ${renderManagedImage(item.image, "", { size:"large" }, item.name || "")}
      <div class="stop-gallery-caption">
        <strong>${stopIndex + 1}. ${esc(title)}</strong>
        <span>${item.name ? esc(item.name) : `Bilde ${item.imageIndex + 1}`}</span>
      </div>
    </button>
  `).join("");

  grid.querySelectorAll(".stop-gallery-card").forEach(button => {
    button.addEventListener("click", function(event){
      event.preventDefault();
      event.stopPropagation();

      const imageIndex = Number(button.dataset.imageIndex || 0);

      if(stopGalleryStop){
        openImageModal(stopGalleryStop, imageIndex);
      }
    });
  });

  updateStopGalleryAdminLink();
  modal.classList.add("open");
}

function closeStopImageGallery(){

function updateStopGalleryAdminLink(){
  const link = document.getElementById("stopImageGalleryAdminLink");

  if(!link){
    return;
  }

  const isAdmin = currentUser?.role === "Administrator";
  const caseName = currentRouteData?.case?.caseName || getCaseFromUrl();
  const oneDriveFolderPath = String(currentRouteData?.case?.oneDriveFolderPath || "").trim();

  if(!isAdmin || !caseName || !oneDriveFolderPath || !stopGalleryStop){
    link.classList.remove("visible");
    link.href = "#";
    return;
  }

  const params = new URLSearchParams();
  const stopTitle = stopGalleryStop.stopName || stopGalleryStop.title || `Stopp ${stopGalleryStopIndex + 1}`;
  const folderId = getStopOneDriveFolderId(stopGalleryStop);

  params.set("case", caseName);

  if(stopGalleryStop.id){
    params.set("stop", String(stopGalleryStop.id));
  }

  if(folderId){
    params.set("folderId", folderId);
  }

  if(stopTitle){
    params.set("stopName", stopTitle);
  }

  // Admin-siden skal åpnes på selve stoppestedets OneDrive-mappe.
  // Uten folderId/stop faller den tilbake til rutemappen, som ofte bare har
  // undermapper og derfor viser "0 bilder funnet".
  link.href = `onedrive-images.html?${params.toString()}`;
  link.classList.add("visible");
}
    
function renderMap(stops){
  const map = L.map("map", {
    scrollWheelZoom:false
  });

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom:19,
    attribution:"&copy; OpenStreetMap contributors"
  }).addTo(map);

  const routePoints = buildRouteMapPoints(stops);
  const points = routePoints.map(point => [
    point.coordinates.lat,
    point.coordinates.lng
  ]);

  routePoints.forEach(point => {
    const stop = point.stop;
    const lat = point.coordinates.lat;
    const lng = point.coordinates.lng;
    const dateText = formatDateRange(stop.dateFrom, stop.dateTo);

    const popupHtml = `
      <div class="route-popup">
        <div class="route-popup-title">
          ${esc(point.displayNumber)}. ${esc(stop.stopName || stop.title)}
        </div>

        <div class="route-popup-meta">
          ${point.positionLabel ? `${esc(point.positionLabel)}<br>` : ""}
          ${dateText ? `${esc(dateText)}<br>` : ""}
          ${stop.stopType ? `Type: ${esc(stop.stopType)}<br>` : ""}
          ${stop.transport ? `Transport: ${esc(stop.transport)}<br>` : ""}
          ${stop.roads ? `Veier: ${esc(stop.roads)}<br>` : ""}
        </div>

        ${stop.description ? `
          <div style="margin-top:8px;">
            ${esc(stop.description)}
          </div>
        ` : ""}
      </div>
    `;

    const marker = L.marker([lat, lng], {
      icon:createNumberIcon(point.displayNumber)
    }).addTo(map);

    marker.bindPopup(popupHtml);

    marker.bindTooltip(
      `${point.displayNumber}. ${esc(stop.stopName || stop.title)}`,
      {
        direction:"top",
        offset:[0,-16],
        opacity:0.95
      }
    );
  });

  if(points.length){
    L.polyline(points, {
      weight:4,
      opacity:.9
    }).addTo(map);

    map.fitBounds(points, {
      padding:[30,30],
      maxZoom:7
    });
  }else{
    map.setView([39.5, -98.35], 4);
  }


  setTimeout(function(){
    map.invalidateSize();

    if(points.length){
      map.fitBounds(points, {
        padding:[30,30],
        maxZoom:7
      });
    }
  }, 250);
}

    function renderRoute(data){
      currentRouteData = data;

      const content = document.getElementById("content");
      const title = data.case?.title || data.case?.caseName || "Reiserute";
      const stops = data.stops || [];

      document.title = title + " - Reiserute";
      document.getElementById("pageTitle").textContent = title;
      document.getElementById("pageSubtitle").textContent = "Reiserute";

      if(!stops.length){
        renderEmptyRoute(data);
        return;
      }

      const showMap = currentRouteView === "map-list" || currentRouteView === "map";

      let stopContent = "";

      if(currentRouteView === "map-list"){
        stopContent = renderStopList(stops);
      }else if(currentRouteView === "cards"){
        stopContent = renderStopCards(stops);
      }else if(currentRouteView === "compact"){
        stopContent = renderCompactStopList(stops);
      }else if(currentRouteView === "photos"){
        stopContent = renderPhotoGallery(stops);
      }

      content.innerHTML = `
        ${renderGeneralDescription(data)}
        ${renderSummary(data)}
        ${renderViewToolbar()}
        ${showMap ? `
          <div class="card">
            <div id="map"></div>
          </div>
        ` : ""}
        ${stopContent}
      `;

      updateRouteSyncStatusUi();
      setupImageModal();

      if(currentRouteView === "map-list"){
        setupStopImageClicks(stops);
      }

      setupImageTriggers(stops);

      if(showMap){
        renderMap(stops);
      }

      scrollToHashStop();
    }

let currentUser = null;

async function fetchCurrentUser(){
  try{
    const res = await fetch(`${API_BASE}/whoami`, {
      credentials:"include"
    });

    if(!res.ok){
      return null;
    }

    return await res.json();
  }catch(error){
    return null;
  }
}
    
    async function loadRoute(){
      const caseName = getCaseFromUrl();

      if(!caseName){
        throw new Error("Mangler route case i URL-en.");
      }

      currentUser = await fetchCurrentUser();

      try{
        const data = await fetchJson(`${API_BASE}/route?case=${encodeURIComponent(caseName)}`);
        renderRoute(data);
      }catch(error){
        const message = String(error.message || "");
        const responseText = String(error.responseText || "");

        if(
          error.status === 404 &&
          (message.includes("Route case not found") || responseText.includes("Route case not found"))
        ){
          renderMissingRouteCase(caseName);
          return;
        }

        throw error;
      }
    }

    loadRoute().catch(error => {
      console.error(error);

      document.getElementById("content").innerHTML = `
        <div class="error-box">
          Kunne ikke laste reiseruten.<br><br>
          ${esc(error.message)}
        </div>
      `;
    });
  </script>
