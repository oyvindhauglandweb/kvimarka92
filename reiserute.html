    function esc(value){
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

function scrollToHashStop(){
  if(!window.location.hash){
    return;
  }

  const target = document.querySelector(window.location.hash);

  if(!target){
    return;
  }

  setTimeout(function(){
    target.scrollIntoView({
      behavior:"smooth",
      block:"center"
    });
  }, 300);
}
    
function getImageDisplayUrl(image){
  if(!image){
    return "";
  }

  if(typeof image === "string"){
    return image;
  }

  return (
    image.webUrl ||
    image.mediumUrl ||
    image.largeUrl ||
    image.url ||
    image.download_url ||
    image.thumbnails?.large?.url ||
    image.thumbnails?.large ||
    image.thumbnails?.small?.url ||
    image.thumbnails?.small ||
    image.thumbUrl ||
    image.thumbnailUrl ||
    ""
  );
}

function getStopImages(stop){
  if(!stop){
    return [];
  }

  if(Array.isArray(stop.images)){
    return stop.images;
  }

  return [
    ...(Array.isArray(stop.image) ? stop.image : []),
    ...(Array.isArray(stop.imageMetadata) ? stop.imageMetadata : [])
  ];
}

function getFileUrls(images){
  if(!Array.isArray(images) || !images.length){
    return [];
  }

  return images
    .map(image => getImageDisplayUrl(image))
    .filter(Boolean);
}

function getFileUrl(images){
  return getFileUrls(images)[0] || "";
}

    function getCaseFromUrl(){
      const params = new URLSearchParams(window.location.search);
      return params.get("case") || "";
    }

    async function fetchJson(url, options){
      const res = await fetch(url, {
        credentials:"include",
        ...(options || {})
      });

      if(!res.ok){
        const text = await res.text();
        const error = new Error(text || "Request failed");
        error.status = res.status;
        error.responseText = text;
        return Promise.reject(error);
      }

      return await res.json();
    }

    function formatDate(dateValue){
      if(!dateValue){
        return "";
      }

      const parts = String(dateValue).split("-");

      if(parts.length !== 3){
        return String(dateValue);
      }

      return `${parts[2]}.${parts[1]}.${parts[0]}`;
    }

    function formatDateRange(from, to){
      const fromText = formatDate(from);
      const toText = formatDate(to);

      if(fromText && toText && fromText !== toText){
        return `${fromText}–${toText}`;
      }

      return fromText || toText || "";
    }

    function firstDate(stops){
      return stops
        .map(stop => stop.dateFrom || stop.dateTo)
        .filter(Boolean)[0] || "";
    }

    function lastDate(stops){
      const dates = stops
        .map(stop => stop.dateTo || stop.dateFrom)
        .filter(Boolean);

      return dates[dates.length - 1] || "";
    }

    function createNumberIcon(number){
      return L.divIcon({
        html:`<div class="route-marker">${number}</div>`,
        className:"",
        iconSize:[32,32],
        iconAnchor:[16,16],
        popupAnchor:[0,-16]
      });
    }

async function createRouteCase(){
  const caseName = getCaseFromUrl();
  const content = document.getElementById("content");
  const descriptionField = document.getElementById("newRouteDescription");

  }

  content.innerHTML = `

      Oppretter reiserute for <strong>${esc(caseName)}</strong>...
    </div>
  `;

  try{
    await fetchJson(`${API_BASE}/route-case-create`, {
      method:"POST",
      headers:{
        "Content-Type":"text/plain;charset=UTF-8"
      },
      body:JSON.stringify({
        caseName,
        title:caseName,
        accessLevel:"Private",
        generalDescription
      })
    });

    window.location.href =
      `reiserute.html?case=${encodeURIComponent(caseName)}&refresh=${Date.now()}`;
  }catch(error){
    console.error(error);

    content.innerHTML = `
      <div class="error-box">
        Kunne ikke opprette reiseruten.<br><br>
        ${esc(error.message)}
      </div>
    `;
  }
}


function parseCoordinate(value, type){
  if(value === null || value === undefined){
    return NaN;
  }

  if(typeof value === "object"){
    if(value.value !== undefined){
      return parseCoordinate(value.value, type);
    }

    if(value.name !== undefined){
      return parseCoordinate(value.name, type);
    }

    if(value.text !== undefined){
      return parseCoordinate(value.text, type);
    }

    return NaN;
  }

  let text = String(value).trim();

  if(!text){
    return NaN;
  }

  text = text.replace(",", ".");

  let number = Number(text);

  if(!Number.isFinite(number)){
    return NaN;
  }

  if(type === "lat" && Math.abs(number) > 90){
    number = number / 10000;
  }

  if(type === "lng" && Math.abs(number) > 180){
    number = number / 10000;
  }

  if(type === "lng" && number > 0 && number > 30 && number < 180){
    number = -number;
  }

  return number;
}

function getStopCoordinate(stop, names, type){
  for(const name of names){
    if(
      stop[name] !== undefined &&
      stop[name] !== null &&
      String(stop[name]).trim() !== ""
    ){
      return parseCoordinate(stop[name], type);
    }
  }

  return NaN;
}

function normalizeLatLng(stop, position){
  const isStopPosition = position === "stop";

  let lat = getStopCoordinate(stop, isStopPosition ? [
    "latitudeStop",
    "Latitude stop",
    "latStop",
    "field_8692025"
  ] : [
    "latitude",
    "Latitude",
    "lat",
    "Lat",
    "field_8628028"
  ], "lat");

  let lng = getStopCoordinate(stop, isStopPosition ? [
    "longitudeStop",
    "Longitude stop",
    "lngStop",
    "lonStop",
    "field_8692026"
  ] : [
    "longitude",
    "Longitude",
    "lng",
    "Lng",
    "lon",
    "Lon",
    "field_8628030"
  ], "lng");

  if(
    Number.isFinite(lat) &&
    Number.isFinite(lng) &&
    Math.abs(lat) > 90 &&
    Math.abs(lng) <= 90
  ){
    const oldLat = lat;
    lat = lng;
    lng = oldLat;
  }

  if(
    !Number.isFinite(lat) ||
    !Number.isFinite(lng) ||
    Math.abs(lat) > 90 ||
    Math.abs(lng) > 180
  ){
    return null;
  }

  return { lat, lng };
}

function buildRouteMapPoints(stops){
  const points = [];

  stops.forEach((stop, index) => {
    const number = index + 1;
    const startCoordinates = normalizeLatLng(stop, "start");
    const stopCoordinates = normalizeLatLng(stop, "stop");

    if(startCoordinates && stopCoordinates){
      points.push({
        stop,
        displayNumber:`${number}.1`,
        positionLabel:"Startposisjon",
        coordinates:startCoordinates
      });
      points.push({
        stop,
        displayNumber:`${number}.2`,
        positionLabel:"Stopposisjon",
        coordinates:stopCoordinates
      });
      return;
    }

    if(startCoordinates || stopCoordinates){
      points.push({
        stop,
        displayNumber:String(number),
        positionLabel:startCoordinates ? "Posisjon" : "Stopposisjon",
        coordinates:startCoordinates || stopCoordinates
      });
    }
  });

  return points;
}

function openImageModal(stop, startIndex){
  const imageUrls = getFileUrls(getStopImages(stop));

  if(!imageUrls.length){
    return;
  }

  imageModalImages = imageUrls;
  imageModalTitle = stop.stopName || stop.title || "Bilder";
  imageModalIndex = Number.isFinite(Number(startIndex)) ? Number(startIndex) : 0;

  if(imageModalIndex < 0 || imageModalIndex >= imageModalImages.length){
    imageModalIndex = 0;
  }

  showImageModalImage();
  document.getElementById("imageModal").classList.add("open");
}

function showImageModalImage(){
  const image = document.getElementById("imageModalImage");
  const title = document.getElementById("imageModalTitle");

  if(!imageModalImages.length){
    return;
  }

  const imageUrl = imageModalImages[imageModalIndex];

  image.src = imageUrl;
  title.textContent =
    `${imageModalTitle} — ${imageModalIndex + 1} av ${imageModalImages.length}`;
}

function showPreviousImage(){
  if(!imageModalImages.length){
    return;
  }

  imageModalIndex =
    (imageModalIndex - 1 + imageModalImages.length) % imageModalImages.length;

  showImageModalImage();
}

function showNextImage(){
  if(!imageModalImages.length){
    return;
  }

  imageModalIndex =
    (imageModalIndex + 1) % imageModalImages.length;

  showImageModalImage();
}

function closeImageModal(){
  const modal = document.getElementById("imageModal");
  const image = document.getElementById("imageModalImage");

  modal.classList.remove("open");
  image.src = "";

  imageModalImages = [];
  imageModalTitle = "";
  imageModalIndex = 0;
  imageModalTouchStartX = null;
}

function setupImageModal(){
  if(imageModalReady){
    return;
  }

  imageModalReady = true;

  const modal = document.getElementById("imageModal");
  const closeButton = document.getElementById("imageModalClose");
  const prevButton = document.getElementById("imageModalPrev");
  const nextButton = document.getElementById("imageModalNext");

  closeButton.addEventListener("click", closeImageModal);
  prevButton.addEventListener("click", showPreviousImage);
  nextButton.addEventListener("click", showNextImage);

  modal.addEventListener("click", function(event){
    if(event.target === modal){
      closeImageModal();
    }
  });

  document.addEventListener("keydown", function(event){
    if(!modal.classList.contains("open")){
      return;
    }

    if(event.key === "Escape"){
      closeImageModal();
    }

    if(event.key === "ArrowLeft"){
      showPreviousImage();
    }

    if(event.key === "ArrowRight"){
      showNextImage();
    }
  });

  document.addEventListener("keydown", function(event){
    const galleryModal = document.getElementById("stopImageGalleryModal");

    if(event.key === "Escape" && galleryModal && galleryModal.classList.contains("open")){
      closeStopImageGallery();
    }
  });

  modal.addEventListener("touchstart", function(event){
    if(!modal.classList.contains("open")){
      return;
    }

    imageModalTouchStartX = event.changedTouches[0].clientX;
  }, {
    passive:true
  });

  modal.addEventListener("touchend", function(event){
    if(imageModalTouchStartX === null){
      return;
    }

    const touchEndX = event.changedTouches[0].clientX;
    const difference = touchEndX - imageModalTouchStartX;

    imageModalTouchStartX = null;

    if(Math.abs(difference) < 45){
      return;
    }

    if(difference > 0){
      showPreviousImage();
    }else{
      showNextImage();
    }
  }, {
    passive:true
  });
}

function openStopImageGallery(stop, stopIndex){
  const imageUrls = getFileUrls(getStopImages(stop));

  if(!imageUrls.length){
    return;
  }

  stopGalleryStop = stop;
  stopGalleryStopIndex = stopIndex;

  const title = stop.stopName || stop.title || `Stopp ${stopIndex + 1}`;
  const modal = document.getElementById("stopImageGalleryModal");
  const heading = document.getElementById("stopImageGalleryTitle");
  const grid = document.getElementById("stopImageGalleryGrid");

  if(!modal || !heading || !grid){
    return;
  }

  heading.textContent = `${stopIndex + 1}. ${title}`;

  grid.innerHTML = imageUrls.map((url, imageIndex) => `
    <button
      class="stop-gallery-card"
      type="button"
      data-image-index="${imageIndex}"
      title="Vis bilde"
    >
      <img src="${esc(url)}" alt="">
      <div class="stop-gallery-caption">
        <strong>${stopIndex + 1}. ${esc(title)}</strong>
        <span>Bilde ${imageIndex + 1}</span>
      </div>
    </button>
  `).join("");

  grid.querySelectorAll(".stop-gallery-card").forEach(button => {
    button.addEventListener("click", function(event){
      event.preventDefault();
      event.stopPropagation();

      const imageIndex = Number(button.dataset.imageIndex || 0);

      if(stopGalleryStop){
        openImageModal(stopGalleryStop, imageIndex);
      }
    });
  });

  modal.classList.add("open");
}

function closeStopImageGallery(){
  const modal = document.getElementById("stopImageGalleryModal");
  const grid = document.getElementById("stopImageGalleryGrid");

  if(modal){
    modal.classList.remove("open");
  }

  if(grid){
    grid.innerHTML = "";
  }

  stopGalleryStop = null;
  stopGalleryStopIndex = 0;
}

function handleStopImageGalleryBackdropClick(event){
  if(event.target && event.target.id === "stopImageGalleryModal"){
    closeStopImageGallery();
  }
}
    
function renderMap(stops){
  const map = L.map("map", {
    scrollWheelZoom:false
  });

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom:19,
    attribution:"&copy; OpenStreetMap contributors"
  }).addTo(map);

  const routePoints = buildRouteMapPoints(stops);
  const points = routePoints.map(point => [
    point.coordinates.lat,
    point.coordinates.lng
  ]);

  routePoints.forEach(point => {
    const stop = point.stop;
    const lat = point.coordinates.lat;
    const lng = point.coordinates.lng;
    const dateText = formatDateRange(stop.dateFrom, stop.dateTo);

    const popupHtml = `
      <div class="route-popup">
        <div class="route-popup-title">
          ${esc(point.displayNumber)}. ${esc(stop.stopName || stop.title)}
        </div>

        <div class="route-popup-meta">
          ${point.positionLabel ? `${esc(point.positionLabel)}<br>` : ""}
          ${dateText ? `${esc(dateText)}<br>` : ""}
          ${stop.stopType ? `Type: ${esc(stop.stopType)}<br>` : ""}
          ${stop.transport ? `Transport: ${esc(stop.transport)}<br>` : ""}
          ${stop.roads ? `Veier: ${esc(stop.roads)}<br>` : ""}
        </div>

        ${stop.description ? `
          <div style="margin-top:8px;">
            ${esc(stop.description)}
          </div>
        ` : ""}
      </div>
    `;

    const marker = L.marker([lat, lng], {
      icon:createNumberIcon(point.displayNumber)
    }).addTo(map);

    marker.bindPopup(popupHtml);

    marker.bindTooltip(
      `${point.displayNumber}. ${esc(stop.stopName || stop.title)}`,
      {
        direction:"top",
        offset:[0,-16],
        opacity:0.95
      }
    );
  });

  if(points.length){
    L.polyline(points, {
      weight:4,
      opacity:.9
    }).addTo(map);

    map.fitBounds(points, {
      padding:[30,30],
      maxZoom:7
    });
  }else{
    map.setView([39.5, -98.35], 4);
  }


  setTimeout(function(){
    map.invalidateSize();

    if(points.length){
      map.fitBounds(points, {
        padding:[30,30],
        maxZoom:7
      });
    }
  }, 250);
}

    function renderRoute(data){
      currentRouteData = data;

      const content = document.getElementById("content");
      const title = data.case?.title || data.case?.caseName || "Reiserute";
      const stops = data.stops || [];

      document.title = title + " - Reiserute";
      document.getElementById("pageTitle").textContent = title;
      document.getElementById("pageSubtitle").textContent = "Reiserute";

      if(!stops.length){
        renderEmptyRoute(data);
        return;
      }

      const showMap = currentRouteView === "map-list" || currentRouteView === "map";

      let stopContent = "";

      if(currentRouteView === "map-list"){
        stopContent = renderStopList(stops);
      }else if(currentRouteView === "cards"){
        stopContent = renderStopCards(stops);
      }else if(currentRouteView === "compact"){
        stopContent = renderCompactStopList(stops);
      }else if(currentRouteView === "photos"){
        stopContent = renderPhotoGallery(stops);
      }

      content.innerHTML = `
        ${renderGeneralDescription(data)}
        ${renderSummary(data)}
        ${renderViewToolbar()}
        ${showMap ? `
          <div class="card">
            <div id="map"></div>
          </div>
        ` : ""}
        ${stopContent}
      `;

      setupImageModal();

      if(currentRouteView === "map-list"){
        setupStopImageClicks(stops);
      }

      setupImageTriggers(stops);

      if(showMap){
        renderMap(stops);
      }

      scrollToHashStop();
    }

let currentUser = null;

async function fetchCurrentUser(){
  try{
    const res = await fetch(`${API_BASE}/whoami`, {
      credentials:"include"
    });

    if(!res.ok){
      return null;
    }

    return await res.json();
  }catch(error){
    return null;
  }
}
    
    async function loadRoute(){
      const caseName = getCaseFromUrl();

      if(!caseName){
        throw new Error("Mangler route case i URL-en.");
      }

      currentUser = await fetchCurrentUser();

      try{
        const data = await fetchJson(`${API_BASE}/route?case=${encodeURIComponent(caseName)}`);
        renderRoute(data);
      }catch(error){
        const message = String(error.message || "");
        const responseText = String(error.responseText || "");

        if(
          error.status === 404 &&
          (message.includes("Route case not found") || responseText.includes("Route case not found"))
        ){
          renderMissingRouteCase(caseName);
          return;
        }

        throw error;
      }
    }

    loadRoute().catch(error => {
      console.error(error);

      document.getElementById("content").innerHTML = `
        <div class="error-box">
          Kunne ikke laste reiseruten.<br><br>
          ${esc(error.message)}
        </div>
      `;
    });
  </script>
