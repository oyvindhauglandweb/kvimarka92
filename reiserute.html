<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reiserute - Kvimarka 92</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    :root{
      --bg:#f2f2f2;
      --card:#fff;
      --text:#333;
      --muted:#667;
      --border:#ccc;
      --link:#1f789d;
      --soft:#eaeaea;
    }

    body.dark-mode{
      --bg:#151515;
      --card:#242424;
      --text:#eee;
      --muted:#bbb;
      --border:#555;
      --link:#7cc7e8;
      --soft:#333;
    }

    body{
      margin:0;
      padding:20px;
      background:var(--bg);
      color:var(--text);
      font-family:Arial,sans-serif;
    }

    .container{
      max-width:1100px;
      margin:auto;
    }

    .header{
      text-align:center;
      margin-bottom:24px;
    }

    .site-title{
      margin:0;
      font-size:30px;
    }

    .subtitle{
      margin-top:8px;
      color:var(--muted);
      font-size:16px;
    }

.top-buttons{
  display:flex;
  justify-content:center;
  gap:6px;
  margin:10px 0 0;
}

.top-button{
  display:flex;
  align-items:center;
  justify-content:center;
  min-width:28px;
  height:24px;
  padding:0 7px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:6px;
  color:var(--text);
  text-decoration:none;
  font-size:13px;
  font-weight:bold;
  box-sizing:border-box;
}

    .top-button:hover{
      background:#e9eef2;
    }

    body.dark-mode .top-button:hover{
      background:#3a3a3a;
    }

    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:12px;
      padding:18px;
      margin-bottom:18px;
    }

    #map{
      width:100%;
      height:620px;
      border-radius:12px;
      border:1px solid var(--border);
      background:var(--soft);
      box-sizing:border-box;
      overflow:hidden;
      position:relative;
    }

.summary{
  display:grid;
  grid-template-columns:minmax(260px,2fr) minmax(90px,.5fr);
  gap:10px;
  margin-bottom:18px;
}

    .summary-item{
      border:1px solid var(--border);
      border-radius:10px;
      padding:12px;
      background:rgba(127,127,127,.05);
    }

    .summary-label{
      color:var(--muted);
      font-size:13px;
      margin-bottom:4px;
    }

    .summary-value{
      font-size:18px;
      font-weight:bold;
    }

.summary-item{
  position:relative;
}

.summary-map-link{
  position:absolute;
  top:12px;
  right:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  width:30px;
  height:30px;
  border:2px solid var(--link);
  border-radius:50%;
  color:var(--link);
  text-decoration:none;
  font-size:18px;
  font-weight:bold;
  line-height:1;
  box-sizing:border-box;
}

.summary-map-link:hover{
  background:rgba(124,199,232,.12);
}
    
    .stop-list{
      display:flex;
      flex-direction:column;
      gap:10px;
    }

.stop-row{
  position:relative;
  display:grid;
  grid-template-columns:48px 1fr;
  gap:12px;
  border:1px solid var(--border);
  border-radius:10px;
  padding:12px;
  padding-right:56px;
  background:rgba(127,127,127,.04);
}
    
.stop-web-link{
  position:absolute;
  top:18px;
  right:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  width:30px;
  height:30px;
  border:2px solid var(--link);
  border-radius:50%;
  color:var(--link);
  text-decoration:none;
  font-size:20px;
  font-weight:bold;
  line-height:1;
  box-sizing:border-box;
}

.stop-admin-link{
  position:absolute;
  top:18px;
  right:56px;
  display:flex;
  align-items:center;
  justify-content:center;
  width:30px;
  height:30px;
  border:2px solid var(--link);
  border-radius:50%;
  color:var(--link);
  text-decoration:none;
  font-size:17px;
  font-weight:bold;
  line-height:1;
  box-sizing:border-box;
}

.stop-admin-link:hover{
  background:rgba(124,199,232,.12);
}
    
.stop-web-link:hover{
  background:rgba(124,199,232,.12);
}
    
    .stop-number{
      display:flex;
      align-items:center;
      justify-content:center;
      width:38px;
      height:38px;
      border-radius:50%;
      background:var(--link);
      color:#fff;
      font-weight:bold;
    }

    .stop-title{
      font-size:17px;
      font-weight:bold;
      margin-bottom:4px;
    }

    .stop-meta{
      color:var(--muted);
      font-size:14px;
      line-height:1.45;
    }

    .stop-description{
      margin-top:8px;
      line-height:1.5;
      white-space:pre-wrap;
    }

    .stop-image{
      display:block;
      max-width:100%;
      height:auto;
      margin-top:10px;
      border-radius:10px;
      border:1px solid var(--border);
    }

.image-modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:9999;
  background:rgba(0,0,0,.88);
  padding:18px;
  box-sizing:border-box;
  align-items:center;
  justify-content:center;
}

.image-modal.open{
  display:flex;
}

.image-modal-viewer{
  max-width:96vw;
  max-height:92vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:10px;
}

.image-modal-main-image{
  max-width:96vw;
  max-height:84vh;
  object-fit:contain;
  border-radius:10px;
  background:#111;
}

.image-modal-title{
  color:#fff;
  font-size:15px;
  font-weight:bold;
  text-align:center;
}

.image-modal-close{
  position:absolute;
  top:14px;
  right:14px;
  z-index:10001;
  border:1px solid rgba(255,255,255,.35);
  border-radius:50%;
  background:rgba(0,0,0,.35);
  color:#fff;
  font-size:28px;
  font-weight:bold;
  width:44px;
  height:44px;
  cursor:pointer;
}

.image-modal-nav{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  z-index:10000;
  border:1px solid rgba(255,255,255,.35);
  border-radius:50%;
  background:rgba(0,0,0,.35);
  color:#fff;
  font-size:42px;
  font-weight:bold;
  width:54px;
  height:54px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
}

.image-modal-prev{
  left:18px;
}

.image-modal-next{
  right:18px;
}

.image-modal-nav:hover,
.image-modal-close:hover{
  background:rgba(255,255,255,.18);
}

    padding:10px;

      font-weight:bold;

    }

    .route-popup-meta{
      font-size:12px;
    }

    a{
      color:var(--link);
    }

    @media(max-width:800px){
      body{
        padding:12px;
      }

      .site-title{

      }

      #map{

      }

      }

        grid-template-columns:1fr;
      }

  </style>
</head>

<body class="dark-mode">
  <div class="container">
    <div class="header">
      <h1 class="site-title" id="pageTitle">Reiserute</h1>
      <div class="subtitle" id="pageSubtitle">Kvimarka 92</div>

      <div class="top-buttons">
        <a class="top-button" href="javascript:history.back()" title="Tilbake">←</a>
        <a class="top-button" href="index.html" title="Hovedside">⌂</a>
      </div>
    </div>

    <div id="content">
      <div class="loading">Laster reiserute...</div>
    </div>
  </div>

<div class="image-modal" id="imageModal">
  <button class="image-modal-close" id="imageModalClose" type="button">×</button>

  <button class="image-modal-nav image-modal-prev" id="imageModalPrev" type="button">‹</button>

  <div class="image-modal-viewer">
    <img class="image-modal-main-image" id="imageModalImage" alt="">
    <div class="image-modal-title" id="imageModalTitle">Bilder</div>
  </div>

  <button class="image-modal-nav image-modal-next" id="imageModalNext" type="button">›</button>
</div>
  
  <script>
    const API_BASE = "https://api-kvimarka92.carstereogarage.com";
let imageModalImages = [];
let imageModalTitle = "";
let imageModalIndex = 0;
let imageModalTouchStartX = null;
    
    function esc(value){
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

function scrollToHashStop(){
  if(!window.location.hash){
    return;
  }

  const target = document.querySelector(window.location.hash);

  if(!target){
    return;
  }

  setTimeout(function(){
    target.scrollIntoView({
      behavior:"smooth",
      block:"center"
    });
  }, 300);
}
    
function getFileUrls(fileField){
  if(!Array.isArray(fileField) || !fileField.length){
    return [];
  }

  return fileField
    .map(file => file?.url || file?.visible_name || "")
    .filter(Boolean);
}

function getFileUrl(fileField){
  return getFileUrls(fileField)[0] || "";
}

    function getCaseFromUrl(){
      const params = new URLSearchParams(window.location.search);
      return params.get("case") || "";
    }

    async function fetchJson(url){
      const res = await fetch(url, {
        credentials:"include"
      });

      if(!res.ok){
        const text = await res.text();
        throw new Error(text || "Request failed");
      }

      return await res.json();
    }

    function formatDate(dateValue){
      if(!dateValue){
        return "";
      }

      const parts = String(dateValue).split("-");

      if(parts.length !== 3){
        return String(dateValue);
      }

      return `${parts[2]}.${parts[1]}.${parts[0]}`;
    }

    function formatDateRange(from, to){
      const fromText = formatDate(from);
      const toText = formatDate(to);

      if(fromText && toText && fromText !== toText){
        return `${fromText}–${toText}`;
      }

      return fromText || toText || "";
    }

    function firstDate(stops){
      return stops
        .map(stop => stop.dateFrom || stop.dateTo)
        .filter(Boolean)[0] || "";
    }

    function lastDate(stops){
      const dates = stops
        .map(stop => stop.dateTo || stop.dateFrom)
        .filter(Boolean);

      return dates[dates.length - 1] || "";
    }

    function createNumberIcon(number){
      return L.divIcon({
        html:`<div class="route-marker">${number}</div>`,
        className:"",
        iconSize:[32,32],
        iconAnchor:[16,16],
        popupAnchor:[0,-16]
      });
    }

function renderSummary(data){
  const stops = data.stops || [];
  const from = firstDate(stops);
  const to = lastDate(stops);

  return `
    <div class="summary">
      <div class="summary-item">
        <div class="summary-label">Periode</div>
        <div class="summary-value">${esc(formatDateRange(from, to)) || "-"}</div>
      </div>

<div class="summary-item">
  <a
    class="summary-map-link"
    href="google-mymaps-export.html?case=${encodeURIComponent(data.case?.caseName || data.case?.title || "")}"
    title="Eksporter til Google My Maps"
  >⌖</a>

  <div class="summary-label">Antall stopp</div>
  <div class="summary-value">${esc(stops.length)}</div>
</div>
    </div>
  `;
}

function renderStopList(stops){
  return `
    <div class="card">
      <h2>Stopp</h2>
      <div class="stop-list">
        ${stops.map((stop, index) => {
          const imageUrl = getFileUrl(stop.image);
          const dateText = formatDateRange(stop.dateFrom, stop.dateTo);
          const webLink = String(stop.webLink || "").trim();
          const isAdmin = currentUser?.role === "Administrator";
          const caseName = getCaseFromUrl();
          const metaParts = [
            dateText,
            stop.stopType || "",
            stop.transport || "",
            stop.roads ? `Veier: ${stop.roads}` : ""
          ].filter(Boolean);

          return `
            <div class="stop-row" id="stop-${index + 1}" data-stop-index="${index}">
            ${isAdmin ? `
  <a
    class="stop-admin-link"
    href="image-order.html?case=${encodeURIComponent(caseName)}&stop=${encodeURIComponent(stop.id)}"
    title="Sorter bilder"
    onclick="event.stopPropagation();"
  >⚙</a>
` : ""}
              ${webLink ? `
                <a
                  class="stop-web-link"
                  href="${esc(webLink)}"
                  target="_blank"
                  rel="noopener"
                  title="Åpne webside"
                  onclick="event.stopPropagation();"
                >i</a>
              ` : ""}

              <div>
                <div class="stop-number">${index + 1}</div>
              </div>

              <div>
                <div class="stop-title">${esc(stop.stopName || stop.title)}</div>
                <div class="stop-meta">${esc(metaParts.join(" • "))}</div>

                ${stop.description ? `<div class="stop-description">${esc(stop.description)}</div>` : ""}
                ${imageUrl ? `<img class="stop-image" src="${esc(imageUrl)}" alt="">` : ""}
              </div>
            </div>
          `;
        }).join("")}
      </div>
    </div>
  `;
}

function parseCoordinate(value, type){
  if(value === null || value === undefined){
    return NaN;
  }

  if(typeof value === "object"){
    if(value.value !== undefined){
      return parseCoordinate(value.value, type);
    }

    if(value.name !== undefined){
      return parseCoordinate(value.name, type);
    }

    if(value.text !== undefined){
      return parseCoordinate(value.text, type);
    }

    return NaN;
  }

  let text = String(value).trim();

  if(!text){
    return NaN;
  }

  text = text.replace(",", ".");

  let number = Number(text);

  if(!Number.isFinite(number)){
    return NaN;
  }

  if(type === "lat" && Math.abs(number) > 90){
    number = number / 10000;
  }

  if(type === "lng" && Math.abs(number) > 180){
    number = number / 10000;
  }

  if(type === "lng" && number > 0 && number > 30 && number < 180){
    number = -number;
  }

  return number;
}

function getStopCoordinate(stop, names, type){
  for(const name of names){
    if(
      stop[name] !== undefined &&
      stop[name] !== null &&
      String(stop[name]).trim() !== ""
    ){
      return parseCoordinate(stop[name], type);
    }
  }

  return NaN;
}

function normalizeLatLng(stop){
  let lat = getStopCoordinate(stop, [
    "latitude",
    "Latitude",
    "lat",
    "Lat",
    "field_8628028"
  ], "lat");

  let lng = getStopCoordinate(stop, [
    "longitude",
    "Longitude",
    "lng",
    "Lng",
    "lon",
    "Lon",
    "field_8628030"
  ], "lng");

  if(
    Number.isFinite(lat) &&
    Number.isFinite(lng) &&
    Math.abs(lat) > 90 &&
    Math.abs(lng) <= 90
  ){
    const oldLat = lat;
    lat = lng;
    lng = oldLat;
  }

  if(
    !Number.isFinite(lat) ||
    !Number.isFinite(lng) ||
    Math.abs(lat) > 90 ||
    Math.abs(lng) > 180
  ){
    return null;
  }

  return { lat, lng };
}

function openImageModal(stop){
  const imageUrls = getFileUrls(stop.image);

  if(!imageUrls.length){
    return;
  }

  imageModalImages = imageUrls;
  imageModalTitle = stop.stopName || stop.title || "Bilder";
  imageModalIndex = 0;

  showImageModalImage();
  document.getElementById("imageModal").classList.add("open");
}

function showImageModalImage(){
  const image = document.getElementById("imageModalImage");
  const title = document.getElementById("imageModalTitle");

  if(!imageModalImages.length){
    return;
  }

  const imageUrl = imageModalImages[imageModalIndex];

  image.src = imageUrl;
  title.textContent =
    `${imageModalTitle} — ${imageModalIndex + 1} av ${imageModalImages.length}`;
}

function showPreviousImage(){
  if(!imageModalImages.length){
    return;
  }

  imageModalIndex =
    (imageModalIndex - 1 + imageModalImages.length) % imageModalImages.length;

  showImageModalImage();
}

function showNextImage(){
  if(!imageModalImages.length){
    return;
  }

  imageModalIndex =
    (imageModalIndex + 1) % imageModalImages.length;

  showImageModalImage();
}

function closeImageModal(){
  const modal = document.getElementById("imageModal");
  const image = document.getElementById("imageModalImage");

  modal.classList.remove("open");
  image.src = "";

  imageModalImages = [];
  imageModalTitle = "";
  imageModalIndex = 0;
  imageModalTouchStartX = null;
}

function setupImageModal(){
  const modal = document.getElementById("imageModal");
  const closeButton = document.getElementById("imageModalClose");
  const prevButton = document.getElementById("imageModalPrev");
  const nextButton = document.getElementById("imageModalNext");

  closeButton.addEventListener("click", closeImageModal);
  prevButton.addEventListener("click", showPreviousImage);
  nextButton.addEventListener("click", showNextImage);

  modal.addEventListener("click", function(event){
    if(event.target === modal){
      closeImageModal();
    }
  });

  document.addEventListener("keydown", function(event){
    if(!modal.classList.contains("open")){
      return;
    }

    if(event.key === "Escape"){
      closeImageModal();
    }

    if(event.key === "ArrowLeft"){
      showPreviousImage();
    }

    if(event.key === "ArrowRight"){
      showNextImage();
    }
  });

  modal.addEventListener("touchstart", function(event){
    if(!modal.classList.contains("open")){
      return;
    }

    imageModalTouchStartX = event.changedTouches[0].clientX;
  }, {
    passive:true
  });

  modal.addEventListener("touchend", function(event){
    if(imageModalTouchStartX === null){
      return;
    }

    const touchEndX = event.changedTouches[0].clientX;
    const difference = touchEndX - imageModalTouchStartX;

    imageModalTouchStartX = null;

    if(Math.abs(difference) < 45){
      return;
    }

    if(difference > 0){
      showPreviousImage();
    }else{
      showNextImage();
    }
  }, {
    passive:true
  });
}



function setupStopImageClicks(stops){
  document.querySelectorAll(".stop-row").forEach(row => {
    const index = Number(row.dataset.stopIndex);
    const stop = stops[index];

    if(!stop){
      return;
    }

    const imageUrls = getFileUrls(stop.image);

    if(!imageUrls.length){
      return;
    }

    row.style.cursor = "pointer";
    row.title = "Klikk for å vise bilder";

    row.addEventListener("click", function(event){
      event.preventDefault();
      openImageModal(stop);
    });
  });
}
    
function renderMap(stops){
  const map = L.map("map", {
    scrollWheelZoom:false
  });

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom:19,
    attribution:"&copy; OpenStreetMap contributors"
  }).addTo(map);

  const validStops = stops
    .map((stop, index) => {
      return {
        ...stop,
        displayNumber:index + 1,
        coordinates:normalizeLatLng(stop)
      };
    })
    .filter(stop => stop.coordinates);

  const points = validStops.map(stop => [
    stop.coordinates.lat,
    stop.coordinates.lng
  ]);

  validStops.forEach(stop => {
    const lat = stop.coordinates.lat;
    const lng = stop.coordinates.lng;
    const dateText = formatDateRange(stop.dateFrom, stop.dateTo);

    const popupHtml = `
      <div class="route-popup">
        <div class="route-popup-title">
          ${stop.displayNumber}. ${esc(stop.stopName || stop.title)}
        </div>

 <div class="route-popup-meta">
  ${dateText ? `${esc(dateText)}<br>` : ""}
  ${stop.stopType ? `Type: ${esc(stop.stopType)}<br>` : ""}
  ${stop.transport ? `Transport: ${esc(stop.transport)}<br>` : ""}
  ${stop.roads ? `Veier: ${esc(stop.roads)}<br>` : ""}
</div>

        ${stop.description ? `
          <div style="margin-top:8px;">
            ${esc(stop.description)}
          </div>
        ` : ""}
      </div>
    `;

    const marker = L.marker([lat, lng], {
      icon:createNumberIcon(stop.displayNumber)
    }).addTo(map);

    marker.bindPopup(popupHtml);

    marker.bindTooltip(
      `${stop.displayNumber}. ${esc(stop.stopName || stop.title)}`,
      {
        direction:"top",
        offset:[0,-16],
        opacity:0.95
      }
    );


  });

  if(points.length){
    L.polyline(points, {
      weight:4,
      opacity:.9
    }).addTo(map);

    map.fitBounds(points, {
      padding:[30,30],
      maxZoom:7
    });
  }else{
    map.setView([39.5, -98.35], 4);
  }

  setTimeout(function(){
    map.invalidateSize();

    if(points.length){
      map.fitBounds(points, {
        padding:[30,30],
        maxZoom:7
      });
    }
  }, 250);
}

    function renderRoute(data){
      const content = document.getElementById("content");
      const title = data.case?.title || data.case?.caseName || "Reiserute";
      const stops = data.stops || [];

document.title = title + " - Reiserute";
      document.getElementById("pageTitle").textContent = title;
      document.getElementById("pageSubtitle").textContent = "Reiserute";

      if(!stops.length){
        content.innerHTML = `<div class="error-box">Denne reiseruten har ingen aktive stopp med koordinater.</div>`;
        return;
      }

      content.innerHTML = `
        ${renderSummary(data)}
        <div class="card">
          <div id="map"></div>
        </div>
        ${renderStopList(stops)}
      `;

setupImageModal();
setupStopImageClicks(stops);
renderMap(stops);
scrollToHashStop();
    }

let currentUser = null;

async function fetchCurrentUser(){
  try{
    const res = await fetch(`${API_BASE}/whoami`, {
      credentials:"include"
    });

    if(!res.ok){
      return null;
    }

    return await res.json();
  }catch(error){
    return null;
  }
}
    
    async function loadRoute(){
      const caseName = getCaseFromUrl();

      if(!caseName){
        throw new Error("Mangler route case i URL-en.");
      }

      const data = await fetchJson(`${API_BASE}/route?case=${encodeURIComponent(caseName)}`);
      currentUser = await fetchCurrentUser();
      renderRoute(data);
    }

    loadRoute().catch(error => {
      console.error(error);

      document.getElementById("content").innerHTML = `
        <div class="error-box">
          Kunne ikke laste reiseruten.<br><br>
          ${esc(error.message)}
        </div>
      `;
    });
  </script>
