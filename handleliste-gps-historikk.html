<style>
:root{--bg:#f2f2f2;--card:#fff;--text:#333;--muted:#667;--border:#ccc;--link:#1f789d;--button:#fff;--button-hover:#e9eef2;--success:#72c184;--danger:#d77;}
body.dark-mode{--bg:#151515;--card:#242424;--text:#eee;--muted:#bbb;--border:#555;--link:#7cc7e8;--button:#242424;--button-hover:#3a3a3a;--success:#72c184;--danger:#ff7777;}
*{box-sizing:border-box;}
body{margin:0;padding:20px;background:var(--bg);color:var(--text);font-family:Arial,sans-serif;}
.container{max-width:980px;margin:auto;}
.header{text-align:center;margin-bottom:20px;}
.site-title{margin:0;font-size:30px;}
.subtitle{margin-top:8px;color:var(--muted);font-size:16px;}
.top-buttons{display:flex;justify-content:center;align-items:center;gap:10px;margin:14px 0 0;}
.top-button{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;padding:0;background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--text);text-decoration:none;font-size:24px;font-weight:bold;line-height:1;cursor:pointer;}
.top-button:hover,.action-button:hover{background:var(--button-hover);}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px;margin-bottom:10px;}
.status{color:var(--link);line-height:1.35;font-size:14px;}
.status.error{color:var(--danger);}
.status.success{color:var(--success);}
.toolbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:space-between;}
.action-button{display:inline-flex;align-items:center;justify-content:center;min-height:34px;padding:0 10px;background:var(--button);border:1px solid var(--border);border-radius:8px;color:var(--text);font-weight:bold;text-decoration:none;cursor:pointer;font-size:14px;}
.primary{background:var(--link);border-color:var(--link);color:#fff;}
.gps-list{display:flex;flex-direction:column;gap:10px;}
.gps-row{border:1px solid var(--border);border-radius:10px;background:rgba(127,127,127,.05);padding:10px;}
.gps-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:8px;}
.gps-time{font-weight:bold;font-size:16px;}
.gps-source{color:var(--muted);font-size:12px;margin-top:2px;}
.gps-place{font-weight:bold;color:var(--text);}
.gps-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;}
.gps-field{background:rgba(0,0,0,.08);border-radius:8px;padding:8px;min-width:0;}
body:not(.dark-mode) .gps-field{background:rgba(127,127,127,.08);}
.gps-label{font-size:11px;color:var(--muted);margin-bottom:3px;}
.gps-value{font-weight:bold;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.gps-link{color:var(--link);font-weight:bold;text-decoration:none;}
.gps-link:hover{text-decoration:underline;}
.empty{padding:20px;text-align:center;color:var(--muted);}
@media(max-width:700px){
  body{padding:12px;}
  .site-title{font-size:28px;}
  .gps-grid{grid-template-columns:repeat(2,minmax(0,1fr));}
  .gps-head{flex-direction:column;}
}

.nearby-button{margin-top:8px;}
.store-modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:1000;padding:14px;}
.store-modal.open{display:flex;}
.store-modal-content{background:var(--card);border:1px solid var(--border);border-radius:14px;width:min(720px,96vw);max-height:88vh;overflow:auto;padding:14px;}
.store-modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;}
.store-modal-title{font-size:22px;font-weight:bold;}
.store-list{display:flex;flex-direction:column;gap:8px;}
.store-choice{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;border:1px solid var(--border);border-radius:10px;background:rgba(127,127,127,.07);padding:10px;}
.store-name{font-weight:bold;}
.store-meta{color:var(--muted);font-size:13px;margin-top:3px;}
@media(max-width:700px){.store-choice{grid-template-columns:1fr;}.store-choice button{width:100%;}}


.store-modal-actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;}
.store-form{display:none;border:1px solid var(--border);border-radius:10px;padding:10px;margin:10px 0;background:rgba(127,127,127,.06);}
.store-form.open{display:block;}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;}
.form-field{display:flex;flex-direction:column;gap:4px;}
.form-label{font-size:12px;color:var(--muted);font-weight:bold;}
.form-input{width:100%;min-height:34px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);padding:6px 8px;font:inherit;}

@media(max-width:700px){.form-grid{grid-template-columns:1fr;}}


/* GPS-historikk v5: områdevalg og Finn butikk på selve GPS-historikk-siden. */

.gps-find-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}

  min-height:34px;

@media(max-width:700px){
  .gps-find-row{display:grid;grid-template-columns:1fr auto;}
  .gps-area-select{min-width:0;width:100%;}
}

<body>
<div class="container">
  <div class="header page-icon-spacer-title">
    <h1 class="site-title">Handleliste</h1>
    <div class="subtitle">GPS-historikk</div>
    <div class="top-buttons handleliste-shared-top-menu" id="handlelisteTopMenu"></div>
  </div>

  <div class="card gps-find-card">
    <div class="gps-find-row">
      <select id="gpsShoppingAreaSelect" class="gps-area-select" title="Velg butikk / handelstype" aria-label="Velg butikk / handelstype"></select>

    <div class="toolbar">
      <div id="status" class="status">Laster GPS-historikk...</div>
      <button class="action-button primary" type="button" onclick="loadGpsHistory()">Oppdater</button>

  </div>

  <div class="card">
    <div id="gpsList" class="gps-list"></div>

</div>

<div class="store-modal" id="storeModal" onclick="handleStoreModalBackdrop(event)">
  <div class="store-modal-content" onclick="event.stopPropagation()">
    <div class="store-modal-head">
      <div>
        <div class="store-modal-title">Velg butikk for GPS-posisjon</div>
        <div class="info" id="storeModalInfo"></div>
      </div>
      <button class="action-button" type="button" onclick="closeStoreModal()">Lukk</button>
    </div>
    <div class="store-modal-actions">
      <button class="action-button primary" type="button" onclick="showNewStoreForm()">Legg til ny butikk</button>

        <div class="form-field">
          <label class="form-label" for="newStoreChain">Kjede</label>

        <div class="form-field">
          <label class="form-label" for="newStoreName">Butikknavn</label>

        <div class="form-field">
          <label class="form-label" for="newStoreAddress">Adresse</label>

        </div>
        <div class="form-field">
          <label class="form-label" for="newStoreRadius">Match-radius meter</label>
          <input class="form-input" id="newStoreRadius" type="number" min="10" max="1000" step="10" value="50">

    <div id="storeList" class="store-list"></div>

<script>
const API_BASE="https://api-kvimarka92.carstereogarage.com";

const GPS_HISTORY_VERSION="v5";
const SHOPPING_AREA_DEFAULT="Matvarer";
const SHOPPING_AREA_STORAGE_KEY="kvimarka92SelectedShoppingAreaV1";
const SHOPPING_AREA_ORDER=["Matvarer","Apotek","Bondekompaniet","Clas Ohlson","Europris","Frisør","Normal","Sport"];
let selectedShoppingArea=getInitialSelectedShoppingArea();

function normalizeShoppingArea(value){
  const raw=String(value||"").trim();
  return raw || SHOPPING_AREA_DEFAULT;
}

function getShoppingAreaFromUrl(){
  try{
    const params=new URLSearchParams(window.location.search||"");
    const value=String(params.get("shoppingArea")||params.get("area")||"").trim();
    if(value)return normalizeShoppingArea(value);
  }catch(error){}
  return "";
}

function readShoppingAreaStorage(){
  try{
    return String(localStorage.getItem(SHOPPING_AREA_STORAGE_KEY)||"").trim();
  }catch(error){
    return "";
  }
}

function writeShoppingAreaStorage(value){
  try{localStorage.setItem(SHOPPING_AREA_STORAGE_KEY,normalizeShoppingArea(value));}catch(error){}
}

function getInitialSelectedShoppingArea(){
  return getShoppingAreaFromUrl() || readShoppingAreaStorage() || SHOPPING_AREA_DEFAULT;
}

function renderGpsShoppingAreaSelect(){
  const select=document.getElementById("gpsShoppingAreaSelect");
  if(!select)return;
  select.innerHTML=SHOPPING_AREA_ORDER.map(area=>{
    const label=area==="Bondekompaniet"?"Bondekomp.":area;
    return `<option value="${esc(area)}"${area===selectedShoppingArea?" selected":""}>${esc(label)}</option>`;
  }).join("");
  select.onchange=function(){
    selectedShoppingArea=normalizeShoppingArea(select.value);
    writeShoppingAreaStorage(selectedShoppingArea);
  };
}

function roundGpsForBaserow(value, decimals){
  const n=Number(value);
  if(!Number.isFinite(n)){
    return null;
  }
  const factor=Math.pow(10, Number(decimals || 0));
  return Math.round(n * factor) / factor;
}

function getPositionOnce(options){
  return new Promise(resolve=>{
    if(!navigator.geolocation){
      resolve({status:"error",message:"Nettleseren støtter ikke GPS.",source:"geolocation"});
      return;
    }

    navigator.geolocation.getCurrentPosition(
      position=>{
        resolve({
          status:"ok",
          latitude:position.coords.latitude,
          longitude:position.coords.longitude,
          accuracy:position.coords.accuracy,
          source:"browser"
        });
      },
      error=>{
        const code=Number(error && error.code || 0);
        const status=code===1?"denied":"error";
        resolve({
          status,
          message:error && error.message ? error.message : "Kunne ikke hente GPS-posisjon.",
          source:"browser",
          code
        });
      },
      options || {enableHighAccuracy:true,timeout:12000,maximumAge:0}
    );
  });
}

async function getShoppingLocation(){
  const first=await getPositionOnce({enableHighAccuracy:true,timeout:12000,maximumAge:0});
  if(first.status==="ok" || first.status==="denied"){
    return first;
  }

  const second=await getPositionOnce({enableHighAccuracy:false,timeout:18000,maximumAge:30000});
  if(second.status==="ok"){
    second.retriedAfter=true;
    second.firstError=first.message || "";
    return second;
  }

  second.firstError=first.message || "";
  return second;
}

function formatGpsLocationRaw(location){
  if(!location){
    return "Ingen GPS-respons.";
  }

  if(location.status==="ok"){
    const lat=Number(location.latitude).toFixed(6);
    const lon=Number(location.longitude).toFixed(6);
    const acc=location.accuracy !== null && location.accuracy !== undefined ? `${Math.round(Number(location.accuracy))} m` : "ukjent";
    const retry=location.retriedAfter ? " Fallback brukt." : "";
    return `GPS OK: ${lat}, ${lon}. Nøyaktighet: ${acc}.${retry}`;
  }

  if(location.status==="denied"){
    return `GPS avslått av bruker/nettleser${location.message ? `: ${esc(location.message)}` : "."}`;
  }

  const first=location.firstError ? ` Første forsøk: ${esc(location.firstError)}.` : "";
  return `Kunne ikke hente GPS-posisjon${location.message ? `: ${esc(location.message)}` : "."}${first}`;
}

function setGpsFindButtonBusy(isBusy){
  const button=document.getElementById("gpsFindStoreButton");
  if(!button)return;
  button.disabled=!!isBusy;
  button.textContent=isBusy ? "Sjekker..." : "Finn butikk";
}

async function logGpsHistoryOnly(location, matchStatus){
  if(!location || location.status !== "ok"){
    return {logged:false, skipped:true, error:"Ingen GPS-koordinater å lagre."};
  }

  const latitude=roundGpsForBaserow(location.latitude,4);
  const longitude=roundGpsForBaserow(location.longitude,4);
  const accuracy=roundGpsForBaserow(location.accuracy,0);

  if(latitude === null || longitude === null){
    return {logged:false, error:"GPS-koordinater mangler i HTML-variabler."};
  }

  const data=await fetchJson(`${API_BASE}/shopping/gps-history-log`,{
    method:"POST",
    headers:{"Content-Type":"text/plain;charset=UTF-8"},
    body:JSON.stringify({
      latitude,
      longitude,
      accuracy,
      locationStatus:location.status,
      locationSource:location.source || "",
      locationMessage:location.message || "",
      shoppingArea:selectedShoppingArea,
      storeMatchStatus:matchStatus || "GPS position received"
    })
  });

  return data && data.gpsHistoryLog ? data.gpsHistoryLog : {
    logged:!!(data && data.success),
    mode:data && data.gpsHistoryLog && data.gpsHistoryLog.mode || "html-vars",
    rowId:data && data.gpsHistoryLog && data.gpsHistoryLog.rowId || null,
    error:data && data.error || ""
  };
}

function formatStoreMatchResult(data){
  if(!data){
    return "Ingen butikkrespons.";
  }

  const matchStatus=String(data.storeMatchStatus || "").trim();
  const store=data.store || {};
  const chain=String(data.storeChain || store.chain || "").trim();
  const name=String(data.storeName || store.name || "").trim();
  const distance=data.storeDistance || store.distance;
  const matched=!!(chain || name);

  if(matched){
    const storeText=[chain,name].filter(Boolean).join(" ");
    const distanceText=Number.isFinite(Number(distance)) ? ` · ${Math.round(Number(distance))} m` : "";
    return `Fant butikk: ${esc(storeText)}${distanceText}`;
  }

  if(matchStatus==="Uncertain" || matchStatus==="No nearby store"){
    return "Fant ingen kjent butikk her.";
  }

  return "Butikk kunne ikke foreslås automatisk.";
}

async function findStoreFromGpsHistoryPage(){
  selectedShoppingArea=normalizeShoppingArea(document.getElementById("gpsShoppingAreaSelect") && document.getElementById("gpsShoppingAreaSelect").value || selectedShoppingArea);
  writeShoppingAreaStorage(selectedShoppingArea);
  setGpsFindButtonBusy(true);
  setStatus(`Henter GPS-posisjon for ${esc(selectedShoppingArea)}...`);

  try{
    const location=await getShoppingLocation();

    if(location.status !== "ok"){
      setStatus(formatGpsLocationRaw(location),"error");
      return;
    }

    const gpsLog=await logGpsHistoryOnly(location,"GPS position received");

    const data=await fetchJson(`${API_BASE}/shopping/store-match`,{
      method:"POST",
      headers:{"Content-Type":"text/plain;charset=UTF-8"},
      body:JSON.stringify({
        location,
        latitude:roundGpsForBaserow(location.latitude,4),
        longitude:roundGpsForBaserow(location.longitude,4),
        accuracy:roundGpsForBaserow(location.accuracy,0),
        locationStatus:location.status,
        shoppingArea:selectedShoppingArea
      })
    });

    const logText=gpsLog && gpsLog.logged ? "GPS-logg: lagret." : `GPS-logg feilet: ${esc(gpsLog && gpsLog.error || "ukjent feil")}`;
    setStatus(`${formatGpsLocationRaw(location)}<br>${formatStoreMatchResult(data)}<br>${logText}`,"success");
    await loadGpsHistory();
  }catch(error){
    setStatus(`Kunne ikke finne butikk.<br><br>${esc(error.message)}`,"error");
  }finally{
    setGpsFindButtonBusy(false);
  }
}



function esc(value){
  return String(value == null ? "" : value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function setStatus(message,type){
  const el=document.getElementById("status");
  el.className="status"+(type?` ${type}`:"");
  el.innerHTML=message||"";
}

async function fetchJson(url,options){
  const fetchOptions={
    credentials:"include",
    ...(options||{})
  };
  const res=await fetch(url,fetchOptions);
  const text=await res.text();
  let data=null;

  try{
    data=text?JSON.parse(text):null;
  }catch(error){
    throw new Error(text||`HTTP ${res.status}`);
  }

  if(!res.ok || data && data.error){
    throw new Error(data && (data.detail||data.error) || `HTTP ${res.status}`);
  }

  return data;
}

function formatDateTime(value){
  if(!value)return "";
  const date=new Date(value);
  if(Number.isNaN(date.getTime()))return value;
  return new Intl.DateTimeFormat("no-NO",{
    dateStyle:"medium",
    timeStyle:"short",
    timeZone:"Europe/Oslo"
  }).format(date);
}

function formatNumber(value,decimals){
  const number=Number(value);
  if(!Number.isFinite(number))return "";
  return number.toFixed(decimals);
}

function formatAccuracy(value){
  const number=Number(value);
  if(!Number.isFinite(number))return "";
  return `${Math.round(number)} m`;
}

function formatDistance(value){
  const number=Number(value);
  if(!Number.isFinite(number))return "";
  return `${Math.round(number)} m`;
}

function rowHtml(row){
  const lat=formatNumber(row.latitude,6);
  const lon=formatNumber(row.longitude,6);
  const coords=lat&&lon?`${lat}, ${lon}`:"";
  const place=String(row.place||row.storeName||row.shoppingArea||"GPS-posisjon").trim();
  const source=row.source==="shopping-session"?"Fra avsluttet handel":"GPS-registrering";
  const maps=row.googleMapsUrl || (coords?`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(coords)}`:"");

  return `<div class="gps-row">
    <div class="gps-head">
      <div>
        <div class="gps-time">${esc(formatDateTime(row.checkedAt)||"Ukjent tidspunkt")}</div>
        <div class="gps-source">${esc(source)}${row.user?` · ${esc(row.user)}`:""}</div>
      </div>
      <div class="gps-place">${esc(place)}</div>
    </div>
    <div class="gps-grid">
      <div class="gps-field">
        <div class="gps-label">Nøyaktighet</div>
        <div class="gps-value">${esc(formatAccuracy(row.accuracy)||"-")}</div>
      </div>
      <div class="gps-field">
        <div class="gps-label">Koordinater</div>
        <div class="gps-value" title="${esc(coords)}">${esc(coords||"-")}</div>
      </div>
      <div class="gps-field">
        <div class="gps-label">Butikk / sted</div>
        <div class="gps-value" title="${esc(place)}">${esc(place)}</div>
      </div>
      <div class="gps-field">
        <div class="gps-label">Kart</div>
        <div class="gps-value">${maps?`<a class="gps-link" href="${esc(maps)}" target="_blank" rel="noopener">Åpne kart</a>`:"-"}</div>
      </div>
      <div class="gps-field">
        <div class="gps-label">Butikkstatus</div>
        <div class="gps-value">${esc(row.storeMatchStatus||row.locationStatus||"-")}</div>
      </div>
      <div class="gps-field">
        <div class="gps-label">Avstand butikk</div>
        <div class="gps-value">${esc(formatDistance(row.storeDistance)||"-")}</div>
      </div>
      <div class="gps-field">
        <div class="gps-label">Område</div>
        <div class="gps-value">${esc(row.shoppingArea||"-")}</div>
      </div>
      <div class="gps-field">
        <div class="gps-label">Kilde</div>
        <div class="gps-value">${esc(row.source||"-")}</div>
      </div>
    </div>
    ${row.latitude!==null&&row.longitude!==null?`<button class="action-button nearby-button" type="button" onclick="openNearbyStores(${Number(row.id)})">Finn nærmeste butikker</button>`:""}
  </div>`;
}


let currentGpsIdForStoreChoice=null;
let currentGpsForStoreChoice=null;
let currentStoreChoices=[];
let currentChainChoices=[];
let currentGpsArea="";

function closeStoreModal(){
  document.getElementById("storeModal").classList.remove("open");
  hideNewStoreForm();
  currentGpsIdForStoreChoice=null;
  currentGpsForStoreChoice=null;
  currentStoreChoices=[];
  currentChainChoices=[];
  currentGpsArea="";
}

function handleStoreModalBackdrop(event){
  if(event.target.id==="storeModal")closeStoreModal();
}

function populateNewStoreChains(){
  const select=document.getElementById("newStoreChain");
  const chains=currentChainChoices.length
    ? currentChainChoices
    : currentStoreChoices
        .filter(store=>store.chain)
        .map(store=>({name:store.chain,shoppingArea:store.shoppingArea}));

  const unique=[];
  const seen=new Set();

  chains.forEach(chain=>{
    const name=String(chain && chain.name || chain && chain.chain || "").trim();
    if(!name)return;
    const key=name.toLowerCase();
    if(seen.has(key))return;
    seen.add(key);
    unique.push({name,shoppingArea:chain.shoppingArea || currentGpsArea});
  });

  select.innerHTML=unique.map(chain=>`<option value="${esc(chain.name)}">${esc(chain.name)}</option>`).join("");

  if(!select.innerHTML){
    select.innerHTML='<option value="">Skriv kjede mangler</option>';
  }
}

function showNewStoreForm(){
  const form=document.getElementById("newStoreForm");
  const help=document.getElementById("newStoreHelp");
  populateNewStoreChains();
  document.getElementById("newStoreName").value="";
  document.getElementById("newStoreAddress").value="";
  document.getElementById("newStoreRadius").value="50";
  const gps=currentGpsForStoreChoice || {};
  const coords=(gps.latitude!==null&&gps.longitude!==null&&gps.latitude!==undefined&&gps.longitude!==undefined)
    ? `${formatNumber(gps.latitude,6)}, ${formatNumber(gps.longitude,6)}`
    : "ukjent";
  help.textContent=`Ny butikk opprettes i område ${currentGpsArea || "ukjent"} med GPS-koordinater ${coords}.`;
  form.classList.add("open");
}

function hideNewStoreForm(){
  const form=document.getElementById("newStoreForm");
  if(form)form.classList.remove("open");
}

async function openNearbyStores(gpsId){
  currentGpsIdForStoreChoice=Number(gpsId);
  const modal=document.getElementById("storeModal");
  const list=document.getElementById("storeList");
  const info=document.getElementById("storeModalInfo");
  hideNewStoreForm();
  list.innerHTML='<div class="status">Henter nærmeste butikker...</div>';
  info.textContent=`GPS-rad ${gpsId}`;
  modal.classList.add("open");

  try{
    const data=await fetchJson(`${API_BASE}/shopping/admin/gps-history-nearby-stores?id=${encodeURIComponent(gpsId)}&limit=10`);
    const stores=Array.isArray(data.stores)?data.stores:[];
    currentStoreChoices=stores;
    currentChainChoices=Array.isArray(data.chains)?data.chains:[];
    currentGpsForStoreChoice=data.gps || null;
    currentGpsArea=data.gpsArea || data.gps && data.gps.shoppingArea || "";
    info.textContent=`${stores.length} nærmeste butikker i området ${currentGpsArea || "ukjent"} til logget posisjon.`;
    if(!stores.length){
      list.innerHTML='<div class="empty">Fant ingen butikker med koordinater i dette området.</div>';
      return;
    }
    list.innerHTML=stores.map(store=>`<div class="store-choice">
      <div>
        <div class="store-name">${esc([store.chain,store.name].filter(Boolean).join(" "))}</div>
        <div class="store-meta">${esc(store.address||"")} ${store.shoppingArea?`· ${esc(store.shoppingArea)}`:""} · ${esc(Math.round(Number(store.distance||0)))} m unna</div>
      </div>
      <button class="action-button primary" type="button" onclick="updateStorePositionFromGps(${Number(gpsId)},${Number(store.id)})">Oppdater</button>
    </div>`).join("");
  }catch(error){
    list.innerHTML=`<div class="status error">Kunne ikke hente nærmeste butikker.<br><br>${esc(error.message)}</div>`;
  }
}

async function updateStorePositionFromGps(gpsId,storeId){
  if(!confirm("Oppdatere GPS-koordinatene for valgt butikk med denne posisjonen?"))return;
  const list=document.getElementById("storeList");
  list.innerHTML='<div class="status">Oppdaterer butikkens GPS-koordinater...</div>';

  try{
    const data=await fetchJson(`${API_BASE}/shopping/admin/gps-history-update-store-position`,{
      method:"POST",
      headers:{"Content-Type":"text/plain;charset=UTF-8"},
      body:JSON.stringify({gpsId,storeId})
    });
    closeStoreModal();
    const store=[data.updated&&data.updated.storeChain,data.updated&&data.updated.storeName].filter(Boolean).join(" ");
    setStatus(`Butikkens GPS-koordinater er oppdatert: ${esc(store)}.`,"success");
    await loadGpsHistory();
  }catch(error){
    list.innerHTML=`<div class="status error">Kunne ikke oppdatere butikkens GPS-koordinater.<br><br>${esc(error.message)}</div>`;
  }
}

async function createStoreFromGps(){
  const gpsId=currentGpsIdForStoreChoice;
  const chain=String(document.getElementById("newStoreChain").value||"").trim();
  const name=String(document.getElementById("newStoreName").value||"").trim();
  const address=String(document.getElementById("newStoreAddress").value||"").trim();
  const matchRadius=Number(document.getElementById("newStoreRadius").value||50) || 50;

  if(!gpsId){
    alert("GPS-rad mangler.");
    return;
  }

  if(!chain){
    alert("Velg kjede.");
    return;
  }

  if(!name){
    alert("Skriv butikknavn.");
    return;
  }

  if(!confirm(`Opprette ny butikk "${name}" i kjeden "${chain}" med denne GPS-posisjonen?`))return;

  const list=document.getElementById("storeList");
  list.innerHTML='<div class="status">Oppretter ny butikk...</div>';

  try{
    const data=await fetchJson(`${API_BASE}/shopping/admin/gps-history-create-store`,{
      method:"POST",
      headers:{"Content-Type":"text/plain;charset=UTF-8"},
      body:JSON.stringify({gpsId,chain,name,address,matchRadius})
    });
    closeStoreModal();
    const store=[data.created&&data.created.storeChain,data.created&&data.created.storeName].filter(Boolean).join(" ");
    setStatus(`Ny butikk er opprettet: ${esc(store)}.`,"success");
    await loadGpsHistory();
  }catch(error){
    list.innerHTML=`<div class="status error">Kunne ikke opprette ny butikk.<br><br>${esc(error.message)}</div>`;
  }
}


async function loadGpsHistory(){
  const list=document.getElementById("gpsList");
  list.innerHTML="";
  setStatus("Laster GPS-historikk...");

  try{
    const data=await fetchJson(`${API_BASE}/shopping/gps-history?limit=500`);
    const rows=Array.isArray(data.rows)?data.rows:[];

    if(data.warning){
      setStatus(esc(data.warning),"error");
    }else{
      setStatus(`Klar. Viser ${rows.length} GPS-registreringer, nyeste øverst.`,"success");
    }

    if(!rows.length){
      list.innerHTML='<div class="empty">Ingen GPS-registreringer funnet.</div>';
      return;
    }

    list.innerHTML=rows.map(rowHtml).join("");
  }catch(error){
    setStatus(`Kunne ikke laste GPS-historikk.<br><br>${esc(error.message)}<br><br>Test API direkte: ${esc(API_BASE)}/shopping/gps-history`,"error");
    list.innerHTML="";
  }
}

document.addEventListener("DOMContentLoaded", function(){renderGpsShoppingAreaSelect();loadGpsHistory();});
</script>
</body>
</html>
