/* v11: force Bestille rows to the same compact visual height as Handle */

}.item-suggestions{

/* Handleliste ikonpakke v1 */
.header{position:relative;}
.page-icon-panel{position:absolute;left:0;top:-2px;width:74px;height:74px;display:flex;align-items:center;justify-content:center;pointer-events:none;}
.page-icon-panel svg{width:54px;height:54px;fill:none;stroke:var(--page-icon-color,var(--link));stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.top-button.top-icon-link{font-size:0;padding:0;}
.top-button.top-icon-link svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.top-button.bestille-top-button,.top-button.handle-top-button,.top-button.varsling-top-button,.top-button.history-top-button,.top-button.recipe-top-button,.top-button.edit-top-button,.top-button.type-top-button{color:var(--link);}
.action-button .btn-icon{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;margin-right:7px;vertical-align:middle;}
.action-button .btn-icon svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.action-button.gps-button{color:#ff7a9a;}
.action-button.finish-icon-button .btn-icon{color:inherit;}
.action-button.finish-icon-button .btn-icon svg{stroke:currentColor;}
body.dark-mode .action-button.gps-button{color:#ff8aa8;}
.page-icon-spacer-title .site-title,
.page-icon-spacer-title .subtitle{padding-left:0;}
@media(max-width:700px){
  .page-icon-panel{left:2px;top:-6px;width:52px;height:52px;}
  .page-icon-panel svg{width:38px;height:38px;}
}

<script>
const API_BASE="https://api-kvimarka92.carstereogarage.com";

let typeOptions=[];
const SHOPPING_AREA_DEFAULT="Matvarer";
const SHOPPING_AREA_ORDER=["Matvarer","Normal","Europris","Frisør","Clas Ohlson","Sport","Bondekompaniet","Apotek"];
const NON_FOOD_SHOPPING_TYPES=["Bondekompaniet","Clas Ohlson","Europris","Frisør","Normal","Sport","Apotek"];
const NON_FOOD_TYPE_AREAS={"normal":"Normal","europris":"Europris","frisør":"Frisør","frisor":"Frisør","clas ohlson":"Clas Ohlson","sport":"Sport","sportsbutikk":"Sport","bondekompaniet":"Bondekompaniet","apotek":"Apotek"};
function canonicalShoppingType(value){
  const text=String(value||"").replace(/[\u200B-\u200D\uFEFF]/g,"").trim();
  if(!text)return "";
  const key=text.toLowerCase().replace(/\s+/g," ");
  if(key==="meieri")return "Meieri og egg";
  return text;
}
function isDeprecatedShoppingType(value){
  const key=String(value||"").replace(/[\u200B-\u200D\uFEFF]/g,"").trim().toLowerCase().replace(/\s+/g," ");
  return key==="meieri";
}
function normalizeShoppingArea(value,type){
  const raw=String(value||"").trim();
  if(raw)return raw;
  const key=String(type||"").trim().toLowerCase();
  return NON_FOOD_TYPE_AREAS[key]||SHOPPING_AREA_DEFAULT;
}
function getTypeShoppingArea(type){
  const target=String(type||"").trim().toLowerCase();
  const fromItems=(Array.isArray(items)?items:[]).find(item=>String(item.type||"").trim().toLowerCase()===target && item.shoppingArea);
  if(fromItems)return normalizeShoppingArea(fromItems.shoppingArea,type);
  return normalizeShoppingArea("",type);
}
function getItemShoppingArea(item){
  return normalizeShoppingArea(item&&item.shoppingArea,item&&item.type);
}
function isMatvarerArea(area){
  return normalizeShoppingArea(area,"")===SHOPPING_AREA_DEFAULT;
}
function areaClass(area){
  return "area-"+String(area||"").toLowerCase().replace(/ø/g,"o").replace(/æ/g,"ae").replace(/å/g,"a").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
}
function shoppingAreaBadge(item){
  const area=getItemShoppingArea(item);
  if(isMatvarerArea(area))return "";

}
function compareShoppingTypes(a,b){
  const areaA=getTypeShoppingArea(a);
  const areaB=getTypeShoppingArea(b);
  const ai=SHOPPING_AREA_ORDER.indexOf(areaA);
  const bi=SHOPPING_AREA_ORDER.indexOf(areaB);
  const ia=ai<0?999:ai;
  const ib=bi<0?999:bi;
  if(ia!==ib)return ia-ib;
  const orderA=typeOrder.indexOf(a);
  const orderB=typeOrder.indexOf(b);
  const oa=orderA<0?9999:orderA;
  const ob=orderB<0?9999:orderB;
  if(oa!==ob)return oa-ob;
  return String(a||"").localeCompare(String(b||""),"no",{sensitivity:"base"});
}
function uniqueShoppingTypeValues(values){
  const seen=new Set();
  const result=[];
  (Array.isArray(values)?values:[]).forEach(value=>{
    const type=canonicalShoppingType(value);
    if(!type||isDeprecatedShoppingType(type))return;
    const key=type.toLowerCase().replace(/\s+/g," ");
    if(seen.has(key))return;
    seen.add(key);
    result.push(type);
  });
  return result;
}
function allTypes(){
  const foodValues=[];
  const otherValues=[];
  function addType(value){
    const type=canonicalShoppingType(value);
    if(!type)return;
    const area=normalizeShoppingArea("",type);
    if(area===SHOPPING_AREA_DEFAULT){
      foodValues.push(type);
    }else{
      otherValues.push(type);
    }
  }

  // Bruk listen fra API/Baserow som fasit. Ikke bland inn gamle varetyper fra eksisterende varer,
  // for da kan utgåtte verdier som "Meieri" komme tilbake i nedtrekkslisten.
  const serverTypes=Array.isArray(typeOptions)&&typeOptions.length
    ? typeOptions
    : (Array.isArray(typeOrder)&&typeOrder.length ? typeOrder : DEFAULT_TYPES);
  serverTypes.forEach(addType);

  // Fallback dersom API-et en dag mangler butikktypene.
  NON_FOOD_SHOPPING_TYPES.forEach(addType);

  const seen=new Set();
  function unique(list){
    return list.map(type=>String(type||"").trim()).filter(Boolean).filter(type=>{
      const key=type.toLowerCase();
      if(seen.has(key))return false;
      seen.add(key);
      return true;
    });
  }

  return unique(foodValues).sort(compareShoppingTypes)
    .concat(unique(otherValues).sort(compareShoppingTypes));
}

function getCombinedNewItemSuggestionSource(){
  const combined=[];
  const seen=new Set();

  (Array.isArray(shoppingItemSuggestions)?shoppingItemSuggestions:[]).forEach(item=>{
    const technical=getSuggestionTechnicalName(item);
    const key=String(item.id ? "suggestion-id-"+item.id : normalizeItemNameKey([item.name,technical].filter(Boolean).join(" | ")));
    if(!key||seen.has(key))return;
    seen.add(key);
    combined.push({...item,suggestionSource:"suggestion"});
  });

  (Array.isArray(items)?items:[]).forEach(item=>{
    const key=normalizeItemNameKey(item.name);
    if(!key||seen.has(key))return;
    seen.add(key);
    combined.push({...item,suggestionSource:"item"});
  });

  return combined;
}
function getAllFamilyItemSuggestions(query){
  const text=normalizeItemNameKey(query);
  if(!text||text.length<2)return [];
  const seen=new Set();
  return getCombinedNewItemSuggestionSource()
    .filter(item=>item&&getSuggestionTechnicalName(item))
    .filter(item=>{
      const technicalKey=normalizeItemNameKey(getSuggestionTechnicalName(item));
      return technicalKey.includes(text);
    })
    .sort((a,b)=>{
      const aText=normalizeItemNameKey(getSuggestionTechnicalName(a));
      const bText=normalizeItemNameKey(getSuggestionTechnicalName(b));
      const aStarts=aText.startsWith(text)?0:1;
      const bStarts=bText.startsWith(text)?0:1;
      if(aStarts!==bStarts)return aStarts-bStarts;
      return String(getSuggestionTechnicalName(a)||"").localeCompare(String(getSuggestionTechnicalName(b)||""),"no");
    })
    .filter(item=>{
      const key=String(item.suggestionSource||"item")+"-"+String(item.id||normalizeItemNameKey(getSuggestionTechnicalName(item)));
      if(seen.has(key))return false;
      seen.add(key);
      return true;
    })
    .slice(0,15);
}

<script>
(function(){
  const APP_PAGE_RE = /^handleliste-[a-z0-9-]+\.html$/i;
  const HOME_TARGET = 'index.html?restoreMenu=1';

  function currentPage(){
    return location.pathname.split('/').pop() || 'handleliste-bestille.html';
  }

  function isAppPage(page){
    return APP_PAGE_RE.test(String(page || ''));
  }

  function safeAppTarget(value){
    if(!value) return '';
    try{
      const url = new URL(value, location.href);
      if(url.origin !== location.origin) return '';
      const page = url.pathname.split('/').pop();
      if(!isAppPage(page)) return '';
      return page + url.search + url.hash;
    }catch(e){
      const clean = String(value).trim();
      const page = clean.split('?')[0].split('#')[0];
      return isAppPage(page) ? clean : '';
    }
  }

  function currentTargetForBack(){
    const url = new URL(location.href);
    const page = currentPage();
    const params = new URLSearchParams(url.search);
    const legacyFrom = params.get('from');
    const existingBack = params.get('back');

    params.delete('from');

    if(!existingBack && legacyFrom){
      const safeLegacy = safeAppTarget(legacyFrom);
      if(safeLegacy) params.set('back', safeLegacy);
    }

    const query = params.toString();
    return page + (query ? '?' + query : '') + url.hash;
  }

  function getBackTarget(){
    const params = new URLSearchParams(location.search);
    return safeAppTarget(params.get('back')) || safeAppTarget(params.get('from')) || HOME_TARGET;
  }

  function addBackToUrl(rawHref){
    if(!rawHref) return rawHref;
    if(/^#|^(mailto|sms|tel|javascript):/i.test(rawHref)) return rawHref;

    try{
      const url = new URL(rawHref, location.href);
      if(url.origin !== location.origin) return rawHref;
      const page = url.pathname.split('/').pop();
      const here = currentPage();

      if(isAppPage(page) && page !== here){
        url.searchParams.delete('from');
        if(!url.searchParams.has('back')){
          url.searchParams.set('back', currentTargetForBack());
        }
        return page + url.search + url.hash;
      }
    }catch(e){}

    return rawHref;
  }

  function appBack(event){
    event.preventDefault();
    location.href = getBackTarget();
  }

  function initAppNavigation(){
    document.querySelectorAll('a[href]').forEach(function(anchor){
      const href = anchor.getAttribute('href');
      const nextHref = addBackToUrl(href);
      if(nextHref !== href) anchor.setAttribute('href', nextHref);
    });

    document.querySelectorAll('.top-buttons .top-button').forEach(function(button){
      if((button.textContent || '').trim() === '←'){
        button.addEventListener('click', appBack);
      }
    });
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', initAppNavigation);
  }else{
    initAppNavigation();
  }
})();
</script>


<script>
/* Handleliste v51: lokal navigasjonsstack for tilbakeknapp innen Handleliste */
(function(){
  const STACK_KEY = "kvimarka92HandlelisteBackStack";
  const HOME_TARGET = "index.html?restoreMenu=1";
  const HANDLE_PAGE_RE = /^handleliste-[a-z0-9-]+\.html$/i;
  const MAX_STACK = 30;

  function pageFromUrl(value){
    try{
      const url = new URL(value, location.href);
      return url.pathname.split("/").pop() || "";
    }catch(error){
      return String(value || "").split("?")[0].split("#")[0].split("/").pop() || "";
    }
  }

  function isHandlelisteUrl(value){
    return HANDLE_PAGE_RE.test(pageFromUrl(value));
  }

  function relativeUrl(value){
    try{
      const url = new URL(value, location.href);
      if(url.origin !== location.origin) return "";
      const page = url.pathname.split("/").pop() || "";
      if(!HANDLE_PAGE_RE.test(page)) return "";
      return page + url.search + url.hash;
    }catch(error){
      const text = String(value || "").trim();
      return isHandlelisteUrl(text) ? text : "";
    }
  }

  function currentRelativeUrl(){
    const page = location.pathname.split("/").pop() || "";
    return page + location.search + location.hash;
  }

  function readStack(){
    try{
      const parsed = JSON.parse(sessionStorage.getItem(STACK_KEY) || "[]");
      return Array.isArray(parsed) ? parsed.filter(isHandlelisteUrl) : [];
    }catch(error){
      return [];
    }
  }

  function writeStack(stack){
    try{
      sessionStorage.setItem(STACK_KEY, JSON.stringify(stack.slice(-MAX_STACK)));
    }catch(error){}
  }

  function pushCurrentToHandlelisteStack(){
    const current = currentRelativeUrl();
    if(!isHandlelisteUrl(current)) return;
    const stack = readStack();
    if(stack[stack.length - 1] !== current){
      stack.push(current);
      writeStack(stack);
    }
  }

  function popPreviousFromHandlelisteStack(){
    const current = currentRelativeUrl();
    const stack = readStack();
    let target = "";
    while(stack.length){
      const candidate = stack.pop();
      if(candidate && candidate !== current){
        target = candidate;
        break;
      }
    }
    writeStack(stack);
    return target;
  }

  window.pushHandlelisteBackUrl = pushCurrentToHandlelisteStack;
  window.goHandlelisteBackOrHome = function(event){
    if(event){
      event.preventDefault();
      if(event.stopImmediatePropagation) event.stopImmediatePropagation();
      event.stopPropagation();
    }
    location.href = popPreviousFromHandlelisteStack() || HOME_TARGET;
    return false;
  };

  function shouldIgnoreClick(event, anchor){
    if(event.defaultPrevented) return true;
    if(event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return true;
    if(anchor.target && anchor.target !== "_self") return true;
    if(anchor.hasAttribute("download")) return true;
    const href = anchor.getAttribute("href") || "";
    if(!href || href === "#" || href.startsWith("#")) return true;
    if(/^(mailto|sms|tel|javascript):/i.test(href)) return true;
    return false;
  }

  document.addEventListener("click", function(event){
    const anchor = event.target && event.target.closest ? event.target.closest("a[href]") : null;
    if(!anchor) return;

    const isBackButton = anchor.hasAttribute("data-handleliste-back") ||
      (anchor.classList && anchor.classList.contains("top-button") && (anchor.textContent || "").trim() === "←");

    if(isBackButton){
      window.goHandlelisteBackOrHome(event);
      return;
    }

    const href = anchor.getAttribute("href") || "";

    if(/^(index\.html|\/index\.html)/i.test(href)){
      try{ sessionStorage.removeItem(STACK_KEY); }catch(error){}
      return;
    }

    if(shouldIgnoreClick(event, anchor)) return;

    if(isHandlelisteUrl(href)){
      const target = relativeUrl(href);
      if(target && target !== currentRelativeUrl()){
        pushCurrentToHandlelisteStack();
      }
    }
  }, true);
})();
</script>
