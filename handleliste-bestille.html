const DEFAULT_TYPES=["Frukt og grønt","Meieri","Kjøtt og fisk","Brød","Tørrvarer","Frysevarer","Drikke","Husholdning","Personlig","Annet"];
function esc(value){return String(value??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");}
async function fetchJson(url,options){const res=await fetch(url,{credentials:"include",...(options||{})});const data=await res.json().catch(()=>null);if(!res.ok||(data&&data.error)){throw new Error(data?.error||data?.detail||`HTTP ${res.status}`);}return data;}
function setStatus(message,type){const el=document.getElementById("status");el.className="status"+(type?` ${type}`:"");el.innerHTML=message||"";}
function normalizeOwner(value){const text=String(value||"Felles").trim()||"Felles";return SHOPPING_OWNERS.some(owner=>owner.toLowerCase()===text.toLowerCase())?SHOPPING_OWNERS.find(owner=>owner.toLowerCase()===text.toLowerCase()):text;}
function getInitialOwner(){const saved=normalizeOwner(localStorage.getItem(OWNER_STORAGE_KEY)||"Felles");return SHOPPING_OWNERS.includes(saved)?saved:"Felles";}function setShoppingOwners(options){const incoming=Array.isArray(options)?options.map(value=>String(value||"").trim()).filter(Boolean):[];const seen=new Set();const clean=[];incoming.forEach(owner=>{const key=owner.toLowerCase();if(!seen.has(key)){seen.add(key);clean.push(owner);}});if(!clean.some(owner=>owner.toLowerCase()==="felles")){clean.unshift("Felles");}if(clean.length){SHOPPING_OWNERS=clean;}selectedOwner=normalizeOwner(selectedOwner);if(!SHOPPING_OWNERS.includes(selectedOwner)){selectedOwner=SHOPPING_OWNERS[0]||"Felles";}localStorage.setItem(OWNER_STORAGE_KEY,selectedOwner);}
function ownerBadge(item){const owner=normalizeOwner(item.owner);return owner&&owner!=="Felles"?`<span class="badge">${esc(owner)}</span>`:"";}
function normalizePermissionText(value){return String(value||"").trim().toLowerCase();}
function isSupervisorOrAdministrator(){const role=normalizePermissionText(currentUser?.role);return role==="administrator"||role==="supervisor";}
function applyStandardPermissionToModal(){const input=document.getElementById("newItemStandard");if(!input)return;const allowed=isSupervisorOrAdministrator();input.disabled=!allowed;if(!allowed)input.checked=false;const row=input.closest(".checkbox-row");if(row){row.style.opacity=allowed?"1":".45";row.title=allowed?"":"Bare supervisor og administrator kan sette standardvare";}}

let items=[];let currentUser=null;let typeOrder=[...DEFAULT_TYPES];let selectedOwner=getInitialOwner();
function allTypes(){const seen=new Set();return [...typeOrder,...DEFAULT_TYPES,...items.map(item=>item.type||"Annet")].filter(type=>{const key=String(type||"Annet").toLowerCase();if(seen.has(key))return false;seen.add(key);return true;});}
function normalizeItemNameKey(value){return String(value||"").trim().replace(/\s+/g," ").toLowerCase();}
function getAllFamilyItemSuggestions(query){
  const text=normalizeItemNameKey(query);
  if(!text||text.length<2)return [];
  const seen=new Set();
  return items
    .filter(item=>item&&item.name)
    .filter(item=>{
      const nameKey=normalizeItemNameKey(item.name);
      return nameKey.includes(text)||text.includes(nameKey);
    })
    .sort((a,b)=>{
      const aq=normalizeItemNameKey(a.name);
      const bq=normalizeItemNameKey(b.name);
      const aStarts=aq.startsWith(text)?0:1;
      const bStarts=bq.startsWith(text)?0:1;
      if(aStarts!==bStarts)return aStarts-bStarts;
      return String(a.name||"").localeCompare(String(b.name||""),"no");
    })
    .filter(item=>{
      const key=normalizeItemNameKey(item.name);
      if(seen.has(key))return false;
      seen.add(key);
      return true;
    })
    .slice(0,10);
}
function getExactExistingItemByName(name){
  const key=normalizeItemNameKey(name);
  if(!key)return null;
  return items.find(item=>normalizeItemNameKey(item.name)===key)||null;
}
function selectExistingItemSuggestion(itemId){
  const item=items.find(row=>String(row.id)===String(itemId));
  if(!item)return;
  document.getElementById("newItemName").value=item.name||"";
  if(item.owner){document.getElementById("newItemOwner").value=normalizeOwner(item.owner);}
  if(item.type){document.getElementById("newItemType").value=item.type;}
  document.getElementById("newItemStandard").checked=!!item.standardItem;
  document.getElementById("newItemShouldBuy").checked=true;
  hideNewItemSuggestions();
  updateNewItemDuplicateWarning();
}
function hideNewItemSuggestions(){
  const box=document.getElementById("newItemSuggestions");
  if(box){box.className="item-suggestions";box.innerHTML="";}
}
function renderNewItemSuggestions(){
  const input=document.getElementById("newItemName");
  const box=document.getElementById("newItemSuggestions");
  if(!input||!box)return;
  const suggestions=getAllFamilyItemSuggestions(input.value);
  if(!suggestions.length){hideNewItemSuggestions();updateNewItemDuplicateWarning();return;}
  box.innerHTML=suggestions.map(item=>`<button class="item-suggestion-button" type="button" onclick="selectExistingItemSuggestion('${esc(item.id)}')"><div class="item-suggestion-name">${esc(item.name)}</div><div class="item-suggestion-meta">${esc(normalizeOwner(item.owner))} · ${esc(item.type||"Annet")}${item.standardItem?" · Standard":""}${item.shouldBuy?" · Skal handles":""}</div></button>`).join("");
  box.className="item-suggestions visible";
  updateNewItemDuplicateWarning();
}
function updateNewItemDuplicateWarning(){
  const warning=document.getElementById("newItemDuplicateWarning");
  const input=document.getElementById("newItemName");
  if(!warning||!input)return;
  const existing=getExactExistingItemByName(input.value);
  if(existing){
    warning.innerHTML=`Varen finnes allerede: <strong>${esc(existing.name)}</strong> (${esc(normalizeOwner(existing.owner))} · ${esc(existing.type||"Annet")}). Velg forslaget i stedet for å lage duplikat.`;
    warning.className="item-duplicate-warning visible";
  }else{
    warning.innerHTML="";
    warning.className="item-duplicate-warning";
  }
}

function populateTypes(){const select=document.getElementById("newItemType");select.innerHTML=allTypes().map(type=>`<option value="${esc(type)}">${esc(type)}</option>`).join("");select.value="Annet";}
function populateOwners(){const select=document.getElementById("newItemOwner");select.innerHTML=SHOPPING_OWNERS.map(owner=>`<option value="${esc(owner)}">${esc(owner)}</option>`).join("");select.value=selectedOwner;}
function renderOwnerButtons(){document.getElementById("ownerButtons").innerHTML=SHOPPING_OWNERS.map(owner=>`<button class="owner-button ${owner===selectedOwner?"active":""}" type="button" onclick="setOwnerFilter('${esc(owner)}')">${esc(owner)}</button>`).join("");}
function updateOwnerStatus(){
  setStatus(`Klar. Viser varelisten for <strong>${esc(selectedOwner)}</strong>. Kryss av varene som skal handles.`, "success");
}
function setOwnerFilter(owner){
  selectedOwner=normalizeOwner(owner);
  localStorage.setItem(OWNER_STORAGE_KEY,selectedOwner);
  render();
  updateOwnerStatus();
}
function filteredItems(){return items.filter(item=>normalizeOwner(item.owner)===selectedOwner);}
function orderedGroups(list){const map={};list.forEach(item=>{const key=item.type||"Annet";(map[key]=map[key]||[]).push(item);});const seen=new Set();return [...typeOrder,...DEFAULT_TYPES,...Object.keys(map)].filter(type=>{const key=String(type).toLowerCase();if(seen.has(key)||!map[type])return false;seen.add(key);return true;}).map(type=>({type,items:map[type]}));}
function render(){renderOwnerButtons();const visible=filteredItems();const list=document.getElementById("itemList");document.getElementById("totalValue").textContent=String(visible.length);document.getElementById("orderValue").textContent=String(visible.filter(item=>item.shouldBuy).length);document.getElementById("standardValue").textContent=String(visible.filter(item=>item.standardItem).length);if(!visible.length){list.innerHTML=`<div class="empty">Ingen varer er lagt inn for ${esc(selectedOwner)} ennå.</div>`;return;}list.innerHTML=orderedGroups(visible).map(group=>`<div class="group"><h2 class="group-title">${esc(group.type)}</h2><div class="item-list">${group.items.map(item=>`<div class="item-row"><input class="item-check" type="checkbox" ${item.shouldBuy?"checked":""} onchange="toggleShouldBuy(${item.id}, this.checked)" title="Skal handles"><div><div class="item-name">${esc(item.name)}</div></div><div class="badge-stack">${item.standardItem?'<span class="badge">Standard</span>':""}</div></div>`).join("")}</div></div>`).join("");}
async function loadItems(){setStatus("Laster varer...");try{const data=await fetchJson(`${API_BASE}/shopping/items`);currentUser=data.currentUser||null;items=Array.isArray(data.items)?data.items:[];typeOrder=Array.isArray(data.typeOrder)&&data.typeOrder.length?data.typeOrder:[...DEFAULT_TYPES];setShoppingOwners(data.ownerOptions);render();updateOwnerStatus();}catch(error){setStatus(`Kunne ikke laste handlelisten.<br><br>${esc(error.message)}`,"error");}}
async function toggleShouldBuy(id,checked){try{await fetchJson(`${API_BASE}/shopping/item-update`,{method:"POST",headers:{"Content-Type":"text/plain;charset=UTF-8"},body:JSON.stringify({id,shouldBuy:checked})});const item=items.find(item=>Number(item.id)===Number(id));if(item)item.shouldBuy=checked;render();setStatus(checked?"Varen er lagt til i Handle-listen.":"Varen er fjernet fra Handle-listen.","success");}catch(error){setStatus(`Kunne ikke oppdatere varen.<br><br>${esc(error.message)}`,"error");await loadItems();}}
function openNewItemModal(){document.getElementById("newItemForm").reset();hideNewItemSuggestions();populateOwners();populateTypes();document.getElementById("newItemShouldBuy").checked=true;applyStandardPermissionToModal();document.getElementById("newItemModal").classList.add("open");setTimeout(()=>document.getElementById("newItemName").focus(),80);}function closeNewItemModal(){document.getElementById("newItemModal").classList.remove("open");hideNewItemSuggestions();}function handleModalBackdrop(event){if(event.target.id==="newItemModal")closeNewItemModal();}
function buildShoppingListText(){const ordered=items.filter(item=>item.shouldBuy);const lines=["Handleliste",""];orderedGroups(ordered).forEach(group=>{lines.push(group.type);group.items.forEach(item=>lines.push(`- ${normalizeOwner(item.owner)!=="Felles"?`(${normalizeOwner(item.owner)}) `:""}${item.name}`));lines.push("");});return lines.join("\n");}
function sendShoppingListEmail(){const ordered=items.filter(item=>item.shouldBuy);if(!ordered.length){alert("Ingen varer er krysset av for handling.");return;}window.location.href=`mailto:?subject=${encodeURIComponent("Handleliste")}&body=${encodeURIComponent(buildShoppingListText())}`;}
function sendShoppingListSms(){const ordered=items.filter(item=>item.shouldBuy);if(!ordered.length){alert("Ingen varer er krysset av for handling.");return;}window.location.href=`sms:?&body=${encodeURIComponent(buildShoppingListText())}`;}
document.getElementById("newItemName").addEventListener("input",renderNewItemSuggestions);
document.getElementById("newItemName").addEventListener("blur",()=>setTimeout(hideNewItemSuggestions,180));
document.getElementById("newItemName").addEventListener("focus",renderNewItemSuggestions);
document.getElementById("newItemForm").addEventListener("submit",async event=>{event.preventDefault();const button=document.getElementById("saveNewItemButton");const typedName=document.getElementById("newItemName").value.trim();const existing=getExactExistingItemByName(typedName);if(existing&&!confirm(`Varen "${existing.name}" finnes allerede. Vil du likevel opprette en ny vare med samme navn?`)){selectExistingItemSuggestion(existing.id);return;}button.disabled=true;try{const body={name:typedName,owner:document.getElementById("newItemOwner").value,type:document.getElementById("newItemType").value,standardItem:document.getElementById("newItemStandard").checked,shouldBuy:document.getElementById("newItemShouldBuy").checked};await fetchJson(`${API_BASE}/shopping/item-create`,{method:"POST",headers:{"Content-Type":"text/plain;charset=UTF-8"},body:JSON.stringify(body)});closeNewItemModal();await loadItems();setStatus("Varen er lagt til.","success");}catch(error){setStatus(`Kunne ikke lagre varen.<br><br>${esc(error.message)}`,"error");}finally{button.disabled=false;}});
loadItems();
</script>
<script>
(function(){
  const APP_PAGE_RE = /^handleliste-[a-z0-9-]+\.html$/i;
  const HOME_TARGET = 'index.html?restoreMenu=1';

  function currentPage(){
    return location.pathname.split('/').pop() || 'handleliste-bestille.html';
  }

  function isAppPage(page){
    return APP_PAGE_RE.test(String(page || ''));
  }

  function safeAppTarget(value){
    if(!value) return '';
    try{
      const url = new URL(value, location.href);
      if(url.origin !== location.origin) return '';
      const page = url.pathname.split('/').pop();
      if(!isAppPage(page)) return '';
      return page + url.search + url.hash;
    }catch(e){
      const clean = String(value).trim();
      const page = clean.split('?')[0].split('#')[0];
      return isAppPage(page) ? clean : '';
    }
  }

  function currentTargetForBack(){
    const url = new URL(location.href);
    const page = currentPage();
    const params = new URLSearchParams(url.search);
    const legacyFrom = params.get('from');
    const existingBack = params.get('back');

    params.delete('from');

    if(!existingBack && legacyFrom){
      const safeLegacy = safeAppTarget(legacyFrom);
      if(safeLegacy) params.set('back', safeLegacy);
    }

    const query = params.toString();
    return page + (query ? '?' + query : '') + url.hash;
  }

  function getBackTarget(){
    const params = new URLSearchParams(location.search);
    return safeAppTarget(params.get('back')) || safeAppTarget(params.get('from')) || HOME_TARGET;
  }

  function addBackToUrl(rawHref){
    if(!rawHref) return rawHref;
    if(/^#|^(mailto|sms|tel|javascript):/i.test(rawHref)) return rawHref;

    try{
      const url = new URL(rawHref, location.href);
      if(url.origin !== location.origin) return rawHref;
      const page = url.pathname.split('/').pop();
      const here = currentPage();

      if(isAppPage(page) && page !== here){
        url.searchParams.delete('from');
        if(!url.searchParams.has('back')){
          url.searchParams.set('back', currentTargetForBack());
        }
        return page + url.search + url.hash;
      }
    }catch(e){}

    return rawHref;
  }

  function appBack(event){
    event.preventDefault();
    location.href = getBackTarget();
  }

  function initAppNavigation(){
    document.querySelectorAll('a[href]').forEach(function(anchor){
      const href = anchor.getAttribute('href');
      const nextHref = addBackToUrl(href);
      if(nextHref !== href) anchor.setAttribute('href', nextHref);
    });

    document.querySelectorAll('.top-buttons .top-button').forEach(function(button){
      if((button.textContent || '').trim() === '←'){
        button.addEventListener('click', appBack);
      }
    });
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', initAppNavigation);
  }else{
    initAppNavigation();
  }
})();
</script>


<script>
/* Handleliste v51: lokal navigasjonsstack for tilbakeknapp innen Handleliste */
(function(){
  const STACK_KEY = "kvimarka92HandlelisteBackStack";
  const HOME_TARGET = "index.html?restoreMenu=1";
  const HANDLE_PAGE_RE = /^handleliste-[a-z0-9-]+\.html$/i;
  const MAX_STACK = 30;

  function pageFromUrl(value){
    try{
      const url = new URL(value, location.href);
      return url.pathname.split("/").pop() || "";
    }catch(error){
      return String(value || "").split("?")[0].split("#")[0].split("/").pop() || "";
    }
  }

  function isHandlelisteUrl(value){
    return HANDLE_PAGE_RE.test(pageFromUrl(value));
  }

  function relativeUrl(value){
    try{
      const url = new URL(value, location.href);
      if(url.origin !== location.origin) return "";
      const page = url.pathname.split("/").pop() || "";
      if(!HANDLE_PAGE_RE.test(page)) return "";
      return page + url.search + url.hash;
    }catch(error){
      const text = String(value || "").trim();
      return isHandlelisteUrl(text) ? text : "";
    }
  }

  function currentRelativeUrl(){
    const page = location.pathname.split("/").pop() || "";
    return page + location.search + location.hash;
  }

  function readStack(){
    try{
      const parsed = JSON.parse(sessionStorage.getItem(STACK_KEY) || "[]");
      return Array.isArray(parsed) ? parsed.filter(isHandlelisteUrl) : [];
    }catch(error){
      return [];
    }
  }

  function writeStack(stack){
    try{
      sessionStorage.setItem(STACK_KEY, JSON.stringify(stack.slice(-MAX_STACK)));
    }catch(error){}
  }

  function pushCurrentToHandlelisteStack(){
    const current = currentRelativeUrl();
    if(!isHandlelisteUrl(current)) return;
    const stack = readStack();
    if(stack[stack.length - 1] !== current){
      stack.push(current);
      writeStack(stack);
    }
  }

  function popPreviousFromHandlelisteStack(){
    const current = currentRelativeUrl();
    const stack = readStack();
    let target = "";
    while(stack.length){
      const candidate = stack.pop();
      if(candidate && candidate !== current){
        target = candidate;
        break;
      }
    }
    writeStack(stack);
    return target;
  }

  window.pushHandlelisteBackUrl = pushCurrentToHandlelisteStack;
  window.goHandlelisteBackOrHome = function(event){
    if(event){
      event.preventDefault();
      if(event.stopImmediatePropagation) event.stopImmediatePropagation();
      event.stopPropagation();
    }
    location.href = popPreviousFromHandlelisteStack() || HOME_TARGET;
    return false;
  };

  function shouldIgnoreClick(event, anchor){
    if(event.defaultPrevented) return true;
    if(event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return true;
    if(anchor.target && anchor.target !== "_self") return true;
    if(anchor.hasAttribute("download")) return true;
    const href = anchor.getAttribute("href") || "";
    if(!href || href === "#" || href.startsWith("#")) return true;
    if(/^(mailto|sms|tel|javascript):/i.test(href)) return true;
    return false;
  }

  document.addEventListener("click", function(event){
    const anchor = event.target && event.target.closest ? event.target.closest("a[href]") : null;
    if(!anchor) return;

    const isBackButton = anchor.hasAttribute("data-handleliste-back") ||
      (anchor.classList && anchor.classList.contains("top-button") && (anchor.textContent || "").trim() === "←");

    if(isBackButton){
      window.goHandlelisteBackOrHome(event);
      return;
    }

    const href = anchor.getAttribute("href") || "";

    if(/^(index\.html|\/index\.html)/i.test(href)){
      try{ sessionStorage.removeItem(STACK_KEY); }catch(error){}
      return;
    }

    if(shouldIgnoreClick(event, anchor)) return;

    if(isHandlelisteUrl(href)){
      const target = relativeUrl(href);
      if(target && target !== currentRelativeUrl()){
        pushCurrentToHandlelisteStack();
      }
    }
  }, true);
})();
</script>
