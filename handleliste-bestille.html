<style>

*{box-sizing:border-box;}body{margin:0;padding:20px;background:var(--bg);color:var(--text);font-family:Arial,sans-serif;}.container{max-width:980px;margin:auto;}.header{text-align:center;margin-bottom:20px;}.site-title{margin:0;font-size:30px;}.subtitle{margin-top:8px;color:var(--muted);font-size:16px;}.top-buttons{display:flex;justify-content:center;align-items:center;gap:10px;margin:14px 0 0;}.top-button{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;padding:0;background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--text);text-decoration:none;font-size:24px;font-weight:bold;line-height:1;cursor:pointer;}.top-button:hover,.action-button:hover{background:var(--button-hover);}.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px;margin-bottom:10px;}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;}.summary-item{border:1px solid var(--border);border-radius:9px;padding:8px 10px;background:rgba(127,127,127,.05);}.summary-label{color:var(--muted);font-size:12px;margin-bottom:2px;}.summary-value{font-size:17px;font-weight:bold;}.toolbar{display:flex;gap:7px;justify-content:space-between;align-items:center;flex-wrap:wrap;}.toolbar-left,.toolbar-right{display:flex;gap:7px;flex-wrap:wrap;}.action-button{display:inline-flex;align-items:center;justify-content:center;min-height:34px;padding:0 10px;background:var(--button);border:1px solid var(--border);border-radius:8px;color:var(--text);font-weight:bold;text-decoration:none;cursor:pointer;font-size:14px;}.primary{background:var(--link);border-color:var(--link);color:#fff;}.status{color:var(--muted);line-height:1.35;font-size:14px;}.status.error{color:var(--danger);}.status.success{color:var(--success);}.group{margin-bottom:6px;}.group-title{font-size:14px;font-weight:bold;margin:0 0 2px;color:var(--muted);line-height:1.05;}.item-list{display:flex;flex-direction:column;gap:1px;}.item-row{display:grid;grid-template-columns:22px 1fr auto;gap:5px;align-items:center;border:1px solid var(--border);border-radius:6px;padding:2px 6px;background:rgba(127,127,127,.04);min-height:24px;}.item-check{width:16px;height:16px;accent-color:var(--link);}.item-name{font-weight:bold;font-size:13px;line-height:1;}.item-meta{color:var(--muted);font-size:10px;margin-top:0;line-height:1.1;}.badge{display:inline-flex;align-items:center;min-height:16px;padding:0 5px;border-radius:999px;background:rgba(124,199,232,.16);color:var(--link);font-size:9px;font-weight:bold;white-space:nowrap;}.empty{padding:18px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:10px;}.modal{display:none;position:fixed;inset:0;z-index:999;background:rgba(0,0,0,.82);padding:18px;overflow:auto;}.modal.open{display:block;}.modal-content{max-width:560px;margin:50px auto;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;}.modal-header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;}.modal-title{font-size:22px;font-weight:bold;}.modal-close{width:42px;height:42px;border:1px solid var(--border);border-radius:8px;background:var(--button);color:var(--text);font-size:24px;font-weight:bold;cursor:pointer;}.form-field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;}label{font-weight:bold;font-size:14px;}input,select{width:100%;min-height:40px;padding:0 12px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);font-size:15px;}.checkbox-row{display:flex;align-items:center;gap:10px;}.checkbox-row input{width:22px;height:22px;min-height:auto;}@media(max-width:700px){body{padding:6px;}.header{margin-bottom:12px;}.site-title{font-size:28px;}.card{padding:7px;margin-bottom:7px;border-radius:10px;}.summary{grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;}.summary-item{padding:6px;}.summary-label{font-size:10px;}.summary-value{font-size:15px;}.toolbar,.toolbar-left,.toolbar-right{align-items:stretch;width:100%;}.action-button{flex:1 1 auto;min-height:31px;padding:0 7px;font-size:12px;}.group{margin-bottom:6px;}.group-title{font-size:13px;margin-bottom:2px;}.item-list{gap:2px;}.item-row{grid-template-columns:22px 1fr auto;padding:2px 5px;min-height:27px;gap:4px;border-radius:6px;}.item-check{width:17px;height:17px;}.item-name{font-size:13px;}.item-meta{font-size:9px;}.badge{min-height:15px;font-size:9px;padding:0 5px;}.modal-content{margin:30px auto;padding:14px;}}

<body class="dark-mode"><div class="container"><div class="header"><h1 class="site-title">Handleliste</h1><div class="subtitle">Bestille</div><div class="top-buttons"><a class="top-button" href="index.html?restoreMenu=1" title="Tilbake til meny">←</a><a class="top-button" href="index.html" title="Hovedside">⌂</a></div></div>
<div class="card"><div class="summary"><div class="summary-item"><div class="summary-label">Alle varer</div><div class="summary-value" id="totalValue">-</div></div><div class="summary-item"><div class="summary-label">Skal handles</div><div class="summary-value" id="orderValue">-</div></div><div class="summary-item"><div class="summary-label">Standard</div><div class="summary-value" id="standardValue">-</div></div></div></div>
<div class="card"><div class="toolbar"><div class="toolbar-left"><button class="action-button primary" type="button" onclick="openNewItemModal()">+ Legg til ny vare</button><a class="action-button" href="handleliste-handle.html">Handle</a><a class="action-button" href="handleliste-rediger.html">✎ Rediger</a><a class="action-button" href="handleliste-varetyper.html">↕ Varetyper</a></div><div class="toolbar-right"><button class="action-button" type="button" onclick="sendShoppingListEmail()" title="Send handleliste på e-post">⌖ E-post</button></div></div></div>
<div class="card"><div id="status" class="status">Laster...</div></div><div class="card"><div id="itemList" class="item-list"></div></div></div>
<div class="modal" id="newItemModal" onclick="handleModalBackdrop(event)"><div class="modal-content" onclick="event.stopPropagation();"><div class="modal-header"><div class="modal-title">Legg til ny vare</div><button class="modal-close" type="button" onclick="closeNewItemModal()">×</button></div><form id="newItemForm"><div class="form-field"><label for="newItemName">Varenavn</label><input id="newItemName" type="text" autocomplete="off" required></div><div class="form-field"><label for="newItemType">Varetype</label><select id="newItemType"></select></div><div class="form-field checkbox-row"><input id="newItemStandard" type="checkbox"><label for="newItemStandard">Standard vare</label></div><div class="form-field checkbox-row"><input id="newItemShouldBuy" type="checkbox" checked><label for="newItemShouldBuy">Skal handles nå</label></div><div class="toolbar"><button class="action-button" type="button" onclick="closeNewItemModal()">Avbryt</button><button class="action-button primary" type="submit" id="saveNewItemButton">Lagre vare</button></div></form></div></div>
<script>
const API_BASE="https://api-kvimarka92.carstereogarage.com";
const DEFAULT_TYPES=["Frukt og grønt","Meieri","Kjøtt og fisk","Brød","Tørrvarer","Frysevarer","Drikke","Husholdning","Personlig","Annet"];
let items=[];let typeOrder=[...DEFAULT_TYPES];
function esc(value){return String(value??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");}
async function fetchJson(url,options){const res=await fetch(url,{credentials:"include",...(options||{})});const data=await res.json().catch(()=>null);if(!res.ok||(data&&data.error)){throw new Error(data?.error||data?.detail||`HTTP ${res.status}`);}return data;}
function setStatus(message,type){const el=document.getElementById("status");el.className="status"+(type?` ${type}`:"");el.innerHTML=message||"";}
function allTypes(){const seen=new Set();return [...typeOrder,...DEFAULT_TYPES,...items.map(item=>item.type||"Annet")].filter(type=>{const key=String(type||"Annet").toLowerCase();if(seen.has(key)){return false;}seen.add(key);return true;});}
function populateTypes(){const select=document.getElementById("newItemType");select.innerHTML=allTypes().map(type=>`<option value="${esc(type)}">${esc(type)}</option>`).join("");select.value="Annet";}
function orderedGroups(list){const map={};list.forEach(item=>{const key=item.type||"Annet";(map[key]=map[key]||[]).push(item);});return allTypes().filter(type=>map[type]).map(type=>({type,items:map[type]}));}
function render(){const list=document.getElementById("itemList");const orderCount=items.filter(item=>item.shouldBuy).length;const standardCount=items.filter(item=>item.standardItem).length;document.getElementById("totalValue").textContent=String(items.length);document.getElementById("orderValue").textContent=String(orderCount);document.getElementById("standardValue").textContent=String(standardCount);if(!items.length){list.innerHTML='<div class="empty">Ingen varer er lagt inn ennå.</div>';return;}list.innerHTML=orderedGroups(items).map(group=>`<div class="group"><h2 class="group-title">${esc(group.type)}</h2><div class="item-list">${group.items.map(item=>`<div class="item-row"><input class="item-check" type="checkbox" ${item.shouldBuy?"checked":""} onchange="toggleShouldBuy(${item.id}, this.checked)" title="Skal handles"><div><div class="item-name">${esc(item.name)}</div></div>${item.standardItem?'<span class="badge">Standard</span>':""}</div>`).join("")}</div></div>`).join("");}
async function loadItems(){setStatus("Laster varer...");try{const data=await fetchJson(`${API_BASE}/shopping/items`);items=Array.isArray(data.items)?data.items:[];typeOrder=Array.isArray(data.typeOrder)&&data.typeOrder.length?data.typeOrder:[...DEFAULT_TYPES];render();setStatus("Klar. Kryss av varene som skal handles.","success");}catch(error){setStatus(`Kunne ikke laste handlelisten.<br><br>${esc(error.message)}`,"error");}}
async function toggleShouldBuy(id,checked){try{await fetchJson(`${API_BASE}/shopping/item-update`,{method:"POST",headers:{"Content-Type":"text/plain;charset=UTF-8"},body:JSON.stringify({id,shouldBuy:checked})});const item=items.find(item=>Number(item.id)===Number(id));if(item){item.shouldBuy=checked;}render();setStatus(checked?"Varen er lagt til i Handle-listen.":"Varen er fjernet fra Handle-listen.","success");}catch(error){setStatus(`Kunne ikke oppdatere varen.<br><br>${esc(error.message)}`,"error");await loadItems();}}
function openNewItemModal(){document.getElementById("newItemForm").reset();populateTypes();document.getElementById("newItemShouldBuy").checked=true;document.getElementById("newItemModal").classList.add("open");setTimeout(()=>document.getElementById("newItemName").focus(),80);}function closeNewItemModal(){document.getElementById("newItemModal").classList.remove("open");}function handleModalBackdrop(event){if(event.target.id==="newItemModal"){closeNewItemModal();}}
function sendShoppingListEmail(){const ordered=items.filter(item=>item.shouldBuy);if(!ordered.length){alert("Ingen varer er krysset av for handling.");return;}const lines=["Handleliste",""];orderedGroups(ordered).forEach(group=>{lines.push(group.type);group.items.forEach(item=>lines.push(`- ${item.name}`));lines.push("");});window.location.href=`mailto:?subject=${encodeURIComponent("Handleliste")}&body=${encodeURIComponent(lines.join("\n"))}`;}
document.getElementById("newItemForm").addEventListener("submit",async event=>{event.preventDefault();const button=document.getElementById("saveNewItemButton");button.disabled=true;try{const body={name:document.getElementById("newItemName").value.trim(),type:document.getElementById("newItemType").value,standardItem:document.getElementById("newItemStandard").checked,shouldBuy:document.getElementById("newItemShouldBuy").checked};await fetchJson(`${API_BASE}/shopping/item-create`,{method:"POST",headers:{"Content-Type":"text/plain;charset=UTF-8"},body:JSON.stringify(body)});closeNewItemModal();await loadItems();setStatus("Varen er lagt til.","success");}catch(error){setStatus(`Kunne ikke lagre varen.<br><br>${esc(error.message)}`,"error");}finally{button.disabled=false;}});
loadItems();
</script></body></html>
