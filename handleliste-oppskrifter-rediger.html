<div class="card"><div id="status" class="status">Laster...</div></div><div class="card"><div id="recipeRoot"></div></div></div><script>
const API_BASE="https://api-kvimarka92.carstereogarage.com";
const DEFAULT_TYPES=["Frukt og grønt","Meieri","Kjøtt og fisk","Brød","Tørrvarer","Frysevarer","Drikke","Husholdning","Personlig","Annet"];
function esc(value){return String(value==null?"":value).split("&").join("&amp;").split("<").join("&lt;").split(">").join("&gt;").split('"').join("&quot;").split("'").join("&#039;");}
async function fetchJson(url,options){const res=await fetch(url,{credentials:"include",...(options||{})});const data=await res.json().catch(()=>null);if(!res.ok||(data&&data.error)){throw new Error((data&&data.detail)||(data&&data.error)||`HTTP ${res.status}`);}return data;}
function setStatus(message,type){const el=document.getElementById("status");el.className="status"+(type?` ${type}`:"");el.innerHTML=message||"";}
let recipes=[];let recipeItems=[];let typeOptions=[...DEFAULT_TYPES];
function itemsForRecipe(recipeId){return recipeItems.filter(item=>Number(item.recipeId)===Number(recipeId)).sort((a,b)=>Number(a.sortOrder||0)-Number(b.sortOrder||0));}
function typeSelectHtml(item){return `<select onchange="updateRecipeItem(${item.id},{type:this.value})">${typeOptions.map(type=>`<option value="${esc(type)}" ${type===item.type?"selected":""}>${esc(type)}</option>`).join("")}</select>`;}
function render(){const root=document.getElementById("recipeRoot");if(!recipes.length){root.innerHTML='<div class="empty">Ingen oppskrifter er lagt inn ennå.</div>';return;}root.innerHTML=recipes.map(recipe=>`<div class="recipe-card"><div class="recipe-header"><div><div class="recipe-title" onclick="renameRecipe(${recipe.id})" title="Klikk for å endre navn">${esc(recipe.name)}</div>${recipe.description?`<div class="recipe-description">${esc(recipe.description)}</div>`:""}</div><div class="recipe-actions"><button class="small-button" onclick="editRecipeDescription(${recipe.id})">Beskrivelse</button><button class="small-button primary" onclick="createRecipeItem(${recipe.id})">Vare</button><button class="small-button danger" onclick="deleteRecipe(${recipe.id})">🗑</button></div></div><div class="ingredient-list">${itemsForRecipe(recipe.id).map((item,index,arr)=>`<div class="ingredient-row"><div><div class="ingredient-name" onclick="renameRecipeItem(${item.id})" title="Klikk for å endre varenavn">${esc(item.itemName)}</div>${item.note?`<div class="ingredient-note">${esc(item.note)}</div>`:""}</div>${typeSelectHtml(item)}<input value="${esc(item.quantity)}" placeholder="Mengde" onchange="updateRecipeItem(${item.id},{quantity:this.value})"><input value="${esc(item.note)}" placeholder="Notat" onchange="updateRecipeItem(${item.id},{note:this.value})"><div class="recipe-actions"><button class="small-button" ${index===0?"disabled":""} onclick="moveRecipeItem(${item.id},-1)">↑</button><button class="small-button" ${index===arr.length-1?"disabled":""} onclick="moveRecipeItem(${item.id},1)">↓</button><button class="small-button danger" onclick="deleteRecipeItem(${item.id})">🗑</button></div></div>`).join("")}</div></div>`).join("");}
async function loadRecipes(){setStatus("Laster oppskrifter...");try{const data=await fetchJson(`${API_BASE}/shopping/recipes`);recipes=Array.isArray(data.recipes)?data.recipes:[];recipeItems=Array.isArray(data.recipeItems)?data.recipeItems:[];typeOptions=Array.isArray(data.typeOptions)&&data.typeOptions.length?data.typeOptions:DEFAULT_TYPES;render();setStatus("Klar. Klikk på oppskriftsnavn eller varenavn for å endre.","success");}catch(error){setStatus(`Kunne ikke laste oppskrifter.<br><br>${esc(error.message)}`,"error");}}
async function createRecipe(){const name=prompt("Navn på ny oppskrift:");if(!name)return;try{await fetchJson(`${API_BASE}/shopping/recipe-create`,{method:"POST",headers:{"Content-Type":"text/plain;charset=UTF-8"},body:JSON.stringify({name})});await loadRecipes();setStatus("Oppskriften er opprettet.","success");}catch(error){setStatus(`Kunne ikke opprette oppskrift.<br><br>${esc(error.message)}`,"error");}}
async function renameRecipe(id){const recipe=recipes.find(item=>Number(item.id)===Number(id));if(!recipe)return;const name=prompt("Nytt oppskriftsnavn:",recipe.name);if(!name||name===recipe.name)return;await updateRecipe(id,{name});}
async function editRecipeDescription(id){const recipe=recipes.find(item=>Number(item.id)===Number(id));if(!recipe)return;const description=prompt("Beskrivelse:",recipe.description||"");if(description===null)return;await updateRecipe(id,{description});}
async function updateRecipe(id,body){try{await fetchJson(`${API_BASE}/shopping/recipe-update`,{method:"POST",headers:{"Content-Type":"text/plain;charset=UTF-8"},body:JSON.stringify({id,...body})});await loadRecipes();setStatus("Oppskriften er lagret.","success");}catch(error){setStatus(`Kunne ikke lagre oppskrift.<br><br>${esc(error.message)}`,"error");}}
async function deleteRecipe(id){const recipe=recipes.find(item=>Number(item.id)===Number(id));if(!recipe||!confirm(`Slette oppskriften «${recipe.name}»?`))return;try{await fetchJson(`${API_BASE}/shopping/recipe-delete`,{method:"POST",headers:{"Content-Type":"text/plain;charset=UTF-8"},body:JSON.stringify({id})});await loadRecipes();setStatus("Oppskriften er fjernet.","success");}catch(error){setStatus(`Kunne ikke slette oppskriften.<br><br>${esc(error.message)}`,"error");}}
function openRecipeItemModal(recipeId){
  return new Promise(resolve => {
    const existing=document.getElementById("recipeItemModal");
    if(existing){existing.remove();}

    const defaultType=typeOptions[0]||"Annet";
    const modal=document.createElement("div");
    modal.id="recipeItemModal";
    modal.style.cssText="position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;";
    modal.innerHTML=`
      <div style="width:min(520px,100%);background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;box-sizing:border-box;box-shadow:0 18px 50px rgba(0,0,0,.35);">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;">
          <div style="font-size:22px;font-weight:bold;">Legg til vare i oppskrift</div>
          <button class="top-button" type="button" id="recipeItemModalClose" style="width:42px;height:42px;font-size:24px;">×</button>
        </div>
        <label style="display:block;font-weight:bold;margin:10px 0 6px;">Varenavn</label>
        <input id="recipeItemModalName" type="text" style="width:100%;" autocomplete="off">
        <label style="display:block;font-weight:bold;margin:12px 0 6px;">Varetype</label>
        <select id="recipeItemModalType" style="width:100%;">
          ${typeOptions.map(type=>`<option value="${esc(type)}" ${type===defaultType?"selected":""}>${esc(type)}</option>`).join("")}
        </select>
        <label style="display:block;font-weight:bold;margin:12px 0 6px;">Mengde</label>
        <input id="recipeItemModalQuantity" type="text" style="width:100%;" placeholder="Valgfritt, f.eks. 2 stk eller 400 g">
        <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:18px;">
          <button class="action-button" type="button" id="recipeItemModalCancel">Avbryt</button>
          <button class="action-button primary" type="button" id="recipeItemModalSave">Lagre vare</button>
        </div>
      </div>
    `;

    function close(value){
      modal.remove();
      resolve(value);
    }

    document.body.appendChild(modal);
    const nameInput=modal.querySelector("#recipeItemModalName");
    const typeInput=modal.querySelector("#recipeItemModalType");
    const quantityInput=modal.querySelector("#recipeItemModalQuantity");
    const saveButton=modal.querySelector("#recipeItemModalSave");

    modal.querySelector("#recipeItemModalClose").addEventListener("click",()=>close(null));
    modal.querySelector("#recipeItemModalCancel").addEventListener("click",()=>close(null));
    modal.addEventListener("click",event=>{if(event.target===modal){close(null);}});
    modal.addEventListener("keydown",event=>{
      if(event.key==="Escape"){close(null);}
      if(event.key==="Enter" && event.target.tagName!=="TEXTAREA"){
        event.preventDefault();
        saveButton.click();
      }
    });
    saveButton.addEventListener("click",()=>{
      const itemName=nameInput.value.trim();
      if(!itemName){
        nameInput.focus();
        return;
      }
      close({
        recipeId,
        itemName,
        type:typeInput.value || "Annet",
        quantity:quantityInput.value.trim()
      });
    });
    setTimeout(()=>nameInput.focus(),50);
  });
}

async function createRecipeItem(recipeId){
  const values=await openRecipeItemModal(recipeId);
  if(!values){return;}

  try{
    await fetchJson(`${API_BASE}/shopping/recipe-item-create`,{
      method:"POST",
      headers:{"Content-Type":"text/plain;charset=UTF-8"},
      body:JSON.stringify(values)
    });
    await loadRecipes();
    setStatus("Varen er lagt til oppskriften.","success");
  }catch(error){
    setStatus(`Kunne ikke legge til vare.<br><br>${esc(error.message)}`,"error");
  }
}
async function renameRecipeItem(id){const item=recipeItems.find(item=>Number(item.id)===Number(id));if(!item)return;const itemName=prompt("Nytt varenavn:",item.itemName);if(!itemName||itemName===item.itemName)return;await updateRecipeItem(id,{itemName});}
async function updateRecipeItem(id,body){try{await fetchJson(`${API_BASE}/shopping/recipe-item-update`,{method:"POST",headers:{"Content-Type":"text/plain;charset=UTF-8"},body:JSON.stringify({id,...body})});const item=recipeItems.find(item=>Number(item.id)===Number(id));if(item){Object.assign(item,body);}render();setStatus("Oppskriftsvaren er lagret.","success");}catch(error){setStatus(`Kunne ikke lagre oppskriftsvaren.<br><br>${esc(error.message)}`,"error");await loadRecipes();}}
async function deleteRecipeItem(id){const item=recipeItems.find(item=>Number(item.id)===Number(id));if(!item||!confirm(`Fjerne «${item.itemName}» fra oppskriften?`))return;try{await fetchJson(`${API_BASE}/shopping/recipe-item-delete`,{method:"POST",headers:{"Content-Type":"text/plain;charset=UTF-8"},body:JSON.stringify({id})});await loadRecipes();setStatus("Varen er fjernet fra oppskriften.","success");}catch(error){setStatus(`Kunne ikke fjerne varen.<br><br>${esc(error.message)}`,"error");}}
async function moveRecipeItem(id,direction){const item=recipeItems.find(item=>Number(item.id)===Number(id));if(!item)return;const list=itemsForRecipe(item.recipeId);const index=list.findIndex(entry=>Number(entry.id)===Number(id));const target=list[index+direction];if(!target)return;const oldSort=item.sortOrder;item.sortOrder=target.sortOrder;target.sortOrder=oldSort;render();try{await updateRecipeItem(item.id,{sortOrder:item.sortOrder});await updateRecipeItem(target.id,{sortOrder:target.sortOrder});await loadRecipes();}catch(error){setStatus(`Kunne ikke flytte varen.<br><br>${esc(error.message)}`,"error");await loadRecipes();}}
loadRecipes();
</script>
<script>
(function(){
  const APP_PAGE_RE = /^handleliste-[a-z0-9-]+\.html$/i;
  const HOME_TARGET = 'index.html?restoreMenu=1';

  function currentPage(){
    return location.pathname.split('/').pop() || 'handleliste-bestille.html';
  }

  function isAppPage(page){
    return APP_PAGE_RE.test(String(page || ''));
  }

  function safeAppTarget(value){
    if(!value) return '';
    try{
      const url = new URL(value, location.href);
      if(url.origin !== location.origin) return '';
      const page = url.pathname.split('/').pop();
      if(!isAppPage(page)) return '';
      return page + url.search + url.hash;
    }catch(e){
      const clean = String(value).trim();
      const page = clean.split('?')[0].split('#')[0];
      return isAppPage(page) ? clean : '';
    }
  }

  function currentTargetForBack(){
    const url = new URL(location.href);
    const page = currentPage();
    const params = new URLSearchParams(url.search);
    const legacyFrom = params.get('from');
    const existingBack = params.get('back');

    params.delete('from');

    if(!existingBack && legacyFrom){
      const safeLegacy = safeAppTarget(legacyFrom);
      if(safeLegacy) params.set('back', safeLegacy);
    }

    const query = params.toString();
    return page + (query ? '?' + query : '') + url.hash;
  }

  function getBackTarget(){
    const params = new URLSearchParams(location.search);
    return safeAppTarget(params.get('back')) || safeAppTarget(params.get('from')) || HOME_TARGET;
  }

  function addBackToUrl(rawHref){
    if(!rawHref) return rawHref;
    if(/^#|^(mailto|sms|tel|javascript):/i.test(rawHref)) return rawHref;

    try{
      const url = new URL(rawHref, location.href);
      if(url.origin !== location.origin) return rawHref;
      const page = url.pathname.split('/').pop();
      const here = currentPage();

      if(isAppPage(page) && page !== here){
        url.searchParams.delete('from');
        if(!url.searchParams.has('back')){
          url.searchParams.set('back', currentTargetForBack());
        }
        return page + url.search + url.hash;
      }
    }catch(e){}

    return rawHref;
  }

  function appBack(event){
    event.preventDefault();
    location.href = getBackTarget();
  }

  function initAppNavigation(){
    document.querySelectorAll('a[href]').forEach(function(anchor){
      const href = anchor.getAttribute('href');
      const nextHref = addBackToUrl(href);
      if(nextHref !== href) anchor.setAttribute('href', nextHref);
    });

    document.querySelectorAll('.top-buttons .top-button').forEach(function(button){
      if((button.textContent || '').trim() === '←'){
        button.addEventListener('click', appBack);
      }
    });
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', initAppNavigation);
  }else{
    initAppNavigation();
  }
})();
</script>
