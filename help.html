<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hjelp - Kvimarka 92</title>
<!-- version: kvimarka-help-v2-toc-2026-06-04 -->

<style>
:root{
  --bg:#f2f2f2;
  --card:#ffffff;
  --text:#333333;
  --muted:#667;
  --border:#cccccc;
  --soft:#eaeaea;
  --link:#1f789d;
  --button:#ffffff;
  --button-hover:#e9eef2;
  --success:#72c184;
}

body.dark-mode{
  --bg:#151515;
  --card:#242424;
  --text:#eeeeee;
  --muted:#bbbbbb;
  --border:#555555;
  --soft:#333333;
  --link:#7cc7e8;
  --button:#242424;
  --button-hover:#3a3a3a;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:20px;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
}

.container{
  max-width:1000px;
  margin:auto;
}

.header{
  text-align:center;
  margin-bottom:24px;
}

.site-title{
  margin:0;
  font-size:30px;
  font-weight:bold;
}

.subtitle{
  margin-top:8px;
  color:var(--muted);
  font-size:16px;
}

.top-buttons{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  margin:14px 0 0;
}

.top-button{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:44px;
  height:44px;
  padding:0;
  background:var(--button);
  border:1px solid var(--border);
  border-radius:8px;
  color:var(--text);
  text-decoration:none;
  font-size:24px;
  font-weight:bold;
  line-height:1;
  cursor:pointer;
}

.top-button:hover{
  background:var(--button-hover);
}

.help-card,
.info-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
  padding:18px;
  margin-bottom:18px;
}

.info-card{
  color:var(--muted);
  line-height:1.5;
}


.toc-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
  padding:18px;
  margin-bottom:18px;
}

.toc-title{
  font-size:18px;
  font-weight:bold;
  margin-bottom:12px;
}

.toc-list{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:8px;
}

.toc-link{
  display:flex;
  align-items:center;
  gap:8px;
  min-height:36px;
  padding:8px 10px;
  border:1px solid var(--border);
  border-radius:8px;
  background:rgba(127,127,127,.04);
  color:var(--text);
  text-decoration:none;
  font-weight:bold;
  line-height:1.25;
}

.toc-link:hover{
  background:var(--button-hover);
}

.toc-number{
  flex:0 0 auto;
  color:var(--link);
  font-size:13px;
}

.help-list{
  display:flex;
  flex-direction:column;
  gap:14px;
}

.help-card{
  margin-bottom:0;
}

.paragraph-number{
  color:var(--muted);
  font-size:13px;
  font-weight:bold;
  margin-bottom:6px;
}

.paragraph-title{
  font-size:23px;
  font-weight:bold;
  margin-bottom:10px;
}

.paragraph-heading{
  color:var(--muted);
  font-size:15px;
  font-weight:bold;
  margin-bottom:8px;
}

.paragraph-text{
  font-size:16px;
  line-height:1.45;
  white-space:pre-wrap;
}

.paragraph-image{
  display:block;
  max-width:100%;
  max-height:560px;
  object-fit:contain;
  margin:18px auto 0;
  background:var(--soft);
  border:1px solid var(--border);
  border-radius:10px;
}

.loading{
  text-align:center;
  color:var(--muted);
  font-size:17px;
  padding:24px;
}

.error-box{
  border:1px solid #b85c5c;
  color:#ff8a8a;
  background:rgba(198,40,40,.14);
  border-radius:12px;
  padding:16px;
  line-height:1.5;
}

a{
  color:var(--link);
}

@media(max-width:800px){
  body{
    padding:12px;
  }

  .site-title{
    font-size:26px;
  }

  .help-card,
  .info-card{
    padding:14px;
  }

  .paragraph-title{
    font-size:20px;
  }

  .paragraph-text{
    font-size:15px;
  }

  .toc-card{
    padding:14px;
  }

  .toc-list{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body class="dark-mode">
<div class="container">
  <div class="header">
    <h1 class="site-title" id="pageTitle">Hjelp</h1>
    <div class="subtitle" id="pageSubtitle">Kvimarka 92</div>

    <div class="top-buttons">
      <a class="top-button" href="index.html?restoreMenu=1" title="Tilbake til meny">←</a>
      <a class="top-button" href="index.html" title="Hovedside">⌂</a>
    </div>
  </div>

  <div class="info-card" id="caseInfo">Laster hjelpeside...</div>

  <div class="toc-card" id="tocCard" style="display:none;">
    <div class="toc-title">Innhold</div>
    <div class="toc-list" id="tocList"></div>
  </div>

  <div class="help-list" id="helpList">
    <div class="loading">Laster hjelpeinnhold...</div>
  </div>
</div>

<script>
const API_BASE = "https://api-kvimarka92.carstereogarage.com";
console.log("help.html version: kvimarka-help-v2-toc-2026-06-04");

function esc(value){
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function getHelpCaseFromUrl(){
  const params = new URLSearchParams(window.location.search);
  return params.get("case") || "Brukermanual";
}

function getFileUrl(value){
  if(!value){
    return "";
  }

  if(typeof value === "string"){
    return value;
  }

  if(Array.isArray(value)){
    const first = value[0];
    return getFileUrl(first);
  }

  if(typeof value === "object"){
    return (
      value.url ||
      value.downloadUrl ||
      value.download_url ||
      value.thumbnails?.large?.url ||
      value.thumbnails?.card_cover?.url ||
      value.thumbnails?.small?.url ||
      value.thumbnails?.tiny?.url ||
      ""
    );
  }

  return "";
}

async function fetchJson(url, options){
  const res = await fetch(url, {
    credentials:"include",
    ...(options || {})
  });

  const text = await res.text();
  let data = null;

  try{
    data = text ? JSON.parse(text) : null;
  }catch(error){
    data = null;
  }

  if(!res.ok){
    throw new Error(data?.error || text || `HTTP ${res.status}`);
  }

  return data;
}


function makeHelpAnchor(index){
  return `hjelp-${index + 1}`;
}

function renderHelp(data, caseName){
  const pageTitle = document.getElementById("pageTitle");
  const pageSubtitle = document.getElementById("pageSubtitle");
  const caseInfo = document.getElementById("caseInfo");
  const tocCard = document.getElementById("tocCard");
  const tocList = document.getElementById("tocList");
  const helpList = document.getElementById("helpList");

  const helpCase = data.case || {};
  const paragraphs = Array.isArray(data.paragraphs) ? data.paragraphs : [];
  const title = helpCase.name || caseName || "Hjelp";

  document.title = `${title} - Hjelp`;
  pageTitle.textContent = title;
  pageSubtitle.textContent = "Hjelp";

  caseInfo.innerHTML = paragraphs.length
    ? `Hjelpesiden inneholder <strong>${esc(paragraphs.length)}</strong> avsnitt.`
    : "Ingen aktive hjelpeavsnitt er lagt inn ennå.";

  if(!paragraphs.length){
    if(tocCard){
      tocCard.style.display = "none";
    }

    helpList.innerHTML = `<div class="loading">Ingen aktive hjelpeavsnitt funnet.</div>`;
    return;
  }

  if(tocCard && tocList){
    tocCard.style.display = "block";
    tocList.innerHTML = paragraphs.map((item, index) => {
      const number = Number(item.sortOrder || 0) || index + 1;
      const titleText = item.title || item.heading || `Punkt ${index + 1}`;

      return `
        <a class="toc-link" href="#${makeHelpAnchor(index)}">
          <span class="toc-number">${esc(number)}</span>
          <span>${esc(titleText)}</span>
        </a>
      `;
    }).join("");
  }

  helpList.innerHTML = paragraphs.map((item, index) => {
    const imageUrl = getFileUrl(item.image);
    const number = Number(item.sortOrder || 0) || index + 1;
    const titleText = item.title || item.heading || `Punkt ${index + 1}`;
    const headingText = item.title && item.heading && item.heading !== item.title
      ? item.heading
      : "";

    return `
      <article class="help-card" id="${makeHelpAnchor(index)}">
        <div class="paragraph-number">${esc(number)}</div>
        <div class="paragraph-title">${esc(titleText)}</div>
        ${headingText ? `<div class="paragraph-heading">${esc(headingText)}</div>` : ""}
        ${item.body ? `<div class="paragraph-text">${esc(item.body)}</div>` : ""}
        ${imageUrl ? `<img class="paragraph-image" src="${esc(imageUrl)}" alt="${esc(titleText)}" loading="lazy" decoding="async">` : ""}
      </article>
    `;
  }).join("");
}

async function loadHelp(){
  const caseName = getHelpCaseFromUrl();
  const helpList = document.getElementById("helpList");
  const caseInfo = document.getElementById("caseInfo");
  const tocCard = document.getElementById("tocCard");

  if(tocCard){
    tocCard.style.display = "none";
  }

  caseInfo.textContent = `Laster ${caseName}...`;
  helpList.innerHTML = `<div class="loading">Laster hjelpeinnhold...</div>`;

  try{
    const data = await fetchJson(`${API_BASE}/help?case=${encodeURIComponent(caseName)}`);
    renderHelp(data, caseName);
  }catch(error){
    console.error(error);

    document.getElementById("pageTitle").textContent = "Hjelp";
    document.getElementById("pageSubtitle").textContent = caseName;
    caseInfo.innerHTML = `<span style="color:#ff8a8a;">Kunne ikke laste hjelpesiden.</span>`;
    helpList.innerHTML = `
      <div class="error-box">
        Fant ikke en aktiv hjelpesak for <strong>${esc(caseName)}</strong>.<br><br>
        ${esc(error.message)}
      </div>
    `;
  }
}

loadHelp();
</script>
</body>
</html>
