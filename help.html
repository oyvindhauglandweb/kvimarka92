<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hjelp - Kvimarka 92</title>
<!-- version: kvimarka-help-v7-image-zoom-drag-pan-2026-06-06 -->

<style>
:root{
  --bg:#f2f2f2;
  --card:#ffffff;
  --text:#333333;
  --muted:#667;
  --border:#cccccc;
  --soft:#eaeaea;
  --link:#1f789d;
  --button:#ffffff;
  --button-hover:#e9eef2;
  --success:#72c184;
}

body.dark-mode{
  --bg:#151515;
  --card:#242424;
  --text:#eeeeee;
  --muted:#bbbbbb;
  --border:#555555;
  --soft:#333333;
  --link:#7cc7e8;
  --button:#242424;
  --button-hover:#3a3a3a;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:20px;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
}

.container{
  max-width:1000px;
  margin:auto;
}

.header{
  text-align:center;
  margin-bottom:24px;
}

.site-title{
  margin:0;
  font-size:30px;
  font-weight:bold;
}

.subtitle{
  margin-top:8px;
  color:var(--muted);
  font-size:16px;
}

.top-buttons{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  margin:14px 0 0;
}

.top-button{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:44px;
  height:44px;
  padding:0;
  background:var(--button);
  border:1px solid var(--border);
  border-radius:8px;
  color:var(--text);
  text-decoration:none;
  font-size:24px;
  font-weight:bold;
  line-height:1;
  cursor:pointer;
}

.top-button:hover{
  background:var(--button-hover);
}

.help-card,

.toc-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
  padding:18px;
  margin-bottom:18px;
}

.toc-title{
  font-size:18px;
  font-weight:bold;
  margin-bottom:12px;
}

.toc-list{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:8px;
}

.toc-link{
  display:flex;
  align-items:center;
  gap:8px;
  min-height:36px;
  padding:8px 10px;
  border:1px solid var(--border);
  border-radius:8px;
  background:rgba(127,127,127,.04);
  color:var(--text);
  text-decoration:none;
  font-weight:bold;
  line-height:1.25;
}

.toc-link:hover{
  background:var(--button-hover);
}


.help-list{
  display:flex;
  flex-direction:column;
  gap:14px;
}

.help-card{
  margin-bottom:0;
  position:relative;
  scroll-margin-top:18px;
}

.help-card-top-link{
  position:absolute;
  top:14px;
  right:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  width:34px;
  height:34px;
  border:1px solid var(--border);
  border-radius:8px;
  background:var(--button);
  color:var(--text);
  text-decoration:none;
  font-size:18px;
  font-weight:bold;
  line-height:1;
  box-sizing:border-box;
}

.help-card-top-link:hover{
  background:var(--button-hover);
}

.paragraph-title{
  padding-right:44px;
  font-size:23px;
  font-weight:bold;
  margin-bottom:10px;
}

.paragraph-heading{
  color:var(--muted);
  font-size:15px;
  font-weight:bold;
  margin-bottom:8px;
}

.paragraph-text{
  font-size:16px;
  line-height:1.45;
  white-space:pre-wrap;
}

.paragraph-image{
  display:block;
  max-width:100%;
  max-height:560px;
  object-fit:contain;
  margin:18px auto 0;
  background:var(--soft);
  border:1px solid var(--border);
  border-radius:10px;
}


.image-zoom-button{
  display:block;
  width:100%;
  margin:18px auto 0;
  padding:0;
  border:0;
  background:transparent;
  cursor:zoom-in;
}

.image-zoom-button:focus-visible{
  outline:2px solid var(--link);
  outline-offset:4px;
  border-radius:12px;
}

.image-zoom-hint{
  margin-top:7px;
  color:var(--muted);
  font-size:13px;
  text-align:center;
}

.image-modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:9999;
  background:rgba(0,0,0,.92);
  padding:14px;
}

.image-modal.open{
  display:flex;
  flex-direction:column;
}

.image-modal-toolbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:10px;
  color:#eeeeee;
}

.image-modal-title{
  font-size:16px;
  font-weight:bold;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.image-modal-close{
  display:flex;
  align-items:center;
  justify-content:center;
  width:44px;
  height:44px;
  border:1px solid #666;
  border-radius:8px;
  background:#242424;
  color:#eeeeee;
  font-size:28px;
  font-weight:bold;
  cursor:pointer;
}

.image-modal-stage{
  flex:1;
  min-height:0;
  overflow:auto;
  border:1px solid #555;
  border-radius:12px;
  background:#111;
  text-align:center;
  -webkit-overflow-scrolling:touch;
  cursor:grab;
  user-select:none;
}

.image-modal-stage.dragging{
  cursor:grabbing;
}

.image-modal-stage img{
  display:block;
  width:auto;
  height:auto;
  max-width:none;
  max-height:none;
  margin:0 auto;
  background:#222;
}

.image-modal-help{
  color:#bbbbbb;
  font-size:13px;
  padding:8px 2px 0;
  text-align:center;
}

.loading{
  text-align:center;
  color:var(--muted);
  font-size:17px;
  padding:24px;
}

.error-box{
  border:1px solid #b85c5c;
  color:#ff8a8a;
  background:rgba(198,40,40,.14);
  border-radius:12px;
  padding:16px;
  line-height:1.5;
}

a{
  color:var(--link);
}

@media(max-width:800px){
  body{
    padding:12px;
  }

  .site-title{
    font-size:26px;
  }

  .help-card{
    padding:14px;
  }

  .paragraph-title{
    font-size:20px;
  }

  .paragraph-text{
    font-size:15px;
  }

  .toc-card{
    padding:14px;
  }

  .toc-list{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body class="dark-mode">
<div class="container">
  <div class="header">
    <h1 class="site-title" id="pageTitle">Hjelp</h1>
    <div class="subtitle" id="pageSubtitle">Kvimarka 92</div>

    <div class="top-buttons">
      <a class="top-button" href="index.html?restoreMenu=1" title="Tilbake" onclick="return goBackFromHelp(event)">←</a>
      <a class="top-button" href="index.html" title="Hovedside">⌂</a>
    </div>
  </div>


  <div class="toc-card" id="tocCard" style="display:none;" tabindex="-1">
    <div class="toc-title">Innhold</div>
    <div class="toc-list" id="tocList"></div>
  </div>

  <div class="help-list" id="helpList">
    <div class="loading">Laster hjelpeinnhold...</div>
  </div>
</div>

<div class="image-modal" id="imageModal" aria-hidden="true">
  <div class="image-modal-toolbar">
    <div class="image-modal-title" id="imageModalTitle">Bilde</div>
    <div class="image-modal-controls" aria-label="Zoom-kontroller">
      <button type="button" class="image-modal-zoom-button" onclick="zoomImageModal(-0.25)" title="Zoom ut" aria-label="Zoom ut">−</button>
      <button type="button" class="image-modal-zoom-button" onclick="resetImageModalZoom()" title="Tilpass bildet" aria-label="Tilpass bildet">100%</button>
      <button type="button" class="image-modal-zoom-button" onclick="zoomImageModal(0.25)" title="Zoom inn" aria-label="Zoom inn">+</button>
      <div class="image-modal-zoom-label" id="imageModalZoomLabel">100%</div>
    </div>
    <button type="button" class="image-modal-close" onclick="closeImageModal()" aria-label="Lukk forstørret bilde">×</button>
  </div>
  <div class="image-modal-stage" id="imageModalStage">
    <img id="imageModalImage" src="" alt="">
  </div>
  <div class="image-modal-help">Bruk +/− for å endre forstørrelse. Hold museknappen inne og dra for å flytte bildet. Dobbeltklikk på bildet for å zoome inn.</div>
</div>

<script>
const API_BASE = "https://api-kvimarka92.carstereogarage.com";
console.log("help.html version: kvimarka-help-v7-image-zoom-drag-pan-2026-06-06");

function esc(value){
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function getHelpCaseFromUrl(){
  const params = new URLSearchParams(window.location.search);
  return params.get("case") || "Brukermanual";
}

function safeSameOriginTarget(value){
  if(!value){
    return "";
  }

  try{
    const url = new URL(value, location.href);
    if(url.origin !== location.origin){
      return "";
    }

    const page = url.pathname.split("/").pop() || "index.html";
    if(!/^([a-z0-9-]+\.html|index\.html)$/i.test(page)){
      return "";
    }

    return page + url.search + url.hash;
  }catch(error){
    return "";
  }
}

function getHelpBackTarget(){
  const params = new URLSearchParams(location.search);
  const explicitBack = safeSameOriginTarget(params.get("back") || params.get("from"));
  if(explicitBack){
    return explicitBack;
  }

  const referrerBack = safeSameOriginTarget(document.referrer);
  if(referrerBack && referrerBack !== (location.pathname.split("/").pop() + location.search + location.hash)){
    return referrerBack;
  }

  return "index.html?restoreMenu=1";
}

function goBackFromHelp(event){
  if(event){
    event.preventDefault();
  }

  location.href = getHelpBackTarget();
  return false;
}

let imageModalZoom = 1;
const IMAGE_MODAL_MIN_ZOOM = 0.25;
const IMAGE_MODAL_MAX_ZOOM = 5;

function clampImageModalZoom(value){
  return Math.max(IMAGE_MODAL_MIN_ZOOM, Math.min(IMAGE_MODAL_MAX_ZOOM, value));
}

function updateImageModalZoom(keepCenter){
  const image = document.getElementById("imageModalImage");
  const stage = document.getElementById("imageModalStage");
  const label = document.getElementById("imageModalZoomLabel");

  if(!image){
    return;
  }

  const oldCenterX = stage ? stage.scrollLeft + stage.clientWidth / 2 : 0;
  const oldCenterY = stage ? stage.scrollTop + stage.clientHeight / 2 : 0;
  const oldWidth = image.scrollWidth || image.clientWidth || 1;
  const oldHeight = image.scrollHeight || image.clientHeight || 1;
  const relX = oldWidth ? oldCenterX / oldWidth : 0.5;
  const relY = oldHeight ? oldCenterY / oldHeight : 0.1;

  image.style.width = (imageModalZoom * 100) + "%";
  image.style.maxWidth = "none";
  image.style.height = "auto";

  if(label){
    label.textContent = Math.round(imageModalZoom * 100) + "%";
  }

  if(stage && keepCenter){
    requestAnimationFrame(function(){
      stage.scrollLeft = Math.max(0, image.scrollWidth * relX - stage.clientWidth / 2);
      stage.scrollTop = Math.max(0, image.scrollHeight * relY - stage.clientHeight / 2);
    });
  }
}

function zoomImageModal(delta){
  imageModalZoom = clampImageModalZoom(imageModalZoom + delta);
  updateImageModalZoom(true);
}

function resetImageModalZoom(){
  imageModalZoom = 1;
  updateImageModalZoom(false);
  const stage = document.getElementById("imageModalStage");
  if(stage){
    stage.scrollLeft = 0;
    stage.scrollTop = 0;
  }
}

function openImageModal(src, alt){
  const modal = document.getElementById("imageModal");
  const image = document.getElementById("imageModalImage");
  const title = document.getElementById("imageModalTitle");
  const stage = document.getElementById("imageModalStage");

  if(!modal || !image){
    return;
  }

  image.src = src;
  image.alt = alt || "Forstørret bilde";
  if(title){
    title.textContent = alt || "Bilde";
  }

  imageModalZoom = 1;
  updateImageModalZoom(false);

  modal.classList.add("open");
  modal.setAttribute("aria-hidden", "false");
  document.body.style.overflow = "hidden";

  setTimeout(function(){
    if(stage){
      stage.scrollLeft = Math.max(0, (image.scrollWidth - stage.clientWidth) / 2);
      stage.scrollTop = 0;
    }
  }, 80);
}

function closeImageModal(){
  const modal = document.getElementById("imageModal");
  const image = document.getElementById("imageModalImage");

  if(!modal){
    return;
  }

  modal.classList.remove("open");
  modal.setAttribute("aria-hidden", "true");
  document.body.style.overflow = "";
  if(image){
    image.src = "";
    image.style.width = "";
  }
  imageModalZoom = 1;
  imageModalDragState = null;
  const stage = document.getElementById("imageModalStage");
  if(stage){
    stage.classList.remove("dragging");
  }
}

const imageModalStageElement = document.getElementById("imageModalStage");
if(imageModalStageElement){
  imageModalStageElement.addEventListener("wheel", function(event){
    if(!event.ctrlKey && !event.metaKey){
      return;
    }
    event.preventDefault();
    zoomImageModal(event.deltaY < 0 ? 0.25 : -0.25);
  }, {passive:false});
}

let imageModalDragState = null;

if(imageModalStageElement){
  imageModalStageElement.addEventListener("pointerdown", function(event){
    if(event.button !== undefined && event.button !== 0){
      return;
    }

    const image = document.getElementById("imageModalImage");
    if(!image || !image.src){
      return;
    }

    imageModalDragState = {
      pointerId:event.pointerId,
      startX:event.clientX,
      startY:event.clientY,
      scrollLeft:imageModalStageElement.scrollLeft,
      scrollTop:imageModalStageElement.scrollTop
    };

    imageModalStageElement.classList.add("dragging");
    imageModalStageElement.setPointerCapture(event.pointerId);
    event.preventDefault();
  });

  imageModalStageElement.addEventListener("pointermove", function(event){
    if(!imageModalDragState || imageModalDragState.pointerId !== event.pointerId){
      return;
    }

    const dx = event.clientX - imageModalDragState.startX;
    const dy = event.clientY - imageModalDragState.startY;

    imageModalStageElement.scrollLeft = imageModalDragState.scrollLeft - dx;
    imageModalStageElement.scrollTop = imageModalDragState.scrollTop - dy;
    event.preventDefault();
  });

  function endImageModalDrag(event){
    if(!imageModalDragState){
      return;
    }

    if(event && event.pointerId !== imageModalDragState.pointerId){
      return;
    }

    try{
      if(event && imageModalStageElement.hasPointerCapture(event.pointerId)){
        imageModalStageElement.releasePointerCapture(event.pointerId);
      }
    }catch(error){}

    imageModalDragState = null;
    imageModalStageElement.classList.remove("dragging");
  }

  imageModalStageElement.addEventListener("pointerup", endImageModalDrag);
  imageModalStageElement.addEventListener("pointercancel", endImageModalDrag);
  imageModalStageElement.addEventListener("pointerleave", function(event){
    if(imageModalDragState){
      endImageModalDrag(event);
    }
  });
}

const imageModalImageElement = document.getElementById("imageModalImage");
if(imageModalImageElement){
  imageModalImageElement.addEventListener("dblclick", function(){
    zoomImageModal(0.5);
  });
}

document.addEventListener("keydown", function(event){
  if(event.key === "Escape"){
    closeImageModal();
  }
});

document.addEventListener("click", function(event){
  const modal = document.getElementById("imageModal");
  if(event.target === modal){
    closeImageModal();
  }
});

function getFileUrl(value){
  if(!value){
    return "";
  }

  if(typeof value === "string"){
    return value;
  }

  if(Array.isArray(value)){
    const first = value[0];
    return getFileUrl(first);
  }

  if(typeof value === "object"){
    return (
      value.url ||
      value.downloadUrl ||
      value.download_url ||
      value.thumbnails?.large?.url ||
      value.thumbnails?.card_cover?.url ||
      value.thumbnails?.small?.url ||
      value.thumbnails?.tiny?.url ||
      ""
    );
  }

  return "";
}

async function fetchJson(url, options){
  const res = await fetch(url, {
    credentials:"include",
    ...(options || {})
  });

  const text = await res.text();
  let data = null;

  try{
    data = text ? JSON.parse(text) : null;
  }catch(error){
    data = null;
  }

  if(!res.ok){
    throw new Error(data?.error || text || `HTTP ${res.status}`);
  }

  return data;
}


function makeHelpAnchor(index){
  return `hjelp-${index + 1}`;
}

function renderHelp(data, caseName){
  const pageTitle = document.getElementById("pageTitle");
  const pageSubtitle = document.getElementById("pageSubtitle");
  const tocCard = document.getElementById("tocCard");
  const tocList = document.getElementById("tocList");
  const helpList = document.getElementById("helpList");

  const helpCase = data.case || {};
  const paragraphs = Array.isArray(data.paragraphs) ? data.paragraphs : [];
  const title = helpCase.name || caseName || "Hjelp";

  document.title = `${title} - Hjelp`;
  pageTitle.textContent = title;
  pageSubtitle.textContent = "Hjelp";

  if(!paragraphs.length){
    if(tocCard){
      tocCard.style.display = "none";
    }

    helpList.innerHTML = `<div class="loading">Ingen aktive hjelpeavsnitt funnet.</div>`;
    return;
  }

  if(tocCard && tocList){
    tocCard.style.display = "block";
    tocList.innerHTML = paragraphs.map((item, index) => {
      const titleText = item.title || item.heading || `Avsnitt ${index + 1}`;

      return `
        <a class="toc-link" href="#${makeHelpAnchor(index)}">
          <span>${esc(titleText)}</span>
        </a>
      `;
    }).join("");
  }

  helpList.innerHTML = paragraphs.map((item, index) => {
    const imageUrl = getFileUrl(item.image);
    const titleText = item.title || item.heading || `Avsnitt ${index + 1}`;
    const headingText = item.title && item.heading && item.heading !== item.title
      ? item.heading
      : "";

    return `
      <article class="help-card" id="${makeHelpAnchor(index)}">
        <a class="help-card-top-link" href="#tocCard" title="Til innhold" aria-label="Til innhold">↑</a>
        <div class="paragraph-title">${esc(titleText)}</div>
        ${headingText ? `<div class="paragraph-heading">${esc(headingText)}</div>` : ""}
        ${item.body ? `<div class="paragraph-text">${esc(item.body)}</div>` : ""}
        ${imageUrl ? `
          <button type="button" class="image-zoom-button" onclick="openImageModal('${esc(String(imageUrl)).replaceAll('\\', '\\\\').replaceAll("'", "\\'")}', '${esc(String(titleText)).replaceAll('\\', '\\\\').replaceAll("'", "\\'")}')" title="Klikk for å forstørre bildet">
            <img class="paragraph-image" src="${esc(imageUrl)}" alt="${esc(titleText)}" loading="lazy" decoding="async">
          </button>
          <div class="image-zoom-hint">Klikk på bildet for å forstørre</div>
        ` : ""}
      </article>
    `;
  }).join("");
}

async function loadHelp(){
  const caseName = getHelpCaseFromUrl();
  const helpList = document.getElementById("helpList");
  const tocCard = document.getElementById("tocCard");

  if(tocCard){
    tocCard.style.display = "none";
  }

  helpList.innerHTML = `<div class="loading">Laster hjelpeinnhold...</div>`;

  try{
    const data = await fetchJson(`${API_BASE}/help?case=${encodeURIComponent(caseName)}`);
    renderHelp(data, caseName);
  }catch(error){
    console.error(error);

    document.getElementById("pageTitle").textContent = "Hjelp";
    document.getElementById("pageSubtitle").textContent = caseName;
    helpList.innerHTML = `
      <div class="error-box">
        Fant ikke en aktiv hjelpesak for <strong>${esc(caseName)}</strong>.<br><br>
        ${esc(error.message)}
      </div>
    `;
  }
}

loadHelp();
</script>
</body>
</html>
