<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Handleliste - Handle</title>
<style>
:root{--bg:#f2f2f2;--card:#fff;--text:#333;--muted:#667;--border:#ccc;--link:#1f789d;--button:#fff;--button-hover:#e9eef2;--soft:#eaeaea;--success:#72c184;--danger:#d77;}body.dark-mode{--bg:#151515;--card:#242424;--text:#eee;--muted:#bbb;--border:#555;--link:#7cc7e8;--button:#242424;--button-hover:#3a3a3a;--soft:#333;}*{box-sizing:border-box;}body{margin:0;padding:20px;background:var(--bg);color:var(--text);font-family:Arial,sans-serif;}.container{max-width:980px;margin:auto;}.header{text-align:center;margin-bottom:24px;}.site-title{margin:0;font-size:30px;}.subtitle{margin-top:8px;color:var(--muted);font-size:16px;}.top-buttons{display:flex;justify-content:center;align-items:center;gap:10px;margin:14px 0 0;}.top-button{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;padding:0;background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--text);text-decoration:none;font-size:24px;font-weight:bold;line-height:1;cursor:pointer;}.top-button:hover,.action-button:hover{background:var(--button-hover);}.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:18px;}.toolbar{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;}.action-button{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:0 14px;background:var(--button);border:1px solid var(--border);border-radius:8px;color:var(--text);font-weight:bold;text-decoration:none;cursor:pointer;}.primary{background:var(--link);border-color:var(--link);color:#fff;}.action-button:disabled{opacity:.55;cursor:not-allowed;}.status{color:var(--muted);line-height:1.45;}.status.error{color:var(--danger);}.status.success{color:var(--success);}.group{margin-bottom:18px;}.group-title{font-size:18px;font-weight:bold;margin:0 0 8px;}.item-list{display:flex;flex-direction:column;gap:8px;}.item-row{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;border:1px solid var(--border);border-radius:10px;padding:10px;background:rgba(127,127,127,.04);}.item-check{width:26px;height:26px;accent-color:var(--link);}.item-name{font-weight:bold;}.item-meta{color:var(--muted);font-size:13px;margin-top:3px;}.badge{display:inline-flex;align-items:center;min-height:24px;padding:0 8px;border-radius:999px;background:rgba(124,199,232,.16);color:var(--link);font-size:12px;font-weight:bold;}.empty{padding:26px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:12px;}@media(max-width:700px){body{padding:12px;}.toolbar{align-items:stretch}.action-button{width:100%;}.item-row{grid-template-columns:38px 1fr;}.item-row .badge{grid-column:2;justify-self:start;}}
</style>
</head>
<body class="dark-mode">
<div class="container"><div class="header"><h1 class="site-title">Handleliste</h1><div class="subtitle">Handle</div><div class="top-buttons"><a class="top-button" href="index.html?restoreMenu=1" title="Tilbake til meny">←</a><a class="top-button" href="index.html" title="Hovedside">⌂</a></div></div>
<div class="card"><div class="toolbar"><a class="action-button" href="handleliste-bestille.html">Til Bestille</a><button class="action-button primary" id="finishButton" type="button" onclick="finishShopping()">Avslutt handel</button></div></div>
<div class="card"><div id="status" class="status">Laster...</div></div><div class="card"><div id="shoppingList"></div></div></div>
<script>
const API_BASE="https://api-kvimarka92.carstereogarage.com";let items=[];let boughtIds=new Set();
function esc(value){return String(value??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");}
async function fetchJson(url,options){const res=await fetch(url,{credentials:"include",...(options||{})});const data=await res.json().catch(()=>null);if(!res.ok || (data&&data.error)){throw new Error(data?.error||data?.detail||`HTTP ${res.status}`);}return data;}
function setStatus(message,type){const el=document.getElementById("status");el.className="status"+(type?` ${type}`:"");el.innerHTML=message||"";}
function groupByType(list){return list.reduce((groups,item)=>{const key=item.type||"Annet";(groups[key]=groups[key]||[]).push(item);return groups;},{});}
function render(){const root=document.getElementById("shoppingList");const ordered=items.filter(item=>item.shouldBuy);document.getElementById("finishButton").disabled=!ordered.length;if(!ordered.length){root.innerHTML='<div class="empty">Ingen varer er bestilt handlet.</div>';return;}const groups=groupByType(ordered);root.innerHTML=Object.keys(groups).sort((a,b)=>a.localeCompare(b,"no",{sensitivity:"base"})).map(type=>`<div class="group"><h2 class="group-title">${esc(type)}</h2><div class="item-list">${groups[type].map(item=>`<div class="item-row"><input class="item-check" type="checkbox" ${boughtIds.has(item.id)?"checked":""} onchange="toggleBought(${item.id}, this.checked)" title="Handlet"><div><div class="item-name">${esc(item.name)}</div><div class="item-meta">${item.standardItem?"Standardvare":"Engangsvare"}</div></div><span class="badge">Handlet</span></div>`).join("")}</div></div>`).join("");}
function toggleBought(id,checked){if(checked){boughtIds.add(id);}else{boughtIds.delete(id);}}
async function loadItems(){setStatus("Laster handlelisten...");try{const data=await fetchJson(`${API_BASE}/shopping/items`);items=Array.isArray(data.items)?data.items:[];boughtIds.clear();render();setStatus("Klar. Kryss av varene etter hvert som de er handlet.","success");}catch(error){setStatus(`Kunne ikke laste handlelisten.<br><br>${esc(error.message)}`,"error");}}
async function finishShopping(){if(!boughtIds.size){alert("Kryss av minst én vare som handlet først.");return;}if(!confirm(`Avslutte handel og lagre ${boughtIds.size} handlet vare${boughtIds.size===1?"":"r"}?`)){return;}const button=document.getElementById("finishButton");button.disabled=true;setStatus("Avslutter handel...");try{const data=await fetchJson(`${API_BASE}/shopping/finish`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({boughtIds:[...boughtIds]})});await loadItems();setStatus(`Handelen er avsluttet. ${data.boughtCount} varer ble lagret som handlet.`,"success");}catch(error){setStatus(`Kunne ikke avslutte handelen.<br><br>${esc(error.message)}`,"error");}finally{button.disabled=false;render();}}
loadItems();
</script>
</body></html>
