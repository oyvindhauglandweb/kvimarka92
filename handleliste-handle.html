(function(){
  try{
    const savedDesign = localStorage.getItem("shoppingDesign") || "soft";
    document.documentElement.classList.toggle("classic-design-root", savedDesign === "classic");
  }catch(e){}
})();
window.applyShoppingDesignState = function(){
  try{
    const isClassic = document.documentElement.classList.contains("classic-design-root");
    const btn = document.getElementById("shoppingDesignToggle");
    if(btn){
      btn.textContent = isClassic ? "◩" : "◫";
      btn.title = isClassic ? "Bytt til mykt design" : "Bytt til klassisk design";
      btn.setAttribute("aria-label", btn.title);
    }
  }catch(e){}
};
window.toggleShoppingDesign = function(){
  try{
    const isClassic = document.documentElement.classList.toggle("classic-design-root");
    localStorage.setItem("shoppingDesign", isClassic ? "classic" : "soft");
    window.applyShoppingDesignState();
  }catch(e){}
};
document.addEventListener("DOMContentLoaded", window.applyShoppingDesignState);
window.applyShoppingThemeState=function(){
  try{
    const savedTheme=localStorage.getItem("brochureTheme")||localStorage.getItem("shoppingTheme")||"dark";
    const isDark=savedTheme==="dark";
    document.body.classList.toggle("dark-mode",isDark);
    localStorage.setItem("brochureTheme",isDark?"dark":"light");
    localStorage.setItem("shoppingTheme",isDark?"dark":"light");
    const btn=document.getElementById("shoppingThemeToggle");
    if(btn){
      btn.textContent=isDark?"☀":"☾";
      btn.title=isDark?"Bytt til lys modus":"Bytt til mørk modus";
      btn.setAttribute("aria-label",btn.title);
    }
  }catch(e){}
};
window.toggleShoppingTheme=function(){
  try{
    const isDark=document.body.classList.contains("dark-mode");
    localStorage.setItem("brochureTheme",isDark?"light":"dark");
    localStorage.setItem("shoppingTheme",isDark?"light":"dark");
    window.applyShoppingThemeState();
  }catch(e){}
};
document.addEventListener("DOMContentLoaded", window.applyShoppingThemeState);
(function(){
  try{
    const allowed=["small","medium","large"];
    const saved=localStorage.getItem("shoppingListSize")||localStorage.getItem("shoppingHandleSize")||localStorage.getItem("shoppingOrderSize")||"small";
    const size=allowed.includes(saved)?saved:"small";
    document.documentElement.classList.remove("handle-size-small","handle-size-medium","handle-size-large");
    document.documentElement.classList.add("handle-size-"+size);
  }catch(e){
    document.documentElement.classList.add("handle-size-small");
  }
})();
window.applyHandleSizeState=function(){
  try{
    const allowed=["small","medium","large"];
    const saved=localStorage.getItem("shoppingListSize")||localStorage.getItem("shoppingHandleSize")||localStorage.getItem("shoppingOrderSize")||"small";
    const size=allowed.includes(saved)?saved:"small";
    document.documentElement.classList.remove("handle-size-small","handle-size-medium","handle-size-large");
    document.documentElement.classList.add("handle-size-"+size);
    const btn=document.getElementById("handleSizeToggle");
    if(btn){
      const label=size==="small"?"A":(size==="medium"?"A+":"A++");
      btn.textContent=label;
      btn.title="Endre tekststørrelse og avkrysningsbokser: "+(size==="small"?"liten":(size==="medium"?"medium":"stor"));
      btn.setAttribute("aria-label",btn.title);
    }
  }catch(e){}
};
window.toggleHandleSize=function(){
  try{
    const allowed=["small","medium","large"];
    const current=localStorage.getItem("shoppingListSize")||localStorage.getItem("shoppingHandleSize")||localStorage.getItem("shoppingOrderSize")||"small";
    const index=allowed.indexOf(current);
    const next=allowed[(index<0?0:index+1)%allowed.length];
    localStorage.setItem("shoppingListSize",next);localStorage.setItem("shoppingHandleSize",next);localStorage.setItem("shoppingOrderSize",next);
    window.applyHandleSizeState();
  }catch(e){}
};
document.addEventListener("DOMContentLoaded", window.applyHandleSizeState);

function esc(value){return String(value??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");}
async function fetchJson(url,options){const res=await fetch(url,{credentials:"include",...(options||{})});const data=await res.json().catch(()=>null);if(!res.ok||(data&&data.error)){throw new Error(data?.detail||data?.error||`HTTP ${res.status}`);}return data;}
function setStatus(message,type){const el=document.getElementById("status");el.className="status"+(type?` ${type}`:"");el.innerHTML=message||"";}
function normalizeOwner(value){const text=String(value||"Felles").trim()||"Felles";return SHOPPING_OWNERS.some(owner=>owner.toLowerCase()===text.toLowerCase())?SHOPPING_OWNERS.find(owner=>owner.toLowerCase()===text.toLowerCase()):text;}
function getInitialOwner(){const saved=normalizeOwner(localStorage.getItem(OWNER_STORAGE_KEY)||"Felles");return SHOPPING_OWNERS.includes(saved)?saved:"Felles";}function setShoppingOwners(options){const incoming=Array.isArray(options)?options.map(value=>String(value||"").trim()).filter(Boolean):[];const seen=new Set();const clean=[];incoming.forEach(owner=>{const key=owner.toLowerCase();if(!seen.has(key)){seen.add(key);clean.push(owner);}});if(!clean.some(owner=>owner.toLowerCase()==="felles")){clean.unshift("Felles");}if(clean.length){SHOPPING_OWNERS=clean;}}
function ownerBadge(item){const owner=normalizeOwner(item.owner);return owner&&owner!=="Felles"?`<span class="badge">${esc(owner)}</span>`:"";}
function getOwnerPhone(owner){const normalized=normalizeOwner(owner);const contact=ownerContacts.find(item=>String(item.name||"").trim().toLowerCase()===normalized.toLowerCase());return contact?String(contact.phone||"").trim():"";}
function makeSmsMessage(item){const sender=String(currentUserName||"").trim()||"";const itemName=String(item?.name||"varen").trim()||"varen";return `Jeg er i butikken. Denne varen må du forklare litt mer om hvis du ønsker jeg skal kjøpe den: ${itemName} - Mvh ${sender}`.trim();}
function smsHref(phone,message){const number=String(phone||"").replace(/[^+0-9]/g,"");return `sms:${encodeURIComponent(number)}?&body=${encodeURIComponent(message)}`;}
function ownerSmsButton(item){const owner=normalizeOwner(item.owner);if(!owner||owner==="Felles")return "";const phone=getOwnerPhone(owner);if(!phone)return "";return `<a class="sms-button" href="${esc(smsHref(phone,makeSmsMessage(item)))}" onclick="event.stopPropagation();" title="Send SMS til ${esc(owner)}">SMS</a>`;}
function recipeBadge(item){
  if(String(item.source||"").trim().toLowerCase()!=="oppskrift"){
    return "";
  }

  const recipeName=String(item.recipeName||"").trim()||"Oppskrift";
  return `<span class="badge recipe-badge" title="Oppskrift: ${esc(recipeName)}">${esc(recipeName)}</span>`;
}


const BOUGHT_STORAGE_KEY="kvimarka92ShoppingBoughtIds";
let items=[];let boughtIds=new Set();let typeOrder=[];let typeOptions=[];let currentStoreChain="Standard";
function getBoughtStorageKey(){return BOUGHT_STORAGE_KEY;}
function loadRememberedBoughtIds(){
  try{
    const values=JSON.parse(localStorage.getItem(getBoughtStorageKey())||"[]");
    return new Set((Array.isArray(values)?values:[]).map(id=>Number(id)).filter(id=>Number.isInteger(id)&&id>0));
  }catch(error){
    return new Set();
  }
}
function saveRememberedBoughtIds(){
  try{
    localStorage.setItem(getBoughtStorageKey(),JSON.stringify([...boughtIds]));
  }catch(error){}
}
function clearRememberedBoughtIds(){
  boughtIds.clear();
  try{localStorage.removeItem(getBoughtStorageKey());}catch(error){}
}
function reconcileBoughtIdsWithItems(){
  const validIds=new Set(getOrderedItems().map(item=>Number(item.id)));
  boughtIds=new Set([...boughtIds].map(id=>Number(id)).filter(id=>validIds.has(id)));
  saveRememberedBoughtIds();
}
function getOrderedItems(){return items.filter(item=>item.shouldBuy);}
function groupOrderedItems(list){const map={};list.forEach(item=>{const key=item.type||"Annet";(map[key]=map[key]||[]).push(item);});const seen=new Set();return [...typeOrder,...Object.keys(map)].filter(type=>{const key=String(type).toLowerCase();if(seen.has(key)||!map[type])return false;seen.add(key);return true;}).map(type=>({type,items:map[type]}));}
function uniqueShoppingTypesForForm(values){
  const seen=new Set();
  const result=[];
  (Array.isArray(values)?values:[]).forEach(value=>{
    const text=String(value||"").trim()||"Annet";
    const key=text.toLowerCase();
    if(!seen.has(key)){
      seen.add(key);
      result.push(text);
    }
  });
  return result.length?result:["Annet"];
}
function fillAddItemSelects(){
  const typeSelect=document.getElementById("addItemType");
  const ownerSelect=document.getElementById("addItemOwner");
  if(typeSelect){
    const options=uniqueShoppingTypesForForm([...(typeOptions||[]),...DEFAULT_TYPES,...typeOrder,...items.map(item=>item.type)]);
    typeSelect.innerHTML=options.map(type=>`<option value="${esc(type)}">${esc(type)}</option>`).join("");
  }
  if(ownerSelect){
    ownerSelect.innerHTML=SHOPPING_OWNERS.map(owner=>`<option value="${esc(owner)}">${esc(owner)}</option>`).join("");
    ownerSelect.value=normalizeOwner(localStorage.getItem(OWNER_STORAGE_KEY)||"Felles");
  }
}
function openAddItemModal(){
  fillAddItemSelects();
  const modal=document.getElementById("addItemModal");
  const name=document.getElementById("addItemName");
  const shouldBuy=document.getElementById("addItemShouldBuy");
  if(shouldBuy)shouldBuy.checked=true;
  if(modal)modal.classList.add("open");
  window.setTimeout(()=>{if(name){name.focus();name.select();}},50);
}
function closeAddItemModal(){
  const modal=document.getElementById("addItemModal");
  if(modal)modal.classList.remove("open");
}
async function createShoppingItemFromHandle(){
  const button=document.getElementById("addItemSaveButton");
  const name=String(document.getElementById("addItemName")?.value||"").trim();
  const type=String(document.getElementById("addItemType")?.value||"Annet").trim()||"Annet";
  const owner=normalizeOwner(document.getElementById("addItemOwner")?.value||"Felles");
  const shouldBuy=!!document.getElementById("addItemShouldBuy")?.checked;
  if(!name){
    alert("Skriv inn varenavn.");
    return;
  }
  if(button)button.disabled=true;
  try{
    await fetchJson(`${API_BASE}/shopping/item-create`,{
      method:"POST",
      headers:{"Content-Type":"text/plain;charset=UTF-8"},
      body:JSON.stringify({name,type,owner,shouldBuy,standardItem:false})
    });
    document.getElementById("addItemName").value="";
    closeAddItemModal();
    await loadItems();
    setStatus(`Varen "${esc(name)}" er lagt til handlelisten.`,"success");
  }catch(error){
    setStatus(`Kunne ikke legge til vare.<br><br>${esc(error.message)}`,"error");
  }finally{
    if(button)button.disabled=false;
  }
}

function render(){const root=document.getElementById("shoppingList");const ordered=getOrderedItems();const finishButton=document.getElementById("finishButton");const toggleAllButton=document.getElementById("toggleAllButton");if(finishButton)finishButton.disabled=!ordered.length;if(toggleAllButton){const allBought=ordered.length>0&&ordered.every(item=>boughtIds.has(Number(item.id)));toggleAllButton.disabled=!ordered.length;toggleAllButton.textContent=allBought?"Avmerk alle":"Merk alle";toggleAllButton.title=allBought?"Fjern avkrysning på alle varer":"Merk alle varer som handlet";}if(!ordered.length){root.innerHTML='<div class="empty">Ingen varer er bestilt handlet.</div>';return;}root.innerHTML=groupOrderedItems(ordered).map(group=>`<div class="group"><h2 class="group-title">${esc(group.type)}</h2><div class="item-list">${group.items.map(item=>{const isBought=boughtIds.has(Number(item.id));const badges=`${ownerBadge(item)}${ownerSmsButton(item)}${recipeBadge(item)}${item.standardItem?'<span class="badge">Standard</span>':""}${isBought?'<span class="badge">Handlet</span>':""}`;return `<div class="item-row"><input class="item-check" type="checkbox" ${isBought?"checked":""} onchange="toggleBought(${Number(item.id)}, this.checked)" title="Handlet"><div class="item-name">${esc(item.name)}</div><div class="badge-stack">${badges}</div></div>`;}).join("")}</div></div>`).join("");}
function toggleBought(id,checked){const numericId=Number(id);if(!numericId)return;if(checked)boughtIds.add(numericId);else boughtIds.delete(numericId);saveRememberedBoughtIds();render();}
function toggleAllBought(){const ordered=getOrderedItems();if(!ordered.length)return;const allBought=ordered.every(item=>boughtIds.has(Number(item.id)));ordered.forEach(item=>{const id=Number(item.id);if(allBought)boughtIds.delete(id);else boughtIds.add(id);});saveRememberedBoughtIds();render();}
async function loadItems(){setStatus("Laster handlelisten...");try{const data=await fetchJson(`${API_BASE}/shopping/items`);setShoppingOwners(data.ownerOptions);ownerContacts=Array.isArray(data.ownerContacts)?data.ownerContacts:[];currentUserName=data.currentUser?.name||data.currentUser?.email||"";items=Array.isArray(data.items)?data.items:[];typeOrder=Array.isArray(data.typeOrder)?data.typeOrder:[];typeOptions=Array.isArray(data.typeOptions)?data.typeOptions:uniqueShoppingTypesForForm([...DEFAULT_TYPES,...items.map(item=>item.type),...typeOrder]);boughtIds=loadRememberedBoughtIds();reconcileBoughtIdsWithItems();render();setStatus("Klar. Kryss av varene etter hvert som de er handlet.","success");autoCheckStoreOnMobile();}catch(error){setStatus(`Kunne ikke laste handlelisten.<br><br>${esc(error.message)}`,"error");}}

function buildShoppingListText(){
  const ordered=getOrderedItems();
  const lines=["Handleliste",""];
  groupOrderedItems(ordered).forEach(group=>{
    lines.push(group.type);
    group.items.forEach(item=>{
      const ownerText=normalizeOwner(item.owner)!=="Felles"?`(${normalizeOwner(item.owner)}) `:"";
      const recipeText=String(item.source||"").trim().toLowerCase()==="oppskrift"&&item.recipeName?` [${item.recipeName}]`:"";
      lines.push(`${boughtIds.has(Number(item.id))?"[x]":"[ ]"} ${ownerText}${item.name}${recipeText}`);
    });
    lines.push("");
  });
  return lines.join("\n");
}

function sendShoppingListSms(){
  const ordered=getOrderedItems();
  if(!ordered.length){
    alert("Ingen varer er bestilt handlet.");
    return;
  }
  window.location.href=`sms:?&body=${encodeURIComponent(buildShoppingListText())}`;
}
function sendShoppingListEmail(){const ordered=getOrderedItems();if(!ordered.length){alert("Ingen varer er bestilt handlet.");return;}const lines=["Handleliste",""];groupOrderedItems(ordered).forEach(group=>{lines.push(group.type);group.items.forEach(item=>lines.push(`${boughtIds.has(Number(item.id))?"[x]":"[ ]"} ${normalizeOwner(item.owner)!=="Felles"?`(${normalizeOwner(item.owner)}) `:""}${item.name}`));lines.push("");});window.location.href=`mailto:?subject=${encodeURIComponent("Handleliste")}&body=${encodeURIComponent(lines.join("\n"))}`;}
function getShoppingLocation(){
  return new Promise(resolve=>{
    if(!navigator.geolocation){
      resolve({status:"error", message:"Nettleseren støtter ikke GPS/geolocation."});
      return;
    }

    navigator.geolocation.getCurrentPosition(
      position=>{
        resolve({
          status:"ok",
          latitude:position.coords.latitude,
          longitude:position.coords.longitude,
          accuracy:position.coords.accuracy
        });
      },
      error=>{
        const code=error && error.code;
        const message=error && error.message ? error.message : "Ukjent GPS-feil";
        resolve({
          status:code === 1 ? "denied" : "error",
          code,
          message
        });
      },
      {
        enableHighAccuracy:true,
        timeout:15000,
        maximumAge:0
      }
    );
  });
}

function formatGpsLocation(location){
  if(!location){
    return "Ingen GPS-respons.";
  }

  if(location.status === "ok"){
    const lat=Number(location.latitude).toFixed(6);
    const lon=Number(location.longitude).toFixed(6);
    const acc=location.accuracy !== null && location.accuracy !== undefined
      ? `${Math.round(Number(location.accuracy))} m`
      : "ukjent";
    return `GPS OK: ${lat}, ${lon}. Nøyaktighet: ${acc}.`;
  }

  if(location.status === "denied"){
    return `GPS avslått av bruker/nettleser${location.message ? `: ${esc(location.message)}` : "."}`;
  }

  return `GPS-feil${location.message ? `: ${esc(location.message)}` : "."}`;
}

async function testGpsLocation(){
  setStatus("Tester GPS-posisjon...");
  const location=await getShoppingLocation();
  setStatus(formatGpsLocation(location), location.status === "ok" ? "success" : "error");
}

function isLikelyMobileDevice(){
  return (
    /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent || "") ||
    (navigator.maxTouchPoints && navigator.maxTouchPoints > 1) ||
    (window.matchMedia && window.matchMedia("(max-width: 800px)").matches)
  );
}

function setStoreMatchStatus(message, type){
  const card=document.getElementById("storeMatchCard");
  const status=document.getElementById("storeMatchStatus");

  if(!card || !status){
    return;
  }

  if(!message){
    card.style.display="none";
    status.innerHTML="";
    status.className="status";
    return;
  }

  card.style.display="block";
  status.className="status" + (type ? ` ${type}` : "");
  status.innerHTML=message;
}

function formatStoreMatchResult(data){
  const matchStatus=String(data?.storeMatchStatus || "");
  const storeName=String(data?.storeName || data?.store?.name || "").trim();
  const storeChain=String(data?.storeChain || data?.store?.chain || "").trim();
  const logoUrl=String(data?.storeLogoUrl || data?.logoUrl || data?.store?.logoUrl || "").trim();
  const distance=data?.storeDistance;
  const location=data?.location || {};
  const accuracy=location.accuracy !== null && location.accuracy !== undefined
    ? `${Math.round(Number(location.accuracy))} m`
    : "ukjent";

  if(storeName){
    const label=[storeChain,storeName].filter(Boolean).join(" ").trim();
    const distanceText=distance !== null && distance !== undefined ? ` · ${Math.round(Number(distance))} m unna` : "";
    const prefix=matchStatus === "Uncertain" ? "Mulig butikk" : "Du ser ut til å være hos";
    const suffix=matchStatus === "Uncertain" ? " · usikkert treff" : "";
    const text=`${prefix}: <strong>${esc(label)}</strong>${distanceText}${suffix}<br>GPS-nøyaktighet: ${esc(accuracy)}`;
    const logo=logoUrl ? `<img class="store-logo" src="${esc(logoUrl)}" alt="${esc(storeChain || storeName)} logo" loading="lazy" decoding="async" onerror="this.style.display='none'">` : "";
    return `<div class="store-match-line"><div class="store-match-text">${text}</div>${logo}</div>`;
  }

  if(matchStatus === "No match"){
    const lat=location.latitude !== null && location.latitude !== undefined ? Number(location.latitude).toFixed(4) : "?";
    const lon=location.longitude !== null && location.longitude !== undefined ? Number(location.longitude).toFixed(4) : "?";
    return `Fant ingen kjent butikk her.<br>GPS: ${esc(lat)}, ${esc(lon)} · nøyaktighet: ${esc(accuracy)}`;
  }

  if(matchStatus === "Location denied"){
    return "GPS-tilgang er avslått. Butikk kan ikke foreslås automatisk.";
  }

  if(matchStatus === "Location error"){
    return "Kunne ikke hente GPS-posisjon. Butikk kan ikke foreslås automatisk.";
  }

  return "Butikk kunne ikke foreslås automatisk.";
}

let storeMatchRunning=false;
async function checkCurrentStore(silent){
  if(storeMatchRunning){
    return;
  }

  storeMatchRunning=true;

  try{
    if(!silent){
      setStoreMatchStatus("Sjekker hvilken butikk du er i...");
    }

    const location=await getShoppingLocation();

    if(location.status !== "ok"){
      setStoreMatchStatus(formatGpsLocation(location), "error");
      return;
    }

    const data=await fetchJson(`${API_BASE}/shopping/store-match`,{
      method:"POST",
      headers:{"Content-Type":"text/plain;charset=UTF-8"},
      body:JSON.stringify({
        location,
        latitude:location.latitude,
        longitude:location.longitude,
        accuracy:location.accuracy,
        locationStatus:location.status
      })
    });

    const matched=!!(data.storeName || data.store?.name);
    const uncertain=String(data.storeMatchStatus || "") === "Uncertain";

    if(Array.isArray(data.typeOrder) && data.typeOrder.length){
      typeOrder=data.typeOrder;
      currentStoreChain=data.typeOrderChain || data.storeChain || data.store?.chain || "Standard";
      render();
    }

    setStoreMatchStatus(formatStoreMatchResult(data), matched && !uncertain ? "success" : "");
  }catch(error){
    setStoreMatchStatus(`Kunne ikke sjekke butikk.<br><br>${esc(error.message)}`, "error");
  }finally{
    storeMatchRunning=false;
  }
}

function autoCheckStoreOnMobile(){
  if(!isLikelyMobileDevice()){
    return;
  }

  window.setTimeout(() => {
    checkCurrentStore(true);
  }, 800);
}

function shoppingSessionStatusText(session){
  if(!session){
    return "";
  }

  const status=String(session.storeMatchStatus||"");
  const store=[session.storeChain,session.storeName].filter(Boolean).join(" ").trim();

  if(store){
    const distance=session.storeDistance!==null&&session.storeDistance!==undefined?`, ca. ${session.storeDistance} m` : "";
    const unsure=status==="Uncertain" ? " usikkert" : "";
    return ` Butikk${unsure}: ${store}${distance}.`;
  }

  if(status==="No match")return " Ingen butikk ble matchet.";
  if(status==="No location")return " Handelen ble lagret uten posisjon.";
  if(status==="Location denied")return " Handelen ble lagret uten posisjon fordi tilgang ble avslått.";
  if(status==="Location error")return " Handelen ble lagret uten butikkmatch på grunn av GPS-feil.";

  return "";
}

function formatLocationDebug(data, clientLocation){
  const debug=data?.locationDebug || {};
  const parts=[];
  parts.push(`<br><br><strong>GPS-diagnose:</strong>`);
  parts.push(`<br>Mobil/nettleser: ${esc(formatGpsLocation(clientLocation))}`);
  parts.push(`<br>Worker mottok: lat=${esc(debug.latitude ?? "tom")}, lon=${esc(debug.longitude ?? "tom")}, accuracy=${esc(debug.gpsAccuracy ?? "tom")}, status=${esc(debug.status ?? "tom")}`);
  parts.push(`<br>Session opprettet: ${debug.sessionCreated ? "ja" : "nei"}`);

  if(debug.sessionPatchResult){
    parts.push(`<br>Session patch: ${esc(JSON.stringify(debug.sessionPatchResult))}`);
  }

  if(debug.sessionError){
    parts.push(`<br>Session-feil: ${esc(debug.sessionError)}`);
  }

  return parts.join("");
}

async function finishShopping(){
  if(!boughtIds.size){
    alert("Kryss av minst én vare som handlet først.");
    return;
  }

  if(!confirm(`Avslutte handel og lagre ${boughtIds.size} handlet vare${boughtIds.size===1?"":"r"}?`)){
    return;
  }

  const button=document.getElementById("finishButton");
  button.disabled=true;

  let location={status:"none"};

  try{
    setStatus("Henter GPS-posisjon før handelen avsluttes...");
    location=await getShoppingLocation();

    if(location.status !== "ok"){
      const continueWithoutGps=confirm(`${formatGpsLocation(location).replace(/<[^>]+>/g, "")}\n\nFortsette og avslutte handelen uten GPS?`);

      if(!continueWithoutGps){
        setStatus(formatGpsLocation(location), "error");
        return;
      }
    }

    setStatus(`${formatGpsLocation(location)}<br>Sender avslutning til Worker...`, location.status === "ok" ? "success" : "error");

    const data=await fetchJson(`${API_BASE}/shopping/finish`,{
      method:"POST",
      headers:{"Content-Type":"text/plain;charset=UTF-8"},
      body:JSON.stringify({
        boughtIds:[...boughtIds],
        location,
        latitude:location?.latitude,
        longitude:location?.longitude,
        accuracy:location?.accuracy,
        locationStatus:location?.status
      })
    });

    clearRememberedBoughtIds();
    await loadItems();
    setStatus(`Handelen er avsluttet. ${data.boughtCount} varer ble lagret som handlet.${shoppingSessionStatusText(data.session)}`,"success");
  }catch(error){
    setStatus(`Kunne ikke avslutte handelen.<br><br>${esc(error.message)}<br><br>${esc(formatGpsLocation(location))}`,"error");
  }finally{
    button.disabled=false;
    render();
  }
}

<script>
(function(){
  const APP_PAGE_RE = /^handleliste-[a-z0-9-]+\.html$/i;
  const HOME_TARGET = 'index.html?restoreMenu=1';

  function currentPage(){
    return location.pathname.split('/').pop() || 'handleliste-bestille.html';
  }

  function isAppPage(page){
    return APP_PAGE_RE.test(String(page || ''));
  }

  function safeAppTarget(value){
    if(!value) return '';
    try{
      const url = new URL(value, location.href);
      if(url.origin !== location.origin) return '';
      const page = url.pathname.split('/').pop();
      if(!isAppPage(page)) return '';
      return page + url.search + url.hash;
    }catch(e){
      const clean = String(value).trim();
      const page = clean.split('?')[0].split('#')[0];
      return isAppPage(page) ? clean : '';
    }
  }

  function currentTargetForBack(){
    const url = new URL(location.href);
    const page = currentPage();
    const params = new URLSearchParams(url.search);
    const legacyFrom = params.get('from');
    const existingBack = params.get('back');

    params.delete('from');

    if(!existingBack && legacyFrom){
      const safeLegacy = safeAppTarget(legacyFrom);
      if(safeLegacy) params.set('back', safeLegacy);
    }

    const query = params.toString();
    return page + (query ? '?' + query : '') + url.hash;
  }

  function getBackTarget(){
    const params = new URLSearchParams(location.search);
    return safeAppTarget(params.get('back')) || safeAppTarget(params.get('from')) || HOME_TARGET;
  }

  function addBackToUrl(rawHref){
    if(!rawHref) return rawHref;
    if(/^#|^(mailto|sms|tel|javascript):/i.test(rawHref)) return rawHref;

    try{
      const url = new URL(rawHref, location.href);
      if(url.origin !== location.origin) return rawHref;
      const page = url.pathname.split('/').pop();
      const here = currentPage();

      if(isAppPage(page) && page !== here){
        url.searchParams.delete('from');
        if(!url.searchParams.has('back')){
          url.searchParams.set('back', currentTargetForBack());
        }
        return page + url.search + url.hash;
      }
    }catch(e){}

    return rawHref;
  }

  function appBack(event){
    event.preventDefault();
    location.href = getBackTarget();
  }

  function initAppNavigation(){
    document.querySelectorAll('a[href]').forEach(function(anchor){
      const href = anchor.getAttribute('href');
      const nextHref = addBackToUrl(href);
      if(nextHref !== href) anchor.setAttribute('href', nextHref);
    });

    document.querySelectorAll('.top-buttons .top-button').forEach(function(button){
      if((button.textContent || '').trim() === '←'){
        button.addEventListener('click', appBack);
      }
    });
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', initAppNavigation);
  }else{
    initAppNavigation();
  }
})();
</script>
