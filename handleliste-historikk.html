<script>
const API_BASE="https://api-kvimarka92.carstereogarage.com";
function esc(value){return String(value==null?"":value).split("&").join("&amp;").split("<").join("&lt;").split(">").join("&gt;").split('"').join("&quot;").split("'").join("&#039;");}
async function fetchJson(url,options){const res=await fetch(url,Object.assign({credentials:"include",cache:"no-store"},options||{}));const data=await res.json().catch(()=>null);if(!res.ok||(data&&data.error)){throw new Error((data&&data.error)||(data&&data.detail)||`HTTP ${res.status}`);}return data;}
function setStatus(message,type){const el=document.getElementById("status");if(!el)return;el.className="status"+(type?` ${type}`:"");el.innerHTML=message||"";}
function formatDateTime(value){const date=new Date(value);if(Number.isNaN(date.getTime()))return String(value||"");return date.toLocaleString("no-NO",{dateStyle:"medium",timeStyle:"short"});}
function storeText(group){
  const store=[group.storeChain, group.storeName].filter(Boolean).join(" ").trim();
  const status=String(group.storeMatchStatus||"").trim();

  if(store){
    const distance=group.storeDistance!==null&&group.storeDistance!==undefined?` · ${group.storeDistance} m`:"";
    const unsure=status==="Uncertain"?" · usikker match":"";
    return `${store}${distance}${unsure}`;
  }

  if(status==="No match")return "Ingen butikkmatch";
  if(status==="No location")return "Uten posisjon";
  if(status==="Location denied")return "Posisjon avslått";
  if(status==="Location error")return "GPS-feil";
  return "";
}
function storeTextWithoutChain(group){
  const status=String(group.storeMatchStatus||"").trim();
  const storeName=String(group.storeName||"").trim();
  const storeChain=String(group.storeChain||"").trim();
  const store=storeName || storeChain;

  if(store){
    const distance=group.storeDistance!==null&&group.storeDistance!==undefined?` · ${group.storeDistance} m`:"";
    const unsure=status==="Uncertain"?" · usikker match":"";
    return `${store}${distance}${unsure}`;
  }

  if(status==="No match")return "Ingen butikkmatch";
  if(status==="No location")return "Uten posisjon";
  if(status==="Location denied")return "Posisjon avslått";
  if(status==="Location error")return "GPS-feil";
  return "";
}
function compareShoppingItemName(a,b){return String((a&&a.name)||(a&&a.itemName)||"").localeCompare(String((b&&b.name)||(b&&b.itemName)||""),"no",{numeric:true,sensitivity:"base"});}function compareHistoryItem(a,b){return String(a.type||"Annet").localeCompare(String(b.type||"Annet"),"no",{numeric:true,sensitivity:"base"})||compareShoppingItemName(a,b);}function sortedHistoryItems(items){return (Array.isArray(items)?items.slice():[]).sort(compareHistoryItem);}

function historyLogoUrl(group){
  // Historikk må ikke gjette logo fra andre handler. Det ga feil logo,
  // f.eks. Coop Mega-logo på REMA 1000 Nærbø. Vis bare logoen som API-et
  // eksplisitt sender på akkurat denne historikkgruppen.
  return String(group.storeLogoUrl||group.logoUrl||"").trim();
}
function renderHistory(groups){
  const root=document.getElementById("historyList");
  if(!groups.length){
    root.innerHTML='<div class="empty">Ingen handlehistorikk funnet.</div>';
    return;
  }
  root.innerHTML=groups.map(group=>{
    const logoUrl=historyLogoUrl(group);
    const store=storeText(group);
    const logo=logoUrl?`<img class="store-logo" src="${esc(logoUrl)}" alt="${esc(group.storeChain||group.storeName||"Butikk")}" onerror="this.remove();">`:"";
    return `<section class="history-group"><div class="history-title"><div><div class="history-date-line"><span class="history-date">${esc(formatDateTime(group.boughtAt))}</span><span class="history-count">${group.items.length} vare${group.items.length===1?"":"r"}</span></div>${store?`<div class="history-store">${esc(store)}</div>`:""}</div>${logo}</div><div class="history-list">${sortedHistoryItems(group.items).map(item=>`<div class="history-row"><div class="item-name">${esc(item.itemName)}</div><span class="badge">${esc(item.type||"Annet")}</span></div>`).join("")}</div></section>`;
  }).join("");
}
async function loadHistory(){setStatus("Laster handlehistorikk...");try{const data=await fetchJson(`${API_BASE}/shopping/history?limit=500&ts=${Date.now()}`);const groups=Array.isArray(data.groups)?data.groups:[];renderHistory(groups);setStatus(`Klar. Viser ${groups.length} ${groups.length===1?"handel":"handler"}, nyeste øverst.`, "success");}catch(error){setStatus(`Kunne ikke laste handlehistorikk.<br><br>${esc(error.message)}`, "error");}}
loadHistory();
</script>

<script>
(function(){
  const APP_PAGE_RE = /^handleliste-[a-z0-9-]+\.html$/i;
  const HOME_TARGET = 'index.html?restoreMenu=1';

  function currentPage(){
    return location.pathname.split('/').pop() || 'handleliste-bestille.html';
  }

  function isAppPage(page){
    return APP_PAGE_RE.test(String(page || ''));
  }

  function safeAppTarget(value){
    if(!value) return '';
    try{
      const url = new URL(value, location.href);
      if(url.origin !== location.origin) return '';
      const page = url.pathname.split('/').pop();
      if(!isAppPage(page)) return '';
      return page + url.search + url.hash;
    }catch(e){
      const clean = String(value).trim();
      const page = clean.split('?')[0].split('#')[0];
      return isAppPage(page) ? clean : '';
    }
  }

  function currentTargetForBack(){
    const url = new URL(location.href);
    const page = currentPage();
    const params = new URLSearchParams(url.search);
    const legacyFrom = params.get('from');
    const existingBack = params.get('back');

    params.delete('from');

    if(!existingBack && legacyFrom){
      const safeLegacy = safeAppTarget(legacyFrom);
      if(safeLegacy) params.set('back', safeLegacy);
    }

    const query = params.toString();
    return page + (query ? '?' + query : '') + url.hash;
  }

  function getBackTarget(){
    const params = new URLSearchParams(location.search);
    return safeAppTarget(params.get('back')) || safeAppTarget(params.get('from')) || HOME_TARGET;
  }

  function addBackToUrl(rawHref){
    if(!rawHref) return rawHref;
    if(/^#|^(mailto|sms|tel|javascript):/i.test(rawHref)) return rawHref;

    try{
      const url = new URL(rawHref, location.href);
      if(url.origin !== location.origin) return rawHref;
      const page = url.pathname.split('/').pop();
      const here = currentPage();

      if(isAppPage(page) && page !== here){
        url.searchParams.delete('from');
        if(!url.searchParams.has('back')){
          url.searchParams.set('back', currentTargetForBack());
        }
        return page + url.search + url.hash;
      }
    }catch(e){}

    return rawHref;
  }

  function appBack(event){
    event.preventDefault();
    location.href = getBackTarget();
  }

  function initAppNavigation(){
    document.querySelectorAll('a[href]').forEach(function(anchor){
      const href = anchor.getAttribute('href');
      const nextHref = addBackToUrl(href);
      if(nextHref !== href) anchor.setAttribute('href', nextHref);
    });

    document.querySelectorAll('.top-buttons .top-button').forEach(function(button){
      if((button.textContent || '').trim() === '←'){
        button.addEventListener('click', appBack);
      }
    });
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', initAppNavigation);
  }else{
    initAppNavigation();
  }
})();
</script>


<script>
/* Handleliste v51: lokal navigasjonsstack for tilbakeknapp innen Handleliste */
(function(){
  const STACK_KEY = "kvimarka92HandlelisteBackStack";
  const HOME_TARGET = "index.html?restoreMenu=1";
  const HANDLE_PAGE_RE = /^handleliste-[a-z0-9-]+\.html$/i;
  const MAX_STACK = 30;

  function pageFromUrl(value){
    try{
      const url = new URL(value, location.href);
      return url.pathname.split("/").pop() || "";
    }catch(error){
      return String(value || "").split("?")[0].split("#")[0].split("/").pop() || "";
    }
  }

  function isHandlelisteUrl(value){
    return HANDLE_PAGE_RE.test(pageFromUrl(value));
  }

  function relativeUrl(value){
    try{
      const url = new URL(value, location.href);
      if(url.origin !== location.origin) return "";
      const page = url.pathname.split("/").pop() || "";
      if(!HANDLE_PAGE_RE.test(page)) return "";
      return page + url.search + url.hash;
    }catch(error){
      const text = String(value || "").trim();
      return isHandlelisteUrl(text) ? text : "";
    }
  }

  function currentRelativeUrl(){
    const page = location.pathname.split("/").pop() || "";
    return page + location.search + location.hash;
  }

  function readStack(){
    try{
      const parsed = JSON.parse(sessionStorage.getItem(STACK_KEY) || "[]");
      return Array.isArray(parsed) ? parsed.filter(isHandlelisteUrl) : [];
    }catch(error){
      return [];
    }
  }

  function writeStack(stack){
    try{
      sessionStorage.setItem(STACK_KEY, JSON.stringify(stack.slice(-MAX_STACK)));
    }catch(error){}
  }

  function pushCurrentToHandlelisteStack(){
    const current = currentRelativeUrl();
    if(!isHandlelisteUrl(current)) return;
    const stack = readStack();
    if(stack[stack.length - 1] !== current){
      stack.push(current);
      writeStack(stack);
    }
  }

  function popPreviousFromHandlelisteStack(){
    const current = currentRelativeUrl();
    const stack = readStack();
    let target = "";
    while(stack.length){
      const candidate = stack.pop();
      if(candidate && candidate !== current){
        target = candidate;
        break;
      }
    }
    writeStack(stack);
    return target;
  }

  window.pushHandlelisteBackUrl = pushCurrentToHandlelisteStack;
  window.goHandlelisteBackOrHome = function(event){
    if(event){
      event.preventDefault();
      if(event.stopImmediatePropagation) event.stopImmediatePropagation();
      event.stopPropagation();
    }
    location.href = popPreviousFromHandlelisteStack() || HOME_TARGET;
    return false;
  };

  function shouldIgnoreClick(event, anchor){
    if(event.defaultPrevented) return true;
    if(event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return true;
    if(anchor.target && anchor.target !== "_self") return true;
    if(anchor.hasAttribute("download")) return true;
    const href = anchor.getAttribute("href") || "";
    if(!href || href === "#" || href.startsWith("#")) return true;
    if(/^(mailto|sms|tel|javascript):/i.test(href)) return true;
    return false;
  }

  document.addEventListener("click", function(event){
    const anchor = event.target && event.target.closest ? event.target.closest("a[href]") : null;
    if(!anchor) return;

    const isBackButton = anchor.hasAttribute("data-handleliste-back") ||
      (anchor.classList && anchor.classList.contains("top-button") && (anchor.textContent || "").trim() === "←");

    if(isBackButton){
      window.goHandlelisteBackOrHome(event);
      return;
    }

    const href = anchor.getAttribute("href") || "";

    if(/^(index\.html|\/index\.html)/i.test(href)){
      try{ sessionStorage.removeItem(STACK_KEY); }catch(error){}
      return;
    }

    if(shouldIgnoreClick(event, anchor)) return;

    if(isHandlelisteUrl(href)){
      const target = relativeUrl(href);
      if(target && target !== currentRelativeUrl()){
        pushCurrentToHandlelisteStack();
      }
    }
  }, true);
})();
</script>
