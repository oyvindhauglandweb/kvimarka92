*{box-sizing:border-box;}body{margin:0;padding:20px;background:var(--bg);color:var(--text);font-family:Arial,sans-serif;}.container{max-width:980px;margin:auto;}.header{text-align:center;margin-bottom:20px;}.site-title{margin:0;font-size:30px;}.subtitle{margin-top:8px;color:var(--muted);font-size:16px;}.top-buttons{display:flex;justify-content:center;align-items:center;gap:10px;margin:14px 0 0;}.top-button{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;padding:0;background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--text);text-decoration:none;font-size:24px;font-weight:bold;line-height:1;cursor:pointer;}.top-button:hover,.action-button:hover{background:var(--button-hover);}.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px;margin-bottom:10px;}.toolbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;}.action-button{display:inline-flex;align-items:center;justify-content:center;min-height:34px;padding:0 10px;background:var(--button);border:1px solid var(--border);border-radius:8px;color:var(--text);font-weight:bold;text-decoration:none;cursor:pointer;font-size:14px;}.status{color:var(--muted);line-height:1.35;font-size:14px;}.status.error{color:var(--danger);}.status.success{color:var(--success);}.history-group{border:1px solid var(--border);border-radius:10px;background:rgba(127,127,127,.04);padding:8px;margin-bottom:8px;}.history-title{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:start;font-weight:bold;margin-bottom:6px;}.history-date{font-size:15px;}.history-store{color:var(--muted);font-size:12px;margin-top:2px;line-height:1.25;}.history-count{color:var(--muted);font-size:12px;white-space:nowrap;}.store-logo{display:block;max-width:92px;max-height:34px;object-fit:contain;border-radius:5px;background:rgba(255,255,255,.06);padding:2px;}.history-list{display:flex;flex-direction:column;gap:3px;}.history-row{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;border:1px solid var(--border);border-radius:7px;padding:4px 6px;min-height:30px;}.item-name{font-weight:bold;font-size:14px;line-height:1.1;}.badge{display:inline-flex;align-items:center;min-height:18px;padding:0 6px;border-radius:999px;background:rgba(124,199,232,.16);color:var(--link);font-size:10px;font-weight:bold;white-space:nowrap;}.empty{padding:18px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:10px;}@media(max-width:700px){body{padding:6px;}.header{margin-bottom:12px;}.site-title{font-size:28px;}.card{padding:7px;margin-bottom:7px;border-radius:10px;}.action-button{flex:1 1 auto;min-height:31px;padding:0 7px;font-size:12px;}.history-group{padding:6px;margin-bottom:6px;}.history-row{padding:3px 5px;min-height:28px;border-radius:6px;}.item-name{font-size:13px;}.badge{min-height:16px;font-size:9px;padding:0 5px;}.history-title{grid-template-columns:1fr auto auto;gap:6px;}.store-logo{max-width:70px;max-height:28px;}}
/* shopping-toolbar-cleanup-2026-06-05 */ .top-button.bestille-top-button{font-size:20px;} .top-button.handle-top-button{font-size:20px;} .toolbar-separator{display:inline-block;width:12px;flex:0 0 12px;} @media(max-width:700px){.toolbar-separator{width:100%;flex:0 0 100%;height:0;}}

<body class="dark-mode"><script>
(function(){
  try{
    const savedDesign = localStorage.getItem("shoppingDesign") || "soft";
    document.documentElement.classList.toggle("classic-design-root", savedDesign === "classic");
  }catch(e){}
})();
window.applyShoppingDesignState = function(){
  try{
    const isClassic = document.documentElement.classList.contains("classic-design-root");
    const btn = document.getElementById("shoppingDesignToggle");
    if(btn){
      btn.textContent = isClassic ? "◩" : "◫";
      btn.title = isClassic ? "Bytt til mykt design" : "Bytt til klassisk design";
      btn.setAttribute("aria-label", btn.title);
    }
  }catch(e){}
};
window.toggleShoppingDesign = function(){
  try{
    const isClassic = document.documentElement.classList.toggle("classic-design-root");
    localStorage.setItem("shoppingDesign", isClassic ? "classic" : "soft");
    window.applyShoppingDesignState();
  }catch(e){}
};
document.addEventListener("DOMContentLoaded", window.applyShoppingDesignState);
</script>
<div class="container">
  <div class="header">
    <h1 class="site-title">Handleliste</h1>
    <div class="subtitle">Historikk</div>
    <div class="top-buttons">
      <a class="top-button" href="handleliste-handle.html" title="Tilbake til handleliste">←</a><a class="top-button bestille-top-button" href="handleliste-bestille.html" title="Bestille">☑</a>
      <a class="top-button" href="index.html" title="Hovedside">⌂</a>

  </div>

    <div class="toolbar">
      
      
      <button class="action-button" type="button" onclick="loadHistory()">Last på nytt</button>
    </div>

  <div class="card"><div id="historyList"></div></div>
</div>

<script>
const API_BASE="https://api-kvimarka92.carstereogarage.com";
function esc(value){return String(value??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");}
async function fetchJson(url,options){const res=await fetch(url,{credentials:"include",...(options||{})});const data=await res.json().catch(()=>null);if(!res.ok||(data&&data.error)){throw new Error(data?.error||data?.detail||`HTTP ${res.status}`);}return data;}
function setStatus(message,type){const el=document.getElementById("status");el.className="status"+(type?` ${type}`:"");el.innerHTML=message||"";}
function formatDateTime(value){const date=new Date(value);if(Number.isNaN(date.getTime()))return String(value||"");return date.toLocaleString("no-NO",{dateStyle:"medium",timeStyle:"short"});}
function storeText(group){
  const store=[group.storeChain, group.storeName].filter(Boolean).join(" ").trim();
  const status=String(group.storeMatchStatus||"").trim();

  if(store){
    const distance=group.storeDistance!==null&&group.storeDistance!==undefined?` · ${group.storeDistance} m`:"";
    const unsure=status==="Uncertain"?" · usikker match":"";
    return `${store}${distance}${unsure}`;
  }

  if(status==="No match")return "Ingen butikkmatch";
  if(status==="No location")return "Uten posisjon";
  if(status==="Location denied")return "Posisjon avslått";
  if(status==="Location error")return "GPS-feil";
  return "";
}
function renderHistory(groups){const root=document.getElementById("historyList");if(!groups.length){root.innerHTML='<div class="empty">Ingen handlehistorikk funnet.</div>';return;}root.innerHTML=groups.map(group=>{const store=storeText(group);const logoUrl=String(group.storeLogoUrl||group.logoUrl||"").trim();const logo=logoUrl?`<img class="store-logo" src="${esc(logoUrl)}" alt="${esc(group.storeChain||group.storeName||"Butikk")}" onerror="this.style.display='none';">`:"";return `<section class="history-group"><div class="history-title"><div><div class="history-date">${esc(formatDateTime(group.boughtAt))}</div>${store?`<div class="history-store">${esc(store)}</div>`:""}</div>${logo}<div class="history-count">${group.items.length} vare${group.items.length===1?"":"r"}</div></div><div class="history-list">${group.items.map(item=>`<div class="history-row"><div class="item-name">${esc(item.itemName)}</div><span class="badge">${esc(item.type||"Annet")}</span></div>`).join("")}</div></section>`;}).join("");}
async function loadHistory(){setStatus("Laster handlehistorikk...");try{const data=await fetchJson(`${API_BASE}/shopping/history?limit=500`);const groups=Array.isArray(data.groups)?data.groups:[];renderHistory(groups);setStatus(`Klar. Viser ${groups.length} handel${groups.length===1?"":"er"}, nyeste øverst.`, "success");}catch(error){setStatus(`Kunne ikke laste handlehistorikk.<br><br>${esc(error.message)}`, "error");}}
loadHistory();
</script>

<script>
(function(){
  const APP_PAGE_RE = /^handleliste-[a-z0-9-]+\.html$/i;
  const HOME_TARGET = 'index.html?restoreMenu=1';

  function currentPage(){
    return location.pathname.split('/').pop() || 'handleliste-bestille.html';
  }

  function isAppPage(page){
    return APP_PAGE_RE.test(String(page || ''));
  }

  function safeAppTarget(value){
    if(!value) return '';
    try{
      const url = new URL(value, location.href);
      if(url.origin !== location.origin) return '';
      const page = url.pathname.split('/').pop();
      if(!isAppPage(page)) return '';
      return page + url.search + url.hash;
    }catch(e){
      const clean = String(value).trim();
      const page = clean.split('?')[0].split('#')[0];
      return isAppPage(page) ? clean : '';
    }
  }

  function currentTargetForBack(){
    const url = new URL(location.href);
    const page = currentPage();
    const params = new URLSearchParams(url.search);
    const legacyFrom = params.get('from');
    const existingBack = params.get('back');

    params.delete('from');

    if(!existingBack && legacyFrom){
      const safeLegacy = safeAppTarget(legacyFrom);
      if(safeLegacy) params.set('back', safeLegacy);
    }

    const query = params.toString();
    return page + (query ? '?' + query : '') + url.hash;
  }

  function getBackTarget(){
    const params = new URLSearchParams(location.search);
    return safeAppTarget(params.get('back')) || safeAppTarget(params.get('from')) || HOME_TARGET;
  }

  function addBackToUrl(rawHref){
    if(!rawHref) return rawHref;
    if(/^#|^(mailto|sms|tel|javascript):/i.test(rawHref)) return rawHref;

    try{
      const url = new URL(rawHref, location.href);
      if(url.origin !== location.origin) return rawHref;
      const page = url.pathname.split('/').pop();
      const here = currentPage();

      if(isAppPage(page) && page !== here){
        url.searchParams.delete('from');
        if(!url.searchParams.has('back')){
          url.searchParams.set('back', currentTargetForBack());
        }
        return page + url.search + url.hash;
      }
    }catch(e){}

    return rawHref;
  }

  function appBack(event){
    event.preventDefault();
    location.href = getBackTarget();
  }

  function initAppNavigation(){
    document.querySelectorAll('a[href]').forEach(function(anchor){
      const href = anchor.getAttribute('href');
      const nextHref = addBackToUrl(href);
      if(nextHref !== href) anchor.setAttribute('href', nextHref);
    });

    document.querySelectorAll('.top-buttons .top-button').forEach(function(button){
      if((button.textContent || '').trim() === '←'){
        button.addEventListener('click', appBack);
      }
    });
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', initAppNavigation);
  }else{
    initAppNavigation();
  }
})();
</script>
