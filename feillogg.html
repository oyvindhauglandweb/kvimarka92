<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feilmeldingshistorikk</title>
<style>
:root{
  color-scheme:dark;
  --bg:#111;
  --panel:#1f1f1f;
  --panel2:#292929;
  --panel3:#171717;
  --text:#f4f4f4;
  --muted:#bdbdbd;
  --border:#3a3a3a;
  --accent:#3a8197;
  --accent-hover:#4796ae;
  --danger:#ff8585;
  --warning:#ffd27a;
  --ok:#96e696;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;padding:16px}
.wrap{max-width:1500px;margin:0 auto}
header{text-align:center;margin:4px 0 18px}
h1{font-size:30px;margin:0}.subtitle{margin-top:6px;color:var(--muted)}
.card{background:var(--panel);border:1px solid #292929;border-radius:12px;padding:16px;margin-bottom:14px}
.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.toolbar-group{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
button,a.button{border:0;border-radius:8px;background:#2a2a2a;color:var(--text);padding:11px 15px;font-weight:bold;font-size:15px;text-decoration:none;cursor:pointer;min-height:42px;display:inline-flex;align-items:center;justify-content:center}
button:hover,a.button:hover{background:#343434}button.primary{background:var(--accent)}button.primary:hover{background:var(--accent-hover)}button:disabled{opacity:.45;cursor:not-allowed}
.filters{display:grid;grid-template-columns:repeat(4,minmax(160px,1fr)) auto;gap:10px;align-items:end}
label{display:block;font-weight:bold;font-size:13px;margin:0 0 6px;color:var(--muted)}
input,select,textarea{width:100%;border:1px solid var(--border);border-radius:8px;background:var(--panel2);color:var(--text);padding:10px;font-size:15px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);border-color:transparent}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:var(--panel3);border:1px solid var(--border);border-radius:10px;padding:13px}.stat-label{color:var(--muted);font-size:13px}.stat-value{font-size:25px;font-weight:bold;margin-top:3px}
.message{display:none;border-radius:10px;padding:13px;margin-bottom:14px;white-space:pre-wrap;line-height:1.4}.message.show{display:block}.message.error{background:#2a1818;color:var(--danger)}.message.info{background:#17232a;color:#a9def0}.message.ok{background:#172417;color:var(--ok)}
.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:10px}
table{width:100%;border-collapse:collapse;min-width:1050px}th,td{padding:11px 10px;text-align:left;border-bottom:1px solid #333;vertical-align:top}th{position:sticky;top:0;background:#252525;color:#ddd;font-size:13px;z-index:1}tbody tr{cursor:pointer}tbody tr:hover{background:#292929}tbody tr:last-child td{border-bottom:0}
.cell-title{font-weight:bold;max-width:390px}.cell-sub{color:var(--muted);font-size:13px;margin-top:4px;max-width:390px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.nowrap{white-space:nowrap}
.badge{display:inline-flex;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:bold;background:#333}.badge-new{background:#492222;color:#ffb0b0}.badge-work{background:#493c1c;color:#ffe09a}.badge-solved{background:#193d24;color:#a7edb7}.badge-ignored{background:#333;color:#bbb}
.empty{text-align:center;color:var(--muted);padding:35px 12px}.pagination{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:14px}.page-info{color:var(--muted);min-width:150px;text-align:center}
.dialog-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:16px;z-index:100}.dialog-backdrop.open{display:flex}.dialog{width:min(1000px,100%);max-height:94vh;overflow:auto;background:var(--panel);border:1px solid #444;border-radius:14px;box-shadow:0 18px 60px rgba(0,0,0,.5)}.dialog-head{position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--border);padding:16px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start;z-index:2}.dialog-head h2{margin:0;font-size:22px}.close-btn{font-size:24px;width:42px;height:42px;padding:0;flex:0 0 auto}.dialog-body{padding:16px}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.detail{background:var(--panel3);border:1px solid var(--border);border-radius:9px;padding:11px}.detail.full{grid-column:1/-1}.detail-label{font-size:12px;font-weight:bold;color:var(--muted);text-transform:uppercase;margin-bottom:6px}.detail-value{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.45}.code{font-family:Consolas,"Courier New",monospace;font-size:13px;max-height:300px;overflow:auto}.edit-grid{display:grid;grid-template-columns:220px 1fr;gap:12px;margin-top:14px}.dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:14px;flex-wrap:wrap}
@media(max-width:900px){.filters{grid-template-columns:1fr 1fr}.filters .filter-actions{grid-column:1/-1}.stats{grid-template-columns:1fr 1fr}.detail-grid,.edit-grid{grid-template-columns:1fr}.detail.full{grid-column:auto}}
@media(max-width:560px){body{padding:10px}h1{font-size:25px}.filters,.stats{grid-template-columns:1fr}.toolbar-group,button,a.button{width:100%}.dialog-backdrop{padding:0}.dialog{height:100vh;max-height:none;border-radius:0}.dialog-actions button{width:100%}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>FEILMELDINGSHISTORIKK</h1>
    <div class="subtitle">Kun tilgjengelig for globale administratorer</div>
  </header>

  <div id="message" class="message"></div>

  <section class="card">
    <div class="toolbar">
      <div class="toolbar-group">
        <a class="button" href="index.html?restoreMenu=1">Tilbake til hovedmeny</a>
        <button type="button" id="refreshBtn">Oppdater</button>
      </div>
      <div id="lastUpdated" class="subtitle"></div>
    </div>
  </section>

  <section class="card">
    <div class="filters">
      <div><label for="applicationFilter">Applikasjon</label><select id="applicationFilter"><option value="">Alle</option></select></div>
      <div><label for="pageFilter">Side</label><select id="pageFilter"><option value="">Alle</option></select></div>
      <div><label for="statusFilter">Status</label><select id="statusFilter"><option value="">Alle</option><option>Ny</option><option>Undersøkes</option><option>Løst</option><option>Ignorert</option></select></div>
      <div><label for="typeFilter">Feiltype</label><select id="typeFilter"><option value="">Alle</option></select></div>
      <div class="filter-actions"><button type="button" class="primary" id="applyFiltersBtn">Bruk filter</button></div>
    </div>
  </section>

  <section class="card">
    <div class="stats">
      <div class="stat"><div class="stat-label">Treff</div><div class="stat-value" id="totalCount">–</div></div>
      <div class="stat"><div class="stat-label">Nye på denne siden</div><div class="stat-value" id="newCount">–</div></div>
      <div class="stat"><div class="stat-label">Forekomster på denne siden</div><div class="stat-value" id="occurrenceCount">–</div></div>
      <div class="stat"><div class="stat-label">Siste feil</div><div class="stat-value" id="latestTime" style="font-size:17px">–</div></div>
    </div>
  </section>

  <section class="card">
    <div class="table-wrap">
      <table>
        <thead><tr><th>Siste forekomst</th><th>Feil</th><th>Applikasjon / side</th><th>Bruker</th><th>Antall</th><th>Status</th></tr></thead>
        <tbody id="errorRows"><tr><td colspan="6" class="empty">Laster feillogg…</td></tr></tbody>
      </table>
    </div>
    <div class="pagination">
      <button type="button" id="prevBtn">Forrige</button>
      <div class="page-info" id="pageInfo">Side 1</div>
      <button type="button" id="nextBtn">Neste</button>
    </div>
  </section>
</div>

<div id="detailBackdrop" class="dialog-backdrop" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
  <div class="dialog">
    <div class="dialog-head"><div><h2 id="detailTitle">Feildetaljer</h2><div id="detailSubtitle" class="subtitle"></div></div><button type="button" class="close-btn" id="closeDetailBtn" aria-label="Lukk">×</button></div>
    <div class="dialog-body">
      <div id="detailGrid" class="detail-grid"></div>
      <div class="edit-grid">
        <div><label for="detailStatus">Status</label><select id="detailStatus"><option>Ny</option><option>Undersøkes</option><option>Løst</option><option>Ignorert</option></select></div>
        <div><label for="resolutionNote">Løsningsnotat</label><textarea id="resolutionNote" rows="5" placeholder="Beskriv rotårsak og løsning…"></textarea></div>
      </div>
      <div class="dialog-actions"><button type="button" id="cancelDetailBtn">Lukk</button><button type="button" class="primary" id="saveDetailBtn">Lagre endringer</button></div>
    </div>
  </div>
</div>

<script>
const API_BASE = "https://api-kvimarka92.carstereogarage.com";
const PAGE_SIZE = 100;
let currentPage = 1;
let totalRows = 0;
let hasNextPage = false;
let currentRows = [];
let selectedError = null;

const el = id => document.getElementById(id);

function showMessage(type, text){
  const box = el("message");
  box.className = "message" + (text ? ` show ${type}` : "");
  box.textContent = text || "";
}

function escapeHtml(value){
  return String(value ?? "").replace(/[&<>"]/g, character => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[character]);
}

function formatDate(value){
  if(!value) return "–";
  const date = new Date(value);
  if(Number.isNaN(date.getTime())) return String(value);
  return new Intl.DateTimeFormat("nb-NO", {dateStyle:"short", timeStyle:"medium", timeZone:"Europe/Oslo"}).format(date);
}

function statusClass(status){
  return status === "Ny" ? "badge-new" : status === "Undersøkes" ? "badge-work" : status === "Løst" ? "badge-solved" : "badge-ignored";
}

function makeQuery(){
  const params = new URLSearchParams({page:String(currentPage), size:String(PAGE_SIZE)});
  const application = el("applicationFilter").value;
  const pageName = el("pageFilter").value;
  const status = el("statusFilter").value;
  const errorType = el("typeFilter").value;
  if(application) params.set("application", application);
  if(pageName) params.set("pageName", pageName);
  if(status) params.set("status", status);
  if(errorType) params.set("errorType", errorType);
  return params.toString();
}

async function apiFetch(path, options = {}){
  const response = await fetch(`${API_BASE}${path}`, {credentials:"include", ...options});
  const data = await response.json().catch(() => ({}));
  if(!response.ok) throw new Error(data.error || data.detail || `HTTP ${response.status}`);
  return data;
}

function updateDynamicFilter(selectId, values){
  const select = el(selectId);
  const selected = select.value;
  const unique = [...new Set(values.map(value => String(value || "").trim()).filter(Boolean))].sort((a,b) => a.localeCompare(b,"nb",{numeric:true}));
  for(const value of unique){
    if([...select.options].some(option => option.value === value)) continue;
    const option = document.createElement("option"); option.value = value; option.textContent = value; select.appendChild(option);
  }
  if([...select.options].some(option => option.value === selected)) select.value = selected;
}

function renderRows(){
  const tbody = el("errorRows");
  if(!currentRows.length){
    tbody.innerHTML = '<tr><td colspan="6" class="empty">Ingen feilmeldinger samsvarer med filteret.</td></tr>';
    return;
  }
  tbody.innerHTML = currentRows.map(row => `
    <tr data-id="${row.id}">
      <td class="nowrap">${escapeHtml(formatDate(row.lastOccurredAt || row.occurredAt))}</td>
      <td><div class="cell-title">${escapeHtml(row.name || row.errorMessage || "Ukjent feil")}</div><div class="cell-sub">${escapeHtml(row.errorMessage || "")}</div></td>
      <td><div>${escapeHtml(row.application || "–")}</div><div class="cell-sub">${escapeHtml(row.page || "–")}</div></td>
      <td><div>${escapeHtml(row.userName || "–")}</div><div class="cell-sub">${escapeHtml(row.userRole || "")}${row.user ? ` · ID ${row.user}` : ""}</div></td>
      <td class="nowrap">${Number(row.occurrences || 0).toLocaleString("nb-NO")}</td>
      <td><span class="badge ${statusClass(row.status)}">${escapeHtml(row.status || "Ny")}</span></td>
    </tr>`).join("");
  tbody.querySelectorAll("tr[data-id]").forEach(row => row.addEventListener("click", () => openDetail(Number(row.dataset.id))));
}

function renderStats(){
  el("totalCount").textContent = totalRows.toLocaleString("nb-NO");
  el("newCount").textContent = currentRows.filter(row => row.status === "Ny").length.toLocaleString("nb-NO");
  el("occurrenceCount").textContent = currentRows.reduce((sum,row) => sum + Number(row.occurrences || 0),0).toLocaleString("nb-NO");
  el("latestTime").textContent = currentRows.length ? formatDate(currentRows[0].lastOccurredAt || currentRows[0].occurredAt) : "–";
  const pages = Math.max(1, Math.ceil(totalRows / PAGE_SIZE));
  el("pageInfo").textContent = `Side ${currentPage} av ${pages}`;
  el("prevBtn").disabled = currentPage <= 1;
  el("nextBtn").disabled = !hasNextPage;
}

async function loadErrors(){
  showMessage("", "");
  el("errorRows").innerHTML = '<tr><td colspan="6" class="empty">Laster feillogg…</td></tr>';
  el("refreshBtn").disabled = true;
  try{
    const data = await apiFetch(`/admin/error-log?${makeQuery()}`);
    currentRows = Array.isArray(data.results) ? data.results : [];
    totalRows = Number(data.count || 0);
    hasNextPage = !!data.next;
    updateDynamicFilter("applicationFilter", currentRows.map(row => row.application));
    updateDynamicFilter("pageFilter", currentRows.map(row => row.page));
    updateDynamicFilter("typeFilter", currentRows.map(row => row.errorType));
    renderRows(); renderStats();
    el("lastUpdated").textContent = `Oppdatert ${formatDate(new Date().toISOString())}`;
  }catch(error){
    currentRows = []; totalRows = 0; hasNextPage = false; renderRows(); renderStats();
    const message = /Administrator access required/i.test(error.message)
      ? "Du har ikke administratorrettigheter til feilmeldingshistorikken."
      : `Kunne ikke laste feilmeldingshistorikken. ${error.message}`;
    showMessage("error", message);
  }finally{ el("refreshBtn").disabled = false; }
}

function detailItem(label, value, classes = ""){
  return `<div class="detail ${classes}"><div class="detail-label">${escapeHtml(label)}</div><div class="detail-value ${classes.includes("code") ? "code" : ""}">${escapeHtml(value || "–")}</div></div>`;
}

function openDetail(id){
  selectedError = currentRows.find(row => row.id === id) || null;
  if(!selectedError) return;
  el("detailTitle").textContent = selectedError.name || "Feildetaljer";
  el("detailSubtitle").textContent = `${selectedError.application || "Ukjent applikasjon"} · ${selectedError.page || "Ukjent side"}`;
  el("detailStatus").value = selectedError.status || "Ny";
  el("resolutionNote").value = selectedError.resolutionNote || "";
  el("detailGrid").innerHTML = [
    detailItem("Feilmelding", selectedError.errorMessage, "full"),
    detailItem("Feiltype", selectedError.errorType),
    detailItem("Fingerprint", selectedError.fingerprint, "code"),
    detailItem("Første / registrert", formatDate(selectedError.createdAt || selectedError.occurredAt)),
    detailItem("Siste forekomst", formatDate(selectedError.lastOccurredAt || selectedError.occurredAt)),
    detailItem("Antall forekomster", Number(selectedError.occurrences || 0).toLocaleString("nb-NO")),
    detailItem("Bruker", `${selectedError.userName || "–"}${selectedError.user ? ` (ID ${selectedError.user})` : ""}`),
    detailItem("Rolle", selectedError.userRole),
    detailItem("Enhet", selectedError.device),
    detailItem("Nettleser", selectedError.browser),
    detailItem("Operativsystem", selectedError.operatingSystem),
    detailItem("Stack trace", selectedError.stackTrace, "full code"),
    detailItem("Kontekst", selectedError.context, "full code")
  ].join("");
  el("detailBackdrop").classList.add("open");
  document.body.style.overflow = "hidden";
}

function closeDetail(){
  el("detailBackdrop").classList.remove("open");
  document.body.style.overflow = "";
  selectedError = null;
}

async function saveDetail(){
  if(!selectedError) return;
  const button = el("saveDetailBtn");
  button.disabled = true; button.textContent = "Lagrer…";
  try{
    const data = await apiFetch("/admin/error-log/update", {
      method:"POST",
      headers:{"Content-Type":"text/plain;charset=UTF-8"},
      body:JSON.stringify({id:selectedError.id,status:el("detailStatus").value,resolutionNote:el("resolutionNote").value})
    });
    const index = currentRows.findIndex(row => row.id === selectedError.id);
    if(index >= 0 && data.error) currentRows[index] = data.error;
    renderRows(); renderStats(); closeDetail(); showMessage("ok", "Feilmeldingen er oppdatert.");
  }catch(error){ showMessage("error", `Kunne ikke oppdatere feilmeldingen. ${error.message}`); }
  finally{ button.disabled = false; button.textContent = "Lagre endringer"; }
}

el("refreshBtn").addEventListener("click", loadErrors);
el("applyFiltersBtn").addEventListener("click", () => {currentPage = 1; loadErrors();});
el("prevBtn").addEventListener("click", () => {if(currentPage > 1){currentPage--; loadErrors();}});
el("nextBtn").addEventListener("click", () => {if(hasNextPage){currentPage++; loadErrors();}});
el("closeDetailBtn").addEventListener("click", closeDetail);
el("cancelDetailBtn").addEventListener("click", closeDetail);
el("saveDetailBtn").addEventListener("click", saveDetail);
el("detailBackdrop").addEventListener("click", event => {if(event.target === el("detailBackdrop")) closeDetail();});
document.addEventListener("keydown", event => {if(event.key === "Escape" && el("detailBackdrop").classList.contains("open")) closeDetail();});

loadErrors();
</script>
<script src="shared/kvimarka-version-footer.js" data-version="V0001"></script>
</body>
</html>
