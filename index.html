<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kvimarka 92</title>

<style>
:root{
  --bg:#f2f2f2;
  --card:#ffffff;
  --text:#333333;
  --muted:#667;
  --border:#cccccc;
  --link:#1f789d;
}

body.dark-mode{
  --bg:#151515;
  --card:#242424;
  --text:#eeeeee;
  --muted:#bbbbbb;
  --border:#555555;
  --link:#7cc7e8;
}

body{
  margin:0;
  padding:20px;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
}

.container{
  max-width:1200px;
  margin:auto;
}

.header{
  text-align:center;
  margin-bottom:36px;
}

.site-title{
  margin:0;
  font-size:32px;
}

.tagline{
  margin-top:8px;
  color:var(--muted);
  font-size:17px;
}

.loading,
.empty-message{
  color:var(--muted);
  padding:10px 0;
}

.error-box{
  border:1px solid #b54;
  border-radius:8px;
  padding:14px;
  background:rgba(180,80,80,.12);
  color:var(--text);
}

.create-route-modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:10000;
  background:rgba(0,0,0,.72);
  padding:20px;
  box-sizing:border-box;
  overflow:auto;
}

.create-route-modal.open{
  display:block;
}

.create-route-modal-content{
  max-width:720px;
  margin:60px auto;
  padding:18px;
  border:1px solid var(--border);
  border-radius:14px;
  background:var(--card);
  color:var(--text);
  box-sizing:border-box;
}

.create-route-modal-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:16px;
}

.create-route-modal-title{
  font-size:22px;
  font-weight:bold;
}

.create-route-close{
  border:1px solid var(--border);
  border-radius:8px;
  background:var(--card);
  color:var(--text);
  width:42px;
  height:42px;
  font-size:24px;
  font-weight:bold;
  cursor:pointer;
}

.create-route-form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.create-route-field{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.create-route-field.full{
  grid-column:1 / -1;
}

.create-route-field label{
  font-size:14px;
  font-weight:bold;
}

.create-route-field input,
.create-route-field select,
.create-route-field textarea{
  width:100%;
  min-height:40px;
  padding:0 12px;
  border:1px solid var(--border);
  border-radius:8px;
  background:var(--card);
  color:var(--text);
  font-size:15px;
  font-family:Arial,sans-serif;
  box-sizing:border-box;
}

.create-route-field textarea{
  min-height:120px;
  padding:10px 12px;
  resize:vertical;
}

.create-route-actions{
  display:flex;
  justify-content:flex-end;
  gap:10px;
  margin-top:16px;
}

.create-route-button{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:36px;
  padding:0 14px;
  border:1px solid var(--border);
  border-radius:8px;
  background:var(--card);
  color:var(--text);
  font-weight:bold;
  cursor:pointer;
}

.create-route-button.primary{
  background:var(--link);
  color:#fff;
  border-color:var(--link);
}

.create-route-status{
  display:none;
  margin-top:12px;
  padding:10px 12px;
  border:1px solid var(--border);
  border-radius:8px;
  line-height:1.45;
}

.create-route-status.error{
  display:block;
  color:#d77;
  border-color:#b85c5c;
}

.create-route-status.success{
  display:block;
  color:#72c184;
  border-color:#4f8f5f;
}

@media(max-width:800px){
  .create-route-form-grid{
    grid-template-columns:1fr;
  }

  .create-route-actions{
    flex-direction:column;
  }

  .create-route-button{
    width:100%;
  }
}

/* Path menu */

.path-menu{
  max-width:720px;
  margin:0;
}

.menu-row{
  margin-bottom:12px;
}

.menu-row.depth-0{ margin-left:0; }
.menu-row.depth-1{ margin-left:30px; }
.menu-row.depth-2{ margin-left:60px; }
.menu-row.depth-3{ margin-left:90px; }
.menu-row.depth-4{ margin-left:120px; }
.menu-row.depth-5{ margin-left:150px; }
.menu-row.depth-6{ margin-left:180px; }
.menu-row.depth-7{ margin-left:210px; }

.path-button{
  display:flex;
  align-items:center;
  justify-content:center;
  width:338px;
  max-width:calc(100vw - 32px);
  min-height:44px;
  padding:0 18px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:8px;
  color:var(--text);
  text-decoration:none;
  font-size:18px;
  font-weight:bold;
  box-sizing:border-box;
  text-align:center;
  cursor:pointer;
  font-family:Arial,sans-serif;
}

.path-button:hover{
  background:#e9eef2;
}

body.dark-mode .path-button:hover{
  background:#3a3a3a;
}

.path-button.active:hover{
  color:#6fbf73;
}

.path-button.active{
  color:#6fbf73;
}

.path-button.leaf{
  color:var(--text);
}

.path-button.placeholder{
  opacity:.55;
}

/* Login widget */

.login-widget{
  position:absolute;
  top:20px;
  right:max(20px, calc((100vw - 1200px) / 2));
  z-index:9999;
  height:38px;
  display:flex;
  align-items:center;
}

.login-status{
  display:flex;
  align-items:center;
  justify-content:center;
  width:38px;
  height:38px;
  min-width:38px;
  min-height:38px;
  padding:0;
  border:1px solid var(--border);
  background:var(--card);
  border-radius:50%;
  color:var(--muted);
  text-decoration:none;
  font-size:13px;
  font-weight:bold;
  line-height:1;
  opacity:.86;
  box-sizing:border-box;
  cursor:pointer;
  white-space:nowrap;
}

.login-status:hover{
  opacity:1;
  color:var(--text);
  background-color:var(--card);
}

.login-status.is-signin{
  border:none;
  border-radius:0;
  background-color:transparent;
  background-image:url("LogInDG.png");
  background-repeat:no-repeat;
  background-position:center;
  background-size:38px 38px;
  text-indent:-9999px;
  overflow:hidden;
}

.login-menu{
  position:absolute;
  top:44px;
  right:0;
  min-width:247px;
  padding:10px;
  border:1px solid var(--border);
  border-radius:10px;
  background:var(--card);
  color:var(--text);
  box-shadow:0 8px 24px rgba(0,0,0,.18);
  box-sizing:border-box;
}

.login-menu-name{
  font-weight:bold;
  font-size:13px;
  margin-bottom:8px;
  color:var(--text);
  white-space:nowrap;
}

.login-menu-link{
  display:block;
  padding:8px 10px;
  margin:0 -4px -4px;
  border-radius:8px;
  color:var(--link);
  text-decoration:none;
  font-weight:bold;
  font-size:13px;
}

.login-menu-link:hover{
  background:rgba(127,127,127,.10);
}

.login-menu-link:active{
  background:rgba(127,127,127,.22);
}

@media(max-width:800px){
  body{
    padding:14px;
  }

  .site-title{
    font-size:28px;
  }

  .login-widget{
    top:10px;
    right:10px;
  }

  .path-menu{
    max-width:100%;
  }

  .path-button{
    width:247px;
    max-width:calc(100vw - 32px);
    font-size:17px;
  }

  .menu-row.depth-0{ margin-left:0; }
  .menu-row.depth-1{ margin-left:24px; }
  .menu-row.depth-2{ margin-left:48px; }
  .menu-row.depth-3{ margin-left:72px; }
  .menu-row.depth-4{ margin-left:96px; }
  .menu-row.depth-5{ margin-left:120px; }
  .menu-row.depth-6{ margin-left:144px; }
  .menu-row.depth-7{ margin-left:168px; }

}
</style>
</head>

<body class="dark-mode">

<div class="login-widget">
  <a id="loginStatus"
     class="login-status is-signin"
     href="https://api-kvimarka92.carstereogarage.com/login?returnUrl=https%3A%2F%2Fkvimarka92.carstereogarage.com%2F"
     Sign in
  </a>

  <div id="loginMenu" class="login-menu" style="display:none;">
    <div id="loginMenuName" class="login-menu-name"></div>
    <a id="logoutLink" class="login-menu-link" href="#">Logg ut</a>
  </div>
</div>

<div class="container">

  <div class="header">
    <h1 class="site-title">Kvimarka 92</h1>
    <div class="tagline">Informasjon • Dokumentasjon • Fellesskap</div>
  </div>

  <div id="statusBox" class="loading">Laster meny...</div>

  <div id="pathMenu" class="path-menu" style="display:none;"></div>

</div>


<div class="create-route-modal" id="createRouteModal">
  <div class="create-route-modal-content">
    <div class="create-route-modal-header">
      <div class="create-route-modal-title">Opprett ny feriedestinasjon</div>
      <button class="create-route-close" type="button" onclick="closeCreateRouteCaseDialog()">×</button>
    </div>

    <form id="createRouteCaseForm">
      <div class="create-route-form-grid">
        <div class="create-route-field">
          <label for="newRouteCaseName">Navn</label>
          <input id="newRouteCaseName" type="text" placeholder="For eksempel London 2003" required>
        </div>

        <div class="create-route-field">
          <label for="newRouteAccessLevel">Tilgang</label>
          <select id="newRouteAccessLevel">
            <option value="Private">Private</option>
            <option value="Public">Public</option>
            <option value="Administrator">Administrator</option>
          </select>
        </div>

        <div class="create-route-field full">
          <label for="newRouteGeneralDescription">Generell beskrivelse</label>
          <textarea id="newRouteGeneralDescription" placeholder="Skriv en kort generell beskrivelse av reiseruten..."></textarea>
        </div>
      </div>

      <div class="create-route-status" id="createRouteStatus"></div>

      <div class="create-route-actions">
        <button class="create-route-button" type="button" onclick="closeCreateRouteCaseDialog()">Avbryt</button>
        <button class="create-route-button primary" type="submit" id="createRouteSubmitButton">Opprett reiserute</button>
      </div>
    </form>
  </div>
</div>

<script>
const API_BASE = "https://api-kvimarka92.carstereogarage.com";

let currentUser = null;
let allMenuItems = [];
let routeCases = [];

const LEVEL_FIELDS = [
  "level1",
  "level2",
  "level3",
  "level4",
  "level5",
  "level6"
];

const menuState = {
  area: "",
  selectedLevels: []
};

const MENU_STATE_STORAGE_KEY = "kvimarka92MenuState";


const HOLIDAY_ROOT_LABELS = [
  "feriereiser",
  "ferier",
  "ferieturer"
];

const DEFAULT_ROUTE_CASE_SUBMENU = [
  {
    buttonText:"Reiserute",
    sortOrder:1,
    url:"reiserute.html?case={case}"
  }
];

const ROUTE_MENU_KEYWORDS = [
  "ferie",
  "ferier",
  "ferietur",
  "ferieturer",
  "reiserute",
  "reiseruter",
  "route",
  "routes",
  "holiday",
  "holidays"
];

function esc(value){
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function getInitials(nameOrEmail){
  const value = String(nameOrEmail || "").trim();

  if(!value){
    return "?";
  }

  const namePart = value.includes("@")
    ? value.split("@")[0]
    : value;

  const parts = namePart
    .split(/\s+/)
    .filter(Boolean);

  if(parts.length >= 2){
    return (parts[0][0] + parts[1][0]).toUpperCase();
  }

  return namePart.slice(0, 2).toUpperCase();
}

async function fetchJson(url, options = {}){
  const res = await fetch(url, options);

  if(!res.ok){
    const text = await res.text();
    throw new Error(text || "Request failed");
  }

  return await res.json();
}

async function fetchCurrentUser(){
  try{
    return await fetchJson(`${API_BASE}/whoami`, {
      credentials:"include"
    });
  }catch(error){
    return null;
  }
}

async function performLogout(){
  try{
    await fetch(`${API_BASE}/cdn-cgi/access/logout`, {
      method:"GET",
      credentials:"include",
      mode:"no-cors"
    });
  }catch(error){
    console.warn("Logout request may have been blocked, continuing anyway.", error);
  }

  window.location.href = "index.html?logout=" + Date.now();
}

function setupLoginWidget(){
  const loginStatus = document.getElementById("loginStatus");
  const loginMenu = document.getElementById("loginMenu");
  const loginMenuName = document.getElementById("loginMenuName");
  const logoutLink = document.getElementById("logoutLink");

  if(currentUser){
    const displayName =
      currentUser.name || currentUser.email || "Innlogget";

    loginStatus.textContent = getInitials(displayName);
    loginStatus.href = "#";
    loginStatus.classList.remove("is-signin");
    loginStatus.classList.add("signed-in");
    loginStatus.title = displayName;

    loginMenuName.textContent = displayName;

    loginStatus.onclick = function(event){
      event.preventDefault();
      loginMenu.style.display =
        loginMenu.style.display === "block" ? "none" : "block";
    };

    logoutLink.onclick = function(event){
      event.preventDefault();
      performLogout();
    };
  }else{
  const returnUrl =
    window.location.origin +
    window.location.pathname +
    window.location.search;

  loginStatus.textContent = "Sign in";
  loginStatus.href =
    `${API_BASE}/login?returnUrl=${encodeURIComponent(returnUrl)}`;

  loginStatus.classList.add("is-signin");
  loginStatus.classList.remove("signed-in");
  loginStatus.title = "Logg inn";
  loginStatus.onclick = null;
  loginMenu.style.display = "none";
  }
}

function getAvailableAreas(){
  const areas = [
    {
      key:"public",
      label:"Public",
      visible:true
    },
    {
      key:"private",
      label:"Privat",
      visible:!!currentUser
    },
    {
      key:"administrator",
      label:"Admin",
      visible:!!currentUser && currentUser.role === "Administrator"
    }
  ];

  return areas.filter(area => area.visible);
}

function itemBelongsToArea(item, area){
  if(area === "public") return item.public;
  if(area === "private") return item.private;
  if(area === "administrator") return item.administrator;
  return false;
}

function itemsForCurrentArea(){
  if(!menuState.area){
    return [];
  }

  return allMenuItems.filter(item =>
    itemBelongsToArea(item, menuState.area)
  );
}

function uniqueSorted(values){
  return Array.from(new Set(values.filter(Boolean)))
    .sort((a, b) => a.localeCompare(b, "no"));
}

function makeRow(depth, button){
  const row = document.createElement("div");
  row.className = `menu-row depth-${depth}`;
  row.appendChild(button);
  return row;
}

function makeButton(text, options = {}){
  const button = document.createElement(options.href ? "a" : "button");
  button.className = "path-button";

  if(options.active){
    button.classList.add("active");
  }

  if(options.leaf){
    button.classList.add("leaf");
  }

  if(options.placeholder){
    button.classList.add("placeholder");
  }

  button.textContent = text;

  if(options.href){
    button.href = options.href;

    if(options.openInNewTab){
      button.target = "_blank";
      button.rel = "noopener";
    }
  }else{
    button.type = "button";
  }

  if(options.onClick){
    button.addEventListener("click", options.onClick);
  }

  return button;
}

function getItemSort(item){
  return Number(item.sortOrder || 0);
}

function getLevelValue(item, depth){
  const fieldName = LEVEL_FIELDS[depth - 1];

  if(!fieldName){
    return "";
  }

  return String(item[fieldName] || "").trim();
}

function saveMenuState(){
  try{
    sessionStorage.setItem(MENU_STATE_STORAGE_KEY, JSON.stringify(menuState));
  }catch(error){
    console.warn("Could not save menu state.", error);
  }
}

function restoreMenuState(){
  try{
    const saved = JSON.parse(sessionStorage.getItem(MENU_STATE_STORAGE_KEY) || "null");

    if(!saved || typeof saved !== "object"){
      return;
    }

    const availableAreas = getAvailableAreas().map(area => area.key);

    if(!availableAreas.includes(saved.area)){
      return;
    }

    menuState.area = saved.area || "";
    menuState.selectedLevels = Array.isArray(saved.selectedLevels)
      ? saved.selectedLevels
      : [];
  }catch(error){
    console.warn("Could not restore menu state.", error);
  }
}


async function fetchRouteCases(){
  try{
    const options = currentUser
      ? { credentials:"include" }
      : {};

    const data = await fetchJson(`${API_BASE}/route-cases`, options);

    return Array.isArray(data.cases) ? data.cases : [];
  }catch(error){
    console.warn("Could not load route cases.", error);
    return [];
  }
}

function normalizeLabel(value){
  return String(value || "").trim().toLowerCase();
}

function isHolidayRootLabel(value){
  return HOLIDAY_ROOT_LABELS.includes(normalizeLabel(value));
}

function isHolidayMenuItem(item){
  return isHolidayRootLabel(item.level1);
}

function getRouteCaseAccessFlags(routeCase){
  const accessLevel = String(routeCase.accessLevel || "Private").trim();

  return {
    public: accessLevel === "Public",
    private: accessLevel === "Public" || accessLevel === "Private",
    administrator: true
  };
}

function makeRouteCaseUrlFromTemplate(template, routeCase, caseName){
  const rawUrl = String(template.url || "").trim();
  const label = String(template.buttonText || "").trim();

  if(label.toLowerCase() === "reiserute"){
    return `reiserute.html?case=${encodeURIComponent(caseName)}`;
  }

  if(!rawUrl){
    return "#";
  }

  try{
    const url = new URL(rawUrl, window.location.href);

    if(url.searchParams.has("case")){
      url.searchParams.set("case", caseName);
      return url.pathname.replace(/^\//, "") + url.search + url.hash;
    }
  }catch(error){
    // Fall through to text replacement below.
  }

  return rawUrl
    .replaceAll("{case}", encodeURIComponent(caseName))
    .replaceAll("{caseName}", encodeURIComponent(caseName));
}

function getRouteCaseTemplates(items){
  const templates = [];
  const seen = new Set();

  items
    .filter(item => isHolidayMenuItem(item))
    .filter(item => String(item.level2 || "").trim())
    .filter(item => !String(item.level3 || "").trim())
    .forEach(item => {
      const label = String(item.buttonText || "").trim();

      if(!label || seen.has(label.toLowerCase())){
        return;
      }

      seen.add(label.toLowerCase());
      templates.push({
        ...item,
        sortOrder:getItemSort(item)
      });
    });

  if(!templates.length){
    return DEFAULT_ROUTE_CASE_SUBMENU;
  }

  return templates.sort((a, b) => getItemSort(a) - getItemSort(b));
}

function buildDynamicRouteCaseMenu(items, cases){
  const templates = getRouteCaseTemplates(items);

  const baseItems = items.filter(item => {
    if(!isHolidayMenuItem(item)){
      return true;
    }

    return !String(item.level2 || "").trim();
  });

  const dynamicItems = [];

  if(currentUser?.role === "Administrator"){
    dynamicItems.push({
      id:"route-case-create",
      buttonText:"+ Ny feriedestinasjon",
      level1:"Feriereiser",
      level2:"",
      level3:"",
      url:"#create-route-case",
      public:false,
      private:false,
      administrator:true,
      sortOrder:-100,
      openInNewTab:false,
      createRouteCase:true
    });
  }

  cases.forEach((routeCase, caseIndex) => {
    const caseName = String(routeCase.caseName || routeCase.title || "").trim();
    const caseTitle = String(routeCase.title || routeCase.caseName || "").trim();

    if(!caseName || !caseTitle){
      return;
    }

    const accessFlags = getRouteCaseAccessFlags(routeCase);
    const caseSortOrder = Number(routeCase.sortOrder || ((caseIndex + 1) * 10));

    templates.forEach((template, templateIndex) => {
      const label = String(template.buttonText || DEFAULT_ROUTE_CASE_SUBMENU[0].buttonText).trim();
      const templateSort = Number(template.sortOrder || ((templateIndex + 1) * 10));

      dynamicItems.push({
        ...template,
        id:`route-case-${routeCase.id || caseName}-${templateIndex}`,
        buttonText:label,
        level1:"Feriereiser",
        level2:caseTitle,
        level3:"",
        url:makeRouteCaseUrlFromTemplate(template, routeCase, caseName),
        public:accessFlags.public,
        private:accessFlags.private,
        administrator:accessFlags.administrator,
        sortOrder:(caseSortOrder * 1000) + templateSort,
        openInNewTab:false,
        routeCaseName:caseName
      });
    });
  });

  return [...baseItems, ...dynamicItems];
}

function setCreateRouteStatus(message, type){
  const box = document.getElementById("createRouteStatus");

  if(!box){
    return;
  }

  box.className = "create-route-status" + (type ? ` ${type}` : "");
  box.innerHTML = message || "";
}

function openCreateRouteCaseDialog(){
  const modal = document.getElementById("createRouteModal");
  const nameInput = document.getElementById("newRouteCaseName");
  const descriptionInput = document.getElementById("newRouteGeneralDescription");

  if(!modal){
    return;
  }

  setCreateRouteStatus("", "");

  if(nameInput){
    nameInput.value = "";
  }

  if(descriptionInput){
    descriptionInput.value = "";
  }

  modal.classList.add("open");

  setTimeout(function(){
    if(nameInput){
      nameInput.focus();
    }
  }, 50);
}

function closeCreateRouteCaseDialog(){
  const modal = document.getElementById("createRouteModal");

  if(modal){
    modal.classList.remove("open");
  }

  setCreateRouteStatus("", "");
}

async function createRouteCaseFromMenu(event){
  event.preventDefault();

  const nameInput = document.getElementById("newRouteCaseName");
  const accessInput = document.getElementById("newRouteAccessLevel");
  const descriptionInput = document.getElementById("newRouteGeneralDescription");
  const button = document.getElementById("createRouteSubmitButton");

  const caseName = String(nameInput?.value || "").trim();
  const accessLevel = String(accessInput?.value || "Private").trim() || "Private";
  const generalDescription = String(descriptionInput?.value || "").trim();

  if(!caseName){
    setCreateRouteStatus("Skriv inn navn på feriedestinasjonen.", "error");
    return;
  }

  if(button){
    button.disabled = true;
    button.textContent = "Oppretter...";
  }

  setCreateRouteStatus(`Oppretter <strong>${esc(caseName)}</strong>...`, "");

  try{
    await fetchJson(`${API_BASE}/route-case-create`, {
      method:"POST",
      credentials:"include",
      headers:{
        "Content-Type":"text/plain;charset=UTF-8"
      },
      body:JSON.stringify({
        caseName,
        title:caseName,
        accessLevel,
        generalDescription
      })
    });

    menuState.selectedLevels = ["Feriereiser", caseName];
    saveMenuState();

    window.location.href =
      `reiserute.html?case=${encodeURIComponent(caseName)}&refresh=${Date.now()}`;
  }catch(error){
    console.error(error);
    setCreateRouteStatus(`Kunne ikke opprette feriedestinasjonen.<br><br>${esc(error.message)}`, "error");
  }finally{
    if(button){
      button.disabled = false;
      button.textContent = "Opprett reiserute";
    }
  }
}


function isRouteMenuItem(item){
  const values = [
    item.buttonText,
    ...LEVEL_FIELDS.map(fieldName => item[fieldName])
  ]
    .map(value => String(value || "").trim().toLowerCase())
    .filter(Boolean);

  return values.some(value =>
    ROUTE_MENU_KEYWORDS.some(keyword => value.includes(keyword))
  );
}

function getRouteCaseNameForItem(item){
  const buttonText = String(item.buttonText || "").trim();

  if(buttonText.toLowerCase() === "reiserute"){
    const selectedRouteCase = menuState.selectedLevels
      .filter(Boolean)
      .slice(-1)[0] || "";

    if(selectedRouteCase){
      return selectedRouteCase;
    }
  }

  return buttonText;
}

function getMenuItemUrl(item){
  const rawUrl = String(item.url || "").trim();

  if(/(?:^|\/)reiserute\.html(?:\?|$)/i.test(rawUrl)){
    return rawUrl;
  }

  if(!isRouteMenuItem(item)){
    return rawUrl;
  }

  const caseName = getRouteCaseNameForItem(item);

  if(!caseName){
    return rawUrl;
  }

  return `reiserute.html?case=${encodeURIComponent(caseName)}`;
}

function resetLevelsFrom(depth){
  menuState.selectedLevels = menuState.selectedLevels.slice(0, depth - 1);
}

function makeMenuNodes(items, depth){
  const groupMap = new Map();
  const nodes = [];

  items.forEach(item => {
    const groupName = getLevelValue(item, depth);

    if(groupName){
      if(!groupMap.has(groupName)){
        groupMap.set(groupName, {
          type:"group",
          label:groupName,
          sortOrder:getItemSort(item)
        });
      }else{
        const existing = groupMap.get(groupName);
        existing.sortOrder = Math.min(existing.sortOrder, getItemSort(item));
      }
    }else{
      nodes.push({
        type:"leaf",
        item,
        label:item.buttonText || "",
        sortOrder:getItemSort(item)
      });
    }
  });

  groupMap.forEach(group => nodes.push(group));

 return nodes
  .filter(node => node.label)
  .sort((a, b) => {
    const aIsRoute = String(a.label || "").trim().toLowerCase() === "reiserute";
    const bIsRoute = String(b.label || "").trim().toLowerCase() === "reiserute";

    if(aIsRoute && !bIsRoute){
      return -1;
    }

    if(!aIsRoute && bIsRoute){
      return 1;
    }

    if(a.sortOrder !== b.sortOrder){
      return a.sortOrder - b.sortOrder;
    }

    return a.label.localeCompare(b.label, "no");
  });
}

function itemsMatchingPath(depth){
  let items = itemsForCurrentArea();

  for(let i = 1; i < depth; i += 1){
    const selectedValue = menuState.selectedLevels[i - 1] || "";

    items = items.filter(item =>
      getLevelValue(item, i) === selectedValue
    );
  }

  return items;
}

function renderAreaButtons(container){
  const areas = getAvailableAreas();

  areas.forEach(area => {
    const button = makeButton(area.label, {
      active: menuState.area === area.key,
      onClick: function(){
        if(menuState.area === area.key){
          menuState.area = "";
        }else{
          menuState.area = area.key;
        }

        menuState.selectedLevels = [];
        saveMenuState();
        renderPathMenu();
      }
    });

    container.appendChild(makeRow(0, button));

    if(menuState.area === area.key){
      renderMenuDepth(container, 1);
    }
  });
}

function renderMenuDepth(container, depth){
  const items = itemsMatchingPath(depth);
  const nodes = makeMenuNodes(items, depth);

  nodes.forEach(node => {
    if(node.type === "leaf"){
      const item = node.item;

      if(item.createRouteCase){
        const button = makeButton(item.buttonText, {
          leaf:true,
          onClick:function(){
            saveMenuState();
            openCreateRouteCaseDialog();
          }
        });

        container.appendChild(makeRow(depth, button));
        return;
      }

      const button = makeButton(item.buttonText, {
        href:getMenuItemUrl(item),
        openInNewTab:item.openInNewTab,
        leaf:true,
        onClick:function(){
          saveMenuState();
        }
      });

      container.appendChild(makeRow(depth, button));
      return;
    }

    const currentValue = menuState.selectedLevels[depth - 1] || "";

    const button = makeButton(node.label, {
      active: currentValue === node.label,
      onClick: function(){
        if(currentValue === node.label){
          resetLevelsFrom(depth);
        }else{
          resetLevelsFrom(depth);
          menuState.selectedLevels[depth - 1] = node.label;
        }

        saveMenuState();
        renderPathMenu();
      }
    });

    container.appendChild(makeRow(depth, button));

    if(menuState.selectedLevels[depth - 1] === node.label && depth <= LEVEL_FIELDS.length){
      renderMenuDepth(container, depth + 1);
    }
  });
}

function renderPathMenu(){
  const container = document.getElementById("pathMenu");
  container.innerHTML = "";

  renderAreaButtons(container);

  container.style.display = "block";
}

async function loadPage(){
  const statusBox = document.getElementById("statusBox");

  currentUser = await fetchCurrentUser();
  setupLoginWidget();

  let menuData;

  if(currentUser){
    menuData = await fetchJson(`${API_BASE}/menu`, {
      credentials:"include"
    });
  }else{
    menuData = await fetchJson(`${API_BASE}/menu-public`);
  }

  routeCases = await fetchRouteCases();
  allMenuItems = buildDynamicRouteCaseMenu(menuData.items || [], routeCases);

  restoreMenuState();
  renderPathMenu();
  statusBox.style.display = "none";
}


const createRouteCaseForm = document.getElementById("createRouteCaseForm");

if(createRouteCaseForm){
  createRouteCaseForm.addEventListener("submit", createRouteCaseFromMenu);
}

document.addEventListener("keydown", function(event){
  if(event.key === "Escape"){
    closeCreateRouteCaseDialog();
  }
});

document.addEventListener("click", function(event){
  const widget = document.querySelector(".login-widget");
  const menu = document.getElementById("loginMenu");

  if(widget && menu && !widget.contains(event.target)){
    menu.style.display = "none";
  }
});

loadPage().catch(error => {
  console.error(error);

  document.getElementById("statusBox").className = "error-box";
  document.getElementById("statusBox").innerHTML =
    `Kunne ikke laste siden.<br><br>${esc(error.message)}`;
});
</script>
