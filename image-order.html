<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sorter bilder - Kvimarka 92</title>
<style>
:root{
  --bg:#f2f2f2;
  --card:#ffffff;
  --text:#333333;
  --muted:#667;
  --border:#cccccc;
  --link:#1f789d;
  --button:#ffffff;
  --button-hover:#e9eef2;
  --soft:#eaeaea;
  --danger:#b85c5c;
  --success:#72c184;
}

body.dark-mode{
  --bg:#151515;
  --card:#242424;
  --text:#eeeeee;
  --muted:#bbbbbb;
  --border:#555555;
  --link:#7cc7e8;
  --button:#242424;
  --button-hover:#3a3a3a;
  --soft:#333333;
}

body{
  margin:0;
  padding:20px;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
}

.container{
  max-width:1050px;
  margin:auto;
}

.header{
  text-align:center;
  margin-bottom:24px;
}

.site-title{
  margin:0;
  font-size:28px;
}

.subtitle{
  margin-top:8px;
  color:var(--muted);
}

.top-buttons{
  display:flex;
  justify-content:center;
  gap:7px;
  margin:10px 0 0;
}

.top-button,
.action-button{
  display:flex;
  align-items:center;
  justify-content:center;
  min-width:30px;
  height:26px;
  padding:0 8px;
  background:var(--button);
  border:1px solid var(--border);
  border-radius:6px;
  color:var(--text);
  text-decoration:none;
  font-size:14px;
  font-weight:bold;
  box-sizing:border-box;
  cursor:pointer;
}

.action-button{
  height:36px;
  min-width:90px;
  padding:0 12px;
}

.top-button:hover,
.action-button:hover{
  background:var(--button-hover);
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
  padding:18px;
  margin-bottom:18px;
}

.route-info{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:10px;
}

.info-box{
  border:1px solid var(--border);
  border-radius:10px;
  padding:12px;
  background:rgba(127,127,127,.05);
}

.info-label{
  color:var(--muted);
  font-size:13px;
  margin-bottom:4px;
}

.info-value{
  font-size:17px;
  font-weight:bold;
}

.status{
  line-height:1.5;
  color:var(--muted);
}

.status.error{
  color:#d77;
}

.status.success{
  color:var(--success);
}

.image-list{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
  gap:14px;
}

.image-card{
  border:1px solid var(--border);
  border-radius:12px;
  overflow:hidden;
  background:rgba(127,127,127,.04);
  position:relative;
}

.image-card.dragging{
  opacity:.45;
}

.image-card.drag-over{
  outline:3px solid var(--link);
  outline-offset:2px;
}

.image-number{
  position:absolute;
  top:8px;
  left:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  width:28px;
  height:28px;
  border-radius:50%;
  background:var(--link);
  color:#fff;
  font-weight:bold;
  font-size:13px;
  z-index:2;
}

.image-open-button{
  display:block;
  width:100%;
  padding:0;
  border:0;
  background:transparent;
  cursor:pointer;
}

.image-card img{
  width:100%;
  aspect-ratio:4/3;
  object-fit:cover;
  background:var(--soft);
  display:block;
}

.image-caption{
  padding:10px;
  color:var(--muted);
  font-size:13px;
  min-height:34px;
  overflow-wrap:anywhere;
}

.image-card.selected{
  outline:3px solid var(--link);
  outline-offset:2px;
}

.image-card.selected .image-number{
  background:var(--success);
}

.image-controls{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:0;
  padding:8px;
  border-top:1px solid var(--border);
}

.image-controls button{
  height:32px;
  margin:0;
  border:1px solid var(--border);
  border-radius:0;
  background:var(--button);
  color:var(--text);
  font-weight:bold;
  cursor:pointer;
}

.image-controls button:first-child{
  border-top-left-radius:7px;
  border-bottom-left-radius:7px;
}

.image-controls button:last-child{
  border-top-right-radius:7px;
  border-bottom-right-radius:7px;
}

.image-controls button:hover{
  background:var(--button-hover);
}

.image-controls .select-button.selected{
  background:var(--link);
  color:#fff;
}


.image-controls.selection-controls{
  grid-template-columns:1fr;
}

.image-controls.selection-controls button{
  border-radius:7px;
}

.image-controls .mark-button{
  background:var(--button);
}

.image-controls .mark-button.selected{
  background:var(--link);
  color:#fff;
  border-color:var(--link);
}

.batch-toolbar{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:0;
  flex:0 0 auto;
}

.batch-toolbar button{
  display:flex;
  align-items:center;
  justify-content:center;
  width:34px;
  height:32px;
  margin:0;
  border:1px solid var(--border);
  border-radius:0;
  background:var(--button);
  color:var(--text);
  font-weight:bold;
  cursor:pointer;
}

.batch-toolbar button:first-child{
  border-top-left-radius:7px;
  border-bottom-left-radius:7px;
}

.batch-toolbar button:last-child{
  border-top-right-radius:7px;
  border-bottom-right-radius:7px;
}

.batch-toolbar button + button{
  margin-left:-1px;
}

.batch-toolbar button:hover{
  background:var(--button-hover);
}

.batch-toolbar button:disabled{
  opacity:.45;
  cursor:default;
}

.batch-toolbar .selection-mode-button.active{
  background:var(--link);
  color:#fff;
}

.batch-toolbar .delete-button{
  color:#ff8b8b;
}

.status-action-row{
  display:grid;
  grid-template-columns:1fr auto;
  gap:10px;
  margin-bottom:18px;
  align-items:stretch;
}

.status-card,
.batch-toolbar-card{
  padding:10px 12px;
  margin-bottom:0;
}

.status-card{
  display:flex;
  align-items:center;
}

.batch-toolbar-card{
  display:flex;
  align-items:center;
  justify-content:center;
}

.image-viewer{
  display:none;
  position:fixed;
  inset:0;
  z-index:9999;
  background:rgba(0,0,0,.9);
  align-items:center;
  justify-content:center;
  padding:48px 16px;
  box-sizing:border-box;
}

.image-viewer.open{
  display:flex;
}

.image-viewer-image{
  max-width:100%;
  max-height:82vh;
  object-fit:contain;
  border-radius:10px;
  background:#111;
}

.image-viewer-caption{
  position:absolute;
  left:16px;
  right:16px;
  bottom:12px;
  text-align:center;
  color:#fff;
  font-size:14px;
  overflow-wrap:anywhere;
}

.image-viewer-button{
  position:absolute;
  display:flex;
  align-items:center;
  justify-content:center;
  width:42px;
  height:42px;
  border:1px solid rgba(255,255,255,.45);
  border-radius:50%;
  background:rgba(0,0,0,.35);
  color:#fff;
  font-size:28px;
  font-weight:bold;
  cursor:pointer;
}

.image-viewer-button:hover{
  background:rgba(255,255,255,.16);
}

.image-viewer-close{
  top:12px;
  right:12px;
}

.image-viewer-prev{
  left:12px;
  top:50%;
  transform:translateY(-50%);
}

.image-viewer-next{
  right:12px;
  top:50%;
  transform:translateY(-50%);
}

@media(max-width:800px){
 .image-controls{
    padding:6px;
    gap:0;
  }

  .image-controls button{
    height:30px;
    font-size:13px;
    margin:0;
  }

  .image-viewer-button{
    width:38px;
    height:38px;
    font-size:24px;
  }
}

.add-first-card{
  grid-column:1 / -1;
  border:1px dashed var(--border);
  border-radius:12px;
  padding:22px;
  text-align:center;
  background:rgba(127,127,127,.04);
}

.add-first-button{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:36px;
  padding:0 14px;
  border:1px solid var(--border);
  border-radius:8px;
  background:var(--button);
  color:var(--text);
  font-weight:bold;
  cursor:pointer;
}

.add-first-button:hover{
  background:var(--button-hover);
}

.image-controls button:disabled{
  opacity:.45;
  cursor:default;
}

.save-row{
  display:flex;
  justify-content:flex-end;
  gap:10px;
  flex-wrap:wrap;
  margin-top:16px;
}

.save-button{
  background:var(--link);
  color:#fff;
  border:none;
}

.small-help{
  color:var(--muted);
  font-size:14px;
  line-height:1.5;
}

@media(max-width:800px){
  body{
    padding:12px;
  }

  .image-list{
    grid-template-columns:repeat(auto-fill,minmax(145px,1fr));
  }

  .save-row{
    flex-direction:column;
  }

  .action-button{
    width:100%;
  }
}
</style>
</head>

<body class="dark-mode">
<div class="container">
  <div class="header">
    <h1 class="site-title">Sorter bilder</h1>
    <div class="subtitle" id="pageSubtitle">Kvimarka 92</div>
    <div class="top-buttons">
      <a class="top-button" id="backToRouteButton" href="reiserute.html" title="Tilbake til reiserute">←</a>
      <a class="top-button" href="index.html" title="Hovedside">⌂</a>
    </div>
  </div>

  <div class="card">
    <div class="route-info">
      <div class="info-box">
        <div class="info-label">Route case</div>
        <div class="info-value" id="caseValue">-</div>
      </div>
      <div class="info-box">
        <div class="info-label">Stopp</div>
        <div class="info-value" id="stopValue">-</div>
      </div>
      <div class="info-box">
        <div class="info-label">Antall bilder</div>
        <div class="info-value" id="imageCountValue">-</div>
      </div>
    </div>
  </div>

  <div class="status-action-row">
    <div class="card status-card">
      <div id="status" class="status">Laster...</div>
    </div>

    <div class="card batch-toolbar-card">
      <div class="batch-toolbar" aria-label="Batch image controls">
        <button type="button" onclick="moveSelectedToStart()" id="batchFirstButton" title="Flytt merkede bilder først" disabled>⇤</button>
        <button type="button" onclick="moveSelectedLeft()" id="batchLeftButton" title="Flytt merkede bilder til venstre" disabled>←</button>
        <button type="button" onclick="moveSelectedRight()" id="batchRightButton" title="Flytt merkede bilder til høyre" disabled>→</button>
        <button type="button" onclick="moveSelectedToEnd()" id="batchLastButton" title="Flytt merkede bilder sist" disabled>⇥</button>
        <button type="button" onclick="toggleSelectionMode()" id="selectionModeButton" class="selection-mode-button" title="Start merking">+</button>
        <button type="button" onclick="deleteSelectedImages()" id="batchDeleteButton" class="delete-button" title="Slett merkede bilder" disabled>🗑</button>
      </div>
    </div>
  </div>

  <div class="card" id="imagesCard" style="display:none;">
    <div class="small-help">
      Dra bildene for å endre rekkefølgen, eller bruk knappene under hvert bilde. Første bilde blir hovedbildet i reiseruten.
    </div>

    <div id="imageList" class="image-list" style="margin-top:14px;"></div>
    <input id="imageUploadInput" type="file" accept="image/*" multiple style="display:none;">

    <div class="save-row">
      <a class="action-button" id="routeLink" href="reiserute.html">Til reiserute</a>
      <button class="action-button" type="button" onclick="reloadFromServer()">Angre / last på nytt</button>
      <button class="action-button save-button" type="button" onclick="saveImageOrder()" id="saveButton">Lagre bilderekkefølge</button>
    </div>
  </div>
</div>

<div class="image-viewer" id="imageViewer" onclick="handleViewerBackdropClick(event)">
  <button class="image-viewer-button image-viewer-close" type="button" onclick="closeImageViewer()" title="Lukk">×</button>
  <button class="image-viewer-button image-viewer-prev" type="button" onclick="showPreviousImage()" title="Forrige bilde">‹</button>
  <img
  class="image-viewer-image"
  id="imageViewerImage"
  alt=""
  onclick="closeImageViewer()"
  title="Klikk for å lukke"
>
  <button class="image-viewer-button image-viewer-next" type="button" onclick="showNextImage()" title="Neste bilde">›</button>
  <div class="image-viewer-caption" id="imageViewerCaption"></div>
</div>

<script>
const API_BASE = "https://api-kvimarka92.carstereogarage.com";

let currentUser = null;
let routeData = null;
let currentStop = null;
let currentImages = [];
let draggedIndex = null;
let pendingInsertIndex = null;
let hasUnsavedChanges = false;
let selectedImageIndices = new Set();
let selectionMode = false;
let viewerIndex = 0;
let viewerTouchStartX = null;

function esc(value){
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function getCaseFromUrl(){
  const params = new URLSearchParams(window.location.search);
  return params.get("case") || "";
}

function getStopIdFromUrl(){
  const params = new URLSearchParams(window.location.search);
  return Number(params.get("stop") || 0);
}

function setStatus(message, type){
  const status = document.getElementById("status");
  status.className = "status" + (type ? ` ${type}` : "");
  status.innerHTML = message;
}

function scrollToStatus(){
  const status = document.getElementById("status");

  if(status){
    status.scrollIntoView({
      behavior:"smooth",
      block:"center"
    });
  }
}

function getCurrentStopNumber(){
  if(!routeData || !Array.isArray(routeData.stops) || !currentStop){
    return 0;
  }

  const index = routeData.stops.findIndex(stop => Number(stop.id) === Number(currentStop.id));

  return index >= 0 ? index + 1 : 0;
}

function updateRouteLink(){
  const caseName = getCaseFromUrl();
  const stopNumber = getCurrentStopNumber();
  const refreshValue = Date.now();
  const hash = stopNumber ? `#stop-${stopNumber}` : "";

  const href = `reiserute.html?case=${encodeURIComponent(caseName)}&refresh=${refreshValue}${hash}`;

  document.getElementById("routeLink").href = href;

  const backButton = document.getElementById("backToRouteButton");

  if(backButton){
    backButton.href = href;
  }
}

async function fetchJson(url, options){
  const res = await fetch(url, {
    credentials:"include",
    ...(options || {})
  });

  if(!res.ok){
    const text = await res.text();
    throw new Error(text || `HTTP ${res.status}`);
  }

  return await res.json();
}

async function fetchCurrentUser(){
  try{
    return await fetchJson(`${API_BASE}/whoami`);
  }catch(error){
    return null;
  }
}

function getImageUrl(image){
  if(!image){
    return "";
  }

  if(typeof image === "string"){
    return image;
  }

  return (
    image.url ||
    image.download_url ||
    image.thumbnails?.large?.url ||
    image.thumbnails?.large ||
    image.thumbnails?.small?.url ||
    image.thumbnails?.small ||
    ""
  );
}

function getImageName(image, index){
  if(!image){
    return `Bilde ${index + 1}`;
  }

  if(typeof image === "string"){
    return image.split("/").pop() || `Bilde ${index + 1}`;
  }

  return image.visible_name || image.name || image.original_name || `Bilde ${index + 1}`;
}

function moveImage(fromIndex, toIndex){
  if(
    fromIndex < 0 ||
    fromIndex >= currentImages.length ||
    toIndex < 0 ||
    toIndex >= currentImages.length ||
    fromIndex === toIndex
  ){
    return;
  }

  const [image] = currentImages.splice(fromIndex, 1);
  currentImages.splice(toIndex, 0, image);
  hasUnsavedChanges = true;
  renderImages();
}

function moveImageToStart(index){
  moveImage(index, 0);
}

function moveImageToEnd(index){
  moveImage(index, currentImages.length - 1);
}

function updateBatchButtons(){
  const selectedCount = selectedImageIndices.size;
  const hasSelection = selectionMode && selectedCount > 0;
  const selected = getSelectedIndices();
  const minIndex = selected.length ? Math.min(...selected) : 0;
  const maxIndex = selected.length ? Math.max(...selected) : 0;

  const selectionButton = document.getElementById("selectionModeButton");

  if(selectionButton){
    selectionButton.classList.toggle("active", selectionMode);
    selectionButton.title = selectionMode ? "Avslutt merking" : "Start merking";
    selectionButton.textContent = "+";
    selectionButton.disabled = currentImages.length === 0;
  }

  const buttonStates = [
    ["batchFirstButton", hasSelection && minIndex > 0],
    ["batchLeftButton", hasSelection && minIndex > 0],
    ["batchRightButton", hasSelection && maxIndex < currentImages.length - 1],
    ["batchLastButton", hasSelection && maxIndex < currentImages.length - 1],
    ["batchDeleteButton", hasSelection]
  ];

  buttonStates.forEach(([id, enabled]) => {
    const button = document.getElementById(id);

    if(button){
      button.disabled = !enabled;
    }
  });
}

function getSelectedIndices(){
  return [...selectedImageIndices]
    .filter(index => index >= 0 && index < currentImages.length)
    .sort((a, b) => a - b);
}

function clearSelectedImages(){
  selectedImageIndices.clear();
  updateBatchButtons();
}

function toggleSelectionMode(){
  selectionMode = !selectionMode;

  if(!selectionMode){
    selectedImageIndices.clear();
  }

  renderImages();
}

function toggleImageSelection(index){
  if(!selectionMode){
    return;
  }

  if(selectedImageIndices.has(index)){
    selectedImageIndices.delete(index);
  }else{
    selectedImageIndices.add(index);
  }

  renderImages();
}

function moveSelectedLeft(){
  const selected = getSelectedIndices();

  if(!selected.length || selected[0] === 0){
    return;
  }

  const selectedSet = new Set(selected);
  const newSelected = new Set();

  for(let i = 0; i < currentImages.length; i += 1){
    if(selectedSet.has(i) && !selectedSet.has(i - 1)){
      const temp = currentImages[i - 1];
      currentImages[i - 1] = currentImages[i];
      currentImages[i] = temp;
      newSelected.add(i - 1);
    }else if(selectedSet.has(i)){
      newSelected.add(i);
    }
  }

  selectedImageIndices = newSelected;
  hasUnsavedChanges = true;
  renderImages();
}

function moveSelectedRight(){
  const selected = getSelectedIndices();

  if(!selected.length || selected[selected.length - 1] === currentImages.length - 1){
    return;
  }

  const selectedSet = new Set(selected);
  const newSelected = new Set();

  for(let i = currentImages.length - 1; i >= 0; i -= 1){
    if(selectedSet.has(i) && !selectedSet.has(i + 1)){
      const temp = currentImages[i + 1];
      currentImages[i + 1] = currentImages[i];
      currentImages[i] = temp;
      newSelected.add(i + 1);
    }else if(selectedSet.has(i)){
      newSelected.add(i);
    }
  }

  selectedImageIndices = newSelected;
  hasUnsavedChanges = true;
  renderImages();
}

function moveSelectedToStart(){
  const selected = getSelectedIndices();

  if(!selected.length || selected[0] === 0){
    return;
  }

  const selectedSet = new Set(selected);
  const selectedImages = currentImages.filter((_, index) => selectedSet.has(index));
  const remainingImages = currentImages.filter((_, index) => !selectedSet.has(index));

  currentImages = [...selectedImages, ...remainingImages];
  selectedImageIndices = new Set(selectedImages.map((_, index) => index));
  hasUnsavedChanges = true;
  renderImages();
}

function moveSelectedToEnd(){
  const selected = getSelectedIndices();

  if(!selected.length || selected[selected.length - 1] === currentImages.length - 1){
    return;
  }

  const selectedSet = new Set(selected);
  const selectedImages = currentImages.filter((_, index) => selectedSet.has(index));
  const remainingImages = currentImages.filter((_, index) => !selectedSet.has(index));
  const startIndex = remainingImages.length;

  currentImages = [...remainingImages, ...selectedImages];
  selectedImageIndices = new Set(selectedImages.map((_, index) => startIndex + index));
  hasUnsavedChanges = true;
  renderImages();
}

function deleteSelectedImages(){
  const selected = getSelectedIndices();

  if(!selected.length){
    return;
  }

  if(!confirm(`Slette ${selected.length} merkede bilde${selected.length === 1 ? "" : "r"} fra stoppet?`)){
    return;
  }

  const selectedSet = new Set(selected);
  currentImages = currentImages.filter((_, index) => !selectedSet.has(index));
  selectedImageIndices.clear();
  hasUnsavedChanges = true;
  renderImages();
  setStatus("Merkede bilder er fjernet lokalt. Trykk «Lagre bilderekkefølge» for å lagre endringen.", "success");
}

function renderImages(){
  const list = document.getElementById("imageList");

  if(!currentImages.length){
    list.innerHTML = `
      <div class="add-first-card">
        <div class="small-help" style="margin-bottom:12px;">Dette stoppet har ingen bilder.</div>
        <button class="add-first-button" type="button" onclick="chooseImageForInsert(0)">＋ Legg til første bilde</button>
      </div>
    `;

    document.getElementById("imageCountValue").textContent = "0";
    selectionMode = false;
    selectedImageIndices.clear();
    updateBatchButtons();
    return;
  }

  list.innerHTML = currentImages.map((image, index) => {
    const imageUrl = getImageUrl(image);
    const imageName = getImageName(image, index);

    return `
      <div
        class="image-card ${selectedImageIndices.has(index) ? "selected" : ""}"
        draggable="${selectionMode ? "false" : "true"}"
        data-index="${index}"
        ondragstart="handleDragStart(event, ${index})"
        ondragover="handleDragOver(event, ${index})"
        ondragleave="handleDragLeave(event)"
        ondrop="handleDrop(event, ${index})"
        ondragend="handleDragEnd(event)"
      >
        <div class="image-number">${index + 1}</div>
        <button class="image-open-button" type="button" onclick="openImageViewer(${index})" title="Åpne bilde">
          <img src="${esc(imageUrl)}" alt="${esc(imageName)}">
        </button>
        <div class="image-caption">${esc(imageName)}</div>
        ${selectionMode ? `
          <div class="image-controls selection-controls">
            <button
              type="button"
              class="mark-button ${selectedImageIndices.has(index) ? "selected" : ""}"
              onclick="toggleImageSelection(${index})"
              title="${selectedImageIndices.has(index) ? "Fjern merking" : "Merk bilde"}"
            >${selectedImageIndices.has(index) ? "✓ Merket" : "Merk"}</button>
          </div>
        ` : `
          <div class="image-controls">
            <button type="button" onclick="moveImageToStart(${index})" title="Flytt først" ${index === 0 ? "disabled" : ""}>⇤</button>
            <button type="button" onclick="moveImage(${index}, ${index - 1})" title="Flytt til venstre" ${index === 0 ? "disabled" : ""}>←</button>
            <button type="button" onclick="moveImage(${index}, ${index + 1})" title="Flytt til høyre" ${index === currentImages.length - 1 ? "disabled" : ""}>→</button>
            <button type="button" onclick="moveImageToEnd(${index})" title="Flytt sist" ${index === currentImages.length - 1 ? "disabled" : ""}>⇥</button>
            <button type="button" onclick="chooseImageForInsert(${index})" title="Legg til bilde her">+</button>
            <button type="button" onclick="deleteImage(${index})" class="delete-button" title="Slett bilde">🗑</button>
          </div>
        `}
      </div>
    `;
  }).join("");

  document.getElementById("imageCountValue").textContent = String(currentImages.length);
  selectedImageIndices = new Set(getSelectedIndices());
  updateBatchButtons();
}

function updateImageViewer(){
  const viewer = document.getElementById("imageViewer");
  const imageElement = document.getElementById("imageViewerImage");
  const caption = document.getElementById("imageViewerCaption");

  if(!viewer || !imageElement || !caption || !currentImages.length){
    return;
  }

  viewerIndex = Math.max(0, Math.min(viewerIndex, currentImages.length - 1));

  const image = currentImages[viewerIndex];
  const imageUrl = getImageUrl(image);
  const imageName = getImageName(image, viewerIndex);

  imageElement.src = imageUrl;
  imageElement.alt = imageName;
  caption.textContent = `${viewerIndex + 1} / ${currentImages.length} - ${imageName}`;
}

function openImageViewer(index){
  if(!currentImages.length){
    return;
  }

  if(selectionMode){
    toggleImageSelection(index);
    return;
  }

  viewerIndex = index;
  updateImageViewer();

  const viewer = document.getElementById("imageViewer");
  viewer.classList.add("open");
}

function closeImageViewer(){
  const viewer = document.getElementById("imageViewer");
  viewer.classList.remove("open");
}

function showPreviousImage(){
  if(!currentImages.length){
    return;
  }

  viewerIndex = (viewerIndex - 1 + currentImages.length) % currentImages.length;
  updateImageViewer();
}

function showNextImage(){
  if(!currentImages.length){
    return;
  }

  viewerIndex = (viewerIndex + 1) % currentImages.length;
  updateImageViewer();
}

function handleViewerBackdropClick(event){
  if(event.target.id === "imageViewer"){
    closeImageViewer();
  }
}

function chooseImageForInsert(index){
  pendingInsertIndex = Math.max(0, Math.min(index, currentImages.length));

  const input = document.getElementById("imageUploadInput");
  input.value = "";
  input.click();
}

function deleteImage(index){
  if(index < 0 || index >= currentImages.length){
    return;
  }

  const imageName = getImageName(currentImages[index], index);

  if(!confirm(`Slette dette bildet fra stoppet?\n\n${imageName}`)){
    return;
  }

  currentImages.splice(index, 1);
  selectedImageIndices.clear();
  hasUnsavedChanges = true;
  renderImages();
  setStatus("Bildet er fjernet lokalt. Trykk «Lagre bilderekkefølge» for å lagre endringen.", "success");
}

async function uploadRouteStopImage(file){
  const formData = new FormData();
  formData.append("file", file);

  const res = await fetch(`${API_BASE}/route-stop-image-upload`, {
    method:"POST",
    credentials:"include",
    body:formData
  });

  if(!res.ok){
    const text = await res.text();
    throw new Error(text || `HTTP ${res.status}`);
  }

  return await res.json();
}

async function handleImageUploadChange(event){
  const files = Array.from(event.target.files || []);

  if(!files.length){
    return;
  }

  const insertIndex = pendingInsertIndex === null
    ? currentImages.length
    : pendingInsertIndex;

  setStatus(`Laster opp ${files.length} bilde${files.length === 1 ? "" : "r"}...`);

  try{
    const uploadedImages = [];

    for(let i = 0; i < files.length; i += 1){
      setStatus(`Laster opp bilde ${i + 1} av ${files.length}...`);
      const uploadedImage = await uploadRouteStopImage(files[i]);
      uploadedImages.push(uploadedImage);
    }

    currentImages.splice(insertIndex, 0, ...uploadedImages);
    pendingInsertIndex = null;
    selectedImageIndices.clear();
    hasUnsavedChanges = true;

    renderImages();
    setStatus(`${uploadedImages.length} bilde${uploadedImages.length === 1 ? "" : "r"} er lastet opp og lagt inn i listen. Trykk «Lagre bilderekkefølge» for å lagre endringen på stoppet.`, "success");
  }catch(error){
    console.error(error);
    setStatus(`Kunne ikke laste opp bildene.<br><br>${esc(error.message)}`, "error");
  }finally{
    event.target.value = "";
  }
}

function handleDragStart(event, index){
  draggedIndex = index;
  event.currentTarget.classList.add("dragging");
  event.dataTransfer.effectAllowed = "move";
}

function handleDragOver(event, index){
  event.preventDefault();
  event.currentTarget.classList.add("drag-over");
}

function handleDragLeave(event){
  event.currentTarget.classList.remove("drag-over");
}

function handleDrop(event, index){
  event.preventDefault();
  event.currentTarget.classList.remove("drag-over");

  if(draggedIndex === null){
    return;
  }

  moveImage(draggedIndex, index);
  draggedIndex = null;
}

function handleDragEnd(event){
  event.currentTarget.classList.remove("dragging");
  document.querySelectorAll(".image-card.drag-over").forEach(card => {
    card.classList.remove("drag-over");
  });
  draggedIndex = null;
}

async function loadPage(){
  const caseName = getCaseFromUrl();
  const stopId = getStopIdFromUrl();

  document.getElementById("caseValue").textContent = caseName || "-";
  document.getElementById("stopValue").textContent = stopId ? String(stopId) : "-";
  const initialRouteHref = `reiserute.html?case=${encodeURIComponent(caseName)}&refresh=${Date.now()}`;
  document.getElementById("routeLink").href = initialRouteHref;
  document.getElementById("backToRouteButton").href = initialRouteHref;

  if(!caseName || !stopId){
    setStatus("Mangler case eller stop i URL-en.<br><br>Eksempel: <code>image-order.html?case=USA%202006&stop=123</code>", "error");
    return;
  }

  currentUser = await fetchCurrentUser();

  if(!currentUser){
    setStatus("Du må være innlogget for å sortere bilder.", "error");
    return;
  }

  if(currentUser.role !== "Administrator"){
    setStatus("Denne siden er bare tilgjengelig for administratorer.", "error");
    return;
  }

  await reloadFromServer();
}

async function reloadFromServer(){
  const caseName = getCaseFromUrl();
  const stopId = getStopIdFromUrl();

  setStatus("Laster stopp og bilder...");
  document.getElementById("imagesCard").style.display = "none";

  try{
    routeData = await fetchJson(`${API_BASE}/route?case=${encodeURIComponent(caseName)}`);
    currentStop = (routeData.stops || []).find(stop => Number(stop.id) === Number(stopId));

    if(!currentStop){
      setStatus("Fant ikke dette stoppet i valgt reiserute.", "error");
      return;
    }

    currentImages = Array.isArray(currentStop.image)
      ? [...currentStop.image]
      : [];
    selectedImageIndices.clear();

    document.getElementById("stopValue").textContent = currentStop.stopName || currentStop.title || String(stopId);
    document.getElementById("pageSubtitle").textContent = routeData.case?.title || routeData.case?.caseName || caseName;

    hasUnsavedChanges = false;
    selectionMode = false;
    selectedImageIndices.clear();
    renderImages();
    updateRouteLink();
    document.getElementById("imagesCard").style.display = "block";

    if(!currentImages.length){
      setStatus(`Klar. Dette stoppet har ingen bilder ennå. Du kan legge til første bilde.`, "success");
      return;
    }

    setStatus(`Klar. Sorterer bilder for <strong>${esc(currentStop.stopName || currentStop.title || stopId)}</strong>.`, "success");
  }catch(error){
    console.error(error);
    setStatus(`Kunne ikke laste bildene.<br><br>${esc(error.message)}`, "error");
  }
}

async function saveImageOrder(){
  const stopId = getStopIdFromUrl();
  const saveButton = document.getElementById("saveButton");

  if(!stopId){
    return;
  }

  saveButton.disabled = true;
  setStatus("Lagrer ny bilderekkefølge...");

  try{
    await fetchJson(`${API_BASE}/route-stop-images`, {
      method:"POST",
      headers:{
        "Content-Type":"text/plain;charset=UTF-8"
      },
      body:JSON.stringify({
        stopId,
        image:currentImages
      })
    });

    hasUnsavedChanges = false;
    updateRouteLink();
    setStatus("Bilderekkefølgen er lagret. Når du går tilbake til reiseruten, lastes siden på nytt og hopper til dette stoppet.", "success");
    scrollToStatus();
  }catch(error){
    console.error(error);
    setStatus(`Kunne ikke lagre bilderekkefølgen.<br><br>${esc(error.message)}`, "error");
    scrollToStatus();
  }finally{
    saveButton.disabled = false;
  }
}

window.addEventListener("beforeunload", function(event){
  if(!hasUnsavedChanges){
    return;
  }

  event.preventDefault();
  event.returnValue = "";
});

document.addEventListener("keydown", function(event){
  const viewer = document.getElementById("imageViewer");

  if(!viewer || !viewer.classList.contains("open")){
    return;
  }

  if(event.key === "Escape"){
    closeImageViewer();
  }

  if(event.key === "ArrowLeft"){
    showPreviousImage();
  }

  if(event.key === "ArrowRight"){
    showNextImage();
  }
});

document.getElementById("imageViewer").addEventListener("touchstart", function(event){
  viewerTouchStartX = event.changedTouches[0].screenX;
}, { passive:true });

document.getElementById("imageViewer").addEventListener("touchend", function(event){
  if(viewerTouchStartX === null){
    return;
  }

  const touchEndX = event.changedTouches[0].screenX;
  const diff = touchEndX - viewerTouchStartX;
  viewerTouchStartX = null;

  if(Math.abs(diff) < 45){
    return;
  }

  if(diff > 0){
    showPreviousImage();
  }else{
    showNextImage();
  }
}, { passive:true });


document.getElementById("imageUploadInput").addEventListener("change", handleImageUploadChange);

loadPage().catch(error => {
  console.error(error);
  setStatus(`Kunne ikke starte siden.<br><br>${esc(error.message)}`, "error");
});
</script>
</body>
</html>
