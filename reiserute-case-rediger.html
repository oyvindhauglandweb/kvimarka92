<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rediger reiserute</title>
<!-- version: route-case-editor-v3-standard-editor-layout-2026-06-14 -->
<style>
:root{
  color-scheme:dark;
  --bg:#111;
  --card:#1d1d1d;
  --field:#252525;
  --border:#444;
  --text:#f2f2f2;
  --muted:#b8b8b8;
  --ok:#8ee698;
  --err:#ff8f8f;
  --accent:#82cfff;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
  padding:18px;
}
.wrap{
  max-width:880px;
  margin:0 auto;
}
.header{
  text-align:center;
  margin-bottom:18px;
}
h1{
  margin:0;
  text-align:center;
  font-size:32px;
}
.sub{
  text-align:center;
  color:var(--muted);
  margin:8px 0 0;
  font-size:16px;
}
.top-buttons{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  margin:16px 0 0;
}
.top-button{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:44px;
  height:44px;
  padding:0;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:8px;
  color:var(--text);
  text-decoration:none;
  font-size:24px;
  font-weight:bold;
  line-height:1;
  box-sizing:border-box;
  cursor:pointer;
}
.top-button:hover{
  background:#333;
}
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
  padding:16px;
  margin:14px 0;
}
label{
  display:block;
  font-weight:bold;
  margin:14px 0 6px;
}
input,select,textarea{
  width:100%;
  border:1px solid var(--border);
  border-radius:8px;
  background:var(--field);
  color:var(--text);
  font:inherit;
  padding:11px;
}
textarea{
  min-height:130px;
  resize:vertical;
}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}
.status{
  display:none;
  border-radius:10px;
  padding:13px;
  margin:14px 0;
  white-space:pre-wrap;
}
.status.ok{
  display:block;
  background:#102818;
  color:var(--ok);
}
.status.err{
  display:block;
  background:#2b1515;
  color:var(--err);
}
.status.info{
  display:block;
  background:#132230;
  color:var(--accent);
}
.small{
  font-size:13px;
  color:var(--muted);
}
.editor-actions{
  display:flex;
  justify-content:flex-end;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  margin:14px 0 0;
}
.editor-action-button{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:36px;
  padding:0 14px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:8px;
  color:var(--text);
  text-decoration:none;
  font-size:14px;
  font-weight:bold;
  box-sizing:border-box;
  cursor:pointer;
}
.editor-action-button:hover{
  background:#333;
}
.editor-action-button.primary{
  background:var(--accent);
  border-color:var(--accent);
  color:#fff;
}
.editor-action-button.primary:hover{
  filter:brightness(.95);
}
.editor-action-button[disabled]{
  opacity:.55;
  cursor:wait;
}
@media(max-width:720px){
  body{padding:10px}
  .grid{grid-template-columns:1fr}
  h1{font-size:30px}
  .editor-actions{
    display:grid;
    grid-template-columns:1fr;
  }
  .editor-action-button{
    width:100%;
  }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>Rediger reiserute</h1>
    <div class="sub" id="subtitle">Route cases</div>

    <div class="top-buttons">
      <a class="top-button" href="javascript:history.back()" title="Tilbake">←</a>
      <a class="top-button" href="index.html" title="Hovedside">⌂</a>
    </div>
  </div>

  <div id="status" class="status"></div>

  <form class="card" onsubmit="event.preventDefault();saveRouteCase();">
    <input type="hidden" id="caseId">

    <label for="caseName">Case name</label>
    <input id="caseName" autocomplete="off">

    <label for="title">Title</label>
    <input id="title" autocomplete="off">

    <label for="generalDescription">Generell beskrivelse</label>
    <textarea id="generalDescription"></textarea>

    <div class="grid">
      <div>
        <label for="accessLevel">Access level</label>
        <select id="accessLevel">
          <option>Private</option>
          <option>Public</option>
          <option>Administrator</option>
        </select>
      </div>
      <div>
        <label for="statusField">Status</label>
        <select id="statusField">
          <option>Active</option>
          <option>Inactive</option>
        </select>
      </div>
    </div>

    <div class="grid">
      <div>
        <label for="sortOrder">Sort order</label>
        <input id="sortOrder" type="number" step="1">
      </div>
      <div>
        <label>Periode</label>
        <input id="displayDate" disabled>
      </div>
    </div>

    <label for="oneDriveFolderPath">OneDrive folder path</label>
    <input id="oneDriveFolderPath" autocomplete="off">
    <div class="small">Eksempel: /Bilder/WEB/Feriereiser/2011.06.10-2011.06.17 Spangereid</div>

    <div class="editor-actions">
      <a id="routeLink" class="editor-action-button" href="#">Til reiserute</a>
      <button class="editor-action-button" type="button" onclick="loadRouteCase()">Angre / last på nytt</button>
      <button id="saveButton" class="editor-action-button primary" type="button" onclick="saveRouteCase()">Lagre reisedestinasjon</button>
    </div>
  </form>
</div>

<script>
const API_BASE = "https://api-kvimarka92.carstereogarage.com";
let originalCaseName = "";

function qs(name){
  return new URLSearchParams(location.search).get(name) || "";
}

function esc(value){
  return String(value ?? "").replace(/[&<>"']/g, ch => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[ch]));
}

function setStatus(message, type="info"){
  const el=document.getElementById("status");
  el.className="status "+type;
  el.textContent=message || "";
}

async function fetchJson(url, options){
  const res=await fetch(url, {
    credentials:"include",
    ...(options || {})
  });
  const text=await res.text();
  let data={};
  try{data=JSON.parse(text||"{}")}catch(error){data={error:text||"Kunne ikke lese svar."}}
  if(!res.ok || data.error){
    throw new Error(data.error || ("HTTP "+res.status));
  }
  return data;
}

function setValue(id, value){
  document.getElementById(id).value = value ?? "";
}

function getValue(id){
  return document.getElementById(id).value;
}

async function loadRouteCase(){
  const caseName = qs("case") || qs("caseName");

  if(!caseName){
    setStatus("Mangler case i URL. Bruk for eksempel ?case=Spangereid%202011.06", "err");
    return;
  }

  setStatus("Laster Route cases-rad...");
  const data = await fetchJson(`${API_BASE}/route?case=${encodeURIComponent(caseName)}`);
  const routeCase = data.case || {};

  originalCaseName = routeCase.caseName || caseName;

  setValue("caseId", routeCase.id || "");
  setValue("caseName", routeCase.caseName || "");
  setValue("title", routeCase.title || "");
  setValue("generalDescription", routeCase.generalDescription || "");
  setValue("accessLevel", routeCase.accessLevel || "Private");
  setValue("statusField", "Active");
  setValue("sortOrder", routeCase.sortOrder || 0);
  setValue("oneDriveFolderPath", routeCase.oneDriveFolderPath || "");
  setValue("displayDate", routeCase.displayDate || data.period?.displayDate || "");

  document.getElementById("subtitle").textContent = routeCase.caseName || "Route cases";
  document.getElementById("routeLink").href = `reiserute.html?case=${encodeURIComponent(routeCase.caseName || caseName)}&refresh=${Date.now()}`;

  setStatus("Klar.", "ok");
}

async function saveRouteCase(){
  const button=document.getElementById("saveButton");
  button.disabled=true;

  try{
    setStatus("Lagrer Route cases-rad...");

    const payload = {
      caseId:Number(getValue("caseId") || 0),
      currentCaseName:originalCaseName,
      data:{
        caseName:getValue("caseName").trim(),
        title:getValue("title").trim(),
        generalDescription:getValue("generalDescription"),
        accessLevel:getValue("accessLevel"),
        status:getValue("statusField"),
        sortOrder:Number(getValue("sortOrder") || 0),
        oneDriveFolderPath:getValue("oneDriveFolderPath").trim()
      }
    };

    const data = await fetchJson(`${API_BASE}/route-case-update`, {
      method:"POST",
      headers:{"Content-Type":"text/plain;charset=UTF-8"},
      body:JSON.stringify(payload)
    });

    originalCaseName = data.caseName || payload.data.caseName;
    document.getElementById("routeLink").href = `reiserute.html?case=${encodeURIComponent(originalCaseName)}&refresh=${Date.now()}`;

    setStatus("Route cases-raden er lagret.", "ok");
  }catch(error){
    setStatus("Kunne ikke lagre Route cases-raden.\n\n"+error.message, "err");
  }finally{
    button.disabled=false;
  }
}

loadRouteCase().catch(error => {
  const message = error.message === "Failed to fetch"
    ? "Failed to fetch\n\nSjekk at du er innlogget via Cloudflare Access på API-domenet, og at Worker v101 er deployet."
    : error.message;
  setStatus("Kunne ikke laste Route cases-raden.\n\n"+message, "err");
});
</script>
</body>
</html>
