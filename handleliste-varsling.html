<script>
(function(){
  const savedTheme=localStorage.getItem("brochureTheme")||"dark";
  document.body.classList.toggle("dark-mode",savedTheme==="dark");
  const savedDesign=localStorage.getItem("shoppingDesign")||"soft";
  document.body.classList.toggle("soft-design",savedDesign!=="classic");
})();
function applyShoppingThemeState(){
  const savedTheme=localStorage.getItem("brochureTheme")||localStorage.getItem("shoppingTheme")||"dark";
  const isDark=savedTheme==="dark";
  document.body.classList.toggle("dark-mode",isDark);
  localStorage.setItem("brochureTheme",isDark?"dark":"light");
  localStorage.setItem("shoppingTheme",isDark?"dark":"light");
  const btn=document.getElementById("shoppingThemeToggle");
  if(btn){
    btn.textContent=isDark?"☀":"☾";
    btn.title=isDark?"Bytt til lys modus":"Bytt til mørk modus";
    btn.setAttribute("aria-label",btn.title);
  }
}
function toggleShoppingTheme(){
  const isDark=document.body.classList.contains("dark-mode");
  localStorage.setItem("brochureTheme",isDark?"light":"dark");
  localStorage.setItem("shoppingTheme",isDark?"light":"dark");
  applyShoppingThemeState();
}
document.addEventListener("DOMContentLoaded",applyShoppingThemeState);
function toggleShoppingDesign(){
  const isSoft=!document.body.classList.contains("soft-design");
  document.body.classList.toggle("soft-design",isSoft);
  localStorage.setItem("shoppingDesign",isSoft?"soft":"classic");
}

<script>
const API_BASE="https://api-kvimarka92.carstereogarage.com";
const SHOPPING_NOTIFICATION_DEFAULT_KEY="kvimarka92ShoppingNotificationDefaultV1";
const MINUTES_OPTIONS=["0 minutter","15 minutter","30 minutter","45 minutter","1 time","3 timer"];
let users=[];
let activeNotification=null;
let activeRecipients=[];
let selectedMinutes="0 minutter";

function esc(value){return String(value??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");}
async function fetchJson(url,options){
  const res=await fetch(url,{credentials:"include",cache:"no-store",...(options||{})});
  const data=await res.json().catch(()=>null);
  if(!res.ok||(data&&data.error)){throw new Error(data?.error||data?.detail||`HTTP ${res.status}`);}
  return data;
}
function setStatus(message,type){const el=document.getElementById("status");el.className="card status"+(type?` ${type}`:"");el.innerHTML=message||"";}
function minutesToNumber(value){const text=String(value||"").toLowerCase();if(text.includes("3 timer"))return 180;if(text.includes("1 time"))return 60;if(text.includes("45"))return 45;if(text.includes("30"))return 30;if(text.includes("15"))return 15;if(text==="0"||text==="0 minutter"||text.includes("ved handling"))return 0;return 0;}
function pad(value){return String(value).padStart(2,"0");}
function toDatetimeLocal(date){return `${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;}
function parseDatetimeLocal(value){if(!value)return null;const date=new Date(value);return Number.isNaN(date.getTime())?null:date;}
function parseFlexibleDateTime(value){if(!value)return null;const text=String(value).trim();let m=text.match(/^(\d{2})\.(\d{2})\.(\d{4})[,]?\s+(\d{2}):(\d{2})/);if(m){return new Date(Number(m[3]),Number(m[2])-1,Number(m[1]),Number(m[4]),Number(m[5]),0,0);}const date=new Date(text);return Number.isNaN(date.getTime())?null:date;}
function formatLocalDateTime(date){if(!date||Number.isNaN(date.getTime()))return "-";return date.toLocaleString("no-NO",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});}
function getShoppingTimeDate(){return parseDatetimeLocal(document.getElementById("shoppingTime").value);}
function getNotifyAtDate(){const shoppingTime=getShoppingTimeDate();if(!shoppingTime)return null;return new Date(shoppingTime.getTime()-minutesToNumber(selectedMinutes)*60000);}
function getAvailableMinutesOptions(){const shoppingTime=getShoppingTimeDate();if(!shoppingTime)return MINUTES_OPTIONS;const remainingMs=shoppingTime.getTime()-Date.now();const remainingMinutes=Math.max(0,Math.floor(remainingMs/60000));return MINUTES_OPTIONS.filter(option=>minutesToNumber(option)<=remainingMinutes);}
function ensureSelectedMinutesIsAvailable(){const available=getAvailableMinutesOptions();if(!available.includes(selectedMinutes)){selectedMinutes=available.length?available[available.length-1]:"0 minutter";}}
function updateNotifyAtDisplay(){ensureSelectedMinutesIsAvailable();const notifyAt=getNotifyAtDate();document.getElementById("notifyAtDisplay").textContent=formatLocalDateTime(notifyAt);renderMinutes();}
function getActiveNotifyAtDate(){if(!activeNotification)return null;return parseFlexibleDateTime(activeNotification.notifyAt||activeNotification.notify_at||activeNotification["Notify at"]);}
function clearExpiredActiveNotification(now,silent){
  // v43: Ikke nullstill aktiv varsling lokalt basert på "Melding sendes".
  // Worker/API er felles sannhet for aktiv varsling. Lokal nullstilling ga ulik status på PC og mobil.
  return false;
}
function updateSystemClock(){const now=new Date();const el=document.getElementById("systemClockDisplay");if(el)el.textContent=formatLocalDateTime(now);}
function startSystemClock(){updateSystemClock();setInterval(updateSystemClock,1000);}
function setMinutes(value){selectedMinutes=value;ensureSelectedMinutesIsAvailable();renderMinutes();const notifyAt=getNotifyAtDate();document.getElementById("notifyAtDisplay").textContent=formatLocalDateTime(notifyAt);updateSaveDefaultButtonTooltip();}
function renderMinutes(){const available=getAvailableMinutesOptions();if(!available.includes(selectedMinutes)){selectedMinutes=available.length?available[available.length-1]:"0 minutter";}document.getElementById("minutesButtons").innerHTML=available.map(option=>`<button type="button" class="option-button ${option===selectedMinutes?"active":""}" onclick="setMinutes('${esc(option)}')">${esc(option)}</button>`).join("");}
function setDefaultShoppingTime(){const input=document.getElementById("shoppingTime");if(input.value)return;const now=new Date();now.setMinutes(now.getMinutes()+90);now.setMinutes(Math.ceil(now.getMinutes()/15)*15,0,0);input.value=toDatetimeLocal(now);}
function getRecipientDefaults(user){const existing=activeRecipients.find(item=>item.userIds&&item.userIds.includes(Number(user.id)));return {sendEmail:existing?!!existing.sendEmail:true,sendSms:existing?!!existing.sendSms:false};}
function renderRecipients(){const el=document.getElementById("recipientList");if(!users.length){el.innerHTML='<div class="empty">Ingen godkjente brukere funnet.</div>';updateSaveDefaultButtonTooltip();return;}el.innerHTML=users.map(user=>{const defaults=getRecipientDefaults(user);const phone=user.phone?esc(user.phone):"Mangler telefonnummer";return `<div class="recipient-row" data-user-id="${user.id}"><div><div class="recipient-name">${esc(user.name)}</div><div class="recipient-meta">${esc(user.email)}<br>${phone}</div></div><label class="check-cell"><input type="checkbox" class="recipient-email" ${defaults.sendEmail?"checked":""}>E-post</label><label class="check-cell"><input type="checkbox" class="recipient-sms" ${defaults.sendSms?"checked":""}>SMS</label></div>`;}).join("");updateSaveDefaultButtonTooltip();}
function updateSaveButtonVisibility(){const button=document.getElementById("saveButton");if(!button)return;button.style.display=activeNotification?"none":"";}
function renderActivePlan(){const el=document.getElementById("activePlanCard");if(!activeNotification){el.innerHTML="";updateSaveButtonVisibility();return;}const shoppingTime=new Date(activeNotification.shoppingTime);const notifyAt=new Date(activeNotification.notifyAt);const recipientText=activeRecipients.length?`${activeRecipients.length} mottaker${activeRecipients.length===1?"":"e"}`:"Ingen mottakere";el.innerHTML=`<div class="card active-plan"><div><div class="plan-title">Aktiv varsling</div><div class="plan-meta">Neste handling: <strong>${esc(formatLocalDateTime(shoppingTime))}</strong><br>Melding sendes: <strong>${esc(formatLocalDateTime(notifyAt))}</strong><br>Varsling: ${esc(activeNotification.notifyMinutesBefore)} før · ${esc(recipientText)}</div></div><button class="action-button danger" type="button" onclick="cancelNotification()">Avbryt varsling</button></div>`;updateSaveButtonVisibility();}
function toggleAllBySelector(selector){const inputs=Array.from(document.querySelectorAll(selector));if(!inputs.length)return;const allChecked=inputs.every(input=>input.checked);inputs.forEach(input=>input.checked=!allChecked);}
function selectAllEmail(){toggleAllBySelector(".recipient-email");}
function selectAllSms(){toggleAllBySelector(".recipient-sms");}
function collectRecipients(){return Array.from(document.querySelectorAll(".recipient-row")).map(row=>({userId:Number(row.dataset.userId),sendEmail:row.querySelector(".recipient-email").checked,sendSms:row.querySelector(".recipient-sms").checked}));}
function applyActiveNotificationToForm(){if(!activeNotification)return;const shoppingTime=new Date(activeNotification.shoppingTime);if(!Number.isNaN(shoppingTime.getTime())){document.getElementById("shoppingTime").value=toDatetimeLocal(shoppingTime);}selectedMinutes=activeNotification.notifyMinutesBefore||selectedMinutes;document.getElementById("notes").value=activeNotification.notes||"";}
async function loadSetup(){setStatus("Laster varslingsoppsett...");try{const data=await fetchJson(`${API_BASE}/shopping/notification-setup`);users=Array.isArray(data.users)?data.users:[];activeNotification=data.activeNotification||null;activeRecipients=Array.isArray(data.activeRecipients)?data.activeRecipients:[];applyActiveNotificationToForm();setDefaultShoppingTime();renderMinutes();renderRecipients();renderActivePlan();updateNotifyAtDisplay();if(activeNotification){const shoppingText=activeNotification.shoppingTime ? ` Tidspunkt for handling: ${esc(formatLocalDateTime(new Date(activeNotification.shoppingTime)))}.` : "";setStatus(`Varsling er aktivert.${shoppingText} Velg "Avbryt varsling" for å stoppe varsling.`,"success");}else{setStatus("Klar. Velg tidspunkt, varslingstid og mottakere.","success");}}catch(error){setStatus(`Kunne ikke laste varsling.<br><br>${esc(error.message)}`,"error");renderMinutes();setDefaultShoppingTime();updateNotifyAtDisplay();}}

function readNotificationDefault(){
  try{
    const parsed=JSON.parse(localStorage.getItem(SHOPPING_NOTIFICATION_DEFAULT_KEY)||"");
    return parsed&&typeof parsed==="object"?parsed:null;
  }catch(error){
    return null;
  }
}

function formatStandardSavedAt(value){
  if(!value)return "";
  const date=new Date(value);
  if(Number.isNaN(date.getTime()))return "";
  return formatLocalDateTime(date);
}

function namesForDefaultRecipients(standard, channel){
  const details=Array.isArray(standard&&standard.recipientDetails)?standard.recipientDetails:[];
  const fallbackRecipients=Array.isArray(standard&&standard.recipients)?standard.recipients:[];
  const selected=[];

  details.forEach(item=>{
    if(channel==="email" && !item.sendEmail)return;
    if(channel==="sms" && !item.sendSms)return;
    selected.push(String(item.name||item.email||item.phone||item.userId||"").trim());
  });

  if(!selected.length && fallbackRecipients.length){
    fallbackRecipients.forEach(item=>{
      if(channel==="email" && !item.sendEmail)return;
      if(channel==="sms" && !item.sendSms)return;
      const user=users.find(user=>Number(user.id)===Number(item.userId))||{};
      selected.push(String(user.name||user.email||item.userId||"").trim());
    });
  }

  return selected.filter(Boolean).join(", ") || "Ingen";
}

function buildStandardNotificationTooltip(){
  const standard=readNotificationDefault();
  if(!standard){
    return "Ingen standard er lagret ennå.\nKlikk for å lagre nåværende varslingstid og valgte e-post/SMS-mottakere som standard.";
  }

  const lines=[
    "Lagret standard for varsling:",
    `Varsle før handling: ${standard.notifyMinutesBefore||"Ikke satt"}`,
    `E-post: ${namesForDefaultRecipients(standard,"email")}`,
    `SMS: ${namesForDefaultRecipients(standard,"sms")}`
  ];

  const savedAt=formatStandardSavedAt(standard.savedAt);
  if(savedAt){
    lines.push(`Lagret: ${savedAt}`);
  }

  lines.push("Klikk for å overskrive med nåværende oppsett.");
  return lines.join("\n");
}

function updateSaveDefaultButtonTooltip(){
  const button=document.getElementById("saveDefaultButton");
  if(!button)return;
  button.title=buildStandardNotificationTooltip();
  button.setAttribute("aria-label",button.title.replace(/\n/g,". "));
}

function setupStandardTooltipUpdates(){
  const button=document.getElementById("saveDefaultButton");
  if(button){
    button.addEventListener("mouseenter",updateSaveDefaultButtonTooltip);
    button.addEventListener("focus",updateSaveDefaultButtonTooltip);
    button.addEventListener("touchstart",updateSaveDefaultButtonTooltip,{passive:true});
  }

  document.addEventListener("change",event=>{
    if(event.target&&(
      event.target.classList.contains("recipient-email") ||
      event.target.classList.contains("recipient-sms") ||
      event.target.id==="shoppingTime" ||
      event.target.id==="notes"
    )){
      updateSaveDefaultButtonTooltip();
    }
  });
}

function saveNotificationDefault(){
  const button=document.getElementById("saveDefaultButton");
  if(button)button.disabled=true;
  try{
    const recipients=collectRecipients().filter(item=>item.sendEmail||item.sendSms);
    if(!recipients.length){
      throw new Error("Velg minst én mottaker for e-post eller SMS før standard lagres.");
    }
    const recipientDetails=recipients.map(recipient=>{
      const user=users.find(item=>Number(item.id)===Number(recipient.userId))||{};
      return {
        userId:Number(recipient.userId),
        name:user.name||"",
        email:user.email||"",
        phone:user.phone||"",
        sendEmail:!!recipient.sendEmail,
        sendSms:!!recipient.sendSms
      };
    });
    const standard={
      version:1,
      notifyMinutesBefore:selectedMinutes,
      recipients,
      recipientDetails,
      savedAt:new Date().toISOString()
    };
    localStorage.setItem(SHOPPING_NOTIFICATION_DEFAULT_KEY,JSON.stringify(standard));
    updateSaveDefaultButtonTooltip();
    setStatus(`Standard for varsling er lagret: ${esc(selectedMinutes)} før handling · ${recipients.length} mottaker${recipients.length===1?"":"e"}.`,"success");
  }catch(error){
    setStatus(`Kunne ikke lagre standard for varsling.<br><br>${esc(error.message)}`,"error");
  }finally{
    if(button)button.disabled=false;
  }
}

async function saveNotification(){const button=document.getElementById("saveButton");button.disabled=true;try{const shoppingTime=getShoppingTimeDate();const notifyAt=getNotifyAtDate();if(!shoppingTime||!notifyAt){throw new Error("Velg tidspunkt for neste handling.");}const body={shoppingTime:shoppingTime.toISOString(),notifyMinutesBefore:selectedMinutes,notifyAt:notifyAt.toISOString(),notes:document.getElementById("notes").value.trim(),recipients:collectRecipients()};const data=await fetchJson(`${API_BASE}/shopping/notification-save`,{method:"POST",headers:{"Content-Type":"text/plain;charset=UTF-8"},body:JSON.stringify(body)});activeNotification=data.notification||null;activeRecipients=Array.isArray(data.recipients)?data.recipients:[];renderActivePlan();setStatus('Varsling er aktivert. Velg "Avbryt varsling" for å stoppe varsling.',"success");}catch(error){setStatus(`Kunne ikke lagre varsling.<br><br>${esc(error.message)}`,"error");}finally{button.disabled=false;}}
async function cancelNotification(){if(!activeNotification||!activeNotification.id)return;if(!confirm("Avbryte aktiv varsling?"))return;try{await fetchJson(`${API_BASE}/shopping/notification-cancel`,{method:"POST",headers:{"Content-Type":"text/plain;charset=UTF-8"},body:JSON.stringify({id:activeNotification.id})});activeNotification=null;activeRecipients=[];renderActivePlan();renderRecipients();setStatus("Varsling er avbrutt.","success");}catch(error){setStatus(`Kunne ikke avbryte varsling.<br><br>${esc(error.message)}`,"error");}}
function safeAppTarget(value){const text=String(value||"").trim();if(!text)return"";if(/^https?:/i.test(text))return"";if(text.startsWith("//"))return"";if(text.includes(".."))return"";return text;}
(function setupBackLinks(){const params=new URLSearchParams(location.search);const from=safeAppTarget(params.get("from"));if(from){const back=document.querySelector('.top-buttons .top-button[title="Tilbake"]');if(back)back.href=from;}})();
setupStandardTooltipUpdates();
updateSaveDefaultButtonTooltip();
startSystemClock();
loadSetup();

<script>
/* Handleliste v51: lokal navigasjonsstack for tilbakeknapp innen Handleliste */
(function(){
  const STACK_KEY = "kvimarka92HandlelisteBackStack";
  const HOME_TARGET = "index.html?restoreMenu=1";
  const HANDLE_PAGE_RE = /^handleliste-[a-z0-9-]+\.html$/i;
  const MAX_STACK = 30;

  function pageFromUrl(value){
    try{
      const url = new URL(value, location.href);
      return url.pathname.split("/").pop() || "";
    }catch(error){
      return String(value || "").split("?")[0].split("#")[0].split("/").pop() || "";
    }
  }

  function isHandlelisteUrl(value){
    return HANDLE_PAGE_RE.test(pageFromUrl(value));
  }

  function relativeUrl(value){
    try{
      const url = new URL(value, location.href);
      if(url.origin !== location.origin) return "";
      const page = url.pathname.split("/").pop() || "";
      if(!HANDLE_PAGE_RE.test(page)) return "";
      return page + url.search + url.hash;
    }catch(error){
      const text = String(value || "").trim();
      return isHandlelisteUrl(text) ? text : "";
    }
  }

  function currentRelativeUrl(){
    const page = location.pathname.split("/").pop() || "";
    return page + location.search + location.hash;
  }

  function readStack(){
    try{
      const parsed = JSON.parse(sessionStorage.getItem(STACK_KEY) || "[]");
      return Array.isArray(parsed) ? parsed.filter(isHandlelisteUrl) : [];
    }catch(error){
      return [];
    }
  }

  function writeStack(stack){
    try{
      sessionStorage.setItem(STACK_KEY, JSON.stringify(stack.slice(-MAX_STACK)));
    }catch(error){}
  }

  function pushCurrentToHandlelisteStack(){
    const current = currentRelativeUrl();
    if(!isHandlelisteUrl(current)) return;
    const stack = readStack();
    if(stack[stack.length - 1] !== current){
      stack.push(current);
      writeStack(stack);
    }
  }

  function popPreviousFromHandlelisteStack(){
    const current = currentRelativeUrl();
    const stack = readStack();
    let target = "";
    while(stack.length){
      const candidate = stack.pop();
      if(candidate && candidate !== current){
        target = candidate;
        break;
      }
    }
    writeStack(stack);
    return target;
  }

  window.pushHandlelisteBackUrl = pushCurrentToHandlelisteStack;
  window.goHandlelisteBackOrHome = function(event){
    if(event){
      event.preventDefault();
      if(event.stopImmediatePropagation) event.stopImmediatePropagation();
      event.stopPropagation();
    }
    location.href = popPreviousFromHandlelisteStack() || HOME_TARGET;
    return false;
  };

  function shouldIgnoreClick(event, anchor){
    if(event.defaultPrevented) return true;
    if(event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return true;
    if(anchor.target && anchor.target !== "_self") return true;
    if(anchor.hasAttribute("download")) return true;
    const href = anchor.getAttribute("href") || "";
    if(!href || href === "#" || href.startsWith("#")) return true;
    if(/^(mailto|sms|tel|javascript):/i.test(href)) return true;
    return false;
  }

  document.addEventListener("click", function(event){
    const anchor = event.target && event.target.closest ? event.target.closest("a[href]") : null;
    if(!anchor) return;

    const isBackButton = anchor.hasAttribute("data-handleliste-back") ||
      (anchor.classList && anchor.classList.contains("top-button") && (anchor.textContent || "").trim() === "←");

    if(isBackButton){
      window.goHandlelisteBackOrHome(event);
      return;
    }

    const href = anchor.getAttribute("href") || "";

    if(/^(index\.html|\/index\.html)/i.test(href)){
      try{ sessionStorage.removeItem(STACK_KEY); }catch(error){}
      return;
    }

    if(shouldIgnoreClick(event, anchor)) return;

    if(isHandlelisteUrl(href)){
      const target = relativeUrl(href);
      if(target && target !== currentRelativeUrl()){
        pushCurrentToHandlelisteStack();
      }
    }
  }, true);
})();
</script>
