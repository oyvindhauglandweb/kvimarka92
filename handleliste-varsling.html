<script>
(function(){
  const savedTheme=localStorage.getItem("brochureTheme")||"dark";
  document.body.classList.toggle("dark-mode",savedTheme==="dark");
  const savedDesign=localStorage.getItem("shoppingDesign")||"soft";
  document.body.classList.toggle("soft-design",savedDesign!=="classic");
})();
function applyShoppingThemeState(){
  const savedTheme=localStorage.getItem("brochureTheme")||localStorage.getItem("shoppingTheme")||"dark";
  const isDark=savedTheme==="dark";
  document.body.classList.toggle("dark-mode",isDark);
  localStorage.setItem("brochureTheme",isDark?"dark":"light");
  localStorage.setItem("shoppingTheme",isDark?"dark":"light");
  const btn=document.getElementById("shoppingThemeToggle");
  if(btn){
    btn.textContent=isDark?"☀":"☾";
    btn.title=isDark?"Bytt til lys modus":"Bytt til mørk modus";
    btn.setAttribute("aria-label",btn.title);
  }
}
function toggleShoppingTheme(){
  const isDark=document.body.classList.contains("dark-mode");
  localStorage.setItem("brochureTheme",isDark?"light":"dark");
  localStorage.setItem("shoppingTheme",isDark?"light":"dark");
  applyShoppingThemeState();
}
document.addEventListener("DOMContentLoaded",applyShoppingThemeState);
function toggleShoppingDesign(){
  const isSoft=!document.body.classList.contains("soft-design");
  document.body.classList.toggle("soft-design",isSoft);
  localStorage.setItem("shoppingDesign",isSoft?"soft":"classic");
}
</script>

<script>
const API_BASE="https://api-kvimarka92.carstereogarage.com";
const MINUTES_OPTIONS=["0 minutter","15 minutter","30 minutter","1 time","2 timer","3 timer"];
let users=[];
let defaultNotification=null;
let defaultRecipients=[];
let selectedMinutes="0 minutter";

function esc(value){return String(value??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");}
async function fetchJson(url,options){
  const res=await fetch(url,{credentials:"include",cache:"no-store",...(options||{})});
  const data=await res.json().catch(()=>null);
  if(!res.ok||(data&&data.error)){throw new Error(data?.error||data?.detail||`HTTP ${res.status}`);}
  return data;
}
function setStatus(message,type){
  const el=document.getElementById("status");
  if(!el)return;
  el.className="card status"+(type?` ${type}`:"");
  el.innerHTML=message||"";
}
function renderMinutes(){
  const el=document.getElementById("minutesButtons");
  if(!el)return;
  el.innerHTML=MINUTES_OPTIONS.map(option=>
    `<button type="button" class="action-button option-button ${option===selectedMinutes?"active":""}" onclick="selectMinutes('${esc(option)}')">${esc(option)}</button>`
  ).join("");
}
function selectMinutes(value){
  selectedMinutes=String(value||"0 minutter").trim()||"0 minutter";
  renderMinutes();
}
function getDefaultRecipientForUser(userId){
  const id=Number(userId||0);
  return (Array.isArray(defaultRecipients)?defaultRecipients:[]).find(item=>Number(item.userId)===id)||null;
}
function renderRecipients(){
  const el=document.getElementById("recipientList");
  if(!el)return;
  if(!users.length){
    el.innerHTML='<div class="empty">Ingen godkjente familiemedlemmer funnet.</div>';
    return;
  }
  el.innerHTML=users.map(user=>{
    const saved=getDefaultRecipientForUser(user.id);
    const sendEmail=!!(saved&&saved.sendEmail);
    const sendSms=!!(saved&&saved.sendSms);
    return `<div class="recipient-row" data-user-id="${Number(user.id)}">
      <div>
        <div class="recipient-name">${esc(user.name||user.email||"")}</div>
        <div class="recipient-meta">${esc(user.email||"")}${user.phone?` · ${esc(user.phone)}`:""}</div>
      </div>
      <label class="recipient-check"><input type="checkbox" class="recipient-email" ${sendEmail?"checked":""}> E-post</label>
      <label class="recipient-check"><input type="checkbox" class="recipient-sms" ${sendSms?"checked":""}> SMS</label>
    </div>`;
  }).join("");
}
function selectedRecipients(){
  return Array.from(document.querySelectorAll(".recipient-row")).map(row=>({
    userId:Number(row.dataset.userId||0),
    sendEmail:!!row.querySelector(".recipient-email")?.checked,
    sendSms:!!row.querySelector(".recipient-sms")?.checked
  })).filter(item=>item.userId&&(item.sendEmail||item.sendSms));
}
function selectAllEmail(){
  document.querySelectorAll(".recipient-email").forEach(input=>{input.checked=true;});
}
function selectAllSms(){
  document.querySelectorAll(".recipient-sms").forEach(input=>{input.checked=true;});
}
function formatLocalDateTime(value){
  if(!value)return "";
  const date=new Date(value);
  if(Number.isNaN(date.getTime()))return "";
  return date.toLocaleString("no-NO",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}).replace(",","");
}
function renderActivePlan(activeNotification){
  const el=document.getElementById("activePlanCard");
  if(!el)return;
  if(!activeNotification){
    el.innerHTML="";
    return;
  }
  const shoppingTime=formatLocalDateTime(activeNotification.shoppingTime);
  el.innerHTML=`<div class="card status success"><strong>Varsling før handling er aktiv.</strong>${shoppingTime?`<br>Tidspunkt for handling: ${esc(shoppingTime)}`:""}</div>`;
}
async function loadNotificationDefault(){
  setStatus("Laster varslingsoppsett...");
  try{
    const data=await fetchJson(`${API_BASE}/shopping/notification-default?ts=${Date.now()}`);
    users=Array.isArray(data.users)?data.users:[];
    defaultNotification=data.defaultNotification||null;
    defaultRecipients=Array.isArray(data.defaultRecipients)?data.defaultRecipients:[];
    selectedMinutes=defaultNotification?.notifyTimeBefore||defaultNotification?.notifyMinutesBefore||"0 minutter";
    renderMinutes();
    renderRecipients();

    const setup=await fetchJson(`${API_BASE}/shopping/notification-setup?ts=${Date.now()}`).catch(()=>null);
    renderActivePlan(setup&&setup.activeNotification?setup.activeNotification:null);

    const recipientCount=defaultRecipients.filter(item=>item&&(item.sendEmail||item.sendSms)).length;
    if(defaultNotification){
      const updated=defaultNotification.updatedAt?` Sist lagret: ${esc(formatLocalDateTime(defaultNotification.updatedAt))}.`:"";
      setStatus(`Varslingsoppsett lastet. Varsle før handling: ${esc(selectedMinutes)}. Mottakere: ${recipientCount}.${updated}`,"success");
    }else{
      setStatus("Ingen varslingsoppsett er lagret ennå. Velg varslingstid og mottakere, og trykk Lagre varslingsoppsett.","success");
    }
  }catch(error){
    setStatus(`Kunne ikke laste varslingsoppsett.<br><br>${esc(error.message)}`,"error");
    renderMinutes();
  }
}
async function saveNotificationDefault(){
  const button=document.getElementById("saveDefaultButton");
  if(button)button.disabled=true;
  try{
    const recipients=selectedRecipients();
    if(!recipients.length){
      throw new Error("Velg minst én mottaker for e-post eller SMS.");
    }
    const data=await fetchJson(`${API_BASE}/shopping/notification-default-save`,{
      method:"POST",
      headers:{"Content-Type":"text/plain;charset=UTF-8"},
      body:JSON.stringify({
        notifyTimeBefore:selectedMinutes,
        recipients
      })
    });
    defaultNotification=data.defaultNotification||null;
    defaultRecipients=Array.isArray(data.defaultRecipients)?data.defaultRecipients:[];
    renderRecipients();
    const recipientCount=defaultRecipients.filter(item=>item&&(item.sendEmail||item.sendSms)).length;
    setStatus(`Varslingsoppsett er lagret. Varsle før handling: ${esc(selectedMinutes)}. Mottakere: ${recipientCount}.`,"success");
  }catch(error){
    setStatus(`Kunne ikke lagre varslingsoppsett.<br><br>${esc(error.message)}`,"error");
  }finally{
    if(button)button.disabled=false;
  }
}
loadNotificationDefault();
</script>
<script>
/* Handleliste v51: lokal navigasjonsstack for tilbakeknapp innen Handleliste */
(function(){
  const STACK_KEY = "kvimarka92HandlelisteBackStack";
  const HOME_TARGET = "index.html?restoreMenu=1";
  const HANDLE_PAGE_RE = /^handleliste-[a-z0-9-]+\.html$/i;
  const MAX_STACK = 30;

  function pageFromUrl(value){
    try{
      const url = new URL(value, location.href);
      return url.pathname.split("/").pop() || "";
    }catch(error){
      return String(value || "").split("?")[0].split("#")[0].split("/").pop() || "";
    }
  }

  function isHandlelisteUrl(value){
    return HANDLE_PAGE_RE.test(pageFromUrl(value));
  }

  function relativeUrl(value){
    try{
      const url = new URL(value, location.href);
      if(url.origin !== location.origin) return "";
      const page = url.pathname.split("/").pop() || "";
      if(!HANDLE_PAGE_RE.test(page)) return "";
      return page + url.search + url.hash;
    }catch(error){
      const text = String(value || "").trim();
      return isHandlelisteUrl(text) ? text : "";
    }
  }

  function currentRelativeUrl(){
    const page = location.pathname.split("/").pop() || "";
    return page + location.search + location.hash;
  }

  function readStack(){
    try{
      const parsed = JSON.parse(sessionStorage.getItem(STACK_KEY) || "[]");
      return Array.isArray(parsed) ? parsed.filter(isHandlelisteUrl) : [];
    }catch(error){
      return [];
    }
  }

  function writeStack(stack){
    try{
      sessionStorage.setItem(STACK_KEY, JSON.stringify(stack.slice(-MAX_STACK)));
    }catch(error){}
  }

  function pushCurrentToHandlelisteStack(){
    const current = currentRelativeUrl();
    if(!isHandlelisteUrl(current)) return;
    const stack = readStack();
    if(stack[stack.length - 1] !== current){
      stack.push(current);
      writeStack(stack);
    }
  }

  function popPreviousFromHandlelisteStack(){
    const current = currentRelativeUrl();
    const stack = readStack();
    let target = "";
    while(stack.length){
      const candidate = stack.pop();
      if(candidate && candidate !== current){
        target = candidate;
        break;
      }
    }
    writeStack(stack);
    return target;
  }

  window.pushHandlelisteBackUrl = pushCurrentToHandlelisteStack;
  window.goHandlelisteBackOrHome = function(event){
    if(event){
      event.preventDefault();
      if(event.stopImmediatePropagation) event.stopImmediatePropagation();
      event.stopPropagation();
    }
    location.href = popPreviousFromHandlelisteStack() || HOME_TARGET;
    return false;
  };

  function shouldIgnoreClick(event, anchor){
    if(event.defaultPrevented) return true;
    if(event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return true;
    if(anchor.target && anchor.target !== "_self") return true;
    if(anchor.hasAttribute("download")) return true;
    const href = anchor.getAttribute("href") || "";
    if(!href || href === "#" || href.startsWith("#")) return true;
    if(/^(mailto|sms|tel|javascript):/i.test(href)) return true;
    return false;
  }

  document.addEventListener("click", function(event){
    const anchor = event.target && event.target.closest ? event.target.closest("a[href]") : null;
    if(!anchor) return;

    const isBackButton = anchor.hasAttribute("data-handleliste-back") ||
      (anchor.classList && anchor.classList.contains("top-button") && (anchor.textContent || "").trim() === "←");

    if(isBackButton){
      window.goHandlelisteBackOrHome(event);
      return;
    }

    const href = anchor.getAttribute("href") || "";

    if(/^(index\.html|\/index\.html)/i.test(href)){
      try{ sessionStorage.removeItem(STACK_KEY); }catch(error){}
      return;
    }

    if(shouldIgnoreClick(event, anchor)) return;

    if(isHandlelisteUrl(href)){
      const target = relativeUrl(href);
      if(target && target !== currentRelativeUrl()){
        pushCurrentToHandlelisteStack();
      }
    }
  }, true);
})();
</script>
