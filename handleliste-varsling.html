<script>
const API_BASE="https://api-kvimarka92.carstereogarage.com";
const MINUTES_OPTIONS=["0 minutter","15 minutter","30 minutter","45 minutter","1 time","3 timer"];
let users=[];
let activeNotification=null;
let activeRecipients=[];
let selectedMinutes="0 minutter";

function esc(value){return String(value==null?"":value).split("&").join("&amp;").split("<").join("&lt;").split(">").join("&gt;").split('"').join("&quot;").split("'").join("&#039;");}
async function fetchJson(url,options){const res=await fetch(url,Object.assign({credentials:"include"},options||{}));const data=await res.json().catch(()=>null);if(!res.ok||(data&&data.error)){throw new Error((data&&data.error)||(data&&data.detail)||`HTTP ${res.status}`);}return data;}
function setStatus(message,type){const el=document.getElementById("status");el.className="card status"+(type?` ${type}`:"");el.innerHTML=message||"";}
function minutesToNumber(value){const text=String(value||"").toLowerCase();if(text.includes("0")||text.includes("ved handling"))return 0;if(text.includes("15"))return 15;if(text.includes("30"))return 30;if(text.includes("45"))return 45;if(text.includes("1 time"))return 60;if(text.includes("3 timer"))return 180;return 0;}
function pad(value){return String(value).padStart(2,"0");}
function toDatetimeLocal(date){return `${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;}
function parseDatetimeLocal(value){if(!value)return null;const date=new Date(value);return Number.isNaN(date.getTime())?null:date;}
function parseFlexibleDateTime(value){if(!value)return null;const text=String(value).trim();let m=text.match(/^(\d{2})\.(\d{2})\.(\d{4})[,]?\s+(\d{2}):(\d{2})/);if(m){return new Date(Number(m[3]),Number(m[2])-1,Number(m[1]),Number(m[4]),Number(m[5]),0,0);}const date=new Date(text);return Number.isNaN(date.getTime())?null:date;}
function formatLocalDateTime(date){if(!date||Number.isNaN(date.getTime()))return "-";return date.toLocaleString("no-NO",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});}
function getShoppingTimeDate(){return parseDatetimeLocal(document.getElementById("shoppingTime").value);}
function getNotifyAtDate(){const shoppingTime=getShoppingTimeDate();if(!shoppingTime)return null;return new Date(shoppingTime.getTime()-minutesToNumber(selectedMinutes)*60000);}
function updateShoppingTimeDisplay(){
  const shoppingTime=getShoppingTimeDate();
  const el=document.getElementById("shoppingTimeDisplay");
  if(el)el.textContent=formatLocalDateTime(shoppingTime);
}
function normalizeTimePart(value,min,max){
  let number=Number(String(value||"").replace(/\D/g,""));
  if(!Number.isFinite(number))number=min;
  number=Math.max(min,Math.min(max,number));
  return pad(number);
}
function setShoppingTimePart(part,value){
  const input=document.getElementById(part==="hour"?"shoppingHourInput":"shoppingMinuteInput");
  if(!input)return;
  if(part==="minute"){
    let number=Number(String(value||"").replace(/\D/g,""));
    if(!Number.isFinite(number))number=0;
    number=Math.max(0,Math.min(59,number));
    number=Math.round(number/5)*5;
    if(number>55)number=55;
    input.value=pad(number);
    return;
  }
  input.value=normalizeTimePart(value,0,23);
}
function stepShoppingTimePart(part,delta){
  const input=document.getElementById(part==="hour"?"shoppingHourInput":"shoppingMinuteInput");
  if(!input)return;
  const max=part==="hour"?23:59;
  let number=Number(String(input.value||"0").replace(/\D/g,""));
  if(!Number.isFinite(number))number=0;
  number=(number+delta+max+1)%(max+1);
  input.value=pad(number);
}
function syncShoppingTimePickerFromHidden(){
  const hidden=document.getElementById("shoppingTime");
  const dateInput=document.getElementById("shoppingDateInput");
  const hourInput=document.getElementById("shoppingHourInput");
  const minuteInput=document.getElementById("shoppingMinuteInput");
  let date=getShoppingTimeDate();
  if(!date){
    date=new Date();
    date.setMinutes(date.getMinutes()+90);
    date.setMinutes(Math.ceil(date.getMinutes()/15)*15,0,0);
  }
  if(dateInput)dateInput.value=`${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())}`;
  if(hourInput)hourInput.value=pad(date.getHours());
  if(minuteInput)minuteInput.value=pad(date.getMinutes());
  if(hidden&&!hidden.value)hidden.value=toDatetimeLocal(date);
}
function openShoppingTimePicker(){
  const panel=document.getElementById("shoppingTimePanel");
  if(!panel)return;
  syncShoppingTimePickerFromHidden();
  panel.classList.add("open");
}
function closeShoppingTimePicker(){
  const panel=document.getElementById("shoppingTimePanel");
  if(panel)panel.classList.remove("open");
}
function applyShoppingTimePicker(){
  const hidden=document.getElementById("shoppingTime");
  const dateInput=document.getElementById("shoppingDateInput");
  const hourInput=document.getElementById("shoppingHourInput");
  const minuteInput=document.getElementById("shoppingMinuteInput");
  const dateValue=dateInput?String(dateInput.value||"").trim():"";
  const hourValue=hourInput?normalizeTimePart(hourInput.value,0,23):"00";
  const minuteValue=minuteInput?normalizeTimePart(minuteInput.value,0,59):"00";
  if(!dateValue){
    setStatus("Velg dato for neste handling.","error");
    return;
  }
  if(hidden)hidden.value=`${dateValue}T${hourValue}:${minuteValue}`;
  closeShoppingTimePicker();
  updateNotifyAtDisplay();
}

document.addEventListener("DOMContentLoaded",function(){
  const hourInput=document.getElementById("shoppingHourInput");
  const minuteInput=document.getElementById("shoppingMinuteInput");
  if(hourInput){
    hourInput.addEventListener("blur",function(){setShoppingTimePart("hour",hourInput.value);});
  }
  if(minuteInput){
    minuteInput.addEventListener("blur",function(){setShoppingTimePart("minute",minuteInput.value);});
  }
});

function updateNotifyAtDisplay(){const notifyAt=getNotifyAtDate();updateShoppingTimeDisplay();document.getElementById("notifyAtDisplay").textContent=formatLocalDateTime(notifyAt);}
function getActiveNotifyAtDate(){if(!activeNotification)return null;return parseFlexibleDateTime(activeNotification.notifyAt||activeNotification.notify_at||activeNotification["Notify at"]);}
function clearExpiredActiveNotification(now,silent){if(!activeNotification)return false;const notifyAt=getActiveNotifyAtDate();if(!notifyAt||now<notifyAt)return false;activeNotification=null;activeRecipients=[];renderActivePlan();renderRecipients();if(!silent)setStatus("Varslingstidspunktet er passert. Aktiv varsling er nullstilt lokalt.","warning");return true;}
function updateSystemClock(){const now=new Date();const el=document.getElementById("systemClockDisplay");if(el)el.textContent=formatLocalDateTime(now);clearExpiredActiveNotification(now,false);}
function startSystemClock(){updateSystemClock();setInterval(updateSystemClock,1000);}
function setMinutes(value){selectedMinutes=value;renderMinutes();updateNotifyAtDisplay();}
function renderMinutes(){document.getElementById("minutesButtons").innerHTML=MINUTES_OPTIONS.map(option=>`<button type="button" class="option-button ${option===selectedMinutes?"active":""}" onclick="setMinutes('${esc(option)}')">${esc(option)}</button>`).join("");}
function setDefaultShoppingTime(){const input=document.getElementById("shoppingTime");if(input.value)return;const now=new Date();now.setMinutes(now.getMinutes()+90);now.setMinutes(Math.ceil(now.getMinutes()/15)*15,0,0);input.value=toDatetimeLocal(now);syncShoppingTimePickerFromHidden();}
const RECIPIENT_PREFS_KEY="kvimarka92NotificationRecipientPrefs";
function loadRecipientPrefs(){
  try{
    const data=JSON.parse(localStorage.getItem(RECIPIENT_PREFS_KEY)||"{}");
    return data&&typeof data==="object"&&!Array.isArray(data)?data:{};
  }catch(error){
    return {};
  }
}
function saveRecipientPrefsFromRows(){
  const prefs={};
  document.querySelectorAll(".recipient-row").forEach(row=>{
    const userId=String(row.dataset.userId||"").trim();
    if(!userId)return;
    prefs[userId]={
      sendEmail:!!(row.querySelector(".recipient-email")&&row.querySelector(".recipient-email").checked),
      sendSms:!!(row.querySelector(".recipient-sms")&&row.querySelector(".recipient-sms").checked)
    };
  });
  try{
    localStorage.setItem(RECIPIENT_PREFS_KEY,JSON.stringify(prefs));
  }catch(error){}
}
function getRecipientDefaults(user){
  const userId=Number(user.id);
  const existing=activeRecipients.find(item=>item.userIds&&item.userIds.includes(userId));
  if(existing){
    return {sendEmail:!!existing.sendEmail,sendSms:!!existing.sendSms};
  }

  const prefs=loadRecipientPrefs();
  const saved=prefs[String(userId)];
  if(saved){
    return {sendEmail:!!saved.sendEmail,sendSms:!!saved.sendSms};
  }

  return {sendEmail:true,sendSms:false};
}
function renderRecipients(){
  const el=document.getElementById("recipientList");
  if(!users.length){
    el.innerHTML='<div class="empty">Ingen godkjente brukere funnet.</div>';
    return;
  }
  el.innerHTML=users.map(user=>{
    const defaults=getRecipientDefaults(user);
    const phone=user.phone?esc(user.phone):"Mangler telefonnummer";
    return `<div class="recipient-row" data-user-id="${user.id}"><div><div class="recipient-name">${esc(user.name)}</div><div class="recipient-meta">${esc(user.email)}<br>${phone}</div></div><label class="check-cell"><input type="checkbox" class="recipient-email" onchange="saveRecipientPrefsFromRows()" ${defaults.sendEmail?"checked":""}>E-post</label><label class="check-cell"><input type="checkbox" class="recipient-sms" onchange="saveRecipientPrefsFromRows()" ${defaults.sendSms?"checked":""}>SMS</label></div>`;
  }).join("");
  saveRecipientPrefsFromRows();
}
function renderActivePlan(){const el=document.getElementById("activePlanCard");if(!activeNotification){el.innerHTML="";return;}const shoppingTime=new Date(activeNotification.shoppingTime);const notifyAt=new Date(activeNotification.notifyAt);const recipientText=activeRecipients.length?`${activeRecipients.length} mottaker${activeRecipients.length===1?"":"e"}`:"Ingen mottakere";el.innerHTML=`<div class="card active-plan"><div><div class="plan-title">Aktiv varsling</div><div class="plan-meta">Neste handling: <strong>${esc(formatLocalDateTime(shoppingTime))}</strong><br>Melding sendes: <strong>${esc(formatLocalDateTime(notifyAt))}</strong><br>Varsling: ${esc(activeNotification.notifyMinutesBefore)} før · ${esc(recipientText)}</div></div><button class="action-button danger" type="button" onclick="cancelNotification()">Avbryt varsling</button></div>`;}
function selectAllEmail(value){document.querySelectorAll(".recipient-email").forEach(input=>input.checked=value);saveRecipientPrefsFromRows();}
function selectAllSms(value){document.querySelectorAll(".recipient-sms").forEach(input=>input.checked=value);saveRecipientPrefsFromRows();}
function collectRecipients(){saveRecipientPrefsFromRows();return Array.from(document.querySelectorAll(".recipient-row")).map(row=>({userId:Number(row.dataset.userId),sendEmail:row.querySelector(".recipient-email").checked,sendSms:row.querySelector(".recipient-sms").checked}));}
function applyActiveNotificationToForm(){if(!activeNotification)return;const shoppingTime=new Date(activeNotification.shoppingTime);if(!Number.isNaN(shoppingTime.getTime())){document.getElementById("shoppingTime").value=toDatetimeLocal(shoppingTime);}selectedMinutes=activeNotification.notifyMinutesBefore||selectedMinutes;document.getElementById("notes").value=activeNotification.notes||"";}
async function loadSetup(){setStatus("Laster varslingsoppsett...");try{const data=await fetchJson(`${API_BASE}/shopping/notification-setup`);users=Array.isArray(data.users)?data.users:[];activeNotification=data.activeNotification||null;activeRecipients=Array.isArray(data.activeRecipients)?data.activeRecipients:[];clearExpiredActiveNotification(new Date(),true);applyActiveNotificationToForm();setDefaultShoppingTime();renderMinutes();renderRecipients();renderActivePlan();updateNotifyAtDisplay();setStatus("Klar. Velg tidspunkt, varslingstid og mottakere.","success");}catch(error){setStatus(`Kunne ikke laste varsling.<br><br>${esc(error.message)}`,"error");renderMinutes();setDefaultShoppingTime();updateNotifyAtDisplay();}}
async function saveNotification(){const button=document.getElementById("saveButton");button.disabled=true;try{const shoppingTime=getShoppingTimeDate();const notifyAt=getNotifyAtDate();if(!shoppingTime||!notifyAt){throw new Error("Velg tidspunkt for neste handling.");}const body={shoppingTime:shoppingTime.toISOString(),notifyMinutesBefore:selectedMinutes,notifyAt:notifyAt.toISOString(),notes:document.getElementById("notes").value.trim(),recipients:collectRecipients()};const data=await fetchJson(`${API_BASE}/shopping/notification-save`,{method:"POST",headers:{"Content-Type":"text/plain;charset=UTF-8"},body:JSON.stringify(body)});activeNotification=data.notification||null;activeRecipients=Array.isArray(data.recipients)?data.recipients:[];renderActivePlan();setStatus("Varsling er lagret.","success");}catch(error){setStatus(`Kunne ikke lagre varsling.<br><br>${esc(error.message)}`,"error");}finally{button.disabled=false;}}
async function cancelNotification(){if(!activeNotification||!activeNotification.id)return;if(!confirm("Avbryte aktiv varsling?"))return;try{await fetchJson(`${API_BASE}/shopping/notification-cancel`,{method:"POST",headers:{"Content-Type":"text/plain;charset=UTF-8"},body:JSON.stringify({id:activeNotification.id})});activeNotification=null;activeRecipients=[];renderActivePlan();renderRecipients();setStatus("Varsling er avbrutt.","success");}catch(error){setStatus(`Kunne ikke avbryte varsling.<br><br>${esc(error.message)}`,"error");}}
function safeAppTarget(value){const text=String(value||"").trim();if(!text)return"";if(/^https?:/i.test(text))return"";if(text.startsWith("//"))return"";if(text.includes(".."))return"";return text;}
(function setupBackLinks(){const params=new URLSearchParams(location.search);const from=safeAppTarget(params.get("from"));if(from){const back=document.querySelector('.top-buttons .top-button[title="Tilbake"]');if(back)back.href=from;}})();
startSystemClock();
loadSetup();
</script>
</body>
