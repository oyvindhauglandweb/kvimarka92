const API_BASE="https://api-kvimarka92.carstereogarage.com";
let SHOPPING_OWNERS=["Felles"];
const OWNER_STORAGE_KEY="kvimarka92ShoppingOwner";
const DEFAULT_TYPES=["Frukt og grønt","Meieri","Kjøtt og fisk","Brød","Tørrvarer","Frysevarer","Drikke","Husholdning","Personlig","Annet"];
function esc(value){return String(value==null?"":value).split("&").join("&amp;").split("<").join("&lt;").split(">").join("&gt;").split('"').join("&quot;").split("'").join("&#039;");}
async function fetchJson(url,options){const res=await fetch(url,Object.assign({credentials:"include"},options||{}));const data=await res.json().catch(()=>null);if(!res.ok||(data&&data.error)){throw new Error((data&&data.error)||(data&&data.detail)||`HTTP ${res.status}`);}return data;}
function setStatus(message,type){const el=document.getElementById("status");el.className="status"+(type?` ${type}`:"");el.innerHTML=message||"";}
function normalizeOwner(value){const text=String(value||"Felles").trim()||"Felles";return SHOPPING_OWNERS.some(owner=>owner.toLowerCase()===text.toLowerCase())?SHOPPING_OWNERS.find(owner=>owner.toLowerCase()===text.toLowerCase()):text;}
function getInitialOwner(){const saved=normalizeOwner(localStorage.getItem(OWNER_STORAGE_KEY)||"Felles");return SHOPPING_OWNERS.includes(saved)?saved:"Felles";}function setShoppingOwners(options){const incoming=Array.isArray(options)?options.map(value=>String(value||"").trim()).filter(Boolean):[];const seen=new Set();const clean=[];incoming.forEach(owner=>{const key=owner.toLowerCase();if(!seen.has(key)){seen.add(key);clean.push(owner);}});if(!clean.some(owner=>owner.toLowerCase()==="felles")){clean.unshift("Felles");}if(clean.length){SHOPPING_OWNERS=clean;}}
function ownerBadge(item){const owner=normalizeOwner(item.owner);return owner&&owner!=="Felles"?`<span class="badge">${esc(owner)}</span>`:"";}
function normalizePermissionText(value){return String(value||"").trim().toLowerCase();}
function isSupervisorOrAdministrator(){const role=normalizePermissionText((currentUser&&currentUser.role));return role==="administrator"||role==="supervisor";}
function ownerMatchesCurrentUser(owner){const safeOwner=normalizePermissionText(owner||"Felles");if(!safeOwner||safeOwner==="felles")return false;const userName=normalizePermissionText((currentUser&&currentUser.name)||"");const emailLocal=normalizePermissionText(String((currentUser&&currentUser.email)||"").split("@")[0]||"");return userName===safeOwner||userName.startsWith(`${safeOwner} `)||emailLocal===safeOwner||emailLocal.startsWith(safeOwner);}
function canDeleteItem(item){if(isSupervisorOrAdministrator())return true;const owner=normalizeOwner(item.owner);return owner!=="Felles"&&ownerMatchesCurrentUser(owner);}
function canChangeStandard(){return isSupervisorOrAdministrator();}

let items=[];let currentUser=null;let SHOPPING_TYPES=DEFAULT_TYPES.slice();
function uniqueValues(values){const seen=new Set();const result=[];(Array.isArray(values)?values:[]).forEach(value=>{const text=String(value||"").trim();if(!text)return;const key=text.toLowerCase();if(seen.has(key))return;seen.add(key);result.push(text);});return result;}
function setShoppingTypes(typeOrder,rows,typeOptions){const options=Array.isArray(typeOptions)?typeOptions.map(value=>String(value||"").trim()).filter(Boolean):[];SHOPPING_TYPES=options.length?uniqueValues(options):uniqueValues([...(Array.isArray(typeOrder)?typeOrder:[]),...(Array.isArray(rows)?rows.map(item=>item.type):[]),...DEFAULT_TYPES]);}
function compareShoppingItemName(a,b){return String((a&&a.name)||(a&&a.itemName)||"").localeCompare(String((b&&b.name)||(b&&b.itemName)||""),"no",{numeric:true,sensitivity:"base"});}function shoppingTypeIndex(type){const key=String(type||"Annet").toLowerCase();const index=SHOPPING_TYPES.findIndex(value=>String(value||"").toLowerCase()===key);return index<0?9999:index;}function sortedEditItems(){return [...items].sort((a,b)=>shoppingTypeIndex(a.type)-shoppingTypeIndex(b.type)||compareShoppingItemName(a,b));}
function canEditDetails(item){if(isSupervisorOrAdministrator())return true;const owner=normalizeOwner(item.owner);return owner!=="Felles"&&ownerMatchesCurrentUser(owner);}
async function loadItems(){setStatus("Laster varer...");try{const data=await fetchJson(`${API_BASE}/shopping/items`);setShoppingOwners(data.ownerOptions||[]);currentUser=data.currentUser||null;items=Array.isArray(data.items)?data.items:[];setShoppingTypes(data.typeOrder||[],items,data.typeOptions||[]);render();setStatus("Klar. Egne varer kan slettes. Fellesvarer og standardvalg styres av supervisor/administrator.","success");}catch(error){setStatus(`Kunne ikke laste varer.<br><br>${esc(error.message)}`,"error");}}
function render(){const root=document.getElementById("editList");if(!items.length){root.innerHTML='<div class="empty">Ingen varer.</div>';return;}const elevated=isSupervisorOrAdministrator();const standardAllowed=canChangeStandard();root.innerHTML=sortedEditItems().map(item=>{const canDelete=canDeleteItem(item);const canEditOwner=elevated;const canEditItem=canEditDetails(item);const standardTitle=standardAllowed?"Endre standardvare":"Bare supervisor og administrator kan endre standardvare";const deleteTitle=canDelete?"Fjern vare":"Du kan bare slette egne varer. Fellesvarer slettes av supervisor/administrator.";const editTitle=canEditItem?"Klikk for å endre varenavn":"Du kan bare endre egne varer. Fellesvarer endres av supervisor/administrator.";return `<div class="edit-row"><div><button class="editable-name" type="button" onclick="editItemName(${item.id})" title="${esc(editTitle)}" ${canEditItem?"":"disabled"}>${esc(item.name)}</button><div class="item-meta">${esc(item.type||"Annet")} • ${item.shouldBuy?"Skal handles":"Ikke bestilt"}</div></div><select class="small-select type-select" onchange="updateType(${item.id}, this.value)" ${canEditItem?"":"disabled"} title="${canEditItem?"Endre varetype":"Du kan bare endre egne varer"}">${SHOPPING_TYPES.map(type=>`<option value="${esc(type)}" ${String(item.type||"Annet").toLowerCase()===String(type).toLowerCase()?"selected":""}>${esc(type)}</option>`).join("")}</select><select class="small-select" onchange="updateOwner(${item.id}, this.value)" ${canEditOwner?"":"disabled"} title="${canEditOwner?"Endre vareliste":"Bare supervisor og administrator kan endre vareliste"}">${SHOPPING_OWNERS.map(owner=>`<option value="${esc(owner)}" ${normalizeOwner(item.owner)===owner?"selected":""}>${esc(owner)}</option>`).join("")}</select><label class="standard-button ${standardAllowed?"":"disabled"}" title="${esc(standardTitle)}"><input type="checkbox" ${item.standardItem?"checked":""} ${standardAllowed?"":"disabled"} onchange="updateStandard(${item.id}, this.checked)"> Standard</label><button class="delete-button" type="button" onclick="deleteItem(${item.id})" title="${esc(deleteTitle)}" ${canDelete?"":"disabled"}>🗑</button></div>`;}).join("");}

async function updateType(id,type){const item=items.find(item=>Number(item.id)===Number(id));if(!item)return;if(!canEditDetails(item)){setStatus("Du kan bare endre egne varer. Fellesvarer kan bare endres av supervisor eller administrator.","error");await loadItems();return;}const oldType=item.type;item.type=type;render();setStatus("Lagrer varetype...");try{const data=await fetchJson(`${API_BASE}/shopping/item-update`,{method:"POST",headers:{"Content-Type":"text/plain;charset=UTF-8"},body:JSON.stringify({id,type})});if(data&&data.item){Object.assign(item,data.item);}render();setStatus("Varetype er oppdatert.","success");}catch(error){item.type=oldType;render();setStatus(`Kunne ikke oppdatere varetype.<br><br>${esc(error.message)}`,"error");}}
async function editItemName(id){const item=items.find(item=>Number(item.id)===Number(id));if(!item)return;if(!canEditDetails(item)){setStatus("Du kan bare endre egne varer. Fellesvarer kan bare endres av supervisor eller administrator.","error");return;}const name=prompt("Nytt varenavn:",item.name||"");if(name===null)return;const cleanName=String(name||"").trim();if(!cleanName){setStatus("Varenavn kan ikke være tomt.","error");return;}if(cleanName===item.name)return;try{await fetchJson(`${API_BASE}/shopping/item-update`,{method:"POST",headers:{"Content-Type":"text/plain;charset=UTF-8"},body:JSON.stringify({id,name:cleanName})});item.name=cleanName;render();setStatus("Varenavnet er oppdatert.","success");}catch(error){setStatus(`Kunne ikke oppdatere varenavn.<br><br>${esc(error.message)}`,"error");await loadItems();}}
async function updateOwner(id,owner){if(!isSupervisorOrAdministrator()){setStatus("Bare supervisor og administrator kan endre vareliste.","error");await loadItems();return;}try{await fetchJson(`${API_BASE}/shopping/item-update`,{method:"POST",headers:{"Content-Type":"text/plain;charset=UTF-8"},body:JSON.stringify({id,owner})});const item=items.find(item=>Number(item.id)===Number(id));if(item)item.owner=owner;setStatus("Vareliste er oppdatert.","success");}catch(error){setStatus(`Kunne ikke oppdatere vareliste.<br><br>${esc(error.message)}`,"error");await loadItems();}}
async function updateStandard(id,standardItem){if(!canChangeStandard()){setStatus("Bare supervisor og administrator kan endre standardvare.","error");await loadItems();return;}try{await fetchJson(`${API_BASE}/shopping/item-update`,{method:"POST",headers:{"Content-Type":"text/plain;charset=UTF-8"},body:JSON.stringify({id,standardItem})});const item=items.find(item=>Number(item.id)===Number(id));if(item)item.standardItem=standardItem;setStatus("Standardvalg er oppdatert.","success");}catch(error){setStatus(`Kunne ikke oppdatere standardvalg.<br><br>${esc(error.message)}`,"error");await loadItems();}}
async function deleteItem(id){const item=items.find(item=>Number(item.id)===Number(id));if(!item)return;if(!canDeleteItem(item)){setStatus("Du kan bare slette egne varer. Fellesvarer kan bare slettes av supervisor eller administrator.","error");return;}if(!confirm(`Fjerne varen fra handlelisten?\n\n${item.name}\n\nVaren slettes fra Shopping items. Historikk beholdes.`))return;try{await fetchJson(`${API_BASE}/shopping/item-delete`,{method:"POST",headers:{"Content-Type":"text/plain;charset=UTF-8"},body:JSON.stringify({id})});await loadItems();setStatus("Varen er fjernet.","success");}catch(error){setStatus(`Kunne ikke fjerne varen.<br><br>${esc(error.message)}`,"error");}}
loadItems();</script>
<script>
(function(){
  const APP_PAGE_RE = /^handleliste-[a-z0-9-]+\.html$/i;
  const HOME_TARGET = 'index.html?restoreMenu=1';

  function currentPage(){
    return location.pathname.split('/').pop() || 'handleliste-bestille.html';
  }

  function isAppPage(page){
    return APP_PAGE_RE.test(String(page || ''));
  }

  function safeAppTarget(value){
    if(!value) return '';
    try{
      const url = new URL(value, location.href);
      if(url.origin !== location.origin) return '';
      const page = url.pathname.split('/').pop();
      if(!isAppPage(page)) return '';
      return page + url.search + url.hash;
    }catch(e){
      const clean = String(value).trim();
      const page = clean.split('?')[0].split('#')[0];
      return isAppPage(page) ? clean : '';
    }
  }

  function currentTargetForBack(){
    const url = new URL(location.href);
    const page = currentPage();
    const params = new URLSearchParams(url.search);
    const legacyFrom = params.get('from');
    const existingBack = params.get('back');

    params.delete('from');

    if(!existingBack && legacyFrom){
      const safeLegacy = safeAppTarget(legacyFrom);
      if(safeLegacy) params.set('back', safeLegacy);
    }

    const query = params.toString();
    return page + (query ? '?' + query : '') + url.hash;
  }

  function getBackTarget(){
    const params = new URLSearchParams(location.search);
    return safeAppTarget(params.get('back')) || safeAppTarget(params.get('from')) || HOME_TARGET;
  }

  function addBackToUrl(rawHref){
    if(!rawHref) return rawHref;
    if(/^#|^(mailto|sms|tel|javascript):/i.test(rawHref)) return rawHref;

    try{
      const url = new URL(rawHref, location.href);
      if(url.origin !== location.origin) return rawHref;
      const page = url.pathname.split('/').pop();
      const here = currentPage();

      if(isAppPage(page) && page !== here){
        url.searchParams.delete('from');
        if(!url.searchParams.has('back')){
          url.searchParams.set('back', currentTargetForBack());
        }
        return page + url.search + url.hash;
      }
    }catch(e){}

    return rawHref;
  }

  function appBack(event){
    event.preventDefault();
    location.href = getBackTarget();
  }

  function initAppNavigation(){
    document.querySelectorAll('a[href]').forEach(function(anchor){
      const href = anchor.getAttribute('href');
      const nextHref = addBackToUrl(href);
      if(nextHref !== href) anchor.setAttribute('href', nextHref);
    });

    document.querySelectorAll('.top-buttons .top-button').forEach(function(button){
      if((button.textContent || '').trim() === '←'){
        button.addEventListener('click', appBack);
      }
    });
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', initAppNavigation);
  }else{
    initAppNavigation();
  }
})();
</script>
