<!DOCTYPE html>
<html lang="no"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Handleliste - Rediger</title><!-- version: shopping-list-edit-items-v2-2026-06-03 --><style>
:root{--bg:#f2f2f2;--card:#fff;--text:#333;--muted:#667;--border:#ccc;--link:#1f789d;--button:#fff;--button-hover:#e9eef2;--soft:#eaeaea;--success:#72c184;--danger:#d77;}body.dark-mode{--bg:#151515;--card:#242424;--text:#eee;--muted:#bbb;--border:#555;--link:#7cc7e8;--button:#242424;--button-hover:#3a3a3a;--soft:#333;}*{box-sizing:border-box;}body{margin:0;padding:20px;background:var(--bg);color:var(--text);font-family:Arial,sans-serif;}.container{max-width:980px;margin:auto;}.header{text-align:center;margin-bottom:20px;}.site-title{margin:0;font-size:30px;}.subtitle{margin-top:8px;color:var(--muted);font-size:16px;}.top-buttons{display:flex;justify-content:center;align-items:center;gap:10px;margin:14px 0 0;}.top-button{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;padding:0;background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--text);text-decoration:none;font-size:24px;font-weight:bold;line-height:1;cursor:pointer;}.top-button:hover,.action-button:hover,.delete-button:hover{background:var(--button-hover);}.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px;margin-bottom:10px;}.toolbar{display:flex;gap:7px;justify-content:space-between;align-items:center;flex-wrap:wrap;}.toolbar-left,.toolbar-right{display:flex;gap:7px;flex-wrap:wrap;}.action-button{display:inline-flex;align-items:center;justify-content:center;min-height:34px;padding:0 10px;background:var(--button);border:1px solid var(--border);border-radius:8px;color:var(--text);font-weight:bold;text-decoration:none;cursor:pointer;font-size:14px;}.status{color:var(--muted);line-height:1.35;font-size:14px;}.status.error{color:var(--danger);}.status.success{color:var(--success);}.item-list{display:flex;flex-direction:column;gap:3px;}.item-row{display:grid;grid-template-columns:1fr auto auto;gap:7px;align-items:center;border:1px solid var(--border);border-radius:7px;padding:4px 6px;background:rgba(127,127,127,.04);min-height:34px;}.item-name{font-weight:bold;font-size:14px;line-height:1.1;}.item-meta{color:var(--muted);font-size:11px;margin-top:1px;line-height:1.15;}.standard-wrap{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:12px;white-space:nowrap;}.standard-check{width:18px;height:18px;accent-color:var(--link);}.delete-button{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border:1px solid var(--border);border-radius:7px;background:var(--button);color:#ff8b8b;font-weight:bold;cursor:pointer;}.delete-button:disabled,.standard-check:disabled{opacity:.55;cursor:not-allowed;}.empty{padding:18px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:10px;}@media(max-width:700px){body{padding:6px;}.header{margin-bottom:12px;}.site-title{font-size:28px;}.card{padding:7px;margin-bottom:7px;border-radius:10px;}.toolbar,.toolbar-left,.toolbar-right{align-items:stretch;width:100%;}.action-button{flex:1 1 auto;min-height:31px;padding:0 7px;font-size:12px;}.item-list{gap:2px;}.item-row{grid-template-columns:1fr auto auto;padding:3px 5px;min-height:30px;gap:5px;border-radius:6px;}.item-name{font-size:13px;}.item-meta{font-size:10px;}.standard-wrap{font-size:10px;gap:3px;}.standard-check{width:17px;height:17px;}.delete-button{width:28px;height:28px;}}
</style></head><body class="dark-mode"><div class="container"><div class="header"><h1 class="site-title">Handleliste</h1><div class="subtitle">Rediger varer</div><div class="top-buttons"><a class="top-button" href="handleliste-bestille.html" title="Tilbake til Bestille">←</a><a class="top-button" href="index.html" title="Hovedside">⌂</a></div></div>
<div class="card"><div class="toolbar"><div class="toolbar-left"><a class="action-button" href="handleliste-bestille.html">Bestille</a><a class="action-button" href="handleliste-handle.html">Handle</a><a class="action-button" href="handleliste-varetyper.html">↕ Varetyper</a></div></div></div>
<div class="card"><div id="status" class="status">Laster...</div></div><div class="card"><div id="itemList" class="item-list"></div></div></div>
<script>
const API_BASE="https://api-kvimarka92.carstereogarage.com";let items=[];
function esc(value){return String(value??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");}
async function fetchJson(url,options){const res=await fetch(url,{credentials:"include",...(options||{})});const data=await res.json().catch(()=>null);if(!res.ok||(data&&data.error)){throw new Error(data?.error||data?.detail||`HTTP ${res.status}`);}return data;}
function setStatus(message,type){const el=document.getElementById("status");el.className="status"+(type?` ${type}`:"");el.innerHTML=message||"";}
function render(){const list=document.getElementById("itemList");if(!items.length){list.innerHTML='<div class="empty">Ingen aktive varer.</div>';return;}list.innerHTML=items.map(item=>`<div class="item-row"><div><div class="item-name">${esc(item.name)}</div><div class="item-meta">${esc(item.type||"Annet")}${item.shouldBuy?" • Skal handles":""}</div></div><label class="standard-wrap"><input class="standard-check" type="checkbox" ${item.standardItem?"checked":""} onchange="toggleStandard(${item.id}, this.checked)"> Standard</label><button class="delete-button" type="button" onclick="deleteItem(${item.id})" title="Fjern vare">🗑</button></div>`).join("");}
async function loadItems(){setStatus("Laster varer...");try{const data=await fetchJson(`${API_BASE}/shopping/items`);items=Array.isArray(data.items)?data.items:[];render();setStatus("Klar. Endre standardvare eller fjern varer med søppelbøtten.","success");}catch(error){setStatus(`Kunne ikke laste varer.<br><br>${esc(error.message)}`,"error");}}
async function toggleStandard(id,checked){const item=items.find(item=>Number(item.id)===Number(id));try{await fetchJson(`${API_BASE}/shopping/item-update`,{method:"POST",headers:{"Content-Type":"text/plain;charset=UTF-8"},body:JSON.stringify({id,standardItem:checked})});if(item){item.standardItem=checked;}render();setStatus(checked?"Varen er satt som standardvare.":"Varen er ikke lenger standardvare.","success");}catch(error){setStatus(`Kunne ikke oppdatere standardvalg.<br><br>${esc(error.message)}`,"error");await loadItems();}}
async function deleteItem(id){const item=items.find(item=>Number(item.id)===Number(id));if(!item){return;}if(!confirm(`Fjerne varen fra handlelisten?\n\n${item.name}\n\nVaren slettes fra Shopping items. Historikk beholdes.`)){return;}setStatus("Fjerner vare...");try{await fetchJson(`${API_BASE}/shopping/item-delete`,{method:"POST",headers:{"Content-Type":"text/plain;charset=UTF-8"},body:JSON.stringify({id})});items=items.filter(item=>Number(item.id)!==Number(id));render();setStatus("Varen er fjernet fra handlelisten.","success");}catch(error){setStatus(`Kunne ikke fjerne varen.<br><br>${esc(error.message)}`,"error");await loadItems();}}
loadItems();
</script></body></html>
