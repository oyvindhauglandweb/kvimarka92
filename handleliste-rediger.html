function getInitialOwner(){const saved=normalizeOwner(localStorage.getItem(OWNER_STORAGE_KEY)||"Felles");return SHOPPING_OWNERS.includes(saved)?saved:"Felles";}function setShoppingOwners(options){const incoming=Array.isArray(options)?options.map(value=>String(value||"").trim()).filter(Boolean):[];const seen=new Set();const clean=[];incoming.forEach(owner=>{const key=owner.toLowerCase();if(!seen.has(key)){seen.add(key);clean.push(owner);}});if(!clean.some(owner=>owner.toLowerCase()==="felles")){clean.unshift("Felles");}if(clean.length){SHOPPING_OWNERS=clean;}}
function ownerBadge(item){const owner=normalizeOwner(item.owner);return owner&&owner!=="Felles"?`<span class="badge">${esc(owner)}</span>`:"";}
function normalizePermissionText(value){return String(value||"").trim().toLowerCase();}
function isAdminPermissionText(value){const text=normalizePermissionText(value);return text==="administrator"||text==="admin"||text==="supervisor"||text==="family admin"||text==="family_admin";}
function isSupervisorOrAdministrator(){
  if(!currentUser)return false;
  return isAdminPermissionText(currentUser.role)||
    isAdminPermissionText(currentUser.handlelisteRole)||
    isAdminPermissionText(currentUser.handlelisteAccess)||
    isAdminPermissionText(currentUser.family&&currentUser.family.memberRole);
}
function ownerMatchesCurrentUser(owner){const safeOwner=normalizePermissionText(owner||"Felles");if(!safeOwner||safeOwner==="felles")return false;const userName=normalizePermissionText((currentUser&&currentUser.name)||"");const emailLocal=normalizePermissionText(String((currentUser&&currentUser.email)||"").split("@")[0]||"");return userName===safeOwner||userName.startsWith(`${safeOwner} `)||emailLocal===safeOwner||emailLocal.startsWith(safeOwner);}
function canDeleteItem(item){if(isSupervisorOrAdministrator())return true;const owner=normalizeOwner(item.owner);return owner!=="Felles"&&ownerMatchesCurrentUser(owner);}
function canChangeStandard(){return isSupervisorOrAdministrator();}


function getItemImageUrl(item){return (item&&item.imageUrl)||((item&&item.image&&item.image.url)||"");}
function itemImageButton(item){const url=getItemImageUrl(item);if(!url)return "";return `<button class="item-image-button" type="button" onclick="showItemImage(${Number(item.id)})" title="Vis bilde av varen">📷</button>`;}
function showItemImage(id){const item=items.find(row=>Number(row.id)===Number(id));const url=getItemImageUrl(item);if(!url)return;document.getElementById("itemImageModalTitle").textContent=item.name||"Varebilde";document.getElementById("itemImageModalImg").src=url;document.getElementById("itemImageModal").classList.add("open");}
function closeItemImageModal(){const modal=document.getElementById("itemImageModal");const img=document.getElementById("itemImageModalImg");if(modal)modal.classList.remove("open");if(img)img.removeAttribute("src");}
function resizeImageFileToDataUrl(file,maxSize=1200,quality=.82){return new Promise((resolve,reject)=>{if(!file){resolve("");return;}if(!/^image\//i.test(file.type||"")){reject(new Error("Velg en bildefil."));return;}const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const scale=Math.min(1,maxSize/Math.max(img.width,img.height));const canvas=document.createElement("canvas");canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));const ctx=canvas.getContext("2d");ctx.drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL("image/jpeg",quality));};img.onerror=()=>reject(new Error("Kunne ikke lese bildet."));img.src=reader.result;};reader.onerror=()=>reject(new Error("Kunne ikke lese bildet."));reader.readAsDataURL(file);});}
async function changeItemImage(id,input){const item=items.find(row=>Number(row.id)===Number(id));const file=input&&input.files&&input.files[0];if(!item||!file)return;try{setStatus("Laster opp bilde...");const imageDataUrl=await resizeImageFileToDataUrl(file);const data=await fetchJson(`${API_BASE}/shopping/item-update`,{method:"POST",headers:{"Content-Type":"text/plain;charset=UTF-8"},body:JSON.stringify({id,imageDataUrl,imageFileName:file.name||`${item.name||"vare"}.jpg`})});if(data&&data.item){Object.assign(item,data.item);}render();setStatus("Varebildet er oppdatert.","success");}catch(error){setStatus(`Kunne ikke lagre bilde.<br><br>${esc(error.message)}`,"error");await loadItems();}finally{if(input)input.value="";}}
async function removeItemImage(id){const item=items.find(row=>Number(row.id)===Number(id));if(!item||!getItemImageUrl(item))return;if(!confirm("Fjerne bildet fra varen?"))return;try{setStatus("Fjerner bilde...");const data=await fetchJson(`${API_BASE}/shopping/item-update`,{method:"POST",headers:{"Content-Type":"text/plain;charset=UTF-8"},body:JSON.stringify({id,removeImage:true})});if(data&&data.item){Object.assign(item,data.item);}else{item.imageUrl="";item.hasImage=false;item.image={hasImage:false,url:""};}render();setStatus("Varebildet er fjernet.","success");}catch(error){setStatus(`Kunne ikke fjerne bilde.<br><br>${esc(error.message)}`,"error");await loadItems();}}

let items=[];let currentUser=null;let SHOPPING_TYPES=DEFAULT_TYPES.slice();
function uniqueValues(values){const seen=new Set();const result=[];(Array.isArray(values)?values:[]).forEach(value=>{const text=String(value||"").trim();if(!text)return;const key=text.toLowerCase();if(seen.has(key))return;seen.add(key);result.push(text);});return result;}
function setShoppingTypes(typeOrder,rows,typeOptions){const options=Array.isArray(typeOptions)?typeOptions.map(value=>String(value||"").trim()).filter(Boolean):[];SHOPPING_TYPES=uniqueValues([...(options.length?options:[]),...(Array.isArray(typeOrder)?typeOrder:[]),...(Array.isArray(rows)?rows.map(item=>getEffectiveEditType(item)):[]),...DEFAULT_TYPES,...EXTRA_SHOPPING_AREA_TYPES]);}
function isExternalShoppingAreaType(value){const key=String(value||"").trim().toLowerCase();return EXTRA_SHOPPING_AREA_TYPES.some(type=>type.toLowerCase()===key);}
function getEffectiveEditType(item){const area=String(item&&item.shoppingArea||"").trim();if(isExternalShoppingAreaType(area))return area;return String(item&&item.type||"Annet").trim()||"Annet";}
function buildTypeUpdatePayload(id,type){
  const cleanType=String(type||"Annet").trim()||"Annet";
  return isExternalShoppingAreaType(cleanType)
    ? {id,type:cleanType,shoppingArea:cleanType}
    : {id,type:cleanType,shoppingArea:"Matvarer"};
}
function compareShoppingItemName(a,b){return String((a&&a.name)||(a&&a.itemName)||"").localeCompare(String((b&&b.name)||(b&&b.itemName)||""),"no",{numeric:true,sensitivity:"base"});}function shoppingTypeIndex(type){const key=String(type||"Annet").toLowerCase();const index=SHOPPING_TYPES.findIndex(value=>String(value||"").toLowerCase()===key);return index<0?9999:index;}function sortedEditItems(){return [...items].sort((a,b)=>shoppingTypeIndex(getEffectiveEditType(a))-shoppingTypeIndex(getEffectiveEditType(b))||compareShoppingItemName(a,b));}
function canEditDetails(item){if(isSupervisorOrAdministrator())return true;const owner=normalizeOwner(item.owner);return owner!=="Felles"&&ownerMatchesCurrentUser(owner);}
async function loadItems(){setStatus("Laster varer...");try{const data=await fetchJson(`${API_BASE}/shopping/items`);setShoppingOwners(data.ownerOptions||[]);currentUser=data.currentUser||null;items=Array.isArray(data.items)?data.items:[];setShoppingTypes(data.typeOrder||[],items,data.typeOptions||[]);render();setStatus("Klar. Egne varer kan slettes. Fellesvarer og standardvalg styres av supervisor/administrator.","success");}catch(error){setStatus(`Kunne ikke laste varer.<br><br>${esc(error.message)}`,"error");}}
function render(){const root=document.getElementById("editList");if(!items.length){root.innerHTML='<div class="empty">Ingen varer.</div>';return;}const elevated=isSupervisorOrAdministrator();const standardAllowed=canChangeStandard();root.innerHTML=sortedEditItems().map(item=>{const canDelete=canDeleteItem(item);const canEditOwner=elevated;const canEditItem=canEditDetails(item);const standardTitle=standardAllowed?"Endre standardvare":"Bare supervisor og administrator kan endre standardvare";const deleteTitle=canDelete?"Fjern vare":"Du kan bare slette egne varer. Fellesvarer slettes av supervisor/administrator.";const editTitle=canEditItem?"Klikk for å endre varenavn":"Du kan bare endre egne varer. Fellesvarer endres av supervisor/administrator.";return `<div class="edit-row"><div><button class="editable-name" type="button" onclick="editItemName(${item.id})" title="${esc(editTitle)}" ${canEditItem?"":"disabled"}>${esc(item.name)}</button><div class="item-meta">${esc(getEffectiveEditType(item))} • ${item.shouldBuy?"Skal handles":"Ikke bestilt"}</div></div><select class="small-select type-select" onchange="updateType(${item.id}, this.value)" ${canEditItem?"":"disabled"} title="${canEditItem?"Endre varetype":"Du kan bare endre egne varer"}">${SHOPPING_TYPES.map(type=>`<option value="${esc(type)}" ${String(getEffectiveEditType(item)).toLowerCase()===String(type).toLowerCase()?"selected":""}>${esc(type)}</option>`).join("")}</select><select class="small-select" onchange="updateOwner(${item.id}, this.value)" ${canEditOwner?"":"disabled"} title="${canEditOwner?"Endre vareliste":"Bare supervisor og administrator kan endre vareliste"}">${SHOPPING_OWNERS.map(owner=>`<option value="${esc(owner)}" ${normalizeOwner(item.owner)===owner?"selected":""}>${esc(owner)}</option>`).join("")}</select><label class="standard-button ${standardAllowed?"":"disabled"}" title="${esc(standardTitle)}"><input type="checkbox" ${item.standardItem?"checked":""} ${standardAllowed?"":"disabled"} onchange="updateStandard(${item.id}, this.checked)"> Standard</label>${itemImageButton(item)}${getItemImageUrl(item)?`<button class="image-edit-button" type="button" onclick="removeItemImage(${item.id})" title="Fjern bilde">Fjern bilde</button>`:`<label class="image-edit-button" title="Legg til bilde">📷<input class="hidden-image-input" type="file" accept="image/*" style="position:absolute;left:-10000px;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none;" onchange="changeItemImage(${item.id}, this)"></label>`}<button class="delete-button" type="button" onclick="deleteItem(${item.id})" title="${esc(deleteTitle)}" ${canDelete?"":"disabled"}>🗑</button></div>`;}).join("");}

async function updateType(id,type){const item=items.find(item=>Number(item.id)===Number(id));if(!item)return;if(!canEditDetails(item)){setStatus("Du kan bare endre egne varer. Fellesvarer kan bare endres av supervisor eller administrator.","error");await loadItems();return;}const payload=buildTypeUpdatePayload(id,type);setStatus("Lagrer varetype...");try{const data=await fetchJson(`${API_BASE}/shopping/item-update`,{method:"POST",headers:{"Content-Type":"text/plain;charset=UTF-8"},body:JSON.stringify(payload)});if(data&&data.item&&Number(data.item.id)!==Number(id)){throw new Error(`Worker returnerte feil vare-ID (${data.item.id}) for oppdatert vare (${id}).`);}await loadItems();setStatus("Varetype er oppdatert.","success");}catch(error){await loadItems();setStatus(`Kunne ikke oppdatere varetype.<br><br>${esc(error.message)}`,"error");}}
async function editItemName(id){const item=items.find(item=>Number(item.id)===Number(id));if(!item)return;if(!canEditDetails(item)){setStatus("Du kan bare endre egne varer. Fellesvarer kan bare endres av supervisor eller administrator.","error");return;}const name=prompt("Nytt varenavn:",item.name||"");if(name===null)return;const cleanName=String(name||"").trim();if(!cleanName){setStatus("Varenavn kan ikke være tomt.","error");return;}if(cleanName===item.name)return;try{await fetchJson(`${API_BASE}/shopping/item-update`,{method:"POST",headers:{"Content-Type":"text/plain;charset=UTF-8"},body:JSON.stringify({id,name:cleanName})});item.name=cleanName;render();setStatus("Varenavnet er oppdatert.","success");}catch(error){setStatus(`Kunne ikke oppdatere varenavn.<br><br>${esc(error.message)}`,"error");await loadItems();}}
async function updateOwner(id,owner){if(!isSupervisorOrAdministrator()){setStatus("Bare supervisor og administrator kan endre vareliste.","error");await loadItems();return;}try{await fetchJson(`${API_BASE}/shopping/item-update`,{method:"POST",headers:{"Content-Type":"text/plain;charset=UTF-8"},body:JSON.stringify({id,owner})});const item=items.find(item=>Number(item.id)===Number(id));if(item)item.owner=owner;setStatus("Vareliste er oppdatert.","success");}catch(error){setStatus(`Kunne ikke oppdatere vareliste.<br><br>${esc(error.message)}`,"error");await loadItems();}}
async function updateStandard(id,standardItem){if(!canChangeStandard()){setStatus("Bare supervisor og administrator kan endre standardvare.","error");await loadItems();return;}try{await fetchJson(`${API_BASE}/shopping/item-update`,{method:"POST",headers:{"Content-Type":"text/plain;charset=UTF-8"},body:JSON.stringify({id,standardItem})});const item=items.find(item=>Number(item.id)===Number(id));if(item)item.standardItem=standardItem;setStatus("Standardvalg er oppdatert.","success");}catch(error){setStatus(`Kunne ikke oppdatere standardvalg.<br><br>${esc(error.message)}`,"error");await loadItems();}}
async function deleteItem(id){const item=items.find(item=>Number(item.id)===Number(id));if(!item)return;if(!canDeleteItem(item)){setStatus("Du kan bare slette egne varer. Fellesvarer kan bare slettes av supervisor eller administrator.","error");return;}if(!confirm(`Fjerne varen fra handlelisten?\n\n${item.name}\n\nVaren slettes fra Shopping items. Historikk beholdes.`))return;try{await fetchJson(`${API_BASE}/shopping/item-delete`,{method:"POST",headers:{"Content-Type":"text/plain;charset=UTF-8"},body:JSON.stringify({id})});await loadItems();setStatus("Varen er fjernet.","success");}catch(error){setStatus(`Kunne ikke fjerne varen.<br><br>${esc(error.message)}`,"error");}}
loadItems();</script>
<script>
(function(){
  const APP_PAGE_RE = /^handleliste-[a-z0-9-]+\.html$/i;
  const HOME_TARGET = 'index.html?restoreMenu=1';

  function currentPage(){
    return location.pathname.split('/').pop() || 'handleliste-bestille.html';
  }

  function isAppPage(page){
    return APP_PAGE_RE.test(String(page || ''));
  }

  function safeAppTarget(value){
    if(!value) return '';
    try{
      const url = new URL(value, location.href);
      if(url.origin !== location.origin) return '';
      const page = url.pathname.split('/').pop();
      if(!isAppPage(page)) return '';
      return page + url.search + url.hash;
    }catch(e){
      const clean = String(value).trim();
      const page = clean.split('?')[0].split('#')[0];
      return isAppPage(page) ? clean : '';
    }
  }

  function currentTargetForBack(){
    const url = new URL(location.href);
    const page = currentPage();
    const params = new URLSearchParams(url.search);
    const legacyFrom = params.get('from');
    const existingBack = params.get('back');

    params.delete('from');

    if(!existingBack && legacyFrom){
      const safeLegacy = safeAppTarget(legacyFrom);
      if(safeLegacy) params.set('back', safeLegacy);
    }

    const query = params.toString();
    return page + (query ? '?' + query : '') + url.hash;
  }

  function getBackTarget(){
    const params = new URLSearchParams(location.search);
    return safeAppTarget(params.get('back')) || safeAppTarget(params.get('from')) || HOME_TARGET;
  }

  function addBackToUrl(rawHref){
    if(!rawHref) return rawHref;
    if(/^#|^(mailto|sms|tel|javascript):/i.test(rawHref)) return rawHref;

    try{
      const url = new URL(rawHref, location.href);
      if(url.origin !== location.origin) return rawHref;
      const page = url.pathname.split('/').pop();
      const here = currentPage();

      if(isAppPage(page) && page !== here){
        url.searchParams.delete('from');
        if(!url.searchParams.has('back')){
          url.searchParams.set('back', currentTargetForBack());
        }
        return page + url.search + url.hash;
      }
    }catch(e){}

    return rawHref;
  }

  function appBack(event){
    event.preventDefault();
    location.href = getBackTarget();
  }

  function initAppNavigation(){
    document.querySelectorAll('a[href]').forEach(function(anchor){
      const href = anchor.getAttribute('href');
      const nextHref = addBackToUrl(href);
      if(nextHref !== href) anchor.setAttribute('href', nextHref);
    });

    document.querySelectorAll('.top-buttons .top-button').forEach(function(button){
      if((button.textContent || '').trim() === '←'){
        button.addEventListener('click', appBack);
      }
    });
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', initAppNavigation);
  }else{
    initAppNavigation();
  }
})();
</script>


<script>
/* Handleliste v51: lokal navigasjonsstack for tilbakeknapp innen Handleliste */
(function(){
  const STACK_KEY = "kvimarka92HandlelisteBackStack";
  const HOME_TARGET = "index.html?restoreMenu=1";
  const HANDLE_PAGE_RE = /^handleliste-[a-z0-9-]+\.html$/i;
  const MAX_STACK = 30;

  function pageFromUrl(value){
    try{
      const url = new URL(value, location.href);
      return url.pathname.split("/").pop() || "";
    }catch(error){
      return String(value || "").split("?")[0].split("#")[0].split("/").pop() || "";
    }
  }

  function isHandlelisteUrl(value){
    return HANDLE_PAGE_RE.test(pageFromUrl(value));
  }

  function relativeUrl(value){
    try{
      const url = new URL(value, location.href);
      if(url.origin !== location.origin) return "";
      const page = url.pathname.split("/").pop() || "";
      if(!HANDLE_PAGE_RE.test(page)) return "";
      return page + url.search + url.hash;
    }catch(error){
      const text = String(value || "").trim();
      return isHandlelisteUrl(text) ? text : "";
    }
  }

  function currentRelativeUrl(){
    const page = location.pathname.split("/").pop() || "";
    return page + location.search + location.hash;
  }

  function readStack(){
    try{
      const parsed = JSON.parse(sessionStorage.getItem(STACK_KEY) || "[]");
      return Array.isArray(parsed) ? parsed.filter(isHandlelisteUrl) : [];
    }catch(error){
      return [];
    }
  }

  function writeStack(stack){
    try{
      sessionStorage.setItem(STACK_KEY, JSON.stringify(stack.slice(-MAX_STACK)));
    }catch(error){}
  }

  function pushCurrentToHandlelisteStack(){
    const current = currentRelativeUrl();
    if(!isHandlelisteUrl(current)) return;
    const stack = readStack();
    if(stack[stack.length - 1] !== current){
      stack.push(current);
      writeStack(stack);
    }
  }

  function popPreviousFromHandlelisteStack(){
    const current = currentRelativeUrl();
    const stack = readStack();
    let target = "";
    while(stack.length){
      const candidate = stack.pop();
      if(candidate && candidate !== current){
        target = candidate;
        break;
      }
    }
    writeStack(stack);
    return target;
  }

  window.pushHandlelisteBackUrl = pushCurrentToHandlelisteStack;
  window.goHandlelisteBackOrHome = function(event){
    if(event){
      event.preventDefault();
      if(event.stopImmediatePropagation) event.stopImmediatePropagation();
      event.stopPropagation();
    }
    location.href = popPreviousFromHandlelisteStack() || HOME_TARGET;
    return false;
  };

  function shouldIgnoreClick(event, anchor){
    if(event.defaultPrevented) return true;
    if(event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return true;
    if(anchor.target && anchor.target !== "_self") return true;
    if(anchor.hasAttribute("download")) return true;
    const href = anchor.getAttribute("href") || "";
    if(!href || href === "#" || href.startsWith("#")) return true;
    if(/^(mailto|sms|tel|javascript):/i.test(href)) return true;
    return false;
  }

  document.addEventListener("click", function(event){
    const anchor = event.target && event.target.closest ? event.target.closest("a[href]") : null;
    if(!anchor) return;

    const isBackButton = anchor.hasAttribute("data-handleliste-back") ||
      (anchor.classList && anchor.classList.contains("top-button") && (anchor.textContent || "").trim() === "←");

    if(isBackButton){
      window.goHandlelisteBackOrHome(event);
      return;
    }

    const href = anchor.getAttribute("href") || "";

    if(/^(index\.html|\/index\.html)/i.test(href)){
      try{ sessionStorage.removeItem(STACK_KEY); }catch(error){}
      return;
    }

    if(shouldIgnoreClick(event, anchor)) return;

    if(isHandlelisteUrl(href)){
      const target = relativeUrl(href);
      if(target && target !== currentRelativeUrl()){
        pushCurrentToHandlelisteStack();
      }
    }
  }, true);
})();
</script>
