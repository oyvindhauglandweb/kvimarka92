<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Handleliste - Rediger</title>
<!-- version: shopping-list-edit-items-v1-2026-06-03 -->
<style>
:root{--bg:#f2f2f2;--card:#fff;--text:#333;--muted:#667;--border:#ccc;--link:#1f789d;--button:#fff;--button-hover:#e9eef2;--soft:#eaeaea;--success:#72c184;--danger:#d77;}
body.dark-mode{--bg:#151515;--card:#242424;--text:#eee;--muted:#bbb;--border:#555;--link:#7cc7e8;--button:#242424;--button-hover:#3a3a3a;--soft:#333;}
*{box-sizing:border-box;}body{margin:0;padding:20px;background:var(--bg);color:var(--text);font-family:Arial,sans-serif;}.container{max-width:980px;margin:auto;}.header{text-align:center;margin-bottom:24px;}.site-title{margin:0;font-size:30px;}.subtitle{margin-top:8px;color:var(--muted);font-size:16px;}.top-buttons{display:flex;justify-content:center;align-items:center;gap:10px;margin:14px 0 0;}.top-button{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;padding:0;background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--text);text-decoration:none;font-size:24px;font-weight:bold;line-height:1;cursor:pointer;}.top-button:hover,.action-button:hover,.delete-button:hover{background:var(--button-hover);}.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:14px;}.toolbar{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap;}.action-button{display:inline-flex;align-items:center;justify-content:center;min-height:36px;padding:0 12px;background:var(--button);border:1px solid var(--border);border-radius:8px;color:var(--text);font-weight:bold;text-decoration:none;cursor:pointer;}.primary{background:var(--link);border-color:var(--link);color:#fff;}.status{color:var(--muted);line-height:1.45;}.status.error{color:var(--danger);}.status.success{color:var(--success);}.item-list{display:flex;flex-direction:column;gap:5px;}.item-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;border:1px solid var(--border);border-radius:8px;padding:7px 8px;background:rgba(127,127,127,.04);min-height:48px;}.item-name{font-weight:bold;font-size:15px;line-height:1.2;}.item-meta{color:var(--muted);font-size:12px;margin-top:2px;line-height:1.25;}.delete-button{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border:1px solid var(--border);border-radius:8px;background:var(--button);color:#ff8b8b;font-weight:bold;cursor:pointer;}.delete-button:disabled{opacity:.55;cursor:not-allowed;}.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:12px;}@media(max-width:700px){body{padding:8px;}.header{margin-bottom:14px;}.card{padding:10px;margin-bottom:10px;}.toolbar{align-items:stretch}.action-button{flex:1 1 auto;min-height:34px;padding:0 9px;font-size:13px;}.item-row{padding:5px 7px;min-height:42px;}.item-name{font-size:14px;}.item-meta{font-size:11px;}.delete-button{width:32px;height:32px;}}
</style>
</head>
<body class="dark-mode"><div class="container"><div class="header"><h1 class="site-title">Handleliste</h1><div class="subtitle">Rediger varer</div><div class="top-buttons"><a class="top-button" href="handleliste-bestille.html" title="Tilbake til Bestille">←</a><a class="top-button" href="index.html" title="Hovedside">⌂</a></div></div>
<div class="card"><div class="toolbar"><a class="action-button" href="handleliste-bestille.html">Bestille</a><a class="action-button" href="handleliste-handle.html">Handle</a></div></div>
<div class="card"><div id="status" class="status">Laster...</div></div><div class="card"><div id="itemList" class="item-list"></div></div></div>
<script>
const API_BASE="https://api-kvimarka92.carstereogarage.com";let items=[];function esc(value){return String(value??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");}async function fetchJson(url,options){const res=await fetch(url,{credentials:"include",...(options||{})});const data=await res.json().catch(()=>null);if(!res.ok||(data&&data.error)){throw new Error(data?.error||data?.detail||`HTTP ${res.status}`);}return data;}function setStatus(message,type){const el=document.getElementById("status");el.className="status"+(type?` ${type}`:"");el.innerHTML=message||"";}function render(){const list=document.getElementById("itemList");if(!items.length){list.innerHTML='<div class="empty">Ingen aktive varer.</div>';return;}list.innerHTML=items.map(item=>`<div class="item-row"><div><div class="item-name">${esc(item.name)}</div><div class="item-meta">${esc(item.type||"Annet")} • ${item.standardItem?"Standardvare":"Vare"}${item.shouldBuy?" • Skal handles":""}</div></div><button class="delete-button" type="button" onclick="deleteItem(${item.id})" title="Fjern vare">🗑</button></div>`).join("");}
async function loadItems(){setStatus("Laster varer...");try{const data=await fetchJson(`${API_BASE}/shopping/items`);items=Array.isArray(data.items)?data.items:[];render();setStatus("Klar. Trykk på søppelbøtten for å fjerne en vare.","success");}catch(error){setStatus(`Kunne ikke laste varer.<br><br>${esc(error.message)}`,"error");}}
async function deleteItem(id){const item=items.find(item=>Number(item.id)===Number(id));if(!item){return;}if(!confirm(`Fjerne varen fra handlelisten?\n\n${item.name}\n\nVaren arkiveres, ikke permanent slettes.`)){return;}setStatus("Fjerner vare...");try{await fetchJson(`${API_BASE}/shopping/item-delete`,{method:"POST",headers:{"Content-Type":"text/plain;charset=UTF-8"},body:JSON.stringify({id})});items=items.filter(item=>Number(item.id)!==Number(id));render();setStatus("Varen er fjernet fra handlelisten.","success");}catch(error){setStatus(`Kunne ikke fjerne varen.<br><br>${esc(error.message)}`,"error");}}
loadItems();
</script></body></html>
