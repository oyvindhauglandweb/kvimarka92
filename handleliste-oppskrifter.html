</script><div class="container"><div class="header"><h1 class="site-title">Handleliste</h1><div class="subtitle">Oppskrifter</div><div class="top-buttons"><a class="top-button" href="handleliste-bestille.html" title="Tilbake til Bestille">←</a><a class="top-button bestille-top-button" href="handleliste-bestille.html" title="Bestille">☑</a><a class="top-button" href="index.html" title="Hovedside">⌂</a><a class="top-button" href="help.html?case=Handleliste" title="Hjelp">?</a><button type="button" class="top-button design-toggle-button" id="shoppingDesignToggle" onclick="toggleShoppingDesign()" title="Bytt design" aria-label="Bytt design">◫</button></div></div>

<div class="card"><div id="status" class="status">Laster...</div></div><div class="card"><div id="recipeList"></div></div></div><script>
const API_BASE="https://api-kvimarka92.carstereogarage.com";
function esc(value){return String(value??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");}
async function fetchJson(url,options){const res=await fetch(url,{credentials:"include",...(options||{})});const data=await res.json().catch(()=>null);if(!res.ok||(data&&data.error)){throw new Error(data?.error||data?.detail||`HTTP ${res.status}`);}return data;}
function setStatus(message,type){const el=document.getElementById("status");el.className="status"+(type?` ${type}`:"");el.innerHTML=message||"";}
let recipes=[];let recipeItems=[];
function itemsForRecipe(recipeId){return recipeItems.filter(item=>Number(item.recipeId)===Number(recipeId));}
function render(){const root=document.getElementById("recipeList");if(!recipes.length){root.innerHTML='<div class="empty">Ingen oppskrifter er lagt inn ennå.</div>';return;}root.innerHTML=`<div class="recipe-list">${recipes.map(recipe=>{const ingredients=itemsForRecipe(recipe.id);const preview=ingredients.slice(0,8).map(item=>item.quantity?`${item.itemName} (${item.quantity})`:item.itemName).join(", ");return `<div class="recipe-row"><div><div class="recipe-title">${esc(recipe.name)}</div>${recipe.description?`<div class="recipe-description">${esc(recipe.description)}</div>`:""}<div class="recipe-items"><span class="badge">${ingredients.length} varer</span>${preview?` ${esc(preview)}${ingredients.length>8?" …":""}`:""}</div></div><button class="action-button primary" type="button" onclick="addRecipeToList(${recipe.id})">+ Legg til</button></div>`;}).join("")}</div>`;}
async function loadRecipes(){setStatus("Laster oppskrifter...");try{const data=await fetchJson(`${API_BASE}/shopping/recipes`);recipes=Array.isArray(data.recipes)?data.recipes:[];recipeItems=Array.isArray(data.recipeItems)?data.recipeItems:[];render();setStatus("Klar. Velg oppskriften du vil legge til i handlelisten.","success");}catch(error){setStatus(`Kunne ikke laste oppskrifter.<br><br>${esc(error.message)}`,"error");}}
async function addRecipeToList(recipeId){const recipe=recipes.find(item=>Number(item.id)===Number(recipeId));if(!recipe)return;if(!confirm(`Legge alle varer fra oppskriften «${recipe.name}» til handlelisten?`))return;setStatus("Legger oppskrift til handlelisten...");try{const data=await fetchJson(`${API_BASE}/shopping/recipe-add-to-list`,{method:"POST",headers:{"Content-Type":"text/plain;charset=UTF-8"},body:JSON.stringify({recipeId})});setStatus(`Oppskriften er lagt til. ${data.createdCount} varer ble lagt i handlelisten.`,"success");}catch(error){setStatus(`Kunne ikke legge til oppskriften.<br><br>${esc(error.message)}`,"error");}}
loadRecipes();
</script>
<script>
(function(){
  const APP_PAGE_RE = /^handleliste-[a-z0-9-]+\.html$/i;
  const HOME_TARGET = 'index.html?restoreMenu=1';

  function currentPage(){
    return location.pathname.split('/').pop() || 'handleliste-bestille.html';
  }

  function isAppPage(page){
    return APP_PAGE_RE.test(String(page || ''));
  }

  function safeAppTarget(value){
    if(!value) return '';
    try{
      const url = new URL(value, location.href);
      if(url.origin !== location.origin) return '';
      const page = url.pathname.split('/').pop();
      if(!isAppPage(page)) return '';
      return page + url.search + url.hash;
    }catch(e){
      const clean = String(value).trim();
      const page = clean.split('?')[0].split('#')[0];
      return isAppPage(page) ? clean : '';
    }
  }

  function currentTargetForBack(){
    const url = new URL(location.href);
    const page = currentPage();
    const params = new URLSearchParams(url.search);
    const legacyFrom = params.get('from');
    const existingBack = params.get('back');

    params.delete('from');

    if(!existingBack && legacyFrom){
      const safeLegacy = safeAppTarget(legacyFrom);
      if(safeLegacy) params.set('back', safeLegacy);
    }

    const query = params.toString();
    return page + (query ? '?' + query : '') + url.hash;
  }

  function getBackTarget(){
    const params = new URLSearchParams(location.search);
    return safeAppTarget(params.get('back')) || safeAppTarget(params.get('from')) || HOME_TARGET;
  }

  function addBackToUrl(rawHref){
    if(!rawHref) return rawHref;
    if(/^#|^(mailto|sms|tel|javascript):/i.test(rawHref)) return rawHref;

    try{
      const url = new URL(rawHref, location.href);
      if(url.origin !== location.origin) return rawHref;
      const page = url.pathname.split('/').pop();
      const here = currentPage();

      if(isAppPage(page) && page !== here){
        url.searchParams.delete('from');
        if(!url.searchParams.has('back')){
          url.searchParams.set('back', currentTargetForBack());
        }
        return page + url.search + url.hash;
      }
    }catch(e){}

    return rawHref;
  }

  function appBack(event){
    event.preventDefault();
    location.href = getBackTarget();
  }

  function initAppNavigation(){
    document.querySelectorAll('a[href]').forEach(function(anchor){
      const href = anchor.getAttribute('href');
      const nextHref = addBackToUrl(href);
      if(nextHref !== href) anchor.setAttribute('href', nextHref);
    });

    document.querySelectorAll('.top-buttons .top-button').forEach(function(button){
      if((button.textContent || '').trim() === '←'){
        button.addEventListener('click', appBack);
      }
    });
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', initAppNavigation);
  }else{
    initAppNavigation();
  }
})();
</script>
