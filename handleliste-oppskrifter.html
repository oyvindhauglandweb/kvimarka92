<!DOCTYPE html><html lang="no"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Handleliste - Oppskrifter</title><!-- version: shopping-recipes-order-v1-2026-06-04 --><style>
:root{--bg:#f2f2f2;--card:#fff;--text:#333;--muted:#667;--border:#ccc;--link:#1f789d;--button:#fff;--button-hover:#e9eef2;--soft:#eaeaea;--success:#72c184;--danger:#d77;}body.dark-mode{--bg:#151515;--card:#242424;--text:#eee;--muted:#bbb;--border:#555;--link:#7cc7e8;--button:#242424;--button-hover:#3a3a3a;--soft:#333;}*{box-sizing:border-box;}body{margin:0;padding:20px;background:var(--bg);color:var(--text);font-family:Arial,sans-serif;}.container{max-width:980px;margin:auto;}.header{text-align:center;margin-bottom:20px;}.site-title{margin:0;font-size:30px;}.subtitle{margin-top:8px;color:var(--muted);font-size:16px;}.top-buttons{display:flex;justify-content:center;align-items:center;gap:10px;margin:14px 0 0;}.top-button{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;padding:0;background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--text);text-decoration:none;font-size:24px;font-weight:bold;line-height:1;cursor:pointer;}.top-button:hover,.action-button:hover{background:var(--button-hover);}.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px;margin-bottom:10px;}.toolbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;}.action-button{display:inline-flex;align-items:center;justify-content:center;min-height:34px;padding:0 10px;background:var(--button);border:1px solid var(--border);border-radius:8px;color:var(--text);font-weight:bold;text-decoration:none;cursor:pointer;font-size:14px;}.primary{background:var(--link);border-color:var(--link);color:#fff;}.status{color:var(--muted);line-height:1.35;font-size:14px;}.status.error{color:var(--danger);}.status.success{color:var(--success);}.recipe-list{display:flex;flex-direction:column;gap:6px;}.recipe-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--border);border-radius:8px;padding:8px 10px;background:rgba(127,127,127,.04);}.recipe-title{font-size:16px;font-weight:bold;line-height:1.15;}.recipe-description{color:var(--muted);font-size:12px;margin-top:2px;}.recipe-items{color:var(--muted);font-size:12px;margin-top:4px;line-height:1.25;}.badge{display:inline-flex;align-items:center;min-height:18px;padding:0 6px;border-radius:999px;background:rgba(124,199,232,.16);color:var(--link);font-size:10px;font-weight:bold;white-space:nowrap;}.empty{padding:18px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:10px;}@media(max-width:700px){body{padding:6px;}.header{margin-bottom:12px;}.site-title{font-size:28px;}.card{padding:7px;margin-bottom:7px;border-radius:10px;}.toolbar{align-items:stretch;width:100%;}.action-button{flex:1 1 auto;min-height:31px;padding:0 7px;font-size:12px;}.recipe-row{padding:6px 7px;gap:6px;}.recipe-title{font-size:14px;}.recipe-description,.recipe-items{font-size:11px;}}</style></head><body class="dark-mode"><div class="container"><div class="header"><h1 class="site-title">Handleliste</h1><div class="subtitle">Oppskrifter</div><div class="top-buttons"><a class="top-button" href="handleliste-bestille.html" title="Tilbake til Bestille">←</a><a class="top-button" href="index.html" title="Hovedside">⌂</a><a class="top-button" href="help.html?case=Handleliste" title="Hjelp">?</a></div></div>
<div class="card"><div class="toolbar"><a class="action-button" href="handleliste-bestille.html">Bestille</a><a class="action-button" href="handleliste-handle.html">Handle</a><a class="action-button" href="handleliste-oppskrifter-rediger.html">✎ Rediger oppskrifter</a></div></div>
<div class="card"><div id="status" class="status">Laster...</div></div><div class="card"><div id="recipeList"></div></div></div><script>
const API_BASE="https://api-kvimarka92.carstereogarage.com";
function esc(value){return String(value??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");}
async function fetchJson(url,options){const res=await fetch(url,{credentials:"include",...(options||{})});const data=await res.json().catch(()=>null);if(!res.ok||(data&&data.error)){throw new Error(data?.error||data?.detail||`HTTP ${res.status}`);}return data;}
function setStatus(message,type){const el=document.getElementById("status");el.className="status"+(type?` ${type}`:"");el.innerHTML=message||"";}
let recipes=[];let recipeItems=[];
function itemsForRecipe(recipeId){return recipeItems.filter(item=>Number(item.recipeId)===Number(recipeId));}
function render(){const root=document.getElementById("recipeList");if(!recipes.length){root.innerHTML='<div class="empty">Ingen oppskrifter er lagt inn ennå.</div>';return;}root.innerHTML=`<div class="recipe-list">${recipes.map(recipe=>{const ingredients=itemsForRecipe(recipe.id);const preview=ingredients.slice(0,8).map(item=>item.quantity?`${item.itemName} (${item.quantity})`:item.itemName).join(", ");return `<div class="recipe-row"><div><div class="recipe-title">${esc(recipe.name)}</div>${recipe.description?`<div class="recipe-description">${esc(recipe.description)}</div>`:""}<div class="recipe-items"><span class="badge">${ingredients.length} varer</span>${preview?` ${esc(preview)}${ingredients.length>8?" …":""}`:""}</div></div><button class="action-button primary" type="button" onclick="addRecipeToList(${recipe.id})">+ Legg til</button></div>`;}).join("")}</div>`;}
async function loadRecipes(){
  setStatus("Laster oppskrifter...");
  try{
    const [shoppingData,recipeData]=await Promise.all([
      fetchJson(`${API_BASE}/shopping/items`),
      fetchJson(`${API_BASE}/shopping/recipes`)
    ]);

    shoppingItems=Array.isArray(shoppingData.items)?shoppingData.items:[];
    setShoppingOwners(shoppingData.ownerOptions);
    renderOwnerButtons();
    renderShoppingSummary();

    recipes=Array.isArray(recipeData.recipes)?recipeData.recipes:[];
    recipeItems=Array.isArray(recipeData.recipeItems)?recipeData.recipeItems:[];
    render();
    setStatus("Klar. Velg oppskriften du vil legge til i handlelisten.","success");
  }catch(error){
    setStatus(`Kunne ikke laste oppskrifter.<br><br>${esc(error.message)}`,"error");
  }
}
async function addRecipeToList(recipeId){const recipe=recipes.find(item=>Number(item.id)===Number(recipeId));if(!recipe)return;if(!confirm(`Legge alle varer fra oppskriften «${recipe.name}» til handlelisten?`))return;setStatus("Legger oppskrift til handlelisten...");try{const data=await fetchJson(`${API_BASE}/shopping/recipe-add-to-list`,{method:"POST",headers:{"Content-Type":"text/plain;charset=UTF-8"},body:JSON.stringify({recipeId})});setStatus(`Oppskriften er lagt til. ${data.createdCount} varer ble lagt i handlelisten.`,"success");}catch(error){setStatus(`Kunne ikke legge til oppskriften.<br><br>${esc(error.message)}`,"error");}}
loadRecipes();
</script></body></html>
