<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Handleliste - Masterbilder</title>
<!-- version: handleliste-admin-varebilder_v3_sync_items_from_master_2026_06_27 | requires worker-v182-sync-item-images-from-master -->
<style>
:root{--bg:#f2f2f2;--card:#fff;--text:#222;--muted:#667;--border:#ccc;--link:#1f789d;--button:#fff;--button-hover:#eef3f6;--accent:#2f7d8f;--danger:#d86363;--success:#278c48;}
body.dark-mode{--bg:#151515;--card:#242424;--text:#eee;--muted:#bbb;--border:#555;--link:#7cc7e8;--button:#2b2b2b;--button-hover:#3a3a3a;--accent:#2f6f80;--danger:#ff7777;--success:#72c184;}
*{box-sizing:border-box;}
body{margin:0;padding:18px;background:var(--bg);color:var(--text);font-family:Arial,sans-serif;}
.container{max-width:1120px;margin:auto;}
.header{text-align:center;margin-bottom:16px;}
.site-title{margin:0;font-size:30px;}
.subtitle{margin-top:6px;color:var(--muted);}
.top-buttons{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:14px;}
.top-button{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--text);text-decoration:none;font-size:23px;font-weight:bold;}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px;}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between;}
.left-tools,.right-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
button,.button{min-height:36px;padding:0 12px;border:0;border-radius:8px;background:var(--button);color:var(--text);font-weight:bold;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;}
button:hover,.button:hover{background:var(--button-hover);}
.primary{background:var(--accent);color:#fff;}
.danger{background:rgba(216,99,99,.15);color:var(--danger);}
input,select{min-height:38px;border:1px solid var(--border);border-radius:8px;background:var(--button);color:var(--text);padding:0 10px;font-size:15px;}
.search{min-width:260px;}
.status{color:var(--link);line-height:1.35;}
.status.error{color:var(--danger);}
.status.success{color:var(--success);}
.info{color:var(--muted);font-size:13px;line-height:1.35;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;}
.item-card{border:1px solid var(--border);border-radius:12px;background:rgba(127,127,127,.06);padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0;}
.image-box{width:100%;height:140px;border-radius:10px;background:#fff;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;overflow:hidden;color:#777;font-size:30px;}
.image-box img{width:100%;height:100%;object-fit:contain;background:#fff;display:block;}
.item-name{font-weight:bold;font-size:17px;line-height:1.15;}
.item-meta{color:var(--muted);font-size:13px;line-height:1.25;}
.badges{display:flex;gap:5px;flex-wrap:wrap;}
.badge{display:inline-flex;align-items:center;border-radius:999px;background:rgba(124,199,232,.18);color:var(--link);padding:4px 8px;font-weight:bold;font-size:12px;}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;}
.file-input{position:absolute;left:-9999px;width:1px;height:1px;opacity:0;}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:1000;padding:16px;}
.modal.open{display:flex;}
.modal-content{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;max-width:600px;width:min(600px,96vw);max-height:90vh;overflow:auto;}
.modal-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;}
.modal-title{font-size:24px;font-weight:bold;}
.close{width:42px;height:42px;padding:0;font-size:26px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.form-field{display:flex;flex-direction:column;gap:5px;margin-bottom:10px;}
.form-field label{font-weight:bold;font-size:13px;}
.preview{width:120px;height:120px;border:1px solid var(--border);border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#777;}
.preview img{width:100%;height:100%;object-fit:contain;background:#fff;}
.hidden{display:none!important;}
@media(max-width:700px){
  body{padding:10px;}
  .toolbar{align-items:stretch;}
  .left-tools,.right-tools{width:100%;}
  .search{min-width:0;width:100%;}
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));}
  .image-box{height:116px;}
  .form-grid{grid-template-columns:1fr;}
}
</style>
<script src="handleliste-menu.js?v=14"></script>

<meta name="kvimarka-page-version" content="handleliste-admin-varebilder_v3_sync_items_from_master_2026_06_27 | requires worker-v182-sync-item-images-from-master">
<meta name="kvimarka-area" content="Handleliste">
<script src="shared/kvimarka-version-footer.js"></script>
</head>
<body>
<div class="container">
  <div class="header page-icon-spacer-title">
    <h1 class="site-title">Handleliste</h1>
    <div class="subtitle">Masterbilder</div>
    <div class="top-buttons handleliste-shared-top-menu" id="handlelisteTopMenu"></div>
  </div>

  <div class="card">
    <div class="toolbar">
      <div class="left-tools">
        <input id="searchInput" class="search" type="search" placeholder="Søk vare..." oninput="renderItems()">
        <select id="typeFilter" onchange="renderItems()"><option value="">Alle varetyper</option></select>
        <select id="imageFilter" onchange="renderItems()">
          <option value="">Alle bilder</option>
          <option value="missing">Mangler bilde</option>
          <option value="has">Har bilde</option>
        </select>
      </div>
      <div class="right-tools">
        <button type="button" class="primary" onclick="openAddModal()">+ Ny mastervare</button>
        <button type="button" onclick="loadItems()">Oppdater</button>
        <button type="button" onclick="syncMasterImages(true)">Test synk</button>
        <button type="button" class="primary" onclick="syncMasterImages(false)">Synk til handlelister</button>
      </div>
    </div>
  </div>

  <div class="card">
    <div id="status" class="status">Laster...</div>
    <div id="permissionInfo" class="info" style="margin-top:6px;"></div>
  </div>

  <div id="syncResult" class="card hidden"></div>

  <div id="itemsGrid" class="grid"></div>
</div>

<div class="modal" id="addModal" onclick="handleModalBackdrop(event)">
  <div class="modal-content" onclick="event.stopPropagation()">
    <div class="modal-header">
      <div class="modal-title">Ny mastervare</div>
      <button class="close" type="button" onclick="closeAddModal()">×</button>
    </div>
    <form id="addForm">
      <div class="form-grid">
        <div class="form-field">
          <label for="newName">Varenavn</label>
          <input id="newName" type="text" required>
        </div>
        <div class="form-field">
          <label for="newType">Varetype</label>
          <select id="newType" required></select>
        </div>
      </div>
      <div class="form-field">
        <label for="newArea">Handleområde</label>
        <select id="newArea">
          <option value="Matvarer">Matvarer</option>
          <option value="Apotek">Apotek</option>
          <option value="Bondekompaniet">Bondekompaniet</option>
          <option value="Clas Ohlson">Clas Ohlson</option>
          <option value="Europris">Europris</option>
          <option value="Frisør">Frisør</option>
          <option value="Normal">Normal</option>
          <option value="Sport">Sport</option>
        </select>
      </div>
      <div class="form-field">
        <label>Bilde</label>
        <div class="preview" id="newPreview">📷</div>
        <input id="newImage" class="file-input" type="file" accept="image/*" onchange="handleNewImageChange(event)">
        <label class="button" for="newImage">Velg bilde</label>
        <div class="info">Bildet konverteres til JPG med hvit bakgrunn før lagring.</div>
      </div>
      <div class="toolbar">
        <button type="button" onclick="closeAddModal()">Avbryt</button>
        <button id="saveNewButton" class="primary" type="submit">Lagre mastervare</button>
      </div>
    </form>
  </div>
</div>

<script>
const API_BASE="https://api-kvimarka92.carstereogarage.com";
let items=[];
let types=[];
let canManageImages=false;
let newImageDataUrl="";
let newImageFileName="";

function esc(value){
  return String(value==null?"":value)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}

function setStatus(message,type){
  const el=document.getElementById("status");
  el.className="status"+(type?` ${type}`:"");
  el.innerHTML=message||"";
}

async function fetchJson(url,options){
  const fetchOptions={
    credentials:"include",
    ...(options||{})
  };
  const res=await fetch(url,fetchOptions);
  const text=await res.text();
  let data=null;
  try{data=text?JSON.parse(text):null;}catch(error){throw new Error(text||`HTTP ${res.status}`);}
  if(!res.ok || data&&data.error){throw new Error(data&&(data.detail||data.error)||`HTTP ${res.status}`);}
  return data;
}

function getImageUrl(item){
  return item.thumbnailImageUrl || item.imageUrl || (item.thumbnailImage&&item.thumbnailImage.url) || (item.image&&item.image.url) || "";
}

function getFullImageUrl(item){
  return item.imageUrl || (item.image&&item.image.url) || getImageUrl(item);
}

function imageHtml(item){
  const url=getImageUrl(item);
  const full=getFullImageUrl(item);
  if(!url)return '<div class="image-box">📷</div>';
  const fallback=full&&full!==url?` data-full-src="${esc(full)}" onerror="this.onerror=null;this.src=this.dataset.fullSrc;"`:` onerror="this.onerror=null;this.style.display='none';this.parentNode.textContent='📷';"`;
  return `<div class="image-box"><img src="${esc(url)}" alt="" title="${esc(item.name)}"${fallback}></div>`;
}

function populateFilters(){
  const typeFilter=document.getElementById("typeFilter");
  const newType=document.getElementById("newType");
  const options=types.map(type=>`<option value="${esc(type)}">${esc(type)}</option>`).join("");
  typeFilter.innerHTML='<option value="">Alle varetyper</option>'+options;
  newType.innerHTML=options || '<option value="Annet">Annet</option>';
}

function filteredItems(){
  const q=document.getElementById("searchInput").value.trim().toLowerCase();
  const type=document.getElementById("typeFilter").value;
  const imageFilter=document.getElementById("imageFilter").value;
  return items.filter(item=>{
    if(q && !String(item.name||"").toLowerCase().includes(q))return false;
    if(type && item.type!==type)return false;
    const has=!!getImageUrl(item);
    if(imageFilter==="missing" && has)return false;
    if(imageFilter==="has" && !has)return false;
    return true;
  });
}

function renderItems(){
  const grid=document.getElementById("itemsGrid");
  const rows=filteredItems();
  if(!rows.length){
    grid.innerHTML='<div class="card">Ingen varer funnet.</div>';
    return;
  }
  grid.innerHTML=rows.map(item=>{
    const hasImage=!!getImageUrl(item);
    return `<div class="item-card">
      ${imageHtml(item)}
      <div class="item-name">${esc(item.name)}</div>
      <div class="item-meta">${esc(item.type||"")} · ${esc(item.shoppingArea||"")}</div>
      <div class="badges">
        ${hasImage?'<span class="badge">Har bilde</span>':'<span class="badge">Mangler bilde</span>'}
        ${item.hasThumbnailImage?'<span class="badge">Thumbnail</span>':''}
      </div>
      <div class="actions">
        ${canManageImages?`<input class="file-input" id="file-${Number(item.id)}" type="file" accept="image/*" onchange="replaceImage(${Number(item.id)},event)"><label class="button" for="file-${Number(item.id)}">Bytt bilde</label><button class="danger" type="button" onclick="deleteImage(${Number(item.id)})">Slett bilde</button>`:'<span class="info">Kun Øyvind kan bytte/slette eksisterende bilder.</span>'}
      </div>
    </div>`;
  }).join("");
}

async function loadItems(){
  setStatus("Laster mastervarer...");
  try{
    const data=await fetchJson(`${API_BASE}/shopping/admin/master-images`);
    items=Array.isArray(data.suggestions)?data.suggestions:[];
    types=Array.isArray(data.types)?data.types:[];
    canManageImages=!!data.canManageImages;
    populateFilters();
    renderItems();
    document.getElementById("permissionInfo").innerHTML=canManageImages
      ? "Du kan legge til mastervarer og bytte/slette eksisterende masterbilder."
      : "Du kan legge til nye mastervarer med bilde. Bytte/sletting av eksisterende bilder er låst til Øyvind.";
    setStatus(`Klar. Viser ${items.length} mastervarer.`, "success");
  }catch(error){
    setStatus(`Kunne ikke laste masterbilder.<br><br>${esc(error.message)}<br><br>Test API direkte: ${esc(API_BASE)}/shopping/admin/master-images`,"error");
  }
}

function resizeImageFileToDataUrl(file,maxSize=900,quality=.84){
  return new Promise((resolve,reject)=>{
    if(!file){resolve("");return;}
    if(!/^image\//i.test(file.type||"")){reject(new Error("Velg en bildefil."));return;}
    const reader=new FileReader();
    reader.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const scale=Math.min(1,maxSize/Math.max(img.width,img.height));
        const canvas=document.createElement("canvas");
        canvas.width=Math.max(1,Math.round(img.width*scale));
        canvas.height=Math.max(1,Math.round(img.height*scale));
        const ctx=canvas.getContext("2d");
        ctx.fillStyle="#fff";
        ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL("image/jpeg",quality));
      };
      img.onerror=()=>reject(new Error("Kunne ikke lese bildet."));
      img.src=reader.result;
    };
    reader.onerror=()=>reject(new Error("Kunne ikke lese bildet."));
    reader.readAsDataURL(file);
  });
}

function openAddModal(){
  newImageDataUrl="";
  newImageFileName="";
  document.getElementById("addForm").reset();
  document.getElementById("newPreview").innerHTML="📷";
  document.getElementById("addModal").classList.add("open");
}

function closeAddModal(){
  document.getElementById("addModal").classList.remove("open");
}

function handleModalBackdrop(event){
  if(event.target.id==="addModal")closeAddModal();
}

async function handleNewImageChange(event){
  const file=event.target.files&&event.target.files[0];
  if(!file)return;
  newImageDataUrl=await resizeImageFileToDataUrl(file);
  newImageFileName=file.name||"mastervare.jpg";
  document.getElementById("newPreview").innerHTML=`<img src="${newImageDataUrl}" alt="">`;
}

async function replaceImage(id,event){
  const file=event.target.files&&event.target.files[0];
  if(!file)return;
  const item=items.find(row=>Number(row.id)===Number(id));
  if(!confirm(`Bytte bilde for "${item?item.name:id}"?`)){event.target.value="";return;}
  try{
    setStatus("Laster opp nytt bilde...");
    const imageDataUrl=await resizeImageFileToDataUrl(file);
    await fetchJson(`${API_BASE}/shopping/admin/master-suggestions/image-update`,{
      method:"POST",
      headers:{"Content-Type":"text/plain;charset=UTF-8"},
      body:JSON.stringify({id,imageDataUrl,imageFileName:file.name||`vare-${id}.jpg`})
    });
    await loadItems();
    setStatus("Bildet er oppdatert.", "success");
  }catch(error){
    setStatus(`Kunne ikke bytte bilde.<br><br>${esc(error.message)}`,"error");
  }finally{
    event.target.value="";
  }
}

async function deleteImage(id){
  const item=items.find(row=>Number(row.id)===Number(id));
  if(!confirm(`Slette bilde for "${item?item.name:id}"?`))return;
  try{
    setStatus("Sletter bilde...");
    await fetchJson(`${API_BASE}/shopping/admin/master-suggestions/image-delete`,{
      method:"POST",
      headers:{"Content-Type":"text/plain;charset=UTF-8"},
      body:JSON.stringify({id})
    });
    await loadItems();
    setStatus("Bildet er slettet.", "success");
  }catch(error){
    setStatus(`Kunne ikke slette bilde.<br><br>${esc(error.message)}`,"error");
  }
}

document.getElementById("addForm").addEventListener("submit",async event=>{
  event.preventDefault();
  const button=document.getElementById("saveNewButton");
  const name=document.getElementById("newName").value.trim();
  const type=document.getElementById("newType").value;
  const shoppingArea=document.getElementById("newArea").value;
  button.disabled=true;
  try{
    await fetchJson(`${API_BASE}/shopping/admin/master-suggestions/create`,{
      method:"POST",
      headers:{"Content-Type":"text/plain;charset=UTF-8"},
      body:JSON.stringify({
        name,
        type,
        shoppingArea,
        imageDataUrl:newImageDataUrl||undefined,
        imageFileName:newImageFileName||`${name}.jpg`
      })
    });
    closeAddModal();
    await loadItems();
    setStatus("Mastervaren er lagt til.", "success");
  }catch(error){
    setStatus(`Kunne ikke lagre mastervare.<br><br>${esc(error.message)}`,"error");
  }finally{
    button.disabled=false;
  }
});


function renderSyncResult(data){
  const box=document.getElementById("syncResult");
  const samples=Array.isArray(data.samples)?data.samples:[];
  box.classList.remove("hidden");
  box.innerHTML=`<div class="status ${data.dryRun?"":"success"}">${esc(data.note||"Synk ferdig.")}</div>
    <div class="info" style="margin-top:8px;">
      Skannet: <b>${esc(data.scanned)}</b> ·
      Masterbilder: <b>${esc(data.masterWithImages)}</b> ·
      Matchet: <b>${esc(data.matched)}</b> ·
      Kan oppdateres: <b>${esc(data.eligible)}</b> ·
      ${data.dryRun?"Ville oppdatert":"Oppdatert"}: <b>${esc(data.updated)}</b> ·
      Gjenstår: <b>${esc(data.remaining)}</b> ·
      Feil: <b>${esc(data.failed)}</b>
    </div>
    ${samples.length?`<div class="info" style="margin-top:8px;">Eksempler: ${samples.map(row=>`${esc(row.itemName)} ← ${esc(row.masterName)}`).join(", ")}</div>`:""}`;
}

async function syncMasterImages(dryRun){
  const action=dryRun?"testkjøre synk":"oppdatere bildene i handlelistene fra master";
  if(!dryRun && !confirm("Dette oppdaterer bilder/thumbnail på eksisterende Shopping items der varenavn matcher mastervaren. Fortsette?"))return;

  setStatus(`Starter ${action}...`);
  try{
    const data=await fetchJson(`${API_BASE}/shopping/admin/sync-item-images-from-master`,{
      method:"POST",
      headers:{"Content-Type":"text/plain;charset=UTF-8"},
      body:JSON.stringify({dryRun,limit:500})
    });
    renderSyncResult(data);
    setStatus(dryRun?"Testsynk er ferdig. Ingen rader er endret.":"Bilder er synkronisert til handlelistene.", dryRun?"":"success");
  }catch(error){
    setStatus(`Kunne ikke synkronisere bilder.<br><br>${esc(error.message)}`,"error");
  }
}


document.addEventListener("DOMContentLoaded",loadItems);
</script>
</body>
</html>
