<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OneDrive-bilder admin</title>
  <!-- version: stop-folder-params-v1-2026-06-03 -->

  <style>
    :root{
      --bg:#f6f8fb;
      --card:#ffffff;
      --text:#172033;
      --muted:#667085;
      --border:#d9e2ef;
      --danger:#c62828;
      --danger-bg:#fff1f1;
      --primary:#2563eb;
      --soft:#eef2ff;
      --header:#ffffff;
      --shadow:0 10px 25px rgba(15,23,42,.08);
      --modal-bg:rgba(15,23,42,.82);
    }

    body.dark-mode{
      --bg:#151515;
      --card:#242424;
      --text:#eeeeee;
      --muted:#bbbbbb;
      --border:#555555;
      --danger:#ff8a8a;
      --danger-bg:rgba(198,40,40,.14);
      --primary:#7cc7e8;
      --soft:#333333;
      --header:#202020;
      --shadow:0 10px 25px rgba(0,0,0,.35);
      --modal-bg:rgba(0,0,0,.88);
    }

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:var(--bg);
      color:var(--text);
    }

    header{
      padding:20px;
      background:var(--header);
      border-bottom:1px solid var(--border);
      position:sticky;
      top:0;
      z-index:10;
    }

    .header-row{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:16px;
    }

    h1{
      margin:0;
      font-size:22px;
    }

    .subtitle{
      margin-top:6px;
      color:var(--muted);
      font-size:14px;
    }

    .header-actions{
      display:flex;
      align-items:center;
      gap:10px;
      flex:0 0 auto;
    }

    .icon-button{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      width:44px;
      height:44px;
      padding:0;
      border:1px solid var(--border);
      border-radius:8px;
      background:var(--card);
      color:var(--text);
      text-decoration:none;
      font-size:24px;
      font-weight:bold;
      line-height:1;
      box-sizing:border-box;
      cursor:pointer;
    }

    .icon-button:hover{
      background:var(--soft);
    }

    body.dark-mode .icon-button{
      background:#202020;
      border-color:#555;
      color:#fff;
    }

    body.dark-mode .icon-button:hover{
      background:#333;
    }

    main{
      padding:20px;
      max-width:1200px;
      margin:0 auto;
    }

    .toolbar{
      display:grid;
      grid-template-columns:1fr auto;
      gap:10px;
      align-items:center;
      margin-bottom:18px;
    }

    .status{
      font-size:14px;
      color:var(--muted);
    }

    .button{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      width:98px;
      height:44px;
      padding:0;
      border:1px solid var(--border);
      border-radius:8px;
      background:var(--card);
      color:var(--text);
      font-size:13px;
      font-weight:700;
      line-height:1;
      box-sizing:border-box;
      cursor:pointer;
    }

    .button:hover{
      background:var(--soft);
    }

    body.dark-mode .button{
      background:#202020;
      border-color:#555;
      color:#fff;
    }

    body.dark-mode .button:hover{
      background:#333;
    }

    .button:disabled{
      opacity:.55;
      cursor:not-allowed;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
      gap:16px;
    }

    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:16px;
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    .preview{
      height:150px;
      background:linear-gradient(135deg,var(--soft),var(--card));
      display:flex;
      align-items:center;
      justify-content:center;
      color:var(--muted);
      font-size:44px;
      width:100%;
      border:0;
      padding:0;
      cursor:pointer;
      overflow:hidden;
    }

    .thumb-image{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .thumb-image.is-loading{
      opacity:.25;
    }

    .content{
      padding:14px;
    }

    .name{
      font-weight:700;
      word-break:break-word;
      margin-bottom:8px;
    }

    .meta{
      color:var(--muted);
      font-size:13px;
      line-height:1.45;
      margin-bottom:12px;
    }

    .actions{
      display:flex;
      gap:8px;
      align-items:center;
      justify-content:space-between;
    }

    .open-link{
      color:var(--primary);
      text-decoration:none;
      font-size:13px;
      font-weight:600;
    }

    .delete-button{
      border:1px solid #ffc9c9;
      background:var(--danger-bg);
      color:var(--danger);
      border-radius:10px;
      padding:8px 10px;
      cursor:pointer;
      font-weight:700;
    }

    body.dark-mode .delete-button{
      border-color:rgba(255,138,138,.5);
    }

    .delete-button:disabled{
      opacity:.55;
      cursor:not-allowed;
    }

    .error{
      background:#fff1f1;
      color:#991b1b;
      border:1px solid #fecaca;
      padding:12px 14px;
      border-radius:12px;
      margin-bottom:16px;
      display:none;
      white-space:pre-wrap;
    }

    body.dark-mode .error{
      background:rgba(198,40,40,.14);
      color:#ffb4b4;
      border-color:rgba(255,138,138,.45);
    }

    .empty{
      background:var(--card);
      border:1px dashed var(--border);
      padding:30px;
      text-align:center;
      color:var(--muted);
      border-radius:16px;
    }

    .modal{
      position:fixed;
      inset:0;
      z-index:1000;
      display:none;
    }

    .modal.open{
      display:block;
    }

    .modal-backdrop{
      position:absolute;
      inset:0;
      background:var(--modal-bg);
    }

    .modal-content{
      position:absolute;
      inset:24px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:12px;
    }

    .modal-title{
      color:#fff;
      font-weight:700;
      text-align:center;
      max-width:90vw;
      word-break:break-word;
    }

    .modal-image{
      max-width:96vw;
      max-height:82vh;
      object-fit:contain;
      background:#111827;
      border-radius:12px;
      box-shadow:0 20px 60px rgba(0,0,0,.45);
    }

    .modal-close{
      position:absolute;
      top:0;
      right:0;
      width:44px;
      height:44px;
      border:0;
      border-radius:50%;
      background:#fff;
      color:#111827;
      font-size:30px;
      line-height:1;
      cursor:pointer;
      z-index:2;
    }

    @media(max-width:700px){
      header{
        padding:14px;
      }

      .header-row{
        flex-direction:column;
      }

      .header-actions{
        align-self:flex-start;
      }

      main{
        padding:14px;
      }

      .grid{
        grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="header-row">
      <div>
        <h1>OneDrive-bilder admin</h1>
        <div class="subtitle" id="subtitle">Laster...</div>
      </div>

      <div class="header-actions">
        <button class="icon-button" id="closePageButton" type="button" title="Tilbake">←</button>
        <button class="icon-button" id="themeToggleButton" type="button" title="Bytt visning">☾</button>
      </div>
    </div>
  </header>

  <main>
    <div class="toolbar">
      <div class="status" id="status">Starter...</div>
      <button class="button" id="reloadButton" type="button">Last på nytt</button>
    </div>

    <div class="error" id="errorBox"></div>
    <div class="grid" id="grid"></div>
  </main>

  <div class="modal" id="imageModal" aria-hidden="true">
    <div class="modal-backdrop" id="modalBackdrop"></div>
    <div class="modal-content" role="dialog" aria-modal="true">
      <button class="modal-close" id="modalCloseButton" type="button">×</button>
      <div class="modal-title" id="modalTitle"></div>
      <img class="modal-image" id="modalImage" alt="">
    </div>
  </div>

  <script>
    const API_BASE = "https://api-kvimarka92.carstereogarage.com";
    const THEME_STORAGE_KEY = "kvimarka92Theme";

    const params = new URLSearchParams(window.location.search);
    const caseName = params.get("case") || "";
    const stopId = params.get("stop") || params.get("stopId") || "";
    const folderId = params.get("folderId") || params.get("itemId") || "";
    const stopName = params.get("stopName") || "";

    console.log("onedrive-images.html version: stop-folder-params-v1-2026-06-03", {
      caseName,
      stopId,
      folderId,
      stopName
    });

    const subtitle = document.getElementById("subtitle");
    const statusEl = document.getElementById("status");
    const errorBox = document.getElementById("errorBox");
    const grid = document.getElementById("grid");
    const reloadButton = document.getElementById("reloadButton");
    const themeToggleButton = document.getElementById("themeToggleButton");
    const closePageButton = document.getElementById("closePageButton");

    const imageModal = document.getElementById("imageModal");
    const modalImage = document.getElementById("modalImage");
    const modalTitle = document.getElementById("modalTitle");
    const modalBackdrop = document.getElementById("modalBackdrop");
    const modalCloseButton = document.getElementById("modalCloseButton");

    let currentItems = [];

    function getLegacyThemeValue(){
      const possibleKeys = [
        "theme",
        "colorMode",
        "appearance",
        "kvimarka92ColorMode",
        "kvimarka92DarkMode"
      ];

      for(const key of possibleKeys){
        const value = localStorage.getItem(key);

        if(value !== null && value !== undefined && value !== ""){
          return String(value).toLowerCase();
        }
      }

      return "";
    }

    function getInitialTheme(){
      const saved = String(localStorage.getItem(THEME_STORAGE_KEY) || "").toLowerCase();

      if(saved === "dark" || saved === "light"){
        return saved;
      }

      const legacy = getLegacyThemeValue();

      if(["dark", "dark-mode", "mørk", "true", "1", "yes"].includes(legacy)){
        return "dark";
      }

      if(["light", "light-mode", "lys", "false", "0", "no"].includes(legacy)){
        return "light";
      }

      if(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches){
        return "dark";
      }

      return "light";
    }

    function applyTheme(theme){
      const normalizedTheme = theme === "dark" ? "dark" : "light";

      document.body.classList.toggle("dark-mode", normalizedTheme === "dark");
      themeToggleButton.textContent = "☾";
      themeToggleButton.title = normalizedTheme === "dark" ? "Bytt til lys visning" : "Bytt til mørk visning";

      localStorage.setItem(THEME_STORAGE_KEY, normalizedTheme);
    }

    function toggleTheme(){
      const nextTheme = document.body.classList.contains("dark-mode") ? "light" : "dark";
      applyTheme(nextTheme);
    }

    themeToggleButton.addEventListener("click", toggleTheme);
    applyTheme(getInitialTheme());

    function closePage(){
      if(window.history.length > 1){
        window.history.back();
        return;
      }

      if(document.referrer){
        window.location.href = document.referrer;
        return;
      }

      const fallbackCase = caseName || "";
      const fallbackUrl = fallbackCase
        ? `reiserute.html?case=${encodeURIComponent(fallbackCase)}`
        : "index.html?restoreMenu=1";

      window.location.href = fallbackUrl;
    }

    closePageButton.addEventListener("click", closePage);

    function showError(message){
      errorBox.textContent = message;
      errorBox.style.display = "block";
    }

    function clearError(){
      errorBox.textContent = "";
      errorBox.style.display = "none";
    }

    function formatBytes(bytes){
      const value = Number(bytes || 0);

      if(!value){
        return "0 B";
      }

      const units = ["B", "KB", "MB", "GB"];
      let size = value;
      let unitIndex = 0;

      while(size >= 1024 && unitIndex < units.length - 1){
        size = size / 1024;
        unitIndex += 1;
      }

      return `${size.toFixed(size >= 10 ? 1 : 2)} ${units[unitIndex]}`;
    }

    function imageSizeText(item){
      if(item.width && item.height){
        return `${item.width} × ${item.height}px`;
      }

      return "Ukjent bildestørrelse";
    }

    function imageUrl(item, mode, size){
      const url = `${API_BASE}/onedrive/image?id=${encodeURIComponent(item.id)}&mode=${encodeURIComponent(mode)}`;

      if(size){
        return `${url}&size=${encodeURIComponent(size)}`;
      }

      return url;
    }

    function openImageModal(item){
      modalTitle.textContent = item.name || "";
      modalImage.src = imageUrl(item, "full");
      modalImage.alt = item.name || "Forstørret bilde";
      modalImage.dataset.downloadFallbackTried = "";

      modalImage.onerror = () => {
        if(!modalImage.dataset.downloadFallbackTried && item.downloadUrl){
          modalImage.dataset.downloadFallbackTried = "true";
          modalImage.src = item.downloadUrl;
        }
      };

      imageModal.classList.add("open");
      imageModal.setAttribute("aria-hidden", "false");
    }

    function closeImageModal(){
      imageModal.classList.remove("open");
      imageModal.setAttribute("aria-hidden", "true");
      modalImage.onerror = null;
      modalImage.src = "";
      modalImage.alt = "";
      modalTitle.textContent = "";
    }

    modalBackdrop.addEventListener("click", closeImageModal);
    modalCloseButton.addEventListener("click", closeImageModal);

    document.addEventListener("keydown", event => {
      if(event.key === "Escape" && imageModal.classList.contains("open")){
        closeImageModal();
      }
    });

    function render(){
      grid.innerHTML = "";

      if(!currentItems.length){
        grid.innerHTML = `
          <div class="empty">
            Ingen bilder funnet for denne reisen${stopName ? ` / ${stopName}` : ""}.
          </div>
        `;
        return;
      }

      currentItems.forEach(item => {
        const card = document.createElement("article");
        card.className = "card";
        card.dataset.id = item.id;

        card.innerHTML = `
          <button class="preview image-preview-button" type="button" title="Forstørr bilde">
            <img class="thumb-image is-loading" alt="">
          </button>
          <div class="content">
            <div class="name"></div>
            <div class="meta"></div>
            <div class="actions">
              <a class="open-link" target="_blank" rel="noopener">Åpne i OneDrive</a>
              <button class="delete-button" type="button" title="Slett bilde">🗑️ Slett</button>
            </div>
          </div>
        `;

        card.querySelector(".name").textContent = item.name || "(uten navn)";

        const thumbImage = card.querySelector(".thumb-image");
        thumbImage.src = imageUrl(item, "thumb", "medium");
        thumbImage.alt = item.name || "OneDrive-bilde";
        thumbImage.addEventListener("load", () => {
          thumbImage.classList.remove("is-loading");
        });
        thumbImage.addEventListener("error", () => {
          if(!thumbImage.dataset.fullFallbackTried){
            thumbImage.dataset.fullFallbackTried = "true";
            thumbImage.src = imageUrl(item, "full");
            return;
          }

          if(!thumbImage.dataset.downloadFallbackTried && item.downloadUrl){
            thumbImage.dataset.downloadFallbackTried = "true";
            thumbImage.src = item.downloadUrl;
            return;
          }

          thumbImage.classList.remove("is-loading");
          thumbImage.alt = `Kunne ikke laste ${item.name || "bilde"}`;
        });

        card.querySelector(".image-preview-button").addEventListener("click", () => {
          openImageModal(item);
        });

        card.querySelector(".meta").innerHTML = `
          ${imageSizeText(item)}<br>
          ${formatBytes(item.size)}<br>
          ${item.mimeType || ""}
        `;

        const link = card.querySelector(".open-link");
        link.href = item.webUrl || "#";

        const deleteButton = card.querySelector(".delete-button");
        deleteButton.addEventListener("click", () => deleteImage(item, card, deleteButton));

        grid.appendChild(card);
      });
    }

    async function loadImages(){
      clearError();

      if(!caseName){
        subtitle.textContent = "Mangler case i URL.";
        statusEl.textContent = "Bruk for eksempel: onedrive-images.html?case=Liverpool%201996";
        return;
      }

      reloadButton.disabled = true;
      statusEl.textContent = "Laster bilder...";
      subtitle.textContent = stopName
        ? `Reise: ${caseName} – stoppested: ${stopName}`
        : `Reise: ${caseName}`;

      try{
        const query = new URLSearchParams();
        query.set("case", caseName);

        if(stopId){
          query.set("stop", stopId);
        }

        if(folderId){
          query.set("folderId", folderId);
        }

        if(stopName){
          query.set("stopName", stopName);
        }

        const url = `${API_BASE}/onedrive/route-files?${query.toString()}`;

        const response = await fetch(url, {
          method: "GET",
          credentials: "include"
        });

        const data = await response.json();

        if(!response.ok || !data.success){
          throw new Error(data.error || data.detail || `HTTP ${response.status}`);
        }

        currentItems = Array.isArray(data.items) ? data.items : [];

        const effectiveName = data.stopName || stopName || "";
        const effectivePath = data.effectivePath || data.folderPath || "";

        subtitle.textContent = effectiveName
          ? `${data.routeCase?.title || caseName} – ${effectiveName}`
          : `${data.routeCase?.title || caseName} – ${effectivePath}`;

        const sourceText = data.stopFolderId
          ? " – stoppestedets mappe"
          : (data.listedChildFolders ? " – bilder fra undermapper" : (data.autoEnteredSubfolder ? " – undermappe åpnet automatisk" : ""));

        statusEl.textContent = `${currentItems.length} bilder funnet${sourceText}`;

        render();
      }catch(error){
        showError(error.message);
        statusEl.textContent = "Kunne ikke laste bilder.";
      }finally{
        reloadButton.disabled = false;
      }
    }

    async function deleteImage(item, card, button){
      const confirmed = window.confirm(
        `Slett bildet fra OneDrive-arkivet?\n\n${item.name}\n\nBildet flyttes til OneDrive-papirkurven.`
      );

      if(!confirmed){
        return;
      }

      button.disabled = true;
      button.textContent = "Sletter...";

      try{
        const response = await fetch(`${API_BASE}/onedrive/delete-item`, {
          method: "POST",
          credentials: "include",
          body: JSON.stringify({
            id: item.id
          })
        });

        const data = await response.json();

        if(!response.ok || !data.success){
          throw new Error(data.error || data.detail || `HTTP ${response.status}`);
        }

        currentItems = currentItems.filter(existing => existing.id !== item.id);
        card.remove();
        statusEl.textContent = `${currentItems.length} bilder igjen. Slettet: ${item.name}`;

        if(!currentItems.length){
          render();
        }
      }catch(error){
        showError(`Kunne ikke slette ${item.name}: ${error.message}`);
        button.disabled = false;
        button.textContent = "🗑️ Slett";
      }
    }

    reloadButton.addEventListener("click", loadImages);
    loadImages();
  </script>
</body>
</html>
