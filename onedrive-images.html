<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OneDrive-bilder admin</title>

  <style>
    :root{
      --bg:#f6f8fb;
      --card:#ffffff;
      --text:#172033;
      --muted:#667085;
      --border:#d9e2ef;
      --danger:#c62828;
      --danger-bg:#fff1f1;
      --primary:#2563eb;
      --shadow:0 10px 25px rgba(15,23,42,.08);
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:var(--bg);
      color:var(--text);
    }

    header{
      padding:20px;
      background:#fff;
      border-bottom:1px solid var(--border);
      position:sticky;
      top:0;
      z-index:10;
    }

    h1{ margin:0; font-size:22px; }

    .subtitle{
      margin-top:6px;
      color:var(--muted);
      font-size:14px;
    }

    main{
      padding:20px;
      max-width:1200px;
      margin:0 auto;
    }

    .toolbar{
      display:flex;
      gap:10px;
      align-items:center;
      justify-content:space-between;
      flex-wrap:wrap;
      margin-bottom:18px;
    }

    .status{ font-size:14px; color:var(--muted); }

    .button{
      border:0;
      border-radius:10px;
      padding:10px 14px;
      cursor:pointer;
      background:var(--primary);
      color:#fff;
      font-weight:600;
    }

    .button:disabled{ opacity:.55; cursor:not-allowed; }

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
      gap:16px;
    }

    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:16px;
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    .preview{
      height:150px;
      background:linear-gradient(135deg,#eef2ff,#f8fafc);
      display:flex;
      align-items:center;
      justify-content:center;
      color:var(--muted);
      font-size:44px;
      width:100%;
      border:0;
      padding:0;
      cursor:pointer;
      overflow:hidden;
    }

    .thumb-image{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .thumb-image.is-loading{ opacity:.25; }

    .content{ padding:14px; }

    .name{
      font-weight:700;
      word-break:break-word;
      margin-bottom:8px;
    }

    .meta{
      color:var(--muted);
      font-size:13px;
      line-height:1.45;
      margin-bottom:12px;
    }

    .actions{
      display:flex;
      gap:8px;
      align-items:center;
      justify-content:space-between;
    }

    .open-link{
      color:var(--primary);
      text-decoration:none;
      font-size:13px;
      font-weight:600;
    }

    .delete-button{
      border:1px solid #ffc9c9;
      background:var(--danger-bg);
      color:var(--danger);
      border-radius:10px;
      padding:8px 10px;
      cursor:pointer;
      font-weight:700;
    }

    .delete-button:disabled{ opacity:.55; cursor:not-allowed; }

    .error{
      background:#fff1f1;
      color:#991b1b;
      border:1px solid #fecaca;
      padding:12px 14px;
      border-radius:12px;
      margin-bottom:16px;
      display:none;
      white-space:pre-wrap;
    }

    .empty{
      background:#fff;
      border:1px dashed var(--border);
      padding:30px;
      text-align:center;
      color:var(--muted);
      border-radius:16px;
    }

    .modal{
      position:fixed;
      inset:0;
      z-index:1000;
      display:none;
    }

    .modal.open{ display:block; }

    .modal-backdrop{
      position:absolute;
      inset:0;
      background:rgba(15,23,42,.82);
    }

    .modal-content{
      position:absolute;
      inset:24px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:12px;
    }

    .modal-title{
      color:#fff;
      font-weight:700;
      text-align:center;
      max-width:90vw;
      word-break:break-word;
    }

    .modal-image{
      max-width:96vw;
      max-height:82vh;
      object-fit:contain;
      background:#111827;
      border-radius:12px;
      box-shadow:0 20px 60px rgba(0,0,0,.45);
    }

    .modal-close{
      position:absolute;
      top:0;
      right:0;
      width:44px;
      height:44px;
      border:0;
      border-radius:50%;
      background:#fff;
      color:#111827;
      font-size:30px;
      line-height:1;
      cursor:pointer;
      z-index:2;
    }
  </style>
</head>

<body>
  <header>
    <h1>OneDrive-bilder admin</h1>
    <div class="subtitle" id="subtitle">Laster...</div>
  </header>

  <main>
    <div class="toolbar">
      <div class="status" id="status">Starter...</div>
      <button class="button" id="reloadButton" type="button">Last på nytt</button>
    </div>

    <div class="error" id="errorBox"></div>
    <div class="grid" id="grid"></div>
  </main>

  <div class="modal" id="imageModal" aria-hidden="true">
    <div class="modal-backdrop" id="modalBackdrop"></div>
    <div class="modal-content" role="dialog" aria-modal="true">
      <button class="modal-close" id="modalCloseButton" type="button">×</button>
      <div class="modal-title" id="modalTitle"></div>
      <img class="modal-image" id="modalImage" alt="">
    </div>
  </div>

  <script>
    const API_BASE = "https://api-kvimarka92.carstereogarage.com";

    const params = new URLSearchParams(window.location.search);
    const caseName = params.get("case") || "";

    const subtitle = document.getElementById("subtitle");
    const statusEl = document.getElementById("status");
    const errorBox = document.getElementById("errorBox");
    const grid = document.getElementById("grid");
    const reloadButton = document.getElementById("reloadButton");

    const imageModal = document.getElementById("imageModal");
    const modalImage = document.getElementById("modalImage");
    const modalTitle = document.getElementById("modalTitle");
    const modalBackdrop = document.getElementById("modalBackdrop");
    const modalCloseButton = document.getElementById("modalCloseButton");

    let currentItems = [];

    function showError(message){
      errorBox.textContent = message;
      errorBox.style.display = "block";
    }

    function clearError(){
      errorBox.textContent = "";
      errorBox.style.display = "none";
    }

    function formatBytes(bytes){
      const value = Number(bytes || 0);

      if(!value){
        return "0 B";
      }

      const units = ["B", "KB", "MB", "GB"];
      let size = value;
      let unitIndex = 0;

      while(size >= 1024 && unitIndex < units.length - 1){
        size = size / 1024;
        unitIndex += 1;
      }

      return `${size.toFixed(size >= 10 ? 1 : 2)} ${units[unitIndex]}`;
    }

    function imageSizeText(item){
      if(item.width && item.height){
        return `${item.width} × ${item.height}px`;
      }

      return "Ukjent bildestørrelse";
    }

    function imageUrl(item, mode, size){
      const url = `${API_BASE}/onedrive/image?id=${encodeURIComponent(item.id)}&mode=${encodeURIComponent(mode)}`;

      if(size){
        return `${url}&size=${encodeURIComponent(size)}`;
      }

      return url;
    }

function openImageModal(item){
  modalTitle.textContent = item.name || "";
  modalImage.src = imageUrl(item, "full");
  modalImage.alt = item.name || "Forstørret bilde";
  modalImage.dataset.downloadFallbackTried = "";

  modalImage.onerror = () => {
    if(!modalImage.dataset.downloadFallbackTried && item.downloadUrl){
      modalImage.dataset.downloadFallbackTried = "true";
      modalImage.src = item.downloadUrl;
    }
  };

  imageModal.classList.add("open");
  imageModal.setAttribute("aria-hidden", "false");
}

    function closeImageModal(){
      imageModal.classList.remove("open");
      imageModal.setAttribute("aria-hidden", "true");
      modalImage.src = "";
      modalImage.alt = "";
      modalTitle.textContent = "";
    }

    modalBackdrop.addEventListener("click", closeImageModal);
    modalCloseButton.addEventListener("click", closeImageModal);

    document.addEventListener("keydown", event => {
      if(event.key === "Escape" && imageModal.classList.contains("open")){
        closeImageModal();
      }
    });

    function render(){
      grid.innerHTML = "";

      if(!currentItems.length){
        grid.innerHTML = `
          <div class="empty">
            Ingen bilder funnet for denne reisen.
          </div>
        `;
        return;
      }

      currentItems.forEach(item => {
        const card = document.createElement("article");
        card.className = "card";
        card.dataset.id = item.id;

        card.innerHTML = `
          <button class="preview image-preview-button" type="button" title="Forstørr bilde">
            <img class="thumb-image is-loading" alt="">
          </button>
          <div class="content">
            <div class="name"></div>
            <div class="meta"></div>
            <div class="actions">
              <a class="open-link" target="_blank" rel="noopener">Åpne i OneDrive</a>
              <button class="delete-button" type="button" title="Slett bilde">🗑️ Slett</button>
            </div>
          </div>
        `;

        card.querySelector(".name").textContent = item.name || "(uten navn)";

        const thumbImage = card.querySelector(".thumb-image");
        thumbImage.src = imageUrl(item, "thumb", "medium");
        thumbImage.alt = item.name || "OneDrive-bilde";
        thumbImage.addEventListener("load", () => {
          thumbImage.classList.remove("is-loading");
        });
thumbImage.addEventListener("error", () => {
  if(!thumbImage.dataset.fullFallbackTried){
    thumbImage.dataset.fullFallbackTried = "true";
    thumbImage.src = imageUrl(item, "full");
    return;
  }

  if(!thumbImage.dataset.downloadFallbackTried && item.downloadUrl){
    thumbImage.dataset.downloadFallbackTried = "true";
    thumbImage.src = item.downloadUrl;
    return;
  }

  thumbImage.classList.remove("is-loading");
  thumbImage.alt = `Kunne ikke laste ${item.name || "bilde"}`;
});

        card.querySelector(".image-preview-button").addEventListener("click", () => {
          openImageModal(item);
        });

        card.querySelector(".meta").innerHTML = `
          ${imageSizeText(item)}<br>
          ${formatBytes(item.size)}<br>
          ${item.mimeType || ""}
        `;

        const link = card.querySelector(".open-link");
        link.href = item.webUrl || "#";

        const deleteButton = card.querySelector(".delete-button");
        deleteButton.addEventListener("click", () => deleteImage(item, card, deleteButton));

        grid.appendChild(card);
      });
    }

    async function loadImages(){
      clearError();

      if(!caseName){
        subtitle.textContent = "Mangler case i URL.";
        statusEl.textContent = "Bruk for eksempel: onedrive-images.html?case=Liverpool%201996";
        return;
      }

      reloadButton.disabled = true;
      statusEl.textContent = "Laster bilder...";
      subtitle.textContent = `Reise: ${caseName}`;

      try{
        const url = `${API_BASE}/onedrive/route-files?case=${encodeURIComponent(caseName)}`;

        const response = await fetch(url, {
          method: "GET",
          credentials: "include"
        });

        const data = await response.json();

        if(!response.ok || !data.success){
          throw new Error(data.error || data.detail || `HTTP ${response.status}`);
        }

        currentItems = Array.isArray(data.items) ? data.items : [];

        subtitle.textContent = `${data.routeCase?.title || caseName} – ${data.effectivePath || data.folderPath || ""}`;
        statusEl.textContent = `${currentItems.length} bilder funnet${data.autoEnteredSubfolder ? " – undermappe åpnet automatisk" : ""}`;

        render();
      }catch(error){
        showError(error.message);
        statusEl.textContent = "Kunne ikke laste bilder.";
      }finally{
        reloadButton.disabled = false;
      }
    }

    async function deleteImage(item, card, button){
      const confirmed = window.confirm(
        `Slett bildet fra OneDrive-arkivet?\n\n${item.name}\n\nBildet flyttes til OneDrive-papirkurven.`
      );

      if(!confirmed){
        return;
      }

      button.disabled = true;
      button.textContent = "Sletter...";

      try{
        const response = await fetch(`${API_BASE}/onedrive/delete-item`, {
          method: "POST",
          credentials: "include",
          body: JSON.stringify({
            id: item.id
          })
        });

        const data = await response.json();

        if(!response.ok || !data.success){
          throw new Error(data.error || data.detail || `HTTP ${response.status}`);
        }

        currentItems = currentItems.filter(existing => existing.id !== item.id);
        card.remove();
        statusEl.textContent = `${currentItems.length} bilder igjen. Slettet: ${item.name}`;

        if(!currentItems.length){
          render();
        }
      }catch(error){
        showError(`Kunne ikke slette ${item.name}: ${error.message}`);
        button.disabled = false;
        button.textContent = "🗑️ Slett";
      }
    }

    reloadButton.addEventListener("click", loadImages);
    loadImages();
  </script>
</body>
</html>
