name: Arrangementer Meeting Types diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Read row usage and Meeting Types differences
        env:
          ARRANGEMENT_BASEROW_TOKEN: ${{ secrets.ARRANGEMENT_BASEROW_TOKEN }}
          ARRANGEMENT_BASEROW_TOKEN_TIME: ${{ secrets.ARRANGEMENT_BASEROW_TOKEN_TIME }}
          ARRANGEMENT_BASEROW_TOKEN_KLEPP: ${{ secrets.ARRANGEMENT_BASEROW_TOKEN_KLEPP }}
          ARRANGEMENT_BASEROW_TOKEN_SANDNES: ${{ secrets.ARRANGEMENT_BASEROW_TOKEN_SANDNES }}
          ARRANGEMENT_BASEROW_TOKEN_STAVANGER: ${{ secrets.ARRANGEMENT_BASEROW_TOKEN_STAVANGER }}
          BASEROW_API_BASE: https://api.baserow.io
        run: node scripts/arrangementer-meeting-types-row-usage-v468.mjs

      - name: Upload diagnostic report
        uses: actions/upload-artifact@v4
        with:
          name: arrangementer-meeting-types-row-usage-v468
          path: arrangementer-meeting-types-row-usage-v468.json
          if-no-files-found: error
