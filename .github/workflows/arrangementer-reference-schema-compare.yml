name: Arrangementer reference schema compare

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Compare reference schema with Time and Klepp
        env:
          ARRANGEMENT_BASEROW_TOKEN: ${{ secrets.ARRANGEMENT_BASEROW_TOKEN }}
          ARRANGEMENT_BASEROW_TOKEN_TIME: ${{ secrets.ARRANGEMENT_BASEROW_TOKEN_TIME }}
          ARRANGEMENT_BASEROW_TOKEN_KLEPP: ${{ secrets.ARRANGEMENT_BASEROW_TOKEN_KLEPP }}
          BASEROW_API_BASE: https://api.baserow.io
        run: node scripts/diagnose-arrangementer-reference-schema.mjs

      - name: Upload comparison report
        uses: actions/upload-artifact@v4
        with:
          name: arrangementer-reference-schema-compare
          path: arrangementer-reference-schema-compare.json
          if-no-files-found: error
