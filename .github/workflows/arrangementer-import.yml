name: Arrangementer import

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: write

concurrency:
  group: arrangementer-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Backfill tidligere nye rader i historikk
        env:
          ARRANGEMENT_BASEROW_TOKEN: ${{ secrets.ARRANGEMENT_BASEROW_TOKEN }}
          ARRANGEMENT_BASEROW_TOKEN_SANDNES: ${{ secrets.ARRANGEMENT_BASEROW_TOKEN_SANDNES }}
          BASEROW_API_BASE: https://api.baserow.io
          ARRANGEMENT_HISTORY_PATH: arrangementer-import-history.json
        run: node scripts/backfill-import-history-created-rows.mjs

      - name: Import arrangementer
        env:
          ARRANGEMENT_BASEROW_TOKEN: ${{ secrets.ARRANGEMENT_BASEROW_TOKEN }}
          ARRANGEMENT_BASEROW_TOKEN_SANDNES: ${{ secrets.ARRANGEMENT_BASEROW_TOKEN_SANDNES }}
          BASEROW_API_BASE: https://api.baserow.io
          ARRANGEMENT_DATA_PATH: arrangementer-data.json
          ARRANGEMENT_HISTORY_PATH: arrangementer-import-history.json
        run: node scripts/run-arrangementer-import.mjs

      - name: Commit oppdatert snapshot og historikk
        run: |
          if [ -z "$(git status --porcelain -- arrangementer-data.json arrangementer-import-history.json)" ]; then
            echo "Ingen endringer i arrangementer-data.json eller arrangementer-import-history.json"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add arrangementer-data.json arrangementer-import-history.json
          git commit -m "Update arrangementer data"
          git push
