name: Nærbø diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run Nærbø diagnostic
        run: node scripts/diagnose-narbo.mjs

      - name: Show report
        if: always()
        run: |
          if [ -f narbo-diagnostic.json ]; then
            cat narbo-diagnostic.json
          fi

      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: narbo-diagnostic
          path: narbo-diagnostic.json
          if-no-files-found: warn
