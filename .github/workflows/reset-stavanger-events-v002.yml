name: Reset Stavanger Events

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reset-stavanger-events
  cancel-in-progress: false

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Reset Stavanger Events
        env:
          ARRANGEMENT_BASEROW_TOKEN: ${{ secrets.ARRANGEMENT_BASEROW_TOKEN }}
          ARRANGEMENT_BASEROW_TOKEN_STAVANGER: ${{ secrets.ARRANGEMENT_BASEROW_TOKEN_STAVANGER }}
          BASEROW_API_BASE: https://api.baserow.io
        run: node scripts/reset-stavanger-events-v002.mjs
